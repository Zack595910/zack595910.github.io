<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
/* ═══════════════════════════════════════════════════════════════
   CSS 变量 - Windows 10 主题配色
   ═══════════════════════════════════════════════════════════════ */
:root {
    /* 桌面背景渐变 */
    --win-bg: #0078D4;
    --win-bg-gradient-start: #0078D4;
    --win-bg-gradient-end: #004E8C;

    /* 任务栏 */
    --win-taskbar: #111111;
    --win-taskbar-hover: rgba(255, 255, 255, 0.08);
    --win-taskbar-active: rgba(255, 255, 255, 0.15);

    /* 窗口标题栏 */
    --win-title-active: #0078D4;
    --win-title-inactive: #333333;
    --win-title-text-active: #ffffff;
    --win-title-text-inactive: #cccccc;

    /* 窗口主体 */
    --win-border: #1a1a1a;
    --win-body: #ffffff;
    --win-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);

    /* 强调色 */
    --win-accent: #0078D4;
    --win-accent-light: #3A8CFF;
    --win-danger: #E81123;

    /* 文字颜色 */
    --win-text: #1a1a1a;
    --win-text-secondary: #666666;
    --win-text-disabled: #999999;

    /* 通用 */
    --win-hover: rgba(0, 0, 0, 0.04);
    --win-radius: 8px;
    --win-radius-sm: 4px;

    /* 字体 */
    --font-ui: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
    --font-mono: 'Cascadia Code', 'Consolas', 'Courier New', 'SF Mono', monospace;
}

/* ═══════════════════════════════════════════════════════════════
   全局重置
   ═══════════════════════════════════════════════════════════════ */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    font-family: var(--font-ui);
    font-size: 13px;
    color: var(--win-text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

body {
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    touch-action: none;
    -webkit-touch-callout: none;
}

/* ═══════════════════════════════════════════════════════════════
   桌面
   ═══════════════════════════════════════════════════════════════ */
#desktop {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 48px;
    background: linear-gradient(
        135deg,
        var(--win-bg-gradient-start) 0%,
        var(--win-bg-gradient-end) 100%
    );
    overflow: hidden;
    z-index: 0;
}

/* ═══════════════════════════════════════════════════════════════
   桌面图标
   ═══════════════════════════════════════════════════════════════ */
.desktop-icon {
    position: absolute;
    width: 80px;
    text-align: center;
    cursor: pointer;
    padding: 8px 4px;
    border-radius: var(--win-radius-sm);
    color: #ffffff;
    font-size: 12px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    transition: background 0.1s ease;
}

.desktop-icon:hover {
    background: rgba(255, 255, 255, 0.2);
}

.desktop-icon:active {
    background: rgba(255, 255, 255, 0.3);
}

.desktop-icon .icon-img {
    width: 48px;
    height: 48px;
    margin: 0 auto 4px;
    font-size: 36px;
    line-height: 48px;
    pointer-events: none;
}

.desktop-icon div:last-child {
    word-wrap: break-word;
    line-height: 1.3;
}

/* 回收站角标 */
.desktop-icon .icon-badge {
    position: absolute;
    top: 2px;
    right: 2px;
    background: #cc0000;
    color: #ffffff;
    font-size: 10px;
    min-width: 16px;
    height: 16px;
    line-height: 16px;
    border-radius: 8px;
    display: none;
    pointer-events: none;
}

/* ═══════════════════════════════════════════════════════════════
   窗口
   ═══════════════════════════════════════════════════════════════ */
.window {
    position: absolute;
    background: var(--win-body);
    border: 1px solid var(--win-border);
    border-radius: var(--win-radius) var(--win-radius) 0 0;
    box-shadow: var(--win-shadow);
    display: flex;
    flex-direction: column;
    min-width: 260px;
    min-height: 150px;
    z-index: 1;
    overflow: hidden;
    animation: windowOpen 0.2s ease-out;
}

@keyframes windowOpen {
    from {
        opacity: 0;
        transform: scale(0.95);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.window.focused {
    z-index: 100 !important;
}

.window.maximized {
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: calc(100% - 48px) !important;
    border-radius: 0 !important;
    animation: none;
}

/* ═══════════════════════════════════════════════════════════════
   窗口标题栏
   ═══════════════════════════════════════════════════════════════ */
.window-titlebar {
    display: flex;
    align-items: center;
    height: 36px;
    background: var(--win-title-inactive);
    color: var(--win-title-text-inactive);
    padding: 0 8px;
    cursor: default;
    font-size: 13px;
    flex-shrink: 0;
    transition: background 0.15s ease;
}

.window.focused .window-titlebar {
    background: var(--win-title-active);
    color: var(--win-title-text-active);
}

.window-titlebar .title-icon {
    font-size: 16px;
    margin-right: 8px;
    flex-shrink: 0;
}

.window-titlebar .title-text {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.window-titlebar .title-buttons {
    display: flex;
    gap: 2px;
    margin-left: auto;
    flex-shrink: 0;
}

.title-btn {
    width: 36px;
    height: 28px;
    border: none;
    background: transparent;
    color: inherit;
    font-size: 14px;
    cursor: pointer;
    border-radius: var(--win-radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s ease;
}

.title-btn:hover {
    background: rgba(255, 255, 255, 0.15);
}

.title-btn:active {
    background: rgba(255, 255, 255, 0.25);
}

.title-btn.btn-close:hover {
    background: var(--win-danger);
    color: #ffffff;
}

/* ═══════════════════════════════════════════════════════════════
   窗口内容区
   ═══════════════════════════════════════════════════════════════ */
.window-body {
    flex: 1;
    overflow: auto;
    position: relative;
    background: #1e1e1e;
    display: flex;
    flex-direction: column;
}

/* ═══════════════════════════════════════════════════════════════
   菜单栏
   ═══════════════════════════════════════════════════════════════ */
.menu-bar {
    display: flex;
    align-items: center;
    background: #2d2d2d;
    border-bottom: 1px solid #3d3d3d;
    padding: 0;
    flex-shrink: 0;
    height: 28px;
}

.menu-bar .menu-item {
    padding: 4px 12px;
    color: #cccccc;
    cursor: pointer;
    font-size: 12px;
    position: relative;
    white-space: nowrap;
}

.menu-bar .menu-item:hover {
    background: #3d3d3d;
}

.menu-bar .menu-item.open {
    background: #3d3d3d;
}

.menu-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    background: #2d2d2d;
    border: 1px solid #444444;
    border-radius: 4px;
    min-width: 200px;
    z-index: 300;
    display: none;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    padding: 4px 0;
}

.menu-dropdown.open {
    display: block;
}

.menu-dropdown-item {
    padding: 6px 16px;
    color: #cccccc;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.08s ease;
}

.menu-dropdown-item:hover {
    background: rgba(255, 255, 255, 0.08);
}

.menu-dropdown-item.disabled {
    color: #666666;
    cursor: default;
}

.menu-dropdown-item.disabled:hover {
    background: transparent;
}

.menu-dropdown .menu-separator {
    height: 1px;
    background: #444444;
    margin: 4px 0;
}

/* ═══════════════════════════════════════════════════════════════
   任务栏
   ═══════════════════════════════════════════════════════════════ */
#taskbar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 48px;
    background: var(--win-taskbar);
    display: flex;
    align-items: center;
    padding: 0 4px;
    z-index: 1000;
    gap: 0;
    box-shadow: 0 -1px 4px rgba(0, 0, 0, 0.3);
}

.taskbar-btn {
    height: 40px;
    min-width: 40px;
    max-width: 200px;
    padding: 0 10px;
    border: none;
    background: transparent;
    color: #ffffff;
    font-size: 12px;
    cursor: pointer;
    border-radius: var(--win-radius-sm);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background 0.1s ease;
    font-family: var(--font-ui);
    flex-shrink: 1;
}

.taskbar-btn:hover {
    background: var(--win-taskbar-hover);
}

.taskbar-btn.active {
    background: var(--win-taskbar-active);
    border-bottom: 2px solid var(--win-accent);
}

.taskbar-btn .tb-icon {
    font-size: 16px;
    flex-shrink: 0;
}

#start-btn {
    font-weight: 600;
    margin-right: 4px;
    flex-shrink: 0;
    min-width: 50px;
}

#clock {
    margin-left: auto;
    color: #ffffff;
    font-size: 12px;
    padding: 0 12px;
    text-align: right;
    line-height: 1.3;
    flex-shrink: 0;
    cursor: default;
}

/* ═══════════════════════════════════════════════════════════════
   开始菜单
   ═══════════════════════════════════════════════════════════════ */
#start-menu {
    position: absolute;
    bottom: 48px;
    left: 0;
    width: 320px;
    background: #1f1f1f;
    border: 1px solid #333333;
    border-radius: var(--win-radius) var(--win-radius) 0 0;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
    display: none;
    z-index: 999;
    padding: 8px 0;
    color: #ffffff;
    font-size: 13px;
}

#start-menu.open {
    display: block;
}

.start-menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    cursor: pointer;
    transition: background 0.1s ease;
}

.start-menu-item:hover {
    background: rgba(255, 255, 255, 0.08);
}

.start-menu-item .sm-icon {
    font-size: 20px;
    width: 24px;
    text-align: center;
    flex-shrink: 0;
}

/* ═══════════════════════════════════════════════════════════════
   代码编辑器
   ═══════════════════════════════════════════════════════════════ */
.editor-area {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.editor-area textarea {
    width: 100%;
    height: 100%;
    background: #1e1e1e;
    color: #d4d4d4;
    border: none;
    resize: none;
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.6;
    padding: 16px;
    tab-size: 4;
    -moz-tab-size: 4;
    outline: none;
    flex: 1;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.editor-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: #2d2d2d;
    border-bottom: 1px solid #3d3d3d;
    flex-shrink: 0;
}

.editor-toolbar button {
    background: #3d3d3d;
    color: #cccccc;
    border: none;
    padding: 4px 12px;
    font-size: 12px;
    border-radius: var(--win-radius-sm);
    cursor: pointer;
    font-family: var(--font-ui);
    transition: background 0.1s ease;
}

.editor-toolbar button:hover {
    background: #4d4d4d;
}

.editor-toolbar button.run-btn {
    background: #107C10;
    color: #ffffff;
}

.editor-toolbar button.run-btn:hover {
    background: #0e6a0e;
}

.editor-toolbar span {
    color: #888888;
    font-size: 12px;
}

/* 编辑器状态栏 */
.editor-statusbar {
    display: flex;
    align-items: center;
    padding: 2px 12px;
    background: #007acc;
    color: #ffffff;
    font-size: 11px;
    flex-shrink: 0;
    gap: 16px;
    height: 22px;
}

.editor-statusbar span {
    white-space: nowrap;
}

/* ═══════════════════════════════════════════════════════════════
   Python Shell
   ═══════════════════════════════════════════════════════════════ */
.shell-container {
    display: flex;
    flex-direction: column;
    height: 100%;
}

.shell-output {
    flex: 1;
    background: #0c0c0c;
    color: #cccccc;
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 12px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
}

.shell-input-line {
    display: flex;
    align-items: center;
    background: #141414;
    padding: 4px 12px;
    border-top: 1px solid #333333;
    flex-shrink: 0;
}

.shell-input-line .prompt {
    color: #4EC9B0;
    font-family: var(--font-mono);
    font-size: 13px;
    margin-right: 8px;
    white-space: nowrap;
}

.shell-input-line input {
    flex: 1;
    background: transparent;
    border: none;
    color: #ffffff;
    font-family: var(--font-mono);
    font-size: 13px;
    outline: none;
    caret-color: #ffffff;
}

/* Shell 输出颜色 */
.shell-error { color: #f44747; }
.shell-info { color: #6A9955; }
.shell-result { color: #CE9178; }
.shell-warning { color: #CCA700; }

/* ═══════════════════════════════════════════════════════════════
   文件管理器
   ═══════════════════════════════════════════════════════════════ */
.file-list {
    width: 100%;
    height: 100%;
    background: #1e1e1e;
    color: #cccccc;
    overflow-y: auto;
    font-size: 13px;
}

.file-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    cursor: pointer;
    transition: background 0.08s ease;
}

.file-item:hover {
    background: rgba(255, 255, 255, 0.06);
}

.file-item .fi-icon {
    font-size: 18px;
    flex-shrink: 0;
}

.file-manager-toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: #2d2d2d;
    border-bottom: 1px solid #3d3d3d;
    flex-shrink: 0;
}

.file-manager-toolbar button {
    background: #3d3d3d;
    color: #cccccc;
    border: none;
    padding: 4px 10px;
    font-size: 12px;
    border-radius: var(--win-radius-sm);
    cursor: pointer;
    font-family: var(--font-ui);
    transition: background 0.1s ease;
}

.file-manager-toolbar button:hover {
    background: #4d4d4d;
}

/* ═══════════════════════════════════════════════════════════════
   Python 环境安装弹窗
   ═══════════════════════════════════════════════════════════════ */
.install-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    z-index: 10000;
    display: flex;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
}

.install-dialog {
    background: #1f1f1f;
    border: 1px solid #444444;
    border-radius: var(--win-radius);
    padding: 30px;
    width: 420px;
    color: #ffffff;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
}

.install-dialog h3 {
    color: var(--win-accent);
    margin-bottom: 8px;
    font-size: 18px;
    font-weight: 600;
}

.install-dialog .install-icon {
    font-size: 48px;
    margin-bottom: 15px;
}

.install-progress-bar {
    width: 100%;
    height: 8px;
    background: #333333;
    border-radius: 4px;
    margin: 15px 0;
    overflow: hidden;
}

.install-progress-fill {
    height: 100%;
    background: var(--win-accent);
    border-radius: 4px;
    width: 0%;
    transition: width 0.3s ease;
}

.install-stats {
    font-size: 12px;
    color: #888888;
    display: flex;
    justify-content: space-between;
    margin: 8px 0;
}

.install-log {
    background: #0c0c0c;
    color: #6A9955;
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 10px;
    border-radius: var(--win-radius-sm);
    text-align: left;
    max-height: 120px;
    overflow-y: auto;
    margin-top: 10px;
    line-height: 1.5;
}

.install-btn {
    margin-top: 15px;
    padding: 8px 24px;
    background: var(--win-accent);
    color: #ffffff;
    border: none;
    border-radius: var(--win-radius-sm);
    font-size: 14px;
    cursor: pointer;
    font-family: var(--font-ui);
    transition: background 0.15s ease;
}

.install-btn:hover:not(:disabled) {
    background: var(--win-accent-light);
}

.install-btn:disabled {
    background: #555555;
    cursor: not-allowed;
}

/* ═══════════════════════════════════════════════════════════════
   关于系统窗口
   ═══════════════════════════════════════════════════════════════ */
.about-content {
    padding: 40px 30px;
    text-align: center;
    color: #cccccc;
    background: #1e1e1e;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.about-content .about-logo {
    font-size: 72px;
    margin-bottom: 10px;
    animation: aboutPulse 3s ease-in-out infinite;
}

@keyframes aboutPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}

.about-content h2 {
    color: #ffffff;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 2px;
}

.about-content .about-ver {
    color: #888888;
    font-size: 13px;
    margin-bottom: 20px;
}

.about-content .about-divider {
    width: 60%;
    height: 1px;
    background: #333333;
    margin: 10px 0;
}

.about-content .about-info {
    font-size: 13px;
    line-height: 2;
    color: #aaaaaa;
    text-align: left;
    width: 100%;
    max-width: 320px;
}

.about-content .about-info .info-row {
    display: flex;
    justify-content: space-between;
    padding: 2px 0;
}

.about-content .about-info .info-label {
    color: #888888;
}

.about-content .about-info .info-value {
    color: #ffffff;
    font-weight: 500;
}

.about-content .about-footer {
    margin-top: 20px;
    font-size: 11px;
    color: #555555;
    line-height: 1.6;
}

/* ═══════════════════════════════════════════════════════════════
   tkinter 画布区域
   ═══════════════════════════════════════════════════════════════ */
.tk-canvas-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000000;
}

.tk-canvas-wrap canvas {
    display: block;
    image-rendering: auto;
}

/* ═══════════════════════════════════════════════════════════════
   tkinter 控件容器
   ═══════════════════════════════════════════════════════════════ */
.tk-widget-wrap {
    width: 100%;
    height: 100%;
    background: #f0f0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    padding: 16px;
    overflow-y: auto;
}

/* ═══════════════════════════════════════════════════════════════
   Toplevel 控制面板（模拟 ttk.Notebook）
   ═══════════════════════════════════════════════════════════════ */
#tk-panel-wrap {
    width: 100%;
    height: 100%;
    background: #f0f0f0;
    overflow: auto;
    font-size: 12px;
    font-family: var(--font-ui);
}

#tk-panel-wrap .tk-notebook {
    display: flex;
    flex-direction: column;
    height: 100%;
}

#tk-panel-wrap .tk-tabs {
    display: flex;
    border-bottom: 1px solid #999999;
    background: #d0d0d0;
    flex-shrink: 0;
    overflow-x: auto;
}

#tk-panel-wrap .tk-tab {
    padding: 6px 16px;
    cursor: pointer;
    border: 1px solid transparent;
    font-size: 12px;
    white-space: nowrap;
    transition: background 0.1s ease;
}

#tk-panel-wrap .tk-tab:hover {
    background: rgba(0, 0, 0, 0.05);
}

#tk-panel-wrap .tk-tab.active {
    background: #f0f0f0;
    border-color: #999999;

<!-- ═══════════════════════════════════════════════════════════════
     加载 Pyodide
     ═══════════════════════════════════════════════════════════════ -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

<script>
// ═══════════════════════════════════════════════════════════════════
//  tkemu v1.1.0 - 完整主程序
//  ═══════════════════════════════════════════════════════════════════

// 版本信息
var APP_VERSION = '1.1.0';
var APP_NAME = 'tkemu';
var APP_FULL_NAME = 'tkemu - Windows 桌面模拟器';
var APP_COPYRIGHT = '闪讯工作社 Snxth.';
var APP_YEAR = '2026';
var PYODIDE_VERSION = '0.25.0';

// ═══════════════════ 全局状态变量 ═══════════════════
var windowZIndex = 10;
var openWindows = {};
var activeWindowId = null;
var startMenuOpen = false;
var pyodide = null;
var pyodideReady = false;
var _tkMsgResolve = null;
var _tkEntryValues = {};
var _tkListboxSel = {};
var _tkPanelTabs = [];
var _tkPanelActiveTab = 0;
var shellHistory = [];
var shellHistoryIdx = -1;
var trashItems = [];
var _titlebarContextTarget = null;
var _nextWindowX = 80;
var _nextWindowY = 60;

// ═══════════════════ 虚拟文件系统 ═══════════════════
var VirtualFS = {
    _key: 'tkemu_fs_v3',

    // 初始化文件系统
    init: function() {
        if (!localStorage.getItem(this._key)) {
            var defaultFiles = {
                'main.py': '# -*- coding: utf-8 -*-\n# 欢迎使用 tkemu\n# 在编辑器中编写 Python 代码\n\nprint("Hello, tkemu!")\n',
                'README.txt': '══════════════════════════════════\n  tkemu - 浏览器中的 Windows 桌面\n   Python + tkinter 模拟环境\n══════════════════════════════════\n\n版本: ' + APP_VERSION + '\nPython 运行时: Pyodide ' + PYODIDE_VERSION + '\n\n功能:\n  📝 代码编辑器\n  ⬛ Python Shell\n  📁 文件管理\n  🎮 KSD 3D\n  ℹ️ 关于系统\n  🗑️ 回收站\n\n' + APP_COPYRIGHT + '\n'
            };
            localStorage.setItem(this._key, JSON.stringify(defaultFiles));
        }

        // 加载回收站
        try {
            var saved = localStorage.getItem('tkemu_trash');
            if (saved) {
                trashItems = JSON.parse(saved);
            }
        } catch (e) {
            trashItems = [];
        }

        // 迁移旧数据
        try {
            var oldData = localStorage.getItem('tkemu_fs_v2');
            if (oldData) {
                var oldFiles = JSON.parse(oldData);
                var currentFiles = this.listFiles();
                var merged = false;
                Object.keys(oldFiles).forEach(function(key) {
                    if (!currentFiles[key]) {
                        currentFiles[key] = oldFiles[key];
                        merged = true;
                    }
                });
                if (merged) {
                    localStorage.setItem(this._key, JSON.stringify(currentFiles));
                }
                localStorage.removeItem('tkemu_fs_v2');
            }
        } catch (e) {
            // 忽略迁移错误
        }
    },

    // 列出所有文件
    listFiles: function() {
        try {
            return JSON.parse(localStorage.getItem(this._key) || '{}');
        } catch (e) {
            return {};
        }
    },

    // 读取文件
    readFile: function(path) {
        var files = this.listFiles();
        return files[path] || null;
    },

    // 写入文件
    writeFile: function(path, content) {
        var files = this.listFiles();
        files[path] = content;
        localStorage.setItem(this._key, JSON.stringify(files));
    },

    // 删除文件
    deleteFile: function(path) {
        var files = this.listFiles();
        delete files[path];
        localStorage.setItem(this._key, JSON.stringify(files));
    },

    // 重命名文件
    renameFile: function(oldPath, newPath) {
        var files = this.listFiles();
        if (files[oldPath] && !files[newPath]) {
            files[newPath] = files[oldPath];
            delete files[oldPath];
            localStorage.setItem(this._key, JSON.stringify(files));
            return true;
        }
        return false;
    }
};

// ═══════════════════ 回收站功能 ═══════════════════

// 添加到回收站
function trashAdd(path) {
    var content = VirtualFS.readFile(path);
    if (content !== null) {
        trashItems.push({
            path: path,
            content: content,
            time: new Date().toISOString()
        });
        VirtualFS.deleteFile(path);
        updateTrashIcon();
        localStorage.setItem('tkemu_trash', JSON.stringify(trashItems));
    }
}

// 从回收站还原
function trashRestore(index) {
    if (index >= 0 && index < trashItems.length) {
        var item = trashItems[index];
        VirtualFS.writeFile(item.path, item.content);
        trashItems.splice(index, 1);
        updateTrashIcon();
        localStorage.setItem('tkemu_trash', JSON.stringify(trashItems));
        return true;
    }
    return false;
}

// 清空回收站
function trashEmpty() {
    trashItems = [];
    updateTrashIcon();
    localStorage.setItem('tkemu_trash', JSON.stringify(trashItems));
}

// 全部还原
function trashRestoreAll() {
    while (trashItems.length > 0) {
        trashRestore(0);
    }
    showToast('已全部还原');
}

// 更新回收站角标
function updateTrashIcon() {
    var badge = document.getElementById('trash-count');
    if (badge) {
        badge.textContent = trashItems.length;
        badge.style.display = trashItems.length > 0 ? 'block' : 'none';
    }
}

// 打开回收站窗口
function openTrash() {
    var html = '';

    // 工具栏
    html += '<div class="file-manager-toolbar">';
    html += '  <button onclick="trashRestoreAll(); closeWindow(\'trash\'); openTrash();">📥 全部还原</button>';
    html += '  <button onclick="if(confirm(\'确定要清空回收站吗？\\n此操作不可恢复。\')){ trashEmpty(); closeWindow(\'trash\'); openTrash(); }">🗑 清空回收站</button>';
    html += '</div>';

    // 文件列表
    html += '<div class="file-list">';
    if (trashItems.length === 0) {
        html += '<div style="padding:20px;color:#888;text-align:center;">🗑️ 回收站为空</div>';
    } else {
        for (var i = 0; i < trashItems.length; i++) {
            var item = trashItems[i];
            var fileName = item.path.split('/').pop();
            html += '<div class="file-item">';
            html += '  <span class="fi-icon">📄</span>';
            html += '  <span style="flex:1">' + escapeHTML(fileName) + '</span>';
            html += '  <span style="color:#888;font-size:11px;">' + new Date(item.time).toLocaleString() + '</span>';
            html += '  <button onclick="event.stopPropagation(); trashRestore(' + i + '); closeWindow(\'trash\'); openTrash();" style="background:none;border:none;cursor:pointer;margin-left:8px;" title="还原">📥</button>';
            html += '</div>';
        }
    }
    html += '</div>';

    createWindow('trash', '回收站', '🗑️', 500, 400, 130, 160, html);
}

// ═══════════════════ 窗口管理器 ═══════════════════

function createWindow(id, title, icon, width, height, top, left, bodyHTML) {
    // 如果窗口已存在，聚焦
    if (openWindows[id]) {
        focusWindow(id);
        return openWindows[id].el;
    }

    // 计算默认位置
    var finalTop = top || _nextWindowY;
    var finalLeft = left || _nextWindowX;
    _nextWindowX += 30;
    _nextWindowY += 25;
    if (_nextWindowX > 200) _nextWindowX = 80;
    if (_nextWindowY > 200) _nextWindowY = 60;

    // 创建窗口元素
    var win = document.createElement('div');
    win.className = 'window focused';
    win.id = 'win-' + id;
    win.style.width = width + 'px';
    win.style.height = height + 'px';
    win.style.top = finalTop + 'px';
    win.style.left = finalLeft + 'px';
    win.style.zIndex = ++windowZIndex;

    // 构建窗口 HTML
    win.innerHTML = '' +
        '<div class="window-titlebar" ' +
        '    onpointerdown="startDrag(event, \'' + id + '\')" ' +
        '    ondblclick="toggleMaximize(\'' + id + '\')" ' +
        '    oncontextmenu="titlebarContextMenu(event, \'' + id + '\')">' +
        '  <span class="title-icon">' + icon + '</span>' +
        '  <span class="title-text">' + escapeHTML(title) + '</span>' +
        '  <div class="title-buttons">' +
        '    <button class="title-btn" onclick="minimizeWindow(\'' + id + '\')" title="最小化">─</button>' +
        '    <button class="title-btn" onclick="toggleMaximize(\'' + id + '\')" title="最大化">□</button>' +
        '    <button class="title-btn btn-close" onclick="closeWindow(\'' + id + '\')" title="关闭">✕</button>' +
        '  </div>' +
        '</div>' +
        '<div class="window-body">' + bodyHTML + '</div>';

    document.getElementById('desktop').appendChild(win);

    // 存储窗口数据
    openWindows[id] = {
        el: win,
        title: title,
        icon: icon,
        minimized: false,
        maximized: false,
        origX: finalLeft,
        origY: finalTop,
        origW: width,
        origH: height
    };

    focusWindow(id);
    updateTaskbar();
    return win;
}

function focusWindow(id) {
    if (!openWindows[id]) return;
    if (activeWindowId === id) return;

    activeWindowId = id;
    var win = openWindows[id].el;
    win.style.zIndex = ++windowZIndex;

    // 取消所有窗口的聚焦状态
    Object.values(openWindows).forEach(function(w) {
        w.el.classList.remove('focused');
    });
    win.classList.add('focused');

    // 如果最小化了，先还原
    if (openWindows[id].minimized) {
        restoreWindow(id);
    }

    updateTaskbar();
}

function minimizeWindow(id) {
    if (!openWindows[id]) return;
    openWindows[id].el.style.display = 'none';
    openWindows[id].minimized = true;
    if (activeWindowId === id) {
        activeWindowId = null;
    }
    updateTaskbar();
}

function restoreWindow(id) {
    if (!openWindows[id]) return;
    openWindows[id].el.style.display = 'flex';
    openWindows[id].minimized = false;
    focusWindow(id);
}

function toggleMaximize(id) {
    if (!openWindows[id]) return;
    var w = openWindows[id];

    if (w.maximized) {
        // 还原
        w.el.classList.remove('maximized');
        w.el.style.top = w.origY + 'px';
        w.el.style.left = w.origX + 'px';
        w.el.style.width = w.origW + 'px';
        w.el.style.height = w.origH + 'px';
        w.maximized = false;
    } else {
        // 最大化
        w.el.classList.add('maximized');
        w.maximized = true;
    }
}

function closeWindow(id) {
    if (!openWindows[id]) return;
    openWindows[id].el.remove();
    delete openWindows[id];
    if (activeWindowId === id) {
        activeWindowId = null;
        var keys = Object.keys(openWindows);
        if (keys.length > 0) {
            focusWindow(keys[keys.length - 1]);
        }
    }
    updateTaskbar();
}

function titlebarContextMenu(e, id) {
    e.preventDefault();
    e.stopPropagation();
    _titlebarContextTarget = id;

    var menu = document.getElementById('titlebar-context-menu');
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
    menu.classList.add('open');
}

function titlebarContextAction(action) {
    var id = _titlebarContextTarget;
    if (!id || !openWindows[id]) {
        hideAllContextMenus();
        return;
    }

    switch (action) {
        case 'minimize':
            minimizeWindow(id);
            break;
        case 'maximize':
            toggleMaximize(id);
            break;
        case 'close':
            closeWindow(id);
            break;
        case 'restore':
            if (openWindows[id].maximized) {
                toggleMaximize(id);
            }
            break;
        case 'move':
            // 移动由用户拖动窗口完成
            break;
        case 'size':
            // 调整大小由用户拖动窗口边缘完成
            break;
    }

    hideAllContextMenus();
}

function hideAllContextMenus() {
    document.querySelectorAll('.context-menu.open').forEach(function(menu) {
        menu.classList.remove('open');
    });
}

// ═══════════════════ 窗口拖动 ═══════════════════

var dragInfo = null;

function startDrag(e, id) {
    if (!openWindows[id] || openWindows[id].maximized) return;
    var win = openWindows[id].el;
    dragInfo = {
        id: id,
        startX: e.clientX,
        startY: e.clientY,
        origLeft: win.offsetLeft,
        origTop: win.offsetTop
    };
    e.preventDefault();
}

document.addEventListener('pointermove', function(e) {
    if (!dragInfo) return;
    var w = openWindows[dragInfo.id];
    if (!w) {
        dragInfo = null;
        return;
    }
    w.el.style.left = Math.max(-100, dragInfo.origLeft + e.clientX - dragInfo.startX) + 'px';
    w.el.style.top = Math.max(0, dragInfo.origTop + e.clientY - dragInfo.startY) + 'px';
});

document.addEventListener('pointerup', function() {
    dragInfo = null;
});

// ═══════════════════ 任务栏 ═══════════════════

function updateTaskbar() {
    var container = document.getElementById('taskbar-windows');
    container.innerHTML = '';

    var ids = Object.keys(openWindows);
    ids.forEach(function(id) {
        var w = openWindows[id];
        var btn = document.createElement('button');
        btn.className = 'taskbar-btn' + (id === activeWindowId ? ' active' : '');
        btn.innerHTML = '<span class="tb-icon">' + w.icon + '</span>' + w.title;
        btn.title = w.title;
        btn.onclick = function() {
            if (id === activeWindowId && !w.minimized) {
                minimizeWindow(id);
            } else {
                restoreWindow(id);
                focusWindow(id);
            }
        };
        container.appendChild(btn);
    });
}

        '    <div class="shell-info">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</div>' +
        '  </div>' +
        '  <div class="shell-input-line">' +
        '    <span class="prompt">&gt;&gt;&gt;&nbsp;</span>' +
        '    <input type="text" id="shell-input" placeholder="输入 Python 代码..." autofocus>' +
        '  </div>' +
        '</div>';

    createWindow('shell', 'Python Shell', '⬛', 650, 450, 120, 140, bodyHTML);

    setTimeout(function() {
        var inp = document.getElementById('shell-input');
        if (inp) {
            inp.focus();
            inp.addEventListener('keydown', handleShellKey);
        }
    }, 200);
}

function handleShellKey(e) {
    if (e.key === 'Enter') {
        var code = e.target.value.trim();
        if (!code) return;

        shellHistory.push(code);
        shellHistoryIdx = shellHistory.length;
        e.target.value = '';
        shellPrint('>>> ' + code, '');
        executeShellCode(code);

    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (shellHistoryIdx > 0) {
            shellHistoryIdx--;
            e.target.value = shellHistory[shellHistoryIdx];
        }
    } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (shellHistoryIdx < shellHistory.length - 1) {
            shellHistoryIdx++;
            e.target.value = shellHistory[shellHistoryIdx];
        } else {
            shellHistoryIdx = shellHistory.length;
            e.target.value = '';
        }
    }
}

function shellPrint(text, className) {
    var output = document.getElementById('shell-output');
    if (!output) return;
    var cls = className ? ' class="shell-' + className + '"' : '';
    output.innerHTML += '<div' + cls + '>' + escapeHTML(text) + '</div>';
    output.scrollTop = output.scrollHeight;
}

// ═══════════════════ Python 环境检查与运行 ═══════════════════

async function ensurePythonReady() {
    if (!pyodideReady) {
        var ok = await checkPythonEnv();
        if (!ok) {
            throw new Error('Python 环境未就绪，请先安装');
        }
    }
    // 每次运行前重新注入 tkinter 模拟层
    injectTkinterEmulator();
}

async function runEditorCode() {
    var ta = document.getElementById('editor-input');
    if (!ta || !ta.value.trim()) {
        showToast('⚠️ 请先输入代码');
        return;
    }

    try {
        await ensurePythonReady();
    } catch (e) {
        showToast('❌ ' + e.message);
        return;
    }

    // 打开 Shell 显示输出
    if (!openWindows['shell']) {
        openShell();
    }
    focusWindow('shell');
    shellPrint('▶ 正在执行编辑器代码...', 'info');

    // 重定向 stdout/stderr
    pyodide.runPython('' +
        'import sys\n' +
        'from js import shellPrint as _sp\n' +
        'class _ShellWriter:\n' +
        '    def write(self, s):\n' +
        '        if s.strip():\n' +
        '            _sp(s.rstrip(), "")\n' +
        '    def flush(self): pass\n' +
        'sys.stdout = _ShellWriter()\n' +
        'sys.stderr = _ShellWriter()\n'
    );

    try {
        await pyodide.runPythonAsync(ta.value);
        shellPrint('▶ 执行完毕', 'info');
    } catch (e) {
        shellPrint('❌ 错误: ' + e.message, 'error');
    }
}

async function executeShellCode(code) {
    if (code === 'clear') {
        var output = document.getElementById('shell-output');
        if (output) output.innerHTML = '';
        return;
    }

    try {
        await ensurePythonReady();
    } catch (e) {
        shellPrint('❌ ' + e.message, 'error');
        return;
    }

    // 重定向 stdout/stderr
    pyodide.runPython('' +
        'import sys\n' +
        'from js import shellPrint as _sp\n' +
        'class _ShellWriter:\n' +
        '    def write(self, s):\n' +
        '        if s.strip():\n' +
        '            _sp(s.rstrip(), "")\n' +
        '    def flush(self): pass\n' +
        'sys.stdout = _ShellWriter()\n' +
        'sys.stderr = _ShellWriter()\n'
    );

    try {
        var result = pyodide.runPython(code);
        if (result !== undefined && result !== null) {
            shellPrint(repr(result), 'result');
        }
    } catch (e) {
        shellPrint('❌ ' + e.message, 'error');
    }
}

// ═══════════════════ 文件管理器 ═══════════════════

function openFiles() {
    var files = VirtualFS.listFiles();
    var names = Object.keys(files).sort();

    var html = '';

    // 工具栏
    html += '<div class="file-manager-toolbar">';
    html += '  <button onclick="newFileDialog()" title="新建文件">📄 新建文件</button>';
    html += '  <button onclick="newFolderDialog()" title="新建文件夹">📁 新建文件夹</button>';
    html += '  <button onclick="closeWindow(\'files\'); openFiles();" title="刷新">🔄 刷新</button>';
    html += '</div>';

    // 文件列表
    html += '<div class="file-list">';
    if (names.length === 0) {
        html += '<div style="padding:30px;color:#888;text-align:center;">📂 文件夹为空<br><span style="font-size:11px;">点击"新建文件"开始</span></div>';
    } else {
        names.forEach(function(name) {
            var isPy = name.endsWith('.py');
            var isTxt = name.endsWith('.txt') || name.endsWith('.md') || name.endsWith('.json') || name.endsWith('.ini') || name.endsWith('.cfg') || name.endsWith('.yml') || name.endsWith('.yaml');
            var isImg = name.endsWith('.png') || name.endsWith('.jpg') || name.endsWith('.jpeg') || name.endsWith('.gif');
            var isFolder = name.indexOf('/') > -1;
            var icon = isFolder ? '📁' : (isPy ? '📄' : (isImg ? '🖼️' : '📃'));

            html += '<div class="file-item" ondblclick="openFileByType(\'' + escapeAttr(name) + '\')" title="双击打开">';
            html += '  <span class="fi-icon">' + icon + '</span>';
            html += '  <span style="flex:1">' + escapeHTML(name) + '</span>';
            html += '  <button onclick="event.stopPropagation(); deleteFileDialog(\'' + escapeAttr(name) + '\')" style="background:none;border:none;cursor:pointer;font-size:14px;" title="删除">🗑</button>';
            html += '</div>';
        });
    }
    html += '</div>';

    createWindow('files', '文件管理', '📁', 550, 450, 100, 120, html);
}

function newFileDialog() {
    var name = prompt('请输入文件名:', 'new_file.py');
    if (name && name.trim()) {
        name = name.trim();
        if (name.indexOf('.') === -1) {
            name += '.txt';
        }
        VirtualFS.writeFile(name, '');
        closeWindow('files');
        openFiles();
        showToast('✅ 已创建: ' + name);
    }
}

function newFolderDialog() {
    var name = prompt('请输入文件夹名:', '新建文件夹');
    if (name && name.trim()) {
        name = name.trim();
        var placeholder = name + '/.placeholder';
        VirtualFS.writeFile(placeholder, '');
        closeWindow('files');
        openFiles();
        showToast('✅ 已创建文件夹: ' + name);
    }
}

function deleteFileDialog(path) {
    if (confirm('将 "' + path + '" 移动到回收站吗？\n\n之后可以从回收站还原。')) {
        trashAdd(path);
        closeWindow('files');
        openFiles();
        showToast('🗑 已移至回收站: ' + path);
    }
}

function openFileByType(path) {
    var parts = path.split('.');
    var ext = parts.length > 1 ? parts.pop().toLowerCase() : '';

    var textTypes = ['py', 'txt', 'md', 'json', 'ini', 'cfg', 'yml', 'yaml', 'html', 'css', 'js', 'xml', 'csv', 'log', 'bat', 'sh', 'pyw'];
    var imageTypes = ['png', 'jpg', 'jpeg', 'gif', 'bmp', 'svg', 'ico'];

    if (textTypes.indexOf(ext) !== -1) {
        openEditor(path);
    } else if (imageTypes.indexOf(ext) !== -1) {
        showToast('🖼️ 图片预览功能开发中: ' + path);
    } else {
        showToast('⚠️ 不支持的文件类型: .' + ext);
    }
}

function refreshFiles() {
    if (openWindows['files']) {
        closeWindow('files');
        openFiles();
    }
}

function restartSystem() {
    var ids = Object.keys(openWindows);
    ids.forEach(function(id) {
        closeWindow(id);
    });
    _nextWindowX = 80;
    _nextWindowY = 60;
    showToast('🔄 系统已重启（文件已保留）');
}

// ═══════════════════ Python 环境安装 ═══════════════════

async function checkPythonEnv() {
    if (pyodideReady) return true;
    return new Promise(function(resolve) {
        showInstallDialog(resolve);
    });
}

function showInstallDialog(onComplete) {
    // 移除旧弹窗
    var oldOverlay = document.querySelector('.install-overlay');
    if (oldOverlay) oldOverlay.remove();

    var overlay = document.createElement('div');
    overlay.className = 'install-overlay';

    overlay.innerHTML = '' +
        '<div class="install-dialog">' +
        '  <div class="install-icon">🐍</div>' +
        '  <h3>Python 环境安装</h3>' +
        '  <p style="color:#aaa;font-size:13px;">检测到 Python 环境未安装</p>' +
        '  <p style="color:#888;font-size:12px;">Pyodide ' + PYODIDE_VERSION + ' | 预计大小: 10-15 MB</p>' +
        '  <p style="color:#888;font-size:11px;">正在从 CDN 下载所需文件...</p>' +
        '  <div class="install-progress-bar">' +
        '    <div class="install-progress-fill" id="install-progress-fill"></div>' +
        '  </div>' +
        '  <div class="install-stats">' +
        '    <span id="install-percent">0%</span>' +
        '    <span id="install-speed">--</span>' +
        '    <span id="install-size">0 / 0 MB</span>' +
        '  </div>' +
        '  <div class="install-log" id="install-log">' +
        '    <div>🔄 开始下载...</div>' +
        '  </div>' +
        '  <button class="install-btn" id="install-btn" disabled>安装中...</button>' +
        '</div>';

    document.body.appendChild(overlay);

    var progressFill = overlay.querySelector('#install-progress-fill');
    var percentEl = overlay.querySelector('#install-percent');
    var speedEl = overlay.querySelector('#install-speed');
    var sizeEl = overlay.querySelector('#install-size');
    var logEl = overlay.querySelector('#install-log');
    var btn = overlay.querySelector('#install-btn');
    var lastBytes = 0;
    var lastTime = Date.now();
    var startTime = Date.now();

    function log(msg) {
        var time = new Date().toLocaleTimeString();
        logEl.innerHTML += '<div>[' + time + '] ' + msg + '</div>';
        logEl.scrollTop = logEl.scrollHeight;
    }

    log('正在连接 Pyodide CDN...');
    log('URL: cdn.jsdelivr.net/pyodide/v' + PYODIDE_VERSION + '/full/');

    loadPyodide({
        indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.25.0/full/',
        onprogress: function(e) {
            if (e && e.total) {
                var pct = Math.round(e.loaded / e.total * 100);
                var now = Date.now();
                var timeDiff = (now - lastTime) / 1000;
                var bytesDiff = e.loaded - lastBytes;
                var speed = bytesDiff / timeDiff;
                var speedStr;
                if (speed > 1048576) {
                    speedStr = (speed / 1048576).toFixed(2) + ' MB/s';
                } else if (speed > 1024) {
                    speedStr = (speed / 1024).toFixed(1) + ' KB/s';
                } else {
                    speedStr = Math.round(speed) + ' B/s';
                }

                progressFill.style.width = pct + '%';
                percentEl.textContent = pct + '%';
                speedEl.textContent = speedStr;
                sizeEl.textContent = (e.loaded / 1048576).toFixed(1) + ' / ' + (e.total / 1048576).toFixed(1) + ' MB';

                lastBytes = e.loaded;
                lastTime = now;

                if (pct % 15 === 0 && pct > 0 && pct < 100) {
                    log('📥 下载进度: ' + pct + '% (' + (e.loaded / 1048576).toFixed(1) + ' MB) - ' + speedStr);
                }
            }
        }
    }).then(function(result) {
        pyodide = result;
        var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
        log('✅ 下载完成，耗时 ' + elapsed + ' 秒');
        log('🔄 正在初始化 Python 解释器...');

        injectTkinterEmulator();
        pyodideReady = true;

        progressFill.style.width = '100%';
        percentEl.textContent = '100%';
        btn.textContent = '✅ 安装完成 - 点击关闭';
        btn.disabled = false;
        btn.onclick = function() {
            overlay.remove();
            onComplete(true);
            showToast('🎉 Python 环境就绪！双击桌面图标开始使用');
        };

        log('✅ Python 环境安装完成！');
        log('📦 已加载: tkinter(模拟), sys, json, math, random, time');
        log('💡 提示: 在编辑器中编写代码，点击运行即可执行');

    }).catch(function(err) {
        log('❌ 安装失败: ' + err.message);
        log('💡 请检查网络连接后重试');
        btn.textContent = '❌ 安装失败 - 点击重试';
        btn.disabled = false;
        btn.onclick = function() {
            overlay.remove();
            checkPythonEnv().then(onComplete);
        };
    });
}

// ═══════════════════ JS ↔ Python 桥接函数 ═══════════════════

// Canvas 像素更新
function tkCanvasUpdate(rgbBytes, width, height) {
    var canvas = document.getElementById('tk-canvas');
    if (!canvas) return;

    var ctx = canvas.getContext('2d');
    var imgData = ctx.createImageData(width, height);
    var arr = new Uint8ClampedArray(rgbBytes);

    for (var i = 0; i < width * height; i++) {
        var src = i * 3;
        var dst = i * 4;
        imgData.data[dst] = arr[src];
        imgData.data[dst + 1] = arr[src + 1];
        imgData.data[dst + 2] = arr[src + 2];
        imgData.data[dst + 3] = 255;
    }

    ctx.putImageData(imgData, 0, 0);
}

// Canvas 文字绘制
function drawUIText(x, y, text, fill, size) {
    var canvas = document.getElementById('tk-canvas');
    if (!canvas) return;

    var ctx = canvas.getContext('2d');
    ctx.fillStyle = fill;
    ctx.font = size + "px 'Segoe UI', 'Microsoft YaHei', sans-serif";
    ctx.fillText(text, x, y);
}

// 更新窗口标题
function updateWindowTitle(id, title) {
    if (openWindows[id]) {
        openWindows[id].title = title;
        var titleEl = openWindows[id].el.querySelector('.title-text');
        if (titleEl) {
            titleEl.textContent = title;
        }
        updateTaskbar();
    }
}

// tk窗口尺寸调整
function tkResizeWindow(id, width, height) {
    if (openWindows[id]) {
        var win = openWindows[id].el;
        win.style.width = (width + 16) + 'px';
        win.style.height = (height + 40) + 'px';
        openWindows[id].origW = width + 16;
        openWindows[id].origH = height + 40;
    }
}

// 同步 tkinter 控件到 DOM
function tkSyncAll(jsonStr) {
    var wrap = document.getElementById('tk-body-wrap') || document.getElementById('tk-panel-wrap');
    if (!wrap) return;

    try {
        var widgets = JSON.parse(jsonStr);
        widgets.forEach(function(w) {
            var el = document.getElementById(w.id);
            if (!el) {
                el = document.createElement('div');
                el.id = w.id;
                wrap.appendChild(el);
            }

            if (w.type === 'label') {
                el.innerHTML = '<span style="color:' + w.fg + ';font-size:' + w.fontSize + 'px;' + (w.bg ? 'background:' + w.bg + ';' : '') + '">' + escapeHTML(w.text || '') + '</span>';
            } else if (w.type === 'button') {
                el.innerHTML = '<button class="tk-btn" style="font-size:' + w.fontSize + 'px" onclick="tkBtnClick(\'' + w.id + '\')">' + escapeHTML(w.text || '') + '</button>';
            } else if (w.type === 'entry') {
                el.innerHTML = '<input type="text" value="' + escapeHTML(w.value || '') + '" style="width:' + ((w.width || 20) * 8) + 'px;font-size:' + w.fontSize + 'px" onchange="tkEntryChange(\'' + w.id + '\',this.value)" oninput="tkEntryChange(\'' + w.id + '\',this.value)">';
            } else if (w.type === 'frame') {
                el.style.border = '1px solid #ccc';
                el.style.padding = '8px';
                el.style.background = w.bg || '#f0f0f0';
            } else if (w.type === 'listbox') {
                var h = '';
                w.items.forEach(function(it, i) {
                    h += '<div class="tk-listbox-item" onclick="tkListboxSelect(\'' + w.id + '\',' + i + ')">' + escapeHTML(it) + '</div>';
                });
                el.innerHTML = h;
                el.style.maxHeight = ((w.height || 10) * 20) + 'px';
            }
        });
    } catch (e) {
        console.error('tkSyncAll error:', e);
    }
}

// 按钮点击回调
function tkBtnClick(id) {
    if (pyodide) {
        pyodide.runPython("TkEmulator._call_cb('" + id + "')");
    }
}

// Entry 值跟踪
function tkEntryChange(id, val) {
    _tkEntryValues[id] = val;
}

function tkGetEntryValue(id) {
    return _tkEntryValues[id] || '';
}

// Listbox 选择跟踪
function tkListboxSelect(id, idx) {
    _tkListboxSel[id] = idx;
    var el = document.getElementById(id);
    if (el) {
        var items = el.querySelectorAll('.tk-listbox-item');
        items.forEach(function(item, i) {
            item.classList.toggle('selected', i === idx);
        });
    }
}

function tkListboxSelection(id) {
    return _tkListboxSel.hasOwnProperty(id) ? _tkListboxSel[id] : null;
}

// ═══════════════════ 控制面板 (Toplevel 模拟) ═══════════════════

function tkInitPanel() {
    var wrap = document.getElementById('tk-panel-wrap');
    if (!wrap) return;

    wrap.innerHTML = '' +
        '<div class="tk-notebook">' +
        '  <div class="tk-tabs" id="tk-panel-tabs"></div>' +
        '  <div class="tk-tab-body" id="tk-panel-body"></div>' +
        '</div>';

    _tkPanelTabs = [];
    _tkPanelActiveTab = 0;
}

function tkNotebookAdd(text) {
    _tkPanelTabs.push({ text: text, content: '' });

    var tabsEl = document.getElementById('tk-panel-tabs');
    if (!tabsEl) return;

    var idx = _tkPanelTabs.length - 1;
    var tab = document.createElement('div');
    tab.className = 'tk-tab' + (idx === 0 ? ' active' : '');
    tab.textContent = text;
    tab.onclick = function() {
        tkPanelSwitchTab(idx);
    };
    tabsEl.appendChild(tab);
}

function tkPanelSwitchTab(idx) {
    _tkPanelActiveTab = idx;
    var tabs = document.querySelectorAll('#tk-panel-tabs .tk-tab');
    tabs.forEach(function(t, i) {
        t.classList.toggle('active', i === idx);
    });
}

// ═══════════════════ messagebox 模拟 ═══════════════════

function tkMsgBox(type, title, msg) {
    var icons = {
        info: 'ℹ️',
        warning: '⚠️',
        error: '❌',
        yesno: '❓',
        askstring: '📝'
    };

    var overlay = document.createElement('div');
    overlay.className = 'tk-msgbox-overlay';

    if (type === 'askstring') {
        overlay.innerHTML = '' +
            '<div class="tk-msgbox">' +
            '  <div class="tk-msg-icon">' + (icons[type] || '') + '</div>' +
            '  <div class="tk-msg-text"><b>' + escapeHTML(title) + '</b><br>' + escapeHTML(msg) + '</div>' +
            '  <input type="text" id="tk-askstring-input" style="width:100%;padding:6px;margin-bottom:12px;border:1px solid #999;border-radius:3px;" autofocus>' +
            '  <div>' +
            '    <button onclick="tkMsgClose(null)">取消</button>' +
            '    <button onclick="tkMsgClose(document.getElementById(\'tk-askstring-input\').value)">确定</button>' +
            '  </div>' +
            '</div>';
    } else {
        overlay.innerHTML = '' +
            '<div class="tk-msgbox">' +
            '  <div class="tk-msg-icon">' + (icons[type] || '') + '</div>' +
            '  <div class="tk-msg-text"><b>' + escapeHTML(title) + '</b><br>' + escapeHTML(msg) + '</div>' +
            '  <div>' +
            (type === 'yesno' ?
                '<button onclick="tkMsgClose(true)">是</button><button onclick="tkMsgClose(false)">否</button>' :
                '<button onclick="tkMsgClose(true)">确定</button>') +
            '  </div>' +
            '</div>';
    }

    document.body.appendChild(overlay);

    return new Promise(function(resolve) {
        _tkMsgResolve = resolve;
    });
}

function tkMsgClose(val) {
    var overlays = document.querySelectorAll('.tk-msgbox-overlay');
    overlays.forEach(function(o) {
        o.remove();
    });

    if (_tkMsgResolve) {
        _tkMsgResolve(val);
        _tkMsgResolve = null;
    }
}

// ═══════════════════ 工具函数 ═══════════════════

function escapeHTML(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function escapeAttr(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\\/g, '\\\\');
}

function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.opacity = '1';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function() {
        toast.style.opacity = '0';
    }, 3000);
}

// ═══════════════════ 快捷键 ═══════════════════

document.addEventListener('keydown', function(e) {
    // Ctrl+Shift+E - 打开编辑器
    if (e.ctrlKey && e.shiftKey && (e.key === 'E' || e.key === 'e')) {
        e.preventDefault();
        openEditor();
    }
    // Ctrl+Shift+S - 打开 Shell
    if (e.ctrlKey && e.shiftKey && (e.key === 'S' || e.key === 's')) {
        e.preventDefault();
        openShell();
    }
});

// ─── 1. 文件夹嵌套支持（增强 VirtualFS） ───
(function() {
    if (VirtualFS._v160_nested) return;
    VirtualFS._v160_nested = true;
    
    VirtualFS.createFolder = function(folderName) {
        if (!folderName || folderName.indexOf('/') !== -1) return false;
        var allFiles = {};
        try { allFiles = JSON.parse(localStorage.getItem(VirtualFS._key) || '{}'); } catch(e) {}
        var marker = folderName + '/.folder';
        if (allFiles[marker]) return false;
        allFiles[marker] = 'folder';
        localStorage.setItem(VirtualFS._key, JSON.stringify(allFiles));
        return true;
    };
    
    VirtualFS.deleteFolder = function(folderName) {
        var allFiles = {};
        try { allFiles = JSON.parse(localStorage.getItem(VirtualFS._key) || '{}'); } catch(e) {}
        var keys = Object.keys(allFiles);
        var deleted = false;
        keys.forEach(function(k) {
            if (k.indexOf(folderName + '/') === 0) {
                delete allFiles[k];
                deleted = true;
            }
        });
        if (deleted) localStorage.setItem(VirtualFS._key, JSON.stringify(allFiles));
        return deleted;
    };
    
    VirtualFS.getFolders = function() {
        var files = VirtualFS.listFiles();
        var folders = {};
        Object.keys(files).forEach(function(k) {
            var idx = k.indexOf('/');
            if (idx > -1 && k.endsWith('/.folder')) {
                folders[k.substring(0, idx)] = true;
            }
        });
        return Object.keys(folders).sort();
    };
    
    VirtualFS.listFilesInFolder = function(folderName) {
        var files = VirtualFS.listFiles();
        var result = {};
        Object.keys(files).forEach(function(k) {
            if (k.indexOf(folderName + '/') === 0 && !k.endsWith('/.folder')) {
                result[k] = files[k];
            }
        });
        return result;
    };
})();

// 显示登录界面
function v160ShowLogin() {
    var existing = document.getElementById('v160-login-overlay');
    if (existing) existing.remove();
    
    var overlay = document.createElement('div');
    overlay.id = 'v160-login-overlay';
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0a0a2e,#1a1a4e);z-index:99990;display:flex;flex-direction:column;align-items:center;justify-content:center;';
    
    var title = document.createElement('div');
    title.textContent = '选择用户登录';
    title.style.cssText = 'color:#fff;font-size:24px;font-weight:bold;margin-bottom:20px;';
    overlay.appendChild(title);
    
    var listEl = document.createElement('div');
    listEl.style.cssText = 'display:flex;flex-direction:column;gap:8px;';
    
    v160Users.forEach(function(u) {
        var card = document.createElement('div');
        card.style.cssText = 'background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.15);border-radius:14px;padding:14px 20px;cursor:pointer;display:flex;align-items:center;gap:12px;width:260px;transition:all 0.2s;';
        card.onmouseenter = function() { card.style.borderColor = '#00ccff'; card.style.background = 'rgba(255,255,255,0.12)'; };
        card.onmouseleave = function() { card.style.borderColor = 'rgba(255,255,255,0.15)'; card.style.background = 'rgba(255,255,255,0.06)'; };
        
        card.innerHTML = '<div style="font-size:32px;">' + u.avatar + '</div><div style="flex:1;"><div style="color:#fff;font-weight:bold;font-size:15px;">' + u.name + '</div><div style="color:#888;font-size:11px;">' + (u.isAdmin ? '管理员' : '标准用户') + (u.password === '' ? ' | 无密码' : '') + '</div></div><div style="color:#666;font-size:18px;">→</div>';
        
        card.onclick = function() {
            if (u.password === '') {
                // 无密码用户直接登录
                v160SetSession(u.name);
                overlay.remove();
                v160OnLogin();
            } else {
                var pw = prompt('输入密码 (用户: ' + u.name + '):', '');
                if (pw === u.password) {
                    v160SetSession(u.name);
                    overlay.remove();
                    v160OnLogin();
                } else if (pw !== null) {
                    alert('密码错误！');
                }
            }
        };
        listEl.appendChild(card);
    });
    
    overlay.appendChild(listEl);
    
    var addBtn = document.createElement('button');
    addBtn.textContent = '➕ 添加新用户';
    addBtn.style.cssText = 'margin-top:16px;padding:10px 22px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:22px;color:#fff;cursor:pointer;font-size:13px;';
    addBtn.onclick = function() {
        var name = prompt('新用户名:', '');
        if (!name || !name.trim()) return;
        name = name.trim();
        if (v160Users.find(function(u) { return u.name === name; })) { alert('用户已存在'); return; }
        var pw = prompt('设置密码 (留空=无密码):', '');
        if (pw === null) return;
        // 空字符串保持为空密码
        v160Users.push({ name: name, password: pw, avatar: '👤', isAdmin: false, created: new Date().toISOString() });
        v160SaveUsers();
        v160ShowLogin();
        showToast('✅ 用户 ' + name + ' 已创建');
    };
    overlay.appendChild(addBtn);
    
    document.body.appendChild(overlay);
}
// 登录成功后的处理
function v160OnLogin() {
    var user = v160Users.find(function(u) { return u.name === v160CurrentUser; });
    if (user) {
        showToast('✅ 欢迎, ' + user.name);
        // 恢复用户文件
        var ud = v160GetUserData(user.name);
        if (ud && ud.files) {
            var allFiles = {};
            try { allFiles = JSON.parse(localStorage.getItem(VirtualFS._key) || '{}'); } catch(e) {}
            // 把用户文件合并到全局
            for (var k in ud.files) {
                if (ud.files.hasOwnProperty(k)) {
                    allFiles[k] = ud.files[k];
                }
            }
            localStorage.setItem(VirtualFS._key, JSON.stringify(allFiles));
        }
    }
}

// 保存当前用户文件
function v160SaveCurrentUserFiles() {
    if (!v160CurrentUser) return;
    var ud = v160GetUserData(v160CurrentUser);
    var allFiles = {};
    try { allFiles = JSON.parse(localStorage.getItem(VirtualFS._key) || '{}'); } catch(e) {}
    ud.files = {};
    for (var k in allFiles) {
        if (allFiles.hasOwnProperty(k) && !k.startsWith('updates/')) {
            ud.files[k] = allFiles[k];
        }
    }
    ud.lastLogin = new Date().toISOString();
    v160SaveUserData(v160CurrentUser, ud);
}

// 切换用户（保存当前用户数据后显示登录）
window.v160SwitchUser = function() {
    v160SaveCurrentUserFiles();
    v160ClearSession();
    v160ShowLogin();
};

// 注销（切换用户同义）
window.v160Logout = v160SwitchUser;

// 获取当前用户信息
window.v160GetCurrentUser = function() {
    return v160CurrentUser ? v160Users.find(function(u) { return u.name === v160CurrentUser; }) : null;
};

// 在右键菜单加切换用户
(function() {
    var menu = document.getElementById('desktop-context-menu');
    if (!menu || menu._v160_user) return;
    menu._v160_user = true;
    var sep = menu.querySelector('div[style]');
    if (!sep) return;
    var item = document.createElement('div');
    item.className = 'context-menu-item';
    item.innerHTML = '<span>👤</span> 切换用户';
    item.onclick = function() { v160SwitchUser(); hideAllContextMenus(); };
    menu.insertBefore(item, sep);
})();

// 定时自动保存
setInterval(v160SaveCurrentUserFiles, 30000);

// 初始化
v160LoadUsers();
var session = v160GetSession();
if (session && v160Users.find(function(u) { return u.name === session; })) {
    v160CurrentUser = session;
    setTimeout(v160OnLogin, 500);
} else {
    setTimeout(v160ShowLogin, 800);
}

showToast('👥 多用户系统已加载');
// 开始菜单加"注销"按钮
(function() {
    var sm = document.getElementById('start-menu');
    if (!sm || sm._v160_logout) return;
    sm._v160_logout = true;
    
    // 找到重启系统那个菜单项，插在它前面
    var items = sm.querySelectorAll('.start-menu-item');
    var target = null;
    for (var i = 0; i < items.length; i++) {
        if (items[i].textContent.indexOf('重启系统') !== -1) {
            target = items[i];
            break;
        }
    }
    
    var logoutItem = document.createElement('div');
    logoutItem.className = 'start-menu-item';
    logoutItem.innerHTML = '<span class="sm-icon">🚪</span> 注销';
    logoutItem.onclick = function() {
        toggleStartMenu();
        if (typeof v160SwitchUser === 'function') {
            v160SwitchUser();
        } else {
            alert('多用户系统未加载');
        }
    };
    
    if (target) {
        sm.insertBefore(logoutItem, target);
    } else {
        sm.appendChild(logoutItem);
    }
    showToast('✅ 注销按钮已添加');
})();

//  左下角磁贴隐藏功能
//  双击隐藏 / 通过开始菜单重新显示
// ═══════════════════════════════════════════════════════════════

(function() {
    var tiles = document.getElementById('v160-tiles');
    if (!tiles || tiles._v160_hide) return;
    tiles._v160_hide = true;

    // 双击磁贴区域隐藏
    tiles.addEventListener('dblclick', function() {
        tiles.style.display = 'none';
        showToast('磁贴已隐藏，可在开始菜单重新显示');
    });

    // 开始菜单加"显示磁贴"选项
    var sm = document.getElementById('start-menu');
    if (sm) {
        var item = document.createElement('div');
        item.className = 'start-menu-item';
        item.innerHTML = '<span class="sm-icon">📌</span> 显示磁贴';
        item.onclick = function() {
            toggleStartMenu();
            tiles.style.display = 'flex';
            showToast('磁贴已显示');
        };
        sm.appendChild(item);
    }

    // 键盘快捷键：Ctrl+Shift+H 切换
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.shiftKey && e.key === 'H') {
            e.preventDefault();
            tiles.style.display = (tiles.style.display === 'none') ? 'flex' : 'none';
            showToast(tiles.style.display === 'none' ? '磁贴已隐藏' : '磁贴已显示');
        }
    });
})();

    setWallpaperColor: function(c) {
        var d = document.getElementById('desktop');
        d.style.background = c;
        d.style.backgroundImage = 'none';
        var v = document.getElementById('v160-video-wallpaper');
        if (v) v.remove();
        showToast('✅ 壁纸已更改');
    },

    uploadWallpaper: function() {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = function(e) {
            var f = e.target.files[0];
            if (!f) return;
            var r = new FileReader();
            r.onload = function(ev) {
                var d = document.getElementById('desktop');
                d.style.backgroundImage = 'url(' + ev.target.result + ')';
                d.style.backgroundSize = 'cover';
                d.style.backgroundPosition = 'center';
                showToast('🖼️ 壁纸已上传');
            };
            r.readAsDataURL(f);
        };
        input.click();
    },

    uploadVideoWallpaper: function() {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = 'video/*';
        input.onchange = function(e) {
            var f = e.target.files[0];
            if (!f) return;
            var r = new FileReader();
            r.onload = function(ev) {
                var old = document.getElementById('v160-video-wallpaper');
                if (old) old.remove();
                var v = document.createElement('video');
                v.id = 'v160-video-wallpaper';
                v.src = ev.target.result;
                v.loop = true;
                v.muted = true;
                v.autoplay = true;
                v.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-1;';
                document.getElementById('desktop').insertBefore(v, document.getElementById('desktop').firstChild);
                showToast('🎬 动态壁纸已设置');
            };
            r.readAsDataURL(f);
        };
        input.click();
    },

    setWindowColor: function(c) {
        document.documentElement.style.setProperty('--win-accent', c);
        document.documentElement.style.setProperty('--win-title-active', c);
        showToast('✅ 窗口颜色已更改');
    },

    resetWindowColor: function() {
        document.documentElement.style.setProperty('--win-accent', '#0078D4');

    previewScreensaver: function() {
        var type = document.getElementById('wc-screensaver').value;
        if (type === 'none') { showToast('请选择屏幕保护'); return; }
        var overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99999;cursor:none;';
        overlay.onclick = function() { overlay.remove(); clearInterval(overlay._timer); };
        document.body.appendChild(overlay);
        var canvas = document.createElement('canvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        overlay.appendChild(canvas);
        var ctx = canvas.getContext('2d');

        if (type === 'bubbles') {
            var bubbles = [];
            for (var i = 0; i < 20; i++) bubbles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 25 + 8, vy: -Math.random() * 2 - 0.3, color: 'rgba(' + [Math.floor(Math.random() * 200 + 55), Math.floor(Math.random() * 200 + 55), Math.floor(Math.random() * 200 + 55)].join(',') + ',0.5)' });
            overlay._timer = setInterval(function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                bubbles.forEach(function(b) { b.y += b.vy; if (b.y < -50) { b.y = canvas.height + 50;
                        b.x = Math.random() * canvas.width; }
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                    ctx.fillStyle = b.color;
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                    ctx.stroke(); });
            }, 33);
        } else if (type === 'stars') {
            var stars = [];
            for (var s = 0; s < 150; s++) stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 2 + 0.5, sp: Math.random() * 0.5 + 0.1 });
            overlay._timer = setInterval(function() {
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                stars.forEach(function(s) { s.y += s.sp; if (s.y > canvas.height) { s.y = 0;
                        s.x = Math.random() * canvas.width; }
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.fill(); });
            }, 33);
        } else if (type === 'matrix') {
            var drops = [];
            for (var d = 0; d < Math.floor(canvas.width / 18); d++) drops[d] = Math.random() * -100;
            overlay._timer = setInterval(function() {
                ctx.fillStyle = 'rgba(0,0,0,0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#0f0';
                ctx.font = '16px Consolas';
                for (var d = 0; d < drops.length; d++) { ctx.fillText(String.fromCharCode(0x30A0 + Math.random() * 96), d * 18, drops[d] * 18); if (drops[d] * 18 > canvas.height && Math.random() > 0.975) drops[d] = 0;
                    drops[d]++; }
            }, 50);
        }
    },

//  tkemu 存储容量监控 + 预警系统（完整版）

var StorageMonitor = {
    keys: ['tkemu_fs_v6', 'tkemu_hidden_files_v2', 'tkemu_kd_apps', 'tkemu_vfolders_v1', 'tkemu_ftags_v1', 'tkemu_sys_tokens_v2', 'tkemu_sys_updates_v2', 'tkemu_users_v1', 'tkemu_trash'],

    getTotalUsage: function() {
        var total = 0;
        for (var i = 0; i < this.keys.length; i++) {
            try {
                var data = localStorage.getItem(this.keys[i]);
                if (data) total += data.length * 2;
            } catch (e) {}
        }
        return total;
    },

    getUsageByKey: function() {
        var result = {};
        for (var i = 0; i < this.keys.length; i++) {
            try {
                var data = localStorage.getItem(this.keys[i]);
                result[this.keys[i]] = data ? data.length * 2 : 0;
            } catch (e) {
                result[this.keys[i]] = 0;
            }
        }
        return result;
    },

    getLimit: function() { return 5 * 1024 * 1024; },

    formatSize: function(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(2) + ' MB';
    },

    getUsagePercent: function() {
        return Math.round((this.getTotalUsage() / this.getLimit()) * 100);
    },

    check: function() {
        var percent = this.getUsagePercent();
        if (percent >= 85) {
            this.showWarning(percent);
            return true;
        }
        return false;
    },

    showWarning: function(percent) {
        if (confirm('⚠️ 存储空间仅剩 ' + (100 - percent) + '%！\n\n是否打开存储管理？')) {
            this.openStorageManager();
        }
    },

    openStorageManager: function() {
        if (openWindows['storagemanager']) { focusWindow('storagemanager'); return; }

        var usage = this.getTotalUsage();
        var limit = this.getLimit();
        var percent = this.getUsagePercent();
        var byKey = this.getUsageByKey();

        var html = '';
        html += '<div style="padding:14px;background:#f0f0f0;height:100%;overflow-y:auto;color:#1a1a1a;">';
        html += '<h3 style="margin-bottom:12px;color:#0078D4;">💿 存储管理</h3>';

        html += '<div style="background:#fff;border:1px solid #ddd;border-radius:6px;padding:14px;margin-bottom:10px;">';
        html += '<div style="font-size:14px;font-weight:bold;margin-bottom:8px;">' + this.formatSize(usage) + ' / ' + this.formatSize(limit) + '</div>';
        var barColor = percent >= 90 ? '#e74c3c' : (percent >= 70 ? '#f39c12' : '#27ae60');
        html += '<div style="height:14px;background:#e0e0e0;border-radius:7px;overflow:hidden;">';
        html += '<div style="height:100%;background:' + barColor + ';width:' + Math.min(percent, 100) + '%;border-radius:7px;transition:width 0.3s;"></div></div>';
        html += '<div style="font-size:12px;color:' + barColor + ';font-weight:bold;margin-top:4px;">' + percent + '%</div>';
        html += '</div>';

        var keyNames = {
            'tkemu_fs_v6': '📁 文件系统',
            'tkemu_hidden_files_v2': '🙈 隐藏文件',
            'tkemu_kd_apps': '⚡ KD应用',
            'tkemu_vfolders_v1': '📂 虚拟文件夹',
            'tkemu_ftags_v1': '🏷️ 文件标签',
            'tkemu_sys_tokens_v2': '🔑 sys令牌',
            'tkemu_sys_updates_v2': '🔄 sys更新',
            'tkemu_users_v1': '👤 用户数据',
            'tkemu_trash': '🗑️ 回收站'
        };

        html += '<div style="background:#fff;border:1px solid #ddd;border-radius:6px;padding:14px;margin-bottom:10px;">';
        html += '<div style="font-weight:bold;font-size:13px;margin-bottom:6px;">占用详情</div>';
        Object.keys(byKey).forEach(function(k) {
            if (byKey[k] > 0) {
                html += '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f0f0f0;font-size:12px;">';
                html += '<span>' + (keyNames[k] || k) + '</span>';
                html += '<span>' + StorageMonitor.formatSize(byKey[k]) + '</span></div>';
            }
        });
        html += '</div>';

        html += '<div style="display:flex;gap:6px;flex-wrap:wrap;">';
        html += '<button onclick="StorageMonitor.cleanTrash()" style="padding:8px 14px;background:#e67e22;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;">🗑️ 清空回收站</button>';
        html += '<button onclick="StorageMonitor.cleanUpdates()" style="padding:8px 14px;background:#8e44ad;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;">🔄 清空sys更新</button>';
        html += '<button onclick="StorageMonitor.cleanLargeFiles()" style="padding:8px 14px;background:#c0392b;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;">📄 清理大文件</button>';
        html += '<button onclick="StorageMonitor.refresh()" style="padding:8px 14px;background:#0078D4;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;">🔄 刷新</button>';
        html += '</div></div>';

        createWindow('storagemanager', '存储管理', '💿', 450, 480, 100, 150, html);
    },

    refresh: function() {
        closeWindow('storagemanager');
        this.openStorageManager();
    },

    cleanTrash: function() {
        trashEmpty();
        showToast('🗑️ 回收站已清空');
        this.refresh();
    },

    cleanUpdates: function() {
        localStorage.removeItem('tkemu_sys_updates_v2');
        showToast('🔄 sys更新已清空');
        this.refresh();
    },

    cleanLargeFiles: function() {
        var files = VirtualFS.listFiles();
        var largeFiles = [];
        Object.keys(files).forEach(function(name) {
            var size = new Blob([files[name]]).size;
            if (size > 50 * 1024) largeFiles.push({ name: name, size: size });
        });
        if (largeFiles.length === 0) { alert('没有大于50KB的文件'); return; }
        var list = largeFiles.map(function(f, i) { return (i + 1) + '. ' + f.name + ' (' + StorageMonitor.formatSize(f.size) + ')'; }).join('\n');
        var choice = prompt('大文件（>50KB）:\n\n' + list + '\n\n序号删除:', '');
        if (choice !== null && choice !== '') {
            var idx = parseInt(choice) - 1;
            if (idx >= 0 && idx < largeFiles.length) {
                if (confirm('删除 ' + largeFiles[idx].name + '？')) {
                    VirtualFS.deleteFile(largeFiles[idx].name);
                    showToast('🗑 已删除');

(function() {
    if (window._v170_resize) return;
    window._v170_resize = true;

    var RESIZE_HANDLE_SIZE = 8;
    var MIN_WIDTH = 260;
    var MIN_HEIGHT = 150;
    var _resizeInfo = null;
    var _resizeHandles = {};

    /**
     * 为窗口添加缩放拖拽手柄
     */
    function addResizeHandles(winId) {
        var winData = openWindows[winId];
        if (!winData) return;
        var win = winData.el;
        if (win.querySelector('.v170-resize-handle')) return;

        // 8个方向的手柄
        var directions = ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw'];
        var handleStyles = {
            'n':  { top: '-3px', left: '12px', right: '12px', height: '6px', cursor: 'ns-resize', width: 'auto' },
            's':  { bottom: '-3px', left: '12px', right: '12px', height: '6px', cursor: 'ns-resize', width: 'auto' },
            'e':  { right: '-3px', top: '12px', bottom: '12px', width: '6px', cursor: 'ew-resize', height: 'auto' },
            'w':  { left: '-3px', top: '12px', bottom: '12px', width: '6px', cursor: 'ew-resize', height: 'auto' },
            'ne': { top: '-3px', right: '-3px', width: '12px', height: '12px', cursor: 'nesw-resize' },
            'nw': { top: '-3px', left: '-3px', width: '12px', height: '12px', cursor: 'nwse-resize' },
            'se': { bottom: '-3px', right: '-3px', width: '12px', height: '12px', cursor: 'nwse-resize' },
            'sw': { bottom: '-3px', left: '-3px', width: '12px', height: '12px', cursor: 'nesw-resize' }
        };

        for (var i = 0; i < directions.length; i++) {
            var dir = directions[i];
            var handle = document.createElement('div');
            handle.className = 'v170-resize-handle';
            handle.style.cssText = 'position:absolute;z-index:10;background:transparent;';
            var hs = handleStyles[dir];
            if (hs.top !== undefined) handle.style.top = hs.top;
            if (hs.left !== undefined) handle.style.left = hs.left;
            if (hs.right !== undefined) handle.style.right = hs.right;
            if (hs.bottom !== undefined) handle.style.bottom = hs.bottom;
            if (hs.width !== undefined) handle.style.width = hs.width;
            if (hs.height !== undefined) handle.style.height = hs.height;
            handle.style.cursor = hs.cursor;
            handle.dataset.direction = dir;
            handle.dataset.winId = winId;

            handle.addEventListener('pointerdown', function(e) {
                e.preventDefault();
                e.stopPropagation();
                startResize(e, winId, this.dataset.direction);
            });

            win.appendChild(handle);
        }
    }

    /**
     * 开始缩放
     */
    function startResize(e, winId, direction) {
        var winData = openWindows[winId];
        if (!winData || winData.maximized) return;
        var win = winData.el;

        _resizeInfo = {
            winId: winId,
            direction: direction,
            startX: e.clientX,
            startY: e.clientY,
            origLeft: win.offsetLeft,
            origTop: win.offsetTop,
            origWidth: win.offsetWidth,
            origHeight: win.offsetHeight
        };

        // 捕获指针
        try {
            e.target.setPointerCapture(e.pointerId);
        } catch(err) {}

        // 防止拖动窗口
        if (dragInfo) dragInfo = null;
    }

    /**
     * 处理缩放移动
     */
    document.addEventListener('pointermove', function(e) {
        if (!_resizeInfo) return;
        e.preventDefault();

        var winData = openWindows[_resizeInfo.winId];
        if (!winData) {
            _resizeInfo = null;
            return;
        }
        var win = winData.el;
        var dx = e.clientX - _resizeInfo.startX;
        var dy = e.clientY - _resizeInfo.startY;
        var dir = _resizeInfo.direction;

        var newLeft = _resizeInfo.origLeft;
        var newTop = _resizeInfo.origTop;
        var newWidth = _resizeInfo.origWidth;
        var newHeight = _resizeInfo.origHeight;

        // 水平方向
        if (dir.indexOf('e') !== -1) {
            newWidth = _resizeInfo.origWidth + dx;
        }
        if (dir.indexOf('w') !== -1) {
            newWidth = _resizeInfo.origWidth - dx;
            newLeft = _resizeInfo.origLeft + dx;
        }

        // 垂直方向
        if (dir.indexOf('s') !== -1) {
            newHeight = _resizeInfo.origHeight + dy;
        }
        if (dir.indexOf('n') !== -1) {
            newHeight = _resizeInfo.origHeight - dy;
            newTop = _resizeInfo.origTop + dy;
        }

        // 应用最小尺寸约束
        if (newWidth < MIN_WIDTH * SCALE_FACTOR) {
            if (dir.indexOf('w') !== -1) {
                newLeft = _resizeInfo.origLeft + _resizeInfo.origWidth - MIN_WIDTH * SCALE_FACTOR;
            }
            newWidth = MIN_WIDTH * SCALE_FACTOR;
        }
        if (newHeight < MIN_HEIGHT * SCALE_FACTOR) {
            if (dir.indexOf('n') !== -1) {
                newTop = _resizeInfo.origTop + _resizeInfo.origHeight - MIN_HEIGHT * SCALE_FACTOR;
            }
            newHeight = MIN_HEIGHT * SCALE_FACTOR;
        }

        // 防止拖出屏幕
        var maxLeft = window.innerWidth - 50;
        var maxTop = window.innerHeight - 80;
        if (newLeft < -newWidth + 60) newLeft = -newWidth + 60;
        if (newLeft > maxLeft) newLeft = maxLeft;
        if (newTop < 0) newTop = 0;
        if (newTop > maxTop) newTop = maxTop;

        // 应用
        win.style.left = newLeft + 'px';
        win.style.top = newTop + 'px';
        win.style.width = newWidth + 'px';
        win.style.height = newHeight + 'px';

        // 触发子元素自适应
        var iframe = win.querySelector('iframe');
        if (iframe) {
            iframe.style.width = '100%';
            iframe.style.height = '100%';
        }
    });

    /**
     * 结束缩放
     */
    document.addEventListener('pointerup', function() {
        _resizeInfo = null;
    });

    // 监听 createWindow，自动添加缩放手柄
    var _origCreateWindow = createWindow;
    createWindow = function(id, title, icon, width, height, top, left, bodyHTML) {
        _origCreateWindow(id, title, icon, width, height, top, left, bodyHTML);
        setTimeout(function() {
            addResizeHandles(id);
        }, 50);
        return openWindows[id] ? openWindows[id].el : null;
    };

    // 为已存在的窗口添加手柄
    setTimeout(function() {
        var ids = Object.keys(openWindows);
        for (var i = 0; i < ids.length; i++) {
            addResizeHandles(ids[i]);
        }
    }, 500);

    // 窗口最大化时隐藏手柄
    var _origToggleMaximize = toggleMaximize;
    toggleMaximize = function(id) {
        _origToggleMaximize(id);
        var winData = openWindows[id];
        if (!winData) return;
        var handles = winData.el.querySelectorAll('.v170-resize-handle');
        for (var i = 0; i < handles.length; i++) {
            handles[i].style.display = winData.maximized ? 'none' : 'block';
        }
    };

    console.log('[v1.7.0] 窗口缩放拖拽已加载');
})();

// ─────────────────────────────────────────────────────────────
//  2. 拖拽上传系统
// ─────────────────────────────────────────────────────────────

(function() {
    if (window._v170_upload) return;
    window._v170_upload = true;

    var _uploadOverlay = null;
    var _uploadCount = 0;
    var _uploadTotal = 0;

    /**
     * 创建上传遮罩
     */
    function createUploadOverlay() {
        if (_uploadOverlay) return _uploadOverlay;

        _uploadOverlay = document.createElement('div');
        _uploadOverlay.id = 'v170-upload-overlay';
        _uploadOverlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:99998;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px);';
        _uploadOverlay.innerHTML = '' +
            '<div style="background:#1f1f1f;border:2px dashed #0078D4;border-radius:20px;padding:40px 60px;text-align:center;color:#fff;pointer-events:none;">' +
            '  <div style="font-size:60px;margin-bottom:15px;">📤</div>' +
            '  <div style="font-size:20px;font-weight:bold;margin-bottom:10px;">释放文件以上传</div>' +
            '  <div style="font-size:13px;color:#aaa;" id="v170-upload-status">准备上传...</div>' +
            '  <div style="margin-top:15px;height:6px;background:#333;border-radius:3px;overflow:hidden;">' +
            '    <div id="v170-upload-progress" style="height:100%;background:#0078D4;width:0%;border-radius:3px;transition:width 0.2s;"></div>' +
            '  </div>' +
            '</div>';
        document.body.appendChild(_uploadOverlay);
        return _uploadOverlay;
    }

    /**
     * 显示上传遮罩
     */
    function showUploadOverlay() {
        var overlay = createUploadOverlay();
        overlay.style.display = 'flex';
    }

    /**
     * 隐藏上传遮罩
     */
    function hideUploadOverlay() {
        if (_uploadOverlay) {
            _uploadOverlay.style.display = 'none';
        }
    }

    /**
     * 更新上传进度
     */
    function updateUploadProgress(current, total, fileName) {
        var statusEl = document.getElementById('v170-upload-status');
        var progressEl = document.getElementById('v170-upload-progress');
        if (statusEl) {
            statusEl.textContent = '正在上传: ' + fileName + ' (' + current + '/' + total + ')';
        }
        if (progressEl) {
            var pct = total > 0 ? Math.round((current / total) * 100) : 0;
            progressEl.style.width = pct + '%';
        }
    }

    /**
     * 处理文件上传
     */
    function handleFiles(files) {
        if (!files || files.length === 0) return;

        _uploadCount = 0;
        _uploadTotal = files.length;
        showUploadOverlay();

        var uploadedCount = 0;
        var failedCount = 0;

        for (var i = 0; i < files.length; i++) {
            (function(file) {
                var reader = new FileReader();
                var fileName = file.name;

                reader.onprogress = function(e) {
                    if (e.lengthComputable) {
                        var pct = Math.round((e.loaded / e.total) * 100);
                        updateUploadProgress(uploadedCount + 1, _uploadTotal, fileName + ' (' + pct + '%)');
                    }
                };

                reader.onload = function(e) {
                    try {
                        var content = e.target.result;
                        VirtualFS.writeFile(fileName, content);
                        uploadedCount++;
                        updateUploadProgress(uploadedCount, _uploadTotal, fileName);
                    } catch (err) {
                        failedCount++;
                        console.error('上传失败: ' + fileName, err);
                    }

                    _uploadCount++;
                    if (_uploadCount >= _uploadTotal) {
                        // 全部完成
                        setTimeout(function() {
                            hideUploadOverlay();
                            if (failedCount === 0) {
                                showToast('✅ 已上传 ' + uploadedCount + ' 个文件');
                            } else {
                                showToast('⚠️ 上传完成: ' + uploadedCount + ' 成功, ' + failedCount + ' 失败');
                            }
                            refreshFiles();
                            _uploadCount = 0;
                            _uploadTotal = 0;
                        }, 500);
                    }
                };

                reader.onerror = function() {
                    failedCount++;
                    _uploadCount++;
                    if (_uploadCount >= _uploadTotal) {
                        setTimeout(function() {
                            hideUploadOverlay();
                            showToast('⚠️ 上传完成: ' + uploadedCount + ' 成功, ' + failedCount + ' 失败');
                            refreshFiles();
                            _uploadCount = 0;
                            _uploadTotal = 0;
                        }, 500);
                    }
                };

                reader.readAsText(file);
            })(files[i]);
        }
    }

    // 全局拖拽事件
    var _dragCounter = 0;

    document.addEventListener('dragenter', function(e) {
        e.preventDefault();
        _dragCounter++;
        if (_dragCounter === 1) {
            showUploadOverlay();
            var statusEl = document.getElementById('v170-upload-status');
            if (statusEl) statusEl.textContent = '释放文件以上传';
        }
    });

    document.addEventListener('dragover', function(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
    });

    document.addEventListener('dragleave', function(e) {
        e.preventDefault();
        _dragCounter--;
        if (_dragCounter <= 0) {
            _dragCounter = 0;
            hideUploadOverlay();
        }
    });

    document.addEventListener('drop', function(e) {
        e.preventDefault();
        _dragCounter = 0;
        hideUploadOverlay();

        var files = e.dataTransfer.files;
        if (files && files.length > 0) {
            handleFiles(files);
        }
    });

    // 文件管理器窗口内拖拽上传
    document.addEventListener('drop', function(e) {
        if (e.target.closest && e.target.closest('#win-files')) {
            e.preventDefault();
            e.stopPropagation();
            var files = e.dataTransfer.files;
            if (files && files.length > 0) {
                handleFiles(files);
            }
        }
    }, true);

    // 桌面区域拖拽上传
    var desktop = document.getElementById('desktop');
    if (desktop) {
        desktop.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.stopPropagation();
            e.dataTransfer.dropEffect = 'copy';
        });
        desktop.addEventListener('drop', function(e) {
            e.preventDefault();
            e.stopPropagation();
            _dragCounter = 0;
            hideUploadOverlay();
            var files = e.dataTransfer.files;
            if (files && files.length > 0) {
                handleFiles(files);
            }
        });
    }

    console.log('[v1.7.0] 拖拽上传已加载');
    showToast('📤 拖拽上传已启用');
})();

(function() {
    if (window._v171_desktopDrag) return;
    window._v171_desktopDrag = true;

    var ICON_POS_KEY = 'tkemu_icon_positions_v1';
    var _iconDragInfo = null;

    // 加载已保存的图标位置
    function loadIconPositions() {
        try {
            var saved = JSON.parse(localStorage.getItem(ICON_POS_KEY) || '{}');
            var icons = document.querySelectorAll('.desktop-icon');
            icons.forEach(function(icon) {
                var id = icon.id || icon.textContent.trim();
                if (saved[id]) {
                    icon.style.top = saved[id].top;
                    icon.style.left = saved[id].left;
                    icon.style.right = 'auto';
                    icon.style.bottom = 'auto';
                }
            });
        } catch(e) {}
    }

    // 保存图标位置
    function saveIconPositions() {
        var positions = {};
        var icons = document.querySelectorAll('.desktop-icon');
        icons.forEach(function(icon) {
            var id = icon.id || icon.textContent.trim();
            var top = icon.style.top;
            var left = icon.style.left;
            if (top && left) {
                positions[id] = { top: top, left: left };
            } else {
                // 用 right/bottom 定位的图标，读取计算后的位置
                var rect = icon.getBoundingClientRect();
                var desktopRect = document.getElementById('desktop').getBoundingClientRect();
                positions[id] = {
                    top: (rect.top - desktopRect.top) + 'px',
                    left: (rect.left - desktopRect.left) + 'px'
                };
            }
        });
        localStorage.setItem(ICON_POS_KEY, JSON.stringify(positions));
    }

    // 为所有桌面图标添加拖动
    function initIconDrag() {
        var icons = document.querySelectorAll('.desktop-icon');
        icons.forEach(function(icon) {
            icon.style.position = 'absolute';

            icon.addEventListener('pointerdown', function(e) {
                // 不拦截双击
                if (e.detail > 1) return;
                e.preventDefault();
                e.stopPropagation();

                var desktopRect = document.getElementById('desktop').getBoundingClientRect();
                var iconRect = icon.getBoundingClientRect();

                _iconDragInfo = {
                    icon: icon,
                    startX: e.clientX,
                    startY: e.clientY,
                    origLeft: iconRect.left - desktopRect.left,
                    origTop: iconRect.top - desktopRect.top,
                    moved: false
                };

                icon.style.right = 'auto';
                icon.style.bottom = 'auto';
                icon.style.left = _iconDragInfo.origLeft + 'px';
                icon.style.top = _iconDragInfo.origTop + 'px';
                icon.style.zIndex = '500';
                icon.style.opacity = '0.85';
                icon.style.cursor = 'grabbing';

                try {
                    icon.setPointerCapture(e.pointerId);
                } catch(err) {}
            });

            icon.addEventListener('pointermove', function(e) {
                if (!_iconDragInfo || _iconDragInfo.icon !== icon) return;
                e.preventDefault();

                var desktopRect = document.getElementById('desktop').getBoundingClientRect();
                var dx = e.clientX - _iconDragInfo.startX;
                var dy = e.clientY - _iconDragInfo.startY;

                var newLeft = _iconDragInfo.origLeft + dx;
                var newTop = _iconDragInfo.origTop + dy;

                // 边界限制
                var maxLeft = desktopRect.width - icon.offsetWidth - 8;
                var maxTop = desktopRect.height - icon.offsetHeight - 8;
                if (newLeft < 4) newLeft = 4;
                if (newTop < 4) newTop = 4;
                if (newLeft > maxLeft) newLeft = maxLeft;
                if (newTop > maxTop) newTop = maxTop;

                icon.style.left = newLeft + 'px';
                icon.style.top = newTop + 'px';

                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                    _iconDragInfo.moved = true;
                }
            });

            icon.addEventListener('pointerup', function(e) {
                if (!_iconDragInfo || _iconDragInfo.icon !== icon) return;
                icon.style.zIndex = '';
                icon.style.opacity = '1';
                icon.style.cursor = 'pointer';
                saveIconPositions();
                _iconDragInfo = null;
            });
        });
    }

    // 初始化
    setTimeout(function() {
        loadIconPositions();
        initIconDrag();
    }, 500);

    console.log('[v1.7.1] 桌面图标拖动已加载');
})();

                t.textContent = n.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
            }
        }, 1000);

        // 聚焦输入框

    /**

    window.v171Unlock = function() {
        var userName = '';
        var userPassword = '';
        if (typeof v160CurrentUser !== 'undefined' && v160CurrentUser) {
            userName = v160CurrentUser;
            if (typeof v160Users !== 'undefined') {

        var input = document.getElementById('v171-lock-input');
        if (userPassword !== '' && input) {
            if (input.value === userPassword) {
                var overlay = document.getElementById('v171-lockscreen');
                if (overlay) {
                    clearInterval(overlay._timer);
                    overlay.remove();

                showToast('✅ 欢迎回来, ' + userName);

                input.value = '';
                input.style.borderColor = '#ff4444';

                setTimeout(function() {
                    input.style.borderColor = 'rgba(255,255,255,0.3)';
                    input.placeholder = '输入密码解锁';
                }, 1500);
            }
        } else {

                overlay2.remove();

    // Win+L 快捷键锁屏
    document.addEventListener('keydown', function(e) {
        if (e.key === 'L' && (e.metaKey || e.ctrlKey)) {
            e.preventDefault();

    // 开始菜单添加锁屏
    setTimeout(function() {

(function() {
    if (window._v171_notify) return;
    window._v171_notify = true;

    var NOTIFY_KEY = 'tkemu_notifications_v1';
    var notifications = [];
    var _notifyReadCount = 0;

    // 加载通知
    function loadNotifications() {
        try {
            notifications = JSON.parse(localStorage.getItem(NOTIFY_KEY) || '[]');
        } catch(e) {
            notifications = [];
        }
        updateNotifyBadge();
    }

    // 保存通知
    function saveNotifications() {
        localStorage.setItem(NOTIFY_KEY, JSON.stringify(notifications));
        updateNotifyBadge();
    }

    // 更新角标
    function updateNotifyBadge() {
        var badge = document.getElementById('v171-notify-badge');
        if (badge) {
            var unread = notifications.filter(function(n) { return !n.read; }).length;
            badge.textContent = unread;
            badge.style.display = unread > 0 ? 'block' : 'none';
        }
    }

    // 添加通知
    window.v171AddNotification = function(title, message, type) {
        notifications.unshift({
            id: Date.now() + Math.random(),
            title: title,
            message: message || '',
            type: type || 'info',
            time: new Date().toISOString(),
            read: false
        });
        // 最多保留 50 条
        if (notifications.length > 50) notifications = notifications.slice(0, 50);
        saveNotifications();
    };

    // 标记全部已读
    window.v171MarkAllRead = function() {
        notifications.forEach(function(n) { n.read = true; });
        saveNotifications();
        if (openWindows['notifycenter'] && document.getElementById('v171-notify-list')) {
            renderNotifyList();
        }
    };

    // 清除全部
    window.v171ClearAll = function() {
        notifications = [];
        saveNotifications();
        if (openWindows['notifycenter'] && document.getElementById('v171-notify-list')) {
            renderNotifyList();
        }
    };

    // 删除单条
    window.v171RemoveNotify = function(id) {
        notifications = notifications.filter(function(n) { return n.id !== id; });
        saveNotifications();
        renderNotifyList();
    };

    // 渲染通知列表
    function renderNotifyList() {
        var list = document.getElementById('v171-notify-list');
        if (!list) return;
        if (notifications.length === 0) {
            list.innerHTML = '<div style="color:#888;text-align:center;padding:30px;">📭 没有通知</div>';
            return;
        }
        var h = '';
        var icons = { info: 'ℹ️', success: '✅', warning: '⚠️', error: '❌', security: '🔒' };
        notifications.forEach(function(n) {
            var icon = icons[n.type] || 'ℹ️';
            var bg = n.read ? 'background:#1a1a1a;' : 'background:#1a2a4a;border-left:3px solid #0078D4;';
            h += '<div style="' + bg + 'padding:10px 14px;border-bottom:1px solid #222;display:flex;gap:10px;align-items:flex-start;cursor:pointer;" onclick="this.style.opacity=\'0.6\';v171MarkRead(' + n.id + ')">';
            h += '  <span style="font-size:20px;flex-shrink:0;">' + icon + '</span>';
            h += '  <div style="flex:1;">';
            h += '    <div style="color:#fff;font-size:13px;font-weight:bold;">' + escapeHTML(n.title) + '</div>';
            if (n.message) h += '<div style="color:#aaa;font-size:12px;margin-top:2px;">' + escapeHTML(n.message) + '</div>';
            h += '    <div style="color:#666;font-size:10px;margin-top:4px;">' + new Date(n.time).toLocaleString('zh-CN') + '</div>';
            h += '  </div>';
            h += '  <button onclick="event.stopPropagation();v171RemoveNotify(' + n.id + ')" style="background:none;border:none;color:#666;cursor:pointer;font-size:14px;flex-shrink:0;">✕</button>';
            h += '</div>';
        });
        list.innerHTML = h;
    }

    // 标记单条已读
    window.v171MarkRead = function(id) {
        var n = notifications.find(function(x) { return x.id === id; });
        if (n) { n.read = true; saveNotifications(); renderNotifyList(); }
    };

    // 打开通知中心
    window.v171OpenNotifyCenter = function() {
        if (openWindows['notifycenter']) {
            focusWindow('notifycenter');
            return;
        }
        var html = '' +
            '<div style="display:flex;flex-direction:column;height:100%;background:#121212;">' +
            '  <div style="display:flex;padding:8px 14px;border-bottom:1px solid #222;background:#1a1a1a;align-items:center;flex-shrink:0;">' +
            '    <span style="color:#fff;font-weight:bold;font-size:13px;flex:1;">📬 通知中心</span>' +
            '    <button onclick="v171MarkAllRead()" style="background:none;border:none;color:#0078D4;cursor:pointer;font-size:11px;margin-right:8px;">全部已读</button>' +
            '    <button onclick="v171ClearAll()" style="background:none;border:none;color:#e74c3c;cursor:pointer;font-size:11px;">清除全部</button>' +
            '  </div>' +
            '  <div id="v171-notify-list" style="flex:1;overflow-y:auto;"></div>' +
            '</div>';
        createWindow('notifycenter', '通知中心', '📬', 380, 450, 100, 160, html);
        setTimeout(renderNotifyList, 100);
    };

    // 创建任务栏通知图标
    function createNotifyIcon() {
        var taskbar = document.getElementById('taskbar');
        if (!taskbar) return;
        var clock = document.getElementById('clock');
        if (!clock) return;

        var iconWrap = document.createElement('div');
        iconWrap.style.cssText = 'position:relative;margin-right:8px;flex-shrink:0;';
        iconWrap.innerHTML = '' +
            '<button id="v171-notify-btn" onclick="v171OpenNotifyCenter()" style="background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;padding:6px 8px;border-radius:4px;font-family:var(--font-ui);" title="通知中心">📬</button>' +
            '<span id="v171-notify-badge" style="position:absolute;top:0;right:0;background:#e74c3c;color:#fff;font-size:9px;min-width:15px;height:15px;line-height:15px;border-radius:8px;display:none;text-align:center;pointer-events:none;">0</span>';
        taskbar.insertBefore(iconWrap, clock);
    }

    // 重写 showToast 使其同时记录通知
    var _origShowToast = showToast;
    showToast = function(msg) {
        _origShowToast(msg);
        // 记录到通知中心
        var type = 'info';
        if (msg.indexOf('✅') !== -1 || msg.indexOf('成功') !== -1) type = 'success';
        if (msg.indexOf('⚠️') !== -1 || msg.indexOf('警告') !== -1) type = 'warning';
        if (msg.indexOf('❌') !== -1 || msg.indexOf('错误') !== -1) type = 'error';
        v171AddNotification('系统通知', msg, type);
    };

    // 初始化
    loadNotifications();
    setTimeout(createNotifyIcon, 500);

    console.log('[v1.7.1] 通知中心已加载');
})();

(function() {
    if (window._v171_backup) return;
    window._v171_backup = true;

    var BACKUP_KEYS = [
        'tkemu_fs_v6',
        'tkemu_hidden_files_v2',
        'tkemu_kd_apps',
        'tkemu_vfolders_v1',
        'tkemu_ftags_v1',
        'tkemu_sys_tokens_v2',
        'tkemu_sys_updates_v2',
        'tkemu_users_v1',
        'tkemu_session_v1',
        'tkemu_trash',
        'tkemu_icon_positions_v1',
        'tkemu_notifications_v1',
        'tkemu_syslog_v1'
    ];

    /**
     * 导出完整备份
     */
    window.v171ExportBackup = function() {
        var backup = {
            app: 'tkemu',
            version: APP_VERSION,
            exportTime: new Date().toISOString(),
            data: {}
        };

        BACKUP_KEYS.forEach(function(key) {
            try {
                backup.data[key] = localStorage.getItem(key);
            } catch(e) {
                backup.data[key] = null;
            }
        });

        var jsonStr = JSON.stringify(backup, null, 2);
        var blob = new Blob([jsonStr], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'tkemu_backup_' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showToast('💾 完整备份已导出');
        v171AddNotification('系统备份', '完整备份已导出', 'success');
    };

    /**
     * 导入备份
     */
    window.v171ImportBackup = function() {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = function(e) {
            var file = e.target.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    var backup = JSON.parse(ev.target.result);
                    if (!backup || backup.app !== 'tkemu' || !backup.data) {
                        alert('❌ 无效的 tkemu 备份文件');
                        return;
                    }

                    if (!confirm('⚠️ 导入备份将覆盖当前所有数据！\n\n备份版本: ' + backup.version + '\n导出时间: ' + backup.exportTime + '\n\n确定要继续吗？')) {
                        return;
                    }

                    // 恢复所有数据
                    var restoredCount = 0;
                    BACKUP_KEYS.forEach(function(key) {
                        if (backup.data[key] !== undefined && backup.data[key] !== null) {
                            try {
                                localStorage.setItem(key, backup.data[key]);
                                restoredCount++;
                            } catch(err) {
                                console.error('恢复 ' + key + ' 失败:', err);
                            }
                        } else {
                            localStorage.removeItem(key);
                        }
                    });

                    showToast('✅ 备份已恢复 (' + restoredCount + ' 项)');
                    v171AddNotification('系统备份', '备份已恢复', 'success');

                    // 2秒后刷新
                    setTimeout(function() {
                        location.reload();
                    }, 2000);

                } catch(err) {
                    alert('❌ 文件解析失败: ' + err.message);
                }
            };
            reader.readAsText(file);
        };
        input.click();
    };

    /**
     * 打开备份管理窗口
     */
    window.v171OpenBackupManager = function() {
        if (openWindows['backupmanager']) {
            focusWindow('backupmanager');
            return;
        }

        var totalSize = 0;
        BACKUP_KEYS.forEach(function(key) {
            try {
                var data = localStorage.getItem(key);
                if (data) totalSize += data.length * 2;
            } catch(e) {}
        });

        var html = '' +
            '<div style="padding:20px;background:#f0f0f0;height:100%;overflow-y:auto;color:#1a1a1a;">' +
            '  <h3 style="margin-bottom:15px;color:#0078D4;">💾 系统备份</h3>' +
            '  <div style="background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;margin-bottom:15px;">' +
            '    <div style="font-weight:bold;font-size:14px;margin-bottom:6px;">当前数据大小</div>' +
            '    <div style="font-size:22px;color:#0078D4;font-weight:bold;">' + (totalSize / 1024).toFixed(1) + ' KB</div>' +
            '    <div style="color:#888;font-size:11px;margin-top:4px;">包含 ' + BACKUP_KEYS.length + ' 个数据项</div>' +
            '  </div>' +
            '  <div style="background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;margin-bottom:15px;">' +
            '    <div style="font-weight:bold;font-size:13px;margin-bottom:10px;">备份内容</div>' +
            '    <div style="font-size:11px;color:#666;line-height:1.8;">' +
            '      📁 文件系统<br>' +
            '      🙈 隐藏文件<br>' +
            '      ⚡ KD应用<br>' +
            '      📂 虚拟文件夹<br>' +
            '      🏷️ 文件标签<br>' +
            '      🔑 sys令牌<br>' +
            '      🔄 sys更新<br>' +
            '      👤 用户数据<br>' +
            '      🖼️ 桌面图标位置<br>' +
            '      📬 通知记录<br>' +
            '      📋 系统日志' +
            '    </div>' +
            '  </div>' +
            '  <div style="display:flex;gap:8px;">' +
            '    <button onclick="v171ExportBackup()" style="padding:10px 20px;background:#0078D4;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:13px;flex:1;">📤 导出备份</button>' +
            '    <button onclick="v171ImportBackup()" style="padding:10px 20px;background:#e67e22;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:13px;flex:1;">📥 导入备份</button>' +
            '  </div>' +
            '  <div style="color:#888;font-size:10px;margin-top:12px;text-align:center;">⚠️ 导入备份将覆盖当前所有数据</div>' +
            '</div>';

        createWindow('backupmanager', '系统备份', '💾', 420, 460, 110, 150, html);
    };

    // 添加桌面右键入口
    setTimeout(function() {
        var menu = document.getElementById('desktop-context-menu');
        if (menu && !document.getElementById('v171-backup-item')) {
            var item = document.createElement('div');
            item.className = 'context-menu-item';
            item.id = 'v171-backup-item';
            item.innerHTML = '<span>💾</span> 系统备份';
            item.onclick = function() {
                v171OpenBackupManager();
                hideAllContextMenus();
            };
            menu.appendChild(item);
        }
    }, 300);

    // 添加开始菜单入口
    setTimeout(function() {
        var sm = document.getElementById('start-menu');

            var item = document.createElement('div');
            item.className = 'start-menu-item';
            item.id = 'v171-backup-sm';

            item.onclick = function() {
                toggleStartMenu();
                v171OpenBackupManager();

    console.log('[v1.7.1] 系统备份已加载');

(function() {
    if (window._v172_minimize_anim) return;
    window._v172_minimize_anim = true;

    // 保存原始 minimizeWindow
    var _origMinimizeWindow = minimizeWindow;

    // 重写 minimizeWindow 添加动画
    minimizeWindow = function(id) {
        if (!openWindows[id]) return;
        var win = openWindows[id].el;

        // 如果已经最小化，直接调用原始函数
        if (openWindows[id].minimized) {
            _origMinimizeWindow(id);
            return;
        }

        // 获取窗口和任务栏位置
        var winRect = win.getBoundingClientRect();
        var taskbar = document.getElementById('taskbar');
        var taskbarRect = taskbar ? taskbar.getBoundingClientRect() : { left: 0, top: window.innerHeight - 48 };

        // 目标位置（任务栏中央）
        var targetX = taskbarRect.left + taskbarRect.width / 2;
        var targetY = taskbarRect.top + taskbarRect.height / 2;

        // 创建动画副本
        var clone = win.cloneNode(true);
        clone.style.cssText = win.style.cssText;
        clone.style.position = 'fixed';
        clone.style.left = winRect.left + 'px';
        clone.style.top = winRect.top + 'px';
        clone.style.width = winRect.width + 'px';
        clone.style.height = winRect.height + 'px';
        clone.style.zIndex = '99999';
        clone.style.pointerEvents = 'none';
        clone.style.transition = 'all 0.35s cubic-bezier(0.4, 0, 0.2, 1)';
        clone.style.opacity = '1';
        clone.style.transform = 'scale(1)';
        clone.style.transformOrigin = 'center';
        clone.style.borderRadius = '8px';
        clone.style.overflow = 'hidden';
        document.body.appendChild(clone);

        // 立即隐藏原窗口
        win.style.display = 'none';
        openWindows[id].minimized = true;
        if (activeWindowId === id) activeWindowId = null;
        updateTaskbarActive();

        // 触发动画
        setTimeout(function() {
            clone.style.left = (targetX - 30) + 'px';
            clone.style.top = (targetY - 20) + 'px';
            clone.style.width = '60px';
            clone.style.height = '40px';
            clone.style.opacity = '0.2';
            clone.style.transform = 'scale(0.3)';

        // 动画结束后移除副本

(function() {
    if (window._v172_sound) return;
    window._v172_sound = true;

    var audioCtx = null;
    var soundEnabled = true;

    /**
     * 获取 AudioContext
     */
    function getAudioCtx() {
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {
                return null;
            }
        }
        return audioCtx;
    }

    /**
     * 播放音效
     * @param {string} type - 音效类型
     */
    window.v172PlaySound = function(type) {
        if (!soundEnabled) return;
        var ctx = getAudioCtx();
        if (!ctx) return;

        try {
            // 恢复上下文（浏览器自动播放策略）
            if (ctx.state === 'suspended') {
                ctx.resume();
            }

            var oscillator = ctx.createOscillator();
            var gainNode = ctx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);

            var now = ctx.currentTime;

            switch(type) {
                case 'click':
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(800, now);
                    oscillator.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                    gainNode.gain.setValueAtTime(0.15, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    oscillator.start(now);
                    oscillator.stop(now + 0.1);
                    break;

                case 'open':
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(400, now);
                    oscillator.frequency.exponentialRampToValueAtTime(800, now + 0.12);
                    gainNode.gain.setValueAtTime(0.12, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    oscillator.start(now);
                    oscillator.stop(now + 0.15);
                    break;

                case 'close':
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(800, now);
                    oscillator.frequency.exponentialRampToValueAtTime(300, now + 0.12);
                    gainNode.gain.setValueAtTime(0.12, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    oscillator.start(now);
                    oscillator.stop(now + 0.15);
                    break;

                case 'minimize':
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(600, now);
                    oscillator.frequency.exponentialRampToValueAtTime(200, now + 0.2);
                    gainNode.gain.setValueAtTime(0.1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    oscillator.start(now);
                    oscillator.stop(now + 0.25);
                    break;

                case 'restore':
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(300, now);
                    oscillator.frequency.exponentialRampToValueAtTime(700, now + 0.15);
                    gainNode.gain.setValueAtTime(0.1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    oscillator.start(now);
                    oscillator.stop(now + 0.2);
                    break;

                case 'notify':
                    // 双音提示
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(660, now);
                    oscillator.frequency.setValueAtTime(880, now + 0.12);
                    gainNode.gain.setValueAtTime(0.12, now);
                    gainNode.gain.setValueAtTime(0.12, now + 0.12);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    oscillator.start(now);
                    oscillator.stop(now + 0.3);
                    break;

                case 'error':
                    oscillator.type = 'square';
                    oscillator.frequency.setValueAtTime(200, now);
                    oscillator.frequency.exponentialRampToValueAtTime(150, now + 0.2);
                    gainNode.gain.setValueAtTime(0.08, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    oscillator.start(now);
                    oscillator.stop(now + 0.25);
                    break;

                case 'success':
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(523, now);
                    oscillator.frequency.setValueAtTime(659, now + 0.1);
                    oscillator.frequency.setValueAtTime(784, now + 0.2);
                    gainNode.gain.setValueAtTime(0.12, now);
                    gainNode.gain.setValueAtTime(0.12, now + 0.1);
                    gainNode.gain.setValueAtTime(0.12, now + 0.2);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    oscillator.start(now);
                    oscillator.stop(now + 0.4);
                    break;

                default:
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(500, now);
                    gainNode.gain.setValueAtTime(0.1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    oscillator.start(now);
                    oscillator.stop(now + 0.1);
            }
        } catch(e) {
            // 静默失败
        }
    };

    /**
     * 切换音效开关
     */
    window.v172ToggleSound = function() {
        soundEnabled = !soundEnabled;
        return soundEnabled;
    };

    /**
     * 获取音效状态
     */
    window.v172IsSoundEnabled = function() {
        return soundEnabled;
    };

    // 挂载音效到现有函数
    var _origCreateWindow2 = createWindow;
    createWindow = function(id, title, icon, width, height, top, left, bodyHTML) {
        var result = _origCreateWindow2(id, title, icon, width, height, top, left, bodyHTML);
        v172PlaySound('open');
        return result;
    };

    var _origCloseWindow2 = closeWindow;
    closeWindow = function(id) {
        if (openWindows[id]) {
            v172PlaySound('close');
        }
        _origCloseWindow2(id);
    };

    var _origMinimizeWindow2 = minimizeWindow;
    minimizeWindow = function(id) {
        if (openWindows[id] && !openWindows[id].minimized) {
            v172PlaySound('minimize');
        }
        _origMinimizeWindow2(id);
    };

    var _origRestoreWindow2 = restoreWindow;
    restoreWindow = function(id) {
        if (openWindows[id] && openWindows[id].minimized) {
            v172PlaySound('restore');
        }
        _origRestoreWindow2(id);
    };

    var _origShowToast2 = showToast;
    showToast = function(msg) {
        _origShowToast2(msg);
        if (msg.indexOf('✅') !== -1 || msg.indexOf('成功') !== -1) {
            v172PlaySound('success');
        } else if (msg.indexOf('❌') !== -1 || msg.indexOf('错误') !== -1 || msg.indexOf('⚠️') !== -1) {
            v172PlaySound('error');
        } else {
            v172PlaySound('notify');
        }
    };

    console.log('[v1.7.2] 音效系统已加载');
})();

// ─────────────────────────────────────────────────────────────

(function() {
    if (window._v172_snap) return;
    window._v172_snap = true;

    var SNAP_THRESHOLD = 30;
    var _snapState = {};

    // 保存原始 startDrag
    var _origStartDrag = startDrag;

    // 重写 startDrag 添加贴边检测
    startDrag = function(e, id) {
        if (!openWindows[id] || openWindows[id].maximized) return;
        _origStartDrag(e, id);
    };

    // 监听 pointerup 检测贴边
    document.addEventListener('pointerup', function(e) {
        if (!dragInfo) return;
        var id = dragInfo.id;
        var winData = openWindows[id];
        if (!winData) return;

        var win = winData.el;
        var rect = win.getBoundingClientRect();
        var screenW = window.innerWidth;
        var screenH = window.innerHeight;
        var taskbarH = document.getElementById('taskbar').offsetHeight;

        // 检测顶部贴边 → 最大化
        if (rect.top <= SNAP_THRESHOLD) {
            if (!winData.maximized) {
                toggleMaximize(id);
                v172PlaySound('restore');
            }
            return;
        }

        // 检测左边缘 → 左半屏
        if (rect.left <= SNAP_THRESHOLD) {
            if (!winData.snapped || winData.snapped !== 'left') {
                winData.snapped = 'left';
                winData.snappedRect = {
                    left: rect.left,
                    top: rect.top,
                    width: rect.width,
                    height: rect.height
                };
                win.style.left = '0px';
                win.style.top = '0px';
                win.style.width = (screenW / 2) + 'px';
                win.style.height = (screenH - taskbarH) + 'px';
                v172PlaySound('click');
                showToast('📐 贴边到左半屏');
            }
            return;
        }

        // 检测右边缘 → 右半屏
        if (rect.right >= screenW - SNAP_THRESHOLD) {
            if (!winData.snapped || winData.snapped !== 'right') {
                winData.snapped = 'right';
                winData.snappedRect = {
                    left: rect.left,
                    top: rect.top,
                    width: rect.width,
                    height: rect.height
                };
                win.style.left = (screenW / 2) + 'px';
                win.style.top = '0px';
                win.style.width = (screenW / 2) + 'px';
                win.style.height = (screenH - taskbarH) + 'px';
                v172PlaySound('click');
                showToast('📐 贴边到右半屏');
            }
            return;
        }

        // 没有贴边，如果之前贴边了则还原
        if (winData.snapped && winData.snappedRect) {
            win.style.left = winData.snappedRect.left + 'px';
            win.style.top = winData.snappedRect.top + 'px';
            win.style.width = winData.snappedRect.width + 'px';
            win.style.height = winData.snappedRect.height + 'px';
            winData.snapped = null;
            winData.snappedRect = null;
        }
    });

    console.log('[v1.7.2] Aero Snap 已加载');
})();

    window.v172RenameFile = function(oldPath) {
        var newName = prompt('重命名:', oldPath);
        if (newName && newName.trim() && newName.trim() !== oldPath) {
            newName = newName.trim();
            var content = VirtualFS.readFile(oldPath);
            if (content !== null) {
                VirtualFS.writeFile(newName, content);
                VirtualFS.deleteFile(oldPath);
                showToast('✅ 已重命名: ' + newName);
                refreshFiles();
            }
        }
    };

    /**
     * 复制路径
     */
    window.v172CopyPath = function(filePath) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(filePath).then(function() {
                showToast('📋 路径已复制');
            });
        } else {
            // 降级方案
            var ta = document.createElement('textarea');
            ta.value = filePath;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('📋 路径已复制');
        }
    };

    /**

    window.v172SetTag = function(filePath) {
        var currentTag = VirtualFS.getFileTag(filePath) || '';
        var newTag = prompt('设置标签 (留空清除):', currentTag);
        if (newTag !== null) {
            if (newTag.trim() === '') {
                VirtualFS.removeFileTag(filePath);
                showToast('🏷️ 标签已清除');
            } else {
                VirtualFS.setFileTag(filePath, newTag.trim());
                showToast('🏷️ 标签已设置: ' + newTag.trim());
            }
            refreshFiles();
        }
    };

    /**
     * 文件属性
     */
    window.v172FileProperties = function(filePath) {
        var content = VirtualFS.readFile(filePath);
        if (content === null) {
            showToast('文件不存在');
            return;
        }
        var size = new Blob([content]).size;
        var tag = VirtualFS.getFileTag(filePath) || '无';
        var hidden = hiddenFiles.indexOf(filePath) !== -1;
        var type = filePath.split('.').pop().toLowerCase();

        var typeNames = {
            'py': 'Python 脚本',
            'rf': 'rf 脚本',
            'kd': 'KD 应用',
            'sys': 'sys 系统脚本',
            'txt': '文本文件',
            'md': 'Markdown 文档',
            'json': 'JSON 数据',
            'html': 'HTML 文件',
            'css': 'CSS 样式',
            'js': 'JavaScript 文件',
            'csv': 'CSV 数据',
            'log': '日志文件'
        };

        var info = '' +
            '文件名: ' + filePath + '\n' +
            '类型: ' + (typeNames[type] || '.' + type + ' 文件') + '\n' +
            '大小: ' + (size / 1024).toFixed(2) + ' KB (' + size + ' 字节)\n' +
            '标签: ' + tag + '\n' +
            '状态: ' + (hidden ? '已隐藏' : '正常') + '\n' +
            '路径: /' + filePath;

        alert(info);
    };

    /**

     */
    window.v172DeleteFilePermanent = function(filePath) {
        if (confirm('确定永久删除 "' + filePath + '"？\n\n此操作不可恢复！')) {

//  Windows Control 分辨率设置
//  新增"分辨率"设置项：手动选择 + 自适应
// ═══════════════════════════════════════════════════════════════

(function() {
    if (window._resolution_setting) return;
    window._resolution_setting = true;

    // 分辨率预设列表
    var RESOLUTIONS = [
        { label: '1280 × 720 (HD)', scale: 0.67 },
        { label: '1366 × 768', scale: 0.71 },
        { label: '1600 × 900', scale: 0.83 },
        { label: '1920 × 1080 (Full HD)', scale: 1.0 },
        { label: '2560 × 1440 (2K)', scale: 1.33 },
        { label: '3840 × 2160 (4K)', scale: 2.0 }
    ];

    var RES_KEY = 'tkemu_resolution_v1';
    var currentMode = 'auto'; // auto / manual
    var currentScale = SCALE_FACTOR;

    // 加载设置
    try {
        var saved = JSON.parse(localStorage.getItem(RES_KEY) || '{}');
        if (saved.mode) currentMode = saved.mode;
        if (saved.scale) currentScale = saved.scale;
    } catch(e) {}

    // 保存设置
    function saveResSettings() {
        localStorage.setItem(RES_KEY, JSON.stringify({
            mode: currentMode,
            scale: currentScale
        }));
    }

    // 应用缩放
    function applyScale(scale) {
        scale = Math.max(0.5, Math.min(2.0, scale));
        SCALE_FACTOR = scale;
        document.documentElement.style.setProperty('--ui-scale', scale);
        document.body.style.fontSize = (13 * scale) + 'px';
        saveResSettings();
        showToast('📐 分辨率已应用: ' + Math.round(scale * 100) + '%');
    }

    // 自适应模式
    function applyAutoScale() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var baseW = 1920, baseH = 1080;
        var scaleByWidth = w / baseW;
        var scaleByHeight = h / baseH;
        var scale = Math.min(scaleByWidth, scaleByHeight);
        scale = Math.max(0.5, Math.min(2.0, scale));
        applyScale(scale);
    }

    // 在 WC.items 中添加分辨率项目
    WC.items.push({
        id: 'resolution',
        name: '分辨率',
        icon: '📐',
        desc: '调整屏幕分辨率',
        cat: 'appearance'
    });

    // 扩展 WC.runItem
    var _origRunItem = WC.runItem;
    WC.runItem = function(id) {
        if (id === 'resolution') {
            showResolutionPanel(document.getElementById('wc-content'));
            return;
        }
        _origRunItem(id);
    };

    // 分辨率设置面板
    function showResolutionPanel(content) {
        if (!content) return;

        var h = '<div style="font-weight:bold;font-size:14px;margin-bottom:12px;">📐 分辨率设置</div>';

        // 当前信息
        h += '<div style="background:#e8f4fd;border:1px solid #b8d4e8;border-radius:8px;padding:12px;margin-bottom:14px;">';
        h += '  <div style="font-size:12px;color:#333;margin-bottom:4px;">当前显示</div>';
        h += '  <div style="font-size:18px;font-weight:bold;color:#0078D4;">' + window.innerWidth + ' × ' + window.innerHeight + '</div>';
        h += '  <div style="font-size:11px;color:#666;margin-top:2px;">缩放因子: ' + SCALE_FACTOR.toFixed(2) + ' (' + Math.round(SCALE_FACTOR * 100) + '%)</div>';
        h += '</div>';

        // 模式选择
        h += '<div style="margin-bottom:12px;">';
        h += '  <div style="font-weight:bold;font-size:12px;margin-bottom:8px;">显示模式</div>';
        h += '  <div style="display:flex;gap:8px;">';
        h += '    <button onclick="resSetMode(\'auto\')" id="res-mode-auto" style="flex:1;padding:10px;border:2px solid ' + (currentMode === 'auto' ? '#0078D4' : '#d0d0d0') + ';background:' + (currentMode === 'auto' ? '#f0f7ff' : '#fff') + ';border-radius:8px;cursor:pointer;font-size:12px;color:' + (currentMode === 'auto' ? '#0078D4' : '#666') + ';">\n' +
        '      <div style="font-size:20px;">🔄</div>\n' +
        '      <div style="font-weight:bold;margin-top:2px;">自适应</div>\n' +
        '      <div style="font-size:10px;color:#999;">跟随窗口大小</div>\n' +
        '    </button>';
        h += '    <button onclick="resSetMode(\'manual\')" id="res-mode-manual" style="flex:1;padding:10px;border:2px solid ' + (currentMode === 'manual' ? '#0078D4' : '#d0d0d0') + ';background:' + (currentMode === 'manual' ? '#f0f7ff' : '#fff') + ';border-radius:8px;cursor:pointer;font-size:12px;color:' + (currentMode === 'manual' ? '#0078D4' : '#666') + ';">\n' +
        '      <div style="font-size:20px;">🎯</div>\n' +
        '      <div style="font-weight:bold;margin-top:2px;">手动选择</div>\n' +
        '      <div style="font-size:10px;color:#999;">固定缩放比例</div>\n' +
        '    </button>';
        h += '  </div>';
        h += '</div>';

        // 手动选择
        h += '<div id="res-manual-section" style="display:' + (currentMode === 'manual' ? 'block' : 'none') + ';">';
        h += '  <div style="font-weight:bold;font-size:12px;margin-bottom:6px;">选择预设分辨率</div>';
        h += '  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;">';
        RESOLUTIONS.forEach(function(res) {
            var isActive = Math.abs(currentScale - res.scale) < 0.01;
            h += '<button onclick="resApplyPreset(' + res.scale + ')" style="padding:8px 10px;border:2px solid ' + (isActive ? '#0078D4' : '#d0d0d0') + ';background:' + (isActive ? '#f0f7ff' : '#fff') + ';border-radius:6px;cursor:pointer;font-size:11px;color:' + (isActive ? '#0078D4' : '#333') + ';">' + res.label + '</button>';
        });
        h += '  </div>';

        // 自定义滑块
        h += '  <div style="margin-top:12px;">';
        h += '    <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;">';
        h += '      <span>自定义缩放</span>';
        h += '      <span id="res-custom-label">' + Math.round(currentScale * 100) + '%</span>';
        h += '    </div>';
        h += '    <input type="range" min="50" max="200" value="' + Math.round(currentScale * 100) + '" oninput="resApplyCustom(this.value)" style="width:100%;accent-color:#0078D4;">';
        h += '  </div>';
        h += '</div>';

        // 提示
        h += '<div style="margin-top:14px;padding:10px;background:#f9f9f9;border-radius:8px;font-size:10px;color:#888;">';
        h += '💡 缩放因子基于 1920×1080 基准计算。自适应模式会随浏览器窗口大小自动调整。';
        h += '</div>';

        content.innerHTML = h;
    }

    // 全局函数供 onclick 调用
    window.resSetMode = function(mode) {
        currentMode = mode;
        saveResSettings();

        var autoBtn = document.getElementById('res-mode-auto');
        var manualBtn = document.getElementById('res-mode-manual');
        var section = document.getElementById('res-manual-section');

        if (autoBtn && manualBtn) {
            autoBtn.style.borderColor = mode === 'auto' ? '#0078D4' : '#d0d0d0';
            autoBtn.style.background = mode === 'auto' ? '#f0f7ff' : '#fff';
            autoBtn.style.color = mode === 'auto' ? '#0078D4' : '#666';
            manualBtn.style.borderColor = mode === 'manual' ? '#0078D4' : '#d0d0d0';
            manualBtn.style.background = mode === 'manual' ? '#f0f7ff' : '#fff';
            manualBtn.style.color = mode === 'manual' ? '#0078D4' : '#666';
        }
        if (section) {
            section.style.display = mode === 'manual' ? 'block' : 'none';
        }

        if (mode === 'auto') {
            applyAutoScale();
        }
    };

    window.resApplyPreset = function(scale) {
        currentMode = 'manual';
        currentScale = scale;
        applyScale(scale);
        showResolutionPanel(document.getElementById('wc-content'));
    };

    window.resApplyCustom = function(value) {
        var scale = parseInt(value) / 100;
        currentScale = scale;
        applyScale(scale);
        var label = document.getElementById('res-custom-label');
        if (label) label.textContent = value + '%';
    };

    // 启动时应用保存的设置
    setTimeout(function() {
        if (currentMode === 'manual') {
            applyScale(currentScale);
        } else {
            applyAutoScale();
        }
    }, 300);

    // 窗口大小变化时，如果是自适应模式则重新计算
    window.addEventListener('resize', function() {
        if (currentMode === 'auto') {
            applyAutoScale();
        }
    });

    // 添加到 Windows Control 侧边栏
    // WC.cats 中的 appearance 已经有分辨率入口
    console.log('📐 分辨率设置已添加到 Windows Control');
})();

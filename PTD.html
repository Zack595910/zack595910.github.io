<style>
/* ═══════════════════════════════════════════════════════════════
   CSS 变量 - Windows 10 主题配色
   ═══════════════════════════════════════════════════════════════ */
:root {
    /* 桌面背景渐变 */
    --win-bg: #0078D4;
    --win-bg-gradient-start: #0078D4;
    --win-bg-gradient-end: #004E8C;

    /* 任务栏颜色 */
    --win-taskbar: #111111;
    --win-taskbar-hover: rgba(255, 255, 255, 0.08);
    --win-taskbar-active: rgba(255, 255, 255, 0.15);

    /* 窗口标题栏颜色 */
    --win-title-active: #0078D4;
    --win-title-inactive: #333333;
    --win-title-text-active: #ffffff;
    --win-title-text-inactive: #cccccc;

    /* 窗口主体 */
    --win-border: #1a1a1a;
    --win-body: #ffffff;
    --win-shadow: 0 calc(8px * var(--ui-scale, 1)) calc(32px * var(--ui-scale, 1)) rgba(0, 0, 0, 0.4);

    /* 强调色 */
    --win-accent: #0078D4;
    --win-accent-light: #3A8CFF;
    --win-danger: #E81123;

    /* 文字颜色 */
    --win-text: #1a1a1a;
    --win-text-secondary: #666666;
    --win-text-disabled: #999999;

    /* 通用圆角 */
    --win-radius: calc(8px * var(--ui-scale, 1));
    --win-radius-sm: calc(4px * var(--ui-scale, 1));

    /* 字体 */
    --font-ui: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
    --font-mono: 'Cascadia Code', 'Consolas', 'Courier New', 'SF Mono', monospace;

    /* 缩放变量 */
    --ui-scale: 1;
}

/* ═══════════════════════════════════════════════════════════════
   全局重置样式
   ═══════════════════════════════════════════════════════════════ */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    font-family: var(--font-ui);
    font-size: calc(13px * var(--ui-scale, 1));
    color: var(--win-text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    touch-action: none;
    -webkit-touch-callout: none;
}

/* ═══════════════════════════════════════════════════════════════
   桌面区域
   ═══════════════════════════════════════════════════════════════ */
#desktop {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: calc(48px * var(--ui-scale, 1));
    background: linear-gradient(
        135deg,
        var(--win-bg-gradient-start) 0%,
        var(--win-bg-gradient-end) 100%
    );
    overflow: hidden;
    z-index: 0;
}

/* ═══════════════════════════════════════════════════════════════
   桌面图标样式
   ═══════════════════════════════════════════════════════════════ */
.desktop-icon {
    position: absolute;
    width: calc(80px * var(--ui-scale, 1));
    text-align: center;
    cursor: pointer;
    padding: calc(8px * var(--ui-scale, 1)) calc(4px * var(--ui-scale, 1));
    border-radius: var(--win-radius-sm);
    color: #ffffff;
    font-size: calc(12px * var(--ui-scale, 1));
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    transition: background 0.1s ease;
}

.desktop-icon:hover {
    background: rgba(255, 255, 255, 0.2);
}

.desktop-icon:active {
    background: rgba(255, 255, 255, 0.3);
}

.desktop-icon .icon-img {
    width: calc(48px * var(--ui-scale, 1));
    height: calc(48px * var(--ui-scale, 1));
    margin: 0 auto calc(4px * var(--ui-scale, 1));
    font-size: calc(36px * var(--ui-scale, 1));
    line-height: calc(48px * var(--ui-scale, 1));
    pointer-events: none;
}

.desktop-icon div:last-child {
    word-wrap: break-word;
    line-height: 1.3;
}

/* 回收站角标 */
.desktop-icon .icon-badge {
    position: absolute;
    top: calc(2px * var(--ui-scale, 1));
    right: calc(2px * var(--ui-scale, 1));
    background: #cc0000;
    color: #ffffff;
    font-size: calc(10px * var(--ui-scale, 1));
    min-width: calc(16px * var(--ui-scale, 1));
    height: calc(16px * var(--ui-scale, 1));
    line-height: calc(16px * var(--ui-scale, 1));
    border-radius: calc(8px * var(--ui-scale, 1));
    display: none;
    pointer-events: none;
}

/* ═══════════════════════════════════════════════════════════════
   窗口样式
   ═══════════════════════════════════════════════════════════════ */
.window {
    position: absolute;
    background: var(--win-body);
    border: 1px solid var(--win-border);
    border-radius: var(--win-radius) var(--win-radius) 0 0;
    box-shadow: var(--win-shadow);
    display: flex;
    flex-direction: column;
    min-width: calc(260px * var(--ui-scale, 1));
    min-height: calc(150px * var(--ui-scale, 1));
    z-index: 1;
    overflow: hidden;
    animation: windowOpen 0.2s ease-out;
}

/* 窗口打开动画 */
@keyframes windowOpen {
    from {
        opacity: 0;
        transform: scale(0.95);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* 聚焦窗口 */
.window.focused {
    z-index: 100 !important;
}

/* 最大化窗口 */
.window.maximized {
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: calc(100% - 48px * var(--ui-scale, 1)) !important;
    border-radius: 0 !important;
    animation: none;
}

/* ═══════════════════════════════════════════════════════════════
   窗口标题栏
   ═══════════════════════════════════════════════════════════════ */
.window-titlebar {
    display: flex;
    align-items: center;
    height: calc(36px * var(--ui-scale, 1));
    background: var(--win-title-inactive);
    color: var(--win-title-text-inactive);
    padding: 0 calc(8px * var(--ui-scale, 1));
    cursor: default;
    font-size: calc(13px * var(--ui-scale, 1));
    flex-shrink: 0;
    transition: background 0.15s ease;
}

/* 聚焦时标题栏变为蓝色 */
.window.focused .window-titlebar {
    background: var(--win-title-active);
    color: var(--win-title-text-active);
}

.window-titlebar .title-icon {
    font-size: calc(16px * var(--ui-scale, 1));
    margin-right: calc(8px * var(--ui-scale, 1));
    flex-shrink: 0;
}

.window-titlebar .title-text {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.window-titlebar .title-buttons {
    display: flex;
    gap: calc(2px * var(--ui-scale, 1));
    margin-left: auto;
    flex-shrink: 0;
}

/* 标题栏按钮 */
.title-btn {
    width: calc(36px * var(--ui-scale, 1));
    height: calc(28px * var(--ui-scale, 1));
    border: none;
    background: transparent;
    color: inherit;
    font-size: calc(14px * var(--ui-scale, 1));
    cursor: pointer;
    border-radius: var(--win-radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s ease;
}

.title-btn:hover {
    background: rgba(255, 255, 255, 0.15);
}

.title-btn:active {
    background: rgba(255, 255, 255, 0.25);
}

/* 关闭按钮特殊样式 */
.title-btn.btn-close:hover {
    background: var(--win-danger);
    color: #ffffff;
}

/* ═══════════════════════════════════════════════════════════════
   窗口内容区
   ═══════════════════════════════════════════════════════════════ */
.window-body {
    flex: 1;
    overflow: auto;
    position: relative;
    background: #1e1e1e;
    display: flex;
    flex-direction: column;
}

/* iframe 全屏嵌入 */
.window-body iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* ═══════════════════════════════════════════════════════════════
   菜单栏（编辑器用）
   ═══════════════════════════════════════════════════════════════ */
.menu-bar {
    display: flex;
    align-items: center;
    background: #2d2d2d;
    border-bottom: 1px solid #3d3d3d;
    padding: 0;
    flex-shrink: 0;
    height: calc(28px * var(--ui-scale, 1));
}

.menu-bar .menu-item {
    padding: calc(4px * var(--ui-scale, 1)) calc(12px * var(--ui-scale, 1));
    color: #cccccc;
    cursor: pointer;
    font-size: calc(12px * var(--ui-scale, 1));
    position: relative;
    white-space: nowrap;
}

.menu-bar .menu-item:hover {
    background: #3d3d3d;
}

.menu-bar .menu-item.open {
    background: #3d3d3d;
}

/* 下拉菜单 */
.menu-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    background: #2d2d2d;
    border: 1px solid #444444;
    border-radius: calc(4px * var(--ui-scale, 1));
    min-width: calc(200px * var(--ui-scale, 1));
    z-index: 300;
    display: none;
    box-shadow: 0 calc(4px * var(--ui-scale, 1)) calc(16px * var(--ui-scale, 1)) rgba(0, 0, 0, 0.5);
    padding: calc(4px * var(--ui-scale, 1)) 0;
}

.menu-dropdown.open {
    display: block;
}

.menu-dropdown-item {
    padding: calc(6px * var(--ui-scale, 1)) calc(16px * var(--ui-scale, 1));
    color: #cccccc;
    cursor: pointer;
    font-size: calc(12px * var(--ui-scale, 1));
    display: flex;
    align-items: center;
    gap: calc(8px * var(--ui-scale, 1));
    transition: background 0.08s ease;
}

.menu-dropdown-item:hover {
    background: rgba(255, 255, 255, 0.08);
}

.menu-dropdown .menu-separator {
    height: 1px;
    background: #444444;
    margin: calc(4px * var(--ui-scale, 1)) 0;
}

/* ═══════════════════════════════════════════════════════════════
   任务栏
   ═══════════════════════════════════════════════════════════════ */
#taskbar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: calc(48px * var(--ui-scale, 1));
    background: var(--win-taskbar);
    display: flex;
    align-items: center;
    padding: 0 calc(4px * var(--ui-scale, 1));
    z-index: 1000;
    gap: calc(2px * var(--ui-scale, 1));
    box-shadow: 0 calc(-1px * var(--ui-scale, 1)) calc(4px * var(--ui-scale, 1)) rgba(0, 0, 0, 0.3);
}

/* 任务栏槽位按钮 - 固定框子，从左到右排列 */
.taskbar-slot {
    height: calc(40px * var(--ui-scale, 1));
    min-width: calc(40px * var(--ui-scale, 1));
    max-width: calc(200px * var(--ui-scale, 1));
    padding: 0 calc(10px * var(--ui-scale, 1));
    border: none;
    background: transparent;
    color: #ffffff;
    font-size: calc(12px * var(--ui-scale, 1));
    cursor: pointer;
    border-radius: var(--win-radius-sm);
    display: none;
    align-items: center;
    gap: calc(6px * var(--ui-scale, 1));
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background 0.1s ease;
    font-family: var(--font-ui);
    flex-shrink: 0;
    flex-grow: 0;
}

.taskbar-slot:hover {
    background: var(--win-taskbar-hover);
}

.taskbar-slot.active {
    background: var(--win-taskbar-active);
    border-bottom: calc(2px * var(--ui-scale, 1)) solid var(--win-accent);
}

.taskbar-slot .tb-icon {
    font-size: calc(16px * var(--ui-scale, 1));
    flex-shrink: 0;
}

/* 开始按钮 */
#start-btn {
    height: calc(40px * var(--ui-scale, 1));
    min-width: calc(50px * var(--ui-scale, 1));
    padding: 0 calc(10px * var(--ui-scale, 1));
    border: none;
    background: transparent;
    color: #ffffff;
    font-size: calc(13px * var(--ui-scale, 1));
    cursor: pointer;
    border-radius: var(--win-radius-sm);
    display: flex;
    align-items: center;
    gap: calc(6px * var(--ui-scale, 1));
    font-family: var(--font-ui);
    font-weight: 600;
    margin-right: calc(4px * var(--ui-scale, 1));
    flex-shrink: 0;
}

#start-btn:hover {
    background: var(--win-taskbar-hover);
}

/* 时钟 */
#clock {
    margin-left: auto;
    color: #ffffff;
    font-size: calc(12px * var(--ui-scale, 1));
    padding: 0 calc(12px * var(--ui-scale, 1));
    text-align: right;
    line-height: 1.3;
    flex-shrink: 0;
    cursor: default;
}

/* ═══════════════════════════════════════════════════════════════
   开始菜单
   ═══════════════════════════════════════════════════════════════ */
#start-menu {
    position: absolute;
    bottom: calc(48px * var(--ui-scale, 1));
    left: 0;
    width: calc(320px * var(--ui-scale, 1));
    background: #1f1f1f;
    border: 1px solid #333333;
    border-radius: var(--win-radius) var(--win-radius) 0 0;
    box-shadow: 0 calc(-4px * var(--ui-scale, 1)) calc(20px * var(--ui-scale, 1)) rgba(0, 0, 0, 0.5);
    display: none;
    z-index: 999;
    padding: calc(8px * var(--ui-scale, 1)) 0;
    color: #ffffff;
    font-size: calc(13px * var(--ui-scale, 1));
}

#start-menu.open {
    display: block;
}

.start-menu-item {
    display: flex;
    align-items: center;
    gap: calc(12px * var(--ui-scale, 1));
    padding: calc(10px * var(--ui-scale, 1)) calc(16px * var(--ui-scale, 1));
    cursor: pointer;
    transition: background 0.1s ease;
}

.start-menu-item:hover {
    background: rgba(255, 255, 255, 0.08);
}

.start-menu-item .sm-icon {
    font-size: calc(20px * var(--ui-scale, 1));
    width: calc(24px * var(--ui-scale, 1));
    text-align: center;
    flex-shrink: 0;
}

/* ═══════════════════════════════════════════════════════════════
   代码编辑器区域
   ═══════════════════════════════════════════════════════════════ */
.editor-area {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.editor-area textarea {
    width: 100%;
    height: 100%;
    background: #1e1e1e;
    color: #d4d4d4;
    border: none;
    resize: none;
    font-family: var(--font-mono);
    font-size: calc(14px * var(--ui-scale, 1));
    line-height: 1.6;
    padding: calc(16px * var(--ui-scale, 1));
    tab-size: 4;
    -moz-tab-size: 4;
    outline: none;
    flex: 1;
    white-space: pre-wrap;
    word-wrap: break-word;
}

/* 编辑器工具栏 */
.editor-toolbar {
    display: flex;
    align-items: center;
    gap: calc(8px * var(--ui-scale, 1));
    padding: calc(6px * var(--ui-scale, 1)) calc(12px * var(--ui-scale, 1));
    background: #2d2d2d;
    border-bottom: 1px solid #3d3d3d;
    flex-shrink: 0;
}

.editor-toolbar button {
    background: #3d3d3d;
    color: #cccccc;
    border: none;
    padding: calc(4px * var(--ui-scale, 1)) calc(12px * var(--ui-scale, 1));
    font-size: calc(12px * var(--ui-scale, 1));
    border-radius: var(--win-radius-sm);
    cursor: pointer;
    font-family: var(--font-ui);
    transition: background 0.1s ease;
}

.editor-toolbar button:hover {
    background: #4d4d4d;
}

.editor-toolbar button.run-btn {
    background: #107C10;
    color: #ffffff;
}

.editor-toolbar button.run-btn:hover {
    background: #0e6a0e;
}

.editor-toolbar span {
    color: #888888;
    font-size: calc(12px * var(--ui-scale, 1));
}

/* 编辑器状态栏 */
.editor-statusbar {
    display: flex;
    align-items: center;
    padding: calc(2px * var(--ui-scale, 1)) calc(12px * var(--ui-scale, 1));
    background: #007acc;
    color: #ffffff;
    font-size: calc(11px * var(--ui-scale, 1));
    flex-shrink: 0;
    gap: calc(16px * var(--ui-scale, 1));
    height: calc(22px * var(--ui-scale, 1));
}

.editor-statusbar span {
    white-space: nowrap;
}

/* ═══════════════════════════════════════════════════════════════
   Python Shell 界面
   ═══════════════════════════════════════════════════════════════ */
.shell-container {
    display: flex;
    flex-direction: column;
    height: 100%;
}

.shell-output {
    flex: 1;
    background: #0c0c0c;
    color: #cccccc;
    font-family: var(--font-mono);
    font-size: calc(13px * var(--ui-scale, 1));
    padding: calc(12px * var(--ui-scale, 1));
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
}

.shell-input-line {
    display: flex;
    align-items: center;
    background: #141414;
    padding: calc(4px * var(--ui-scale, 1)) calc(12px * var(--ui-scale, 1));
    border-top: 1px solid #333333;
    flex-shrink: 0;
}

.shell-input-line .prompt {
    color: #4EC9B0;
    font-family: var(--font-mono);
    font-size: calc(13px * var(--ui-scale, 1));
    margin-right: calc(8px * var(--ui-scale, 1));
    white-space: nowrap;
}

.shell-input-line input {
    flex: 1;
    background: transparent;
    border: none;
    color: #ffffff;
    font-family: var(--font-mono);
    font-size: calc(13px * var(--ui-scale, 1));
    outline: none;
    caret-color: #ffffff;
}

/* Shell 输出颜色 */
.shell-error {
    color: #f44747;
}

.shell-info {
    color: #6A9955;
}

.shell-result {
    color: #CE9178;
}

/* ═══════════════════════════════════════════════════════════════
   文件管理器
   ═══════════════════════════════════════════════════════════════ */
.file-list {
    width: 100%;
    height: 100%;
    background: #1e1e1e;
    color: #cccccc;
    overflow-y: auto;
    font-size: calc(13px * var(--ui-scale, 1));
}

.file-item {
    display: flex;
    align-items: center;
    gap: calc(10px * var(--ui-scale, 1));
    padding: calc(8px * var(--ui-scale, 1)) calc(16px * var(--ui-scale, 1));
    cursor: pointer;
    transition: background 0.08s ease;
}

.file-item:hover {
    background: rgba(255, 255, 255, 0.06);
}

.file-item .fi-icon {
    font-size: calc(18px * var(--ui-scale, 1));
    flex-shrink: 0;
}

/* 文件管理器工具栏 */
.file-manager-toolbar {
    display: flex;
    align-items: center;
    gap: calc(6px * var(--ui-scale, 1));
    padding: calc(6px * var(--ui-scale, 1)) calc(12px * var(--ui-scale, 1));
    background: #2d2d2d;
    border-bottom: 1px solid #3d3d3d;
    flex-shrink: 0;
}

.file-manager-toolbar button {
    background: #3d3d3d;
    color: #cccccc;
    border: none;
    padding: calc(4px * var(--ui-scale, 1)) calc(10px * var(--ui-scale, 1));
    font-size: calc(12px * var(--ui-scale, 1));
    border-radius: var(--win-radius-sm);
    cursor: pointer;
    font-family: var(--font-ui);
    transition: background 0.1s ease;
}

.file-manager-toolbar button:hover {
    background: #4d4d4d;
}

/* ═══════════════════════════════════════════════════════════════
   Python 环境安装弹窗（全屏覆盖层，保留但默认不使用）
   ═══════════════════════════════════════════════════════════════ */
.install-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    z-index: 10000;
    display: flex;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
}

.install-dialog {
    background: #1f1f1f;
    border: 1px solid #444444;
    border-radius: var(--win-radius);
    padding: calc(30px * var(--ui-scale, 1));
    width: calc(420px * var(--ui-scale, 1));
    color: #ffffff;
    text-align: center;
    box-shadow: 0 calc(8px * var(--ui-scale, 1)) calc(40px * var(--ui-scale, 1)) rgba(0, 0, 0, 0.6);
}

.install-dialog h3 {
    color: var(--win-accent);
    margin-bottom: calc(8px * var(--ui-scale, 1));
    font-size: calc(18px * var(--ui-scale, 1));

}

<!-- ═══════════════════════════════════════════════════════════════
     主程序 JavaScript（完全展开版，无精简）
     ═══════════════════════════════════════════════════════════════ -->
<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║              tkemu v1.5.2 - 完整主程序                      ║
// ║  所有功能全部展开，不精简，不压缩                            ║
// ║  新增: System Control - .sys 系统级脚本支持                 ║
// ╚══════════════════════════════════════════════════════════════╝

// ─────────────────────────────────────────────────────────────
//  版本信息
// ─────────────────────────────────────────────────────────────
var APP_VERSION = '1.5.2';
var APP_NAME = 'tkemu';
var APP_FULL_NAME = 'tkemu - Windows 桌面模拟器';
var APP_COPYRIGHT = '闪讯工作社 Snxth.';
var APP_YEAR = '2026';
var PYODIDE_VERSION = '0.27.0';

// ─────────────────────────────────────────────────────────────
//  分辨率自适应系统（基准：1920×1080）
// ─────────────────────────────────────────────────────────────
var SCALE_FACTOR = 1;
(function initScaleFactor() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    var baseW = 1920, baseH = 1080;
    var scaleByWidth = w / baseW;
    var scaleByHeight = h / baseH;
    SCALE_FACTOR = Math.min(scaleByWidth, scaleByHeight);
    if (SCALE_FACTOR < 0.5) SCALE_FACTOR = 0.5;
    if (SCALE_FACTOR > 2.0) SCALE_FACTOR = 2.0;
    document.documentElement.style.setProperty('--ui-scale', SCALE_FACTOR);
    document.body.style.fontSize = (13 * SCALE_FACTOR) + 'px';
})();

// ─────────────────────────────────────────────────────────────
//  全局状态变量
// ─────────────────────────────────────────────────────────────
var windowZIndex = 10;
var openWindows = {};
var activeWindowId = null;
var startMenuOpen = false;
var pyodide = null;
var pyodideReady = false;
var _tkMsgResolve = null;
var _tkEntryValues = {};
var _tkListboxSel = {};
var _tkPanelTabs = [];
var _tkPanelActiveTab = 0;
var shellHistory = [];
var shellHistoryIdx = -1;
var trashItems = [];
var hiddenFiles = [];
var installedKDApps = [];
var _titlebarContextTarget = null;
var _nextWindowX = Math.round(80 * SCALE_FACTOR);
var _nextWindowY = Math.round(60 * SCALE_FACTOR);
var _installProgressCallback = null;

// ─────────────────────────────────────────────────────────────
//  任务栏槽位系统（10个固定框子，从左到右排列）
// ─────────────────────────────────────────────────────────────
var TASKBAR_SLOTS = 10;
var taskbarSlots = new Array(TASKBAR_SLOTS).fill(null);

/**
 * 初始化任务栏槽位
 */
function initTaskbarSlots() {
    var container = document.getElementById('taskbar-slots');
    container.innerHTML = '';
    for (var i = 0; i < TASKBAR_SLOTS; i++) {
        var btn = document.createElement('button');
        btn.className = 'taskbar-slot';
        btn.id = 'taskbar-slot-' + i;
        btn.style.display = 'none';
        btn.onclick = (function(idx) {
            return function() {
                var windowId = taskbarSlots[idx];
                if (windowId && openWindows[windowId]) {
                    if (windowId === activeWindowId && !openWindows[windowId].minimized) {
                        minimizeWindow(windowId);
                    } else {
                        restoreWindow(windowId);
                        focusWindow(windowId);
                    }
                }
            };
        })(i);
        container.appendChild(btn);
    }
}

/**
 * 为新窗口分配任务栏槽位
 * @param {string} windowId - 窗口ID
 * @param {string} title - 窗口标题
 * @param {string} icon - 窗口图标
 * @returns {number} 分配的槽位索引，-1表示失败
 */
function assignTaskbarSlot(windowId, title, icon) {
    for (var i = 0; i < TASKBAR_SLOTS; i++) {
        if (taskbarSlots[i] === null) {
            taskbarSlots[i] = windowId;
            var btn = document.getElementById('taskbar-slot-' + i);
            if (btn) {
                btn.innerHTML = '<span class="tb-icon">' + icon + '</span>' + title;
                btn.title = title;
                btn.style.display = 'flex';
                if (windowId === activeWindowId) btn.classList.add('active');
            }
            return i;
        }
    }
    return -1;
}

/**
 * 释放窗口占用的任务栏槽位
 * @param {string} windowId - 窗口ID
 */
function releaseTaskbarSlot(windowId) {
    for (var i = 0; i < TASKBAR_SLOTS; i++) {
        if (taskbarSlots[i] === windowId) {
            taskbarSlots[i] = null;
            var btn = document.getElementById('taskbar-slot-' + i);
            if (btn) {
                btn.innerHTML = '';
                btn.style.display = 'none';
                btn.classList.remove('active');
            }
            return;
        }
    }
}

/**
 * 更新所有任务栏槽位的激活状态
 */
function updateTaskbarActive() {
    for (var i = 0; i < TASKBAR_SLOTS; i++) {
        var btn = document.getElementById('taskbar-slot-' + i);
        if (btn) {
            var isActive = taskbarSlots[i] === activeWindowId;
            btn.classList.toggle('active', isActive);
        }
    }
}

/**
 * 更新任务栏槽位的标题和图标
 * @param {string} windowId - 窗口ID
 * @param {string} title - 新标题
 * @param {string} icon - 新图标
 */
function updateTaskbarSlotTitle(windowId, title, icon) {
    for (var i = 0; i < TASKBAR_SLOTS; i++) {
        if (taskbarSlots[i] === windowId) {
            var btn = document.getElementById('taskbar-slot-' + i);
            if (btn) {
                btn.innerHTML = '<span class="tb-icon">' + icon + '</span>' + title;
                btn.title = title;
            }
            return;
        }
    }
}

// ─────────────────────────────────────────────────────────────
//  虚拟文件系统（数据存储在 localStorage）
// ─────────────────────────────────────────────────────────────
var VirtualFS = {
    _key: 'tkemu_fs_v6',
    _hiddenKey: 'tkemu_hidden_files_v2',
    _kdKey: 'tkemu_kd_apps',

    /**
     * 初始化文件系统
     */
    init: function() {
        if (!localStorage.getItem(this._key)) {
            var defaultFiles = {
                'main.py': '# 欢迎使用 tkemu\nprint("Hello, tkemu!")\n',
                'README.txt': 'tkemu v' + APP_VERSION + '\n',
                'hello.rf': '// rf 脚本示例\nwindow "Hello RF" 400 300\nlabel "欢迎使用 rf 脚本系统!" center\nbutton "点击我" run\n  print "按钮被点击了!"\nend\nbutton "关闭" close\n',
                'welcome.kd': '<h1>欢迎使用KD!</h1><p>这是一个KD示例应用。</p><button onclick="parent.shellPrint(\'Hello from KD!\', \'info\')">打印到Shell</button>',
                'paint.rf': 'window "简易画板" 500 400\nmenu "文件"\nmenuitem "清空画布" run\n  draw\n    var c = document.getElementById("rf-canvas");\n    var ctx = c.getContext("2d");\n    ctx.clearRect(0, 0, c.width, c.height);\n  end\nmenuitem "关闭" close\ncanvas 480 300\nlabel "在下方画布上拖动鼠标绘画" center\ndraw\n  var c = document.getElementById("rf-canvas");\n  var ctx = c.getContext("2d");\n  ctx.fillStyle = "white";\n  ctx.fillRect(0, 0, c.width, c.height);\n  ctx.strokeStyle = "black";\n  ctx.lineWidth = 2;\n  var painting = false;\n  c.onpointerdown = function(e) { painting = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); };\n  c.onpointerup = function() { painting = false; };\n  c.onpointermove = function(e) {\n    if (!painting) return;\n    ctx.lineTo(e.offsetX, e.offsetY);\n    ctx.stroke();\n  };\nend',
                'clock.rf': 'window "动态时钟" 300 250\ncanvas 200 200\ndraw\n  var c = document.getElementById("rf-canvas");\n  var ctx = c.getContext("2d");\n  function drawClock() {\n    ctx.clearRect(0, 0, c.width, c.height);\n    var now = new Date();\n    var h = now.getHours() % 12;\n    var m = now.getMinutes();\n    var s = now.getSeconds();\n    ctx.fillStyle = "white"; ctx.fillRect(0,0,c.width,c.height);\n    ctx.beginPath(); ctx.arc(100, 100, 90, 0, 2*Math.PI);\n    ctx.strokeStyle = "black"; ctx.lineWidth = 4; ctx.stroke();\n    ctx.beginPath(); ctx.moveTo(100,100);\n    ctx.lineTo(100+50*Math.cos((h+m/60)*Math.PI/6 - Math.PI/2), 100+50*Math.sin((h+m/60)*Math.PI/6 - Math.PI/2));\n    ctx.stroke();\n    ctx.beginPath(); ctx.moveTo(100,100);\n    ctx.lineTo(100+70*Math.cos(m*Math.PI/30 - Math.PI/2), 100+70*Math.sin(m*Math.PI/30 - Math.PI/2));\n    ctx.stroke();\n    ctx.beginPath(); ctx.moveTo(100,100);\n    ctx.lineTo(100+80*Math.cos(s*Math.PI/30 - Math.PI/2), 100+80*Math.sin(s*Math.PI/30 - Math.PI/2));\n    ctx.strokeStyle = "red"; ctx.lineWidth = 2; ctx.stroke();\n  }\n  setInterval(drawClock, 1000);\n  drawClock();\nend\nlabel "当前时间" center\nbutton "关闭" close\n'
            };
            localStorage.setItem(this._key, JSON.stringify(defaultFiles));
        }
        try {
            var savedTrash = localStorage.getItem('tkemu_trash');
            if (savedTrash) trashItems = JSON.parse(savedTrash);
        } catch (e) {
            trashItems = [];
        }
        try {
            var savedHidden = localStorage.getItem(this._hiddenKey);
            if (savedHidden) hiddenFiles = JSON.parse(savedHidden);
        } catch (e) {
            hiddenFiles = [];
        }
        try {
            var savedKD = localStorage.getItem(this._kdKey);
            if (savedKD) installedKDApps = JSON.parse(savedKD);
        } catch (e) {
            installedKDApps = [];
        }
    },

    /**
     * 获取所有可见文件列表（排除隐藏文件）
     * @returns {object} 文件名到内容的映射
     */
    listFiles: function() {
        var allFiles = {};
        try {
            allFiles = JSON.parse(localStorage.getItem(this._key) || '{}');
        } catch (e) {
            allFiles = {};
        }
        var visibleFiles = {};
        Object.keys(allFiles).forEach(function(key) {
            if (hiddenFiles.indexOf(key) === -1) {
                visibleFiles[key] = allFiles[key];
            }
        });
        return visibleFiles;
    },

    /**
     * 读取文件内容（包括隐藏文件）
     * @param {string} path - 文件路径
     * @returns {string|null} 文件内容或null
     */
    readFile: function(path) {
        var allFiles = {};
        try {
            allFiles = JSON.parse(localStorage.getItem(this._key) || '{}');
        } catch (e) {
            allFiles = {};
        }
        return allFiles[path] || null;
    },

    /**
     * 写入文件（自动取消隐藏）
     * @param {string} path - 文件路径
     * @param {string} content - 文件内容
     */
    writeFile: function(path, content) {
        var allFiles = {};
        try {
            allFiles = JSON.parse(localStorage.getItem(this._key) || '{}');
        } catch (e) {
            allFiles = {};
        }
        allFiles[path] = content;
        localStorage.setItem(this._key, JSON.stringify(allFiles));
        var hiddenIndex = hiddenFiles.indexOf(path);
        if (hiddenIndex > -1) {
            hiddenFiles.splice(hiddenIndex, 1);
            localStorage.setItem(this._hiddenKey, JSON.stringify(hiddenFiles));
        }
    },

    /**
     * 永久删除文件
     * @param {string} path - 文件路径
     */
    deleteFile: function(path) {
        var allFiles = {};
        try {
            allFiles = JSON.parse(localStorage.getItem(this._key) || '{}');
        } catch (e) {
            allFiles = {};
        }
        delete allFiles[path];
        localStorage.setItem(this._key, JSON.stringify(allFiles));
        var hiddenIndex = hiddenFiles.indexOf(path);
        if (hiddenIndex > -1) {
            hiddenFiles.splice(hiddenIndex, 1);
            localStorage.setItem(this._hiddenKey, JSON.stringify(hiddenFiles));
        }
    },

    /**
     * 隐藏文件（不删除数据，只是不再显示）
     * @param {string} path - 文件路径
     */
    hideFile: function(path) {
        if (hiddenFiles.indexOf(path) === -1) {
            hiddenFiles.push(path);
            localStorage.setItem(this._hiddenKey, JSON.stringify(hiddenFiles));
        }
    },

    /**
     * 安装KD应用
     * @param {string} name - 应用名称
     * @param {string} content - 应用HTML内容
     */
    installKDApp: function(name, content) {
        var exists = installedKDApps.findIndex(function(app) {
            return app.name === name;
        });
        if (exists > -1) {
            installedKDApps[exists].content = content;
        } else {
            installedKDApps.push({
                name: name,
                content: content,
                time: new Date().toISOString()
            });
        }
        localStorage.setItem(this._kdKey, JSON.stringify(installedKDApps));
        this.refreshStartMenuKD();
    },

    /**
     * 卸载KD应用
     * @param {string} name - 应用名称
     */
    uninstallKDApp: function(name) {
        installedKDApps = installedKDApps.filter(function(app) {
            return app.name !== name;
        });
        localStorage.setItem(this._kdKey, JSON.stringify(installedKDApps));
        this.refreshStartMenuKD();
    },

    /**
     * 获取所有已安装的KD应用
     * @returns {Array} 已安装应用列表
     */
    getInstalledKDApps: function() {
        return installedKDApps;
    },

    /**
     * 刷新开始菜单中的KD应用列表
     */
    refreshStartMenuKD: function() {
        var section = document.getElementById('installed-apps-section');
        if (!section) return;
        section.innerHTML = '';
        if (installedKDApps.length > 0) {
            section.style.display = 'block';
            section.innerHTML = '<div style="border-top: 1px solid #333333; margin: 4px 0;"></div><div style="padding: 8px 16px; color: #888; font-size: 11px;">已安装应用</div>';
            installedKDApps.forEach(function(app) {
                var item = document.createElement('div');
                item.className = 'start-menu-item';
                item.innerHTML = '<span class="sm-icon">⚡</span> ' + app.name;
                item.onclick = function() {
                    openKDApp(app.content);
                    toggleStartMenu();
                };
                section.appendChild(item);
            });
        } else {
            section.style.display = 'none';
        }
    }
};

// ─────────────────────────────────────────────────────────────
//  回收站功能
// ─────────────────────────────────────────────────────────────

/**
 * 将文件移入回收站
 * @param {string} path - 文件路径
 */
function trashAdd(path) {
    var content = VirtualFS.readFile(path);
    if (content !== null) {
        trashItems.push({
            path: path,
            content: content,
            time: new Date().toISOString()
        });
        VirtualFS.hideFile(path);
        updateTrashIcon();
        localStorage.setItem('tkemu_trash', JSON.stringify(trashItems));
    }
}

/**
 * 从回收站还原文件
 * @param {number} index - 回收站项目索引
 * @returns {boolean} 是否成功
 */
function trashRestore(index) {
    if (index >= 0 && index < trashItems.length) {
        var item = trashItems[index];
        VirtualFS.writeFile(item.path, item.content);
        trashItems.splice(index, 1);
        updateTrashIcon();
        localStorage.setItem('tkemu_trash', JSON.stringify(trashItems));
        return true;
    }
    return false;
}

/**
 * 清空回收站
 */
function trashEmpty() {
    trashItems = [];
    updateTrashIcon();
    localStorage.setItem('tkemu_trash', JSON.stringify(trashItems));
}

/**
 * 还原回收站中的所有文件
 */
function trashRestoreAll() {
    while (trashItems.length > 0) {
        trashRestore(0);
    }
    showToast('📥 已全部还原');
}

/**
 * 更新回收站图标的角标数字
 */
function updateTrashIcon() {
    var badge = document.getElementById('trash-count');
    if (badge) {
        badge.textContent = trashItems.length;
        badge.style.display = trashItems.length > 0 ? 'block' : 'none';
    }
}

/**
 * 打开回收站窗口
 */
function openTrash() {
    var html = '';
    html += '<div class="file-manager-toolbar">';
    html += '  <button onclick="trashRestoreAll(); closeWindow(\'trash\'); openTrash();">📥 全部还原</button>';
    html += '  <button onclick="if(confirm(\'确定要清空回收站吗？\\n此操作不可恢复。\')){ trashEmpty(); closeWindow(\'trash\'); openTrash(); }">🗑 清空回收站</button>';
    html += '</div>';
    html += '<div class="file-list">';
    if (trashItems.length === 0) {
        html += '<div style="padding:20px;color:#888;text-align:center;">🗑️ 回收站为空</div>';
    } else {
        for (var i = 0; i < trashItems.length; i++) {
            var item = trashItems[i];
            var fileName = item.path.split('/').pop();
            html += '<div class="file-item">';
            html += '  <span class="fi-icon">📄</span>';
            html += '  <span style="flex:1">' + escapeHTML(fileName) + '</span>';
            html += '  <span style="color:#888;font-size:11px;">' + new Date(item.time).toLocaleString() + '</span>';
            html += '  <button onclick="event.stopPropagation(); trashRestore(' + i + '); closeWindow(\'trash\'); openTrash();" style="background:none;border:none;cursor:pointer;margin-left:8px;" title="还原">📥</button>';
            html += '</div>';
        }
    }
    html += '</div>';
    createWindow('trash', '回收站', '🗑️', 500, 400, 130, 160, html);
}

// ═══════════════════════════════════
//  第一段结束，后续请在第二段继续

// ─────────────────────────────────────────────────────────────
//  窗口管理器
// ─────────────────────────────────────────────────────────────

/**
 * 创建新窗口
 * @param {string} id - 窗口ID
 * @param {string} title - 窗口标题
 * @param {string} icon - 窗口图标
 * @param {number} width - 宽度
 * @param {number} height - 高度
 * @param {number} top - 顶部位置
 * @param {number} left - 左侧位置
 * @param {string} bodyHTML - 窗口主体HTML
 * @returns {HTMLElement} 窗口DOM元素
 */
function createWindow(id, title, icon, width, height, top, left, bodyHTML) {
    // 自动缩放宽高
    width = Math.round(width * SCALE_FACTOR);
    height = Math.round(height * SCALE_FACTOR);
    if (top !== undefined) top = Math.round(top * SCALE_FACTOR);
    if (left !== undefined) left = Math.round(left * SCALE_FACTOR);

    if (openWindows[id]) {
        focusWindow(id);
        return openWindows[id].el;
    }
    var finalTop = top || _nextWindowY;
    var finalLeft = left || _nextWindowX;
    _nextWindowX += Math.round(30 * SCALE_FACTOR);
    _nextWindowY += Math.round(25 * SCALE_FACTOR);
    if (_nextWindowX > Math.round(200 * SCALE_FACTOR)) _nextWindowX = Math.round(80 * SCALE_FACTOR);
    if (_nextWindowY > Math.round(200 * SCALE_FACTOR)) _nextWindowY = Math.round(60 * SCALE_FACTOR);
    var win = document.createElement('div');
    win.className = 'window focused';
    win.id = 'win-' + id;
    win.style.width = width + 'px';
    win.style.height = height + 'px';
    win.style.top = finalTop + 'px';
    win.style.left = finalLeft + 'px';
    win.style.zIndex = ++windowZIndex;
    win.innerHTML = '<div class="window-titlebar" onpointerdown="startDrag(event,\'' + id + '\')" ondblclick="toggleMaximize(\'' + id + '\')" oncontextmenu="titlebarContextMenu(event,\'' + id + '\')"><span class="title-icon">' + icon + '</span><span class="title-text">' + escapeHTML(title) + '</span><div class="title-buttons"><button class="title-btn" onclick="minimizeWindow(\'' + id + '\')" title="最小化">─</button><button class="title-btn" onclick="toggleMaximize(\'' + id + '\')" title="最大化">□</button><button class="title-btn btn-close" onclick="closeWindow(\'' + id + '\')" title="关闭">✕</button></div></div><div class="window-body">' + bodyHTML + '</div>';
    document.getElementById('desktop').appendChild(win);
    openWindows[id] = {
        el: win,
        title: title,
        icon: icon,
        minimized: false,
        maximized: false,
        slotIndex: -1
    };
    var slotIdx = assignTaskbarSlot(id, title, icon);
    if (slotIdx >= 0) openWindows[id].slotIndex = slotIdx;
    focusWindow(id);
    return win;
}

/**
 * 聚焦窗口
 * @param {string} id - 窗口ID
 */
function focusWindow(id) {
    if (!openWindows[id] || activeWindowId === id) return;
    activeWindowId = id;
    openWindows[id].el.style.zIndex = ++windowZIndex;
    Object.values(openWindows).forEach(function(w) {
        w.el.classList.remove('focused');
    });
    openWindows[id].el.classList.add('focused');
    if (openWindows[id].minimized) restoreWindow(id);
    updateTaskbarActive();
}

/**
 * 最小化窗口
 * @param {string} id - 窗口ID
 */
function minimizeWindow(id) {
    if (!openWindows[id]) return;
    openWindows[id].el.style.display = 'none';
    openWindows[id].minimized = true;
    if (activeWindowId === id) activeWindowId = null;
    updateTaskbarActive();
}

/**
 * 还原窗口
 * @param {string} id - 窗口ID
 */
function restoreWindow(id) {
    if (!openWindows[id]) return;
    openWindows[id].el.style.display = 'flex';
    openWindows[id].minimized = false;
    focusWindow(id);
}

/**
 * 最大化/还原窗口
 * @param {string} id - 窗口ID
 */
function toggleMaximize(id) {
    if (!openWindows[id]) return;
    var w = openWindows[id];
    if (w.maximized) {
        w.el.classList.remove('maximized');
        w.maximized = false;
    } else {
        w.el.classList.add('maximized');
        w.maximized = true;
    }
}

/**
 * 关闭窗口
 * @param {string} id - 窗口ID
 */
function closeWindow(id) {
    if (!openWindows[id]) return;
    releaseTaskbarSlot(id);
    openWindows[id].el.remove();
    delete openWindows[id];
    if (activeWindowId === id) {
        activeWindowId = null;
        var keys = Object.keys(openWindows);
        if (keys.length > 0) focusWindow(keys[keys.length - 1]);
    }
}

/**

    var menu = document.getElementById('titlebar-context-menu');

}

/**
 * 处理标题栏右键菜单动作
 * @param {string} action - 动作类型
 */
function titlebarContextAction(action) {
    var id = _titlebarContextTarget;
    if (!id || !openWindows[id]) {
        hideAllContextMenus();
        return;
    }
    switch (action) {
        case 'minimize':
            minimizeWindow(id);
            break;
        case 'maximize':
            toggleMaximize(id);
            break;
        case 'close':
            closeWindow(id);
            break;
        case 'restore':
            if (openWindows[id].maximized) toggleMaximize(id);
            break;
        case 'move':
        case 'size':
            break;
    }
    hideAllContextMenus();
}

/**
 * 隐藏所有右键菜单

    document.querySelectorAll('.context-menu.open').forEach(function(menu) {
        menu.classList.remove('open');

}

/**

function startDrag(e, id) {
    if (!openWindows[id] || openWindows[id].maximized) return;
    var win = openWindows[id].el;
    dragInfo = {
        id: id,
        startX: e.clientX,
        startY: e.clientY,
        origLeft: win.offsetLeft,
        origTop: win.offsetTop
    };
    e.preventDefault();
}

    if (!dragInfo) return;
    var w = openWindows[dragInfo.id];
    if (!w) {
        dragInfo = null;
        return;
    }
    w.el.style.left = Math.max(-100, dragInfo.origLeft + e.clientX - dragInfo.startX) + 'px';
    w.el.style.top = Math.max(0, dragInfo.origTop + e.clientY - dragInfo.startY) + 'px';
});

document.addEventListener('pointerup', function() {
    dragInfo = null;
});

/**
 * 处理Shell输入框的键盘事件
 * @param {Event} e - 键盘事件
 */
function handleShellKey(e) {
    if (e.key === 'Enter') {
        var c = e.target.value.trim();
        if (!c) return;
        shellHistory.push(c);
        shellHistoryIdx = shellHistory.length;
        e.target.value = '';
        shellPrint('>>> ' + c, '');
        executeShellCode(c);
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (shellHistoryIdx > 0) {
            shellHistoryIdx--;
            e.target.value = shellHistory[shellHistoryIdx];
        }
    } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (shellHistoryIdx < shellHistory.length - 1) {
            shellHistoryIdx++;
            e.target.value = shellHistory[shellHistoryIdx];
        } else {
            shellHistoryIdx = shellHistory.length;
            e.target.value = '';
        }
    }
}

/**
 * 向Shell输出区打印文字
 * @param {string} text - 文字内容
 * @param {string} className - CSS类名
 */
function shellPrint(text, className) {
    var o = document.getElementById('shell-output');
    if (!o) return;
    o.innerHTML += '<div class="shell-' + (className || '') + '">' + escapeHTML(text) + '</div>';
    o.scrollTop = o.scrollHeight;
}

/**
 * 确保Python环境已就绪
 */
async function ensurePythonReady() {
    if (!pyodideReady) {
        var ok = await checkPythonEnv();
        if (!ok) throw new Error('Python 环境未就绪，请先在控制面板中安装');
    }
    injectTkinterEmulator();
}

/**
 * 运行编辑器中的代码
 */
async function runEditorCode() {
    var ta = document.getElementById('editor-input');
    if (!ta || !ta.value.trim()) return;
    var filePath = ta.dataset.filepath || '';
    if (filePath.endsWith('.rf')) {
        executeRFScript(ta.value);
        return;
    }
    if (filePath.endsWith('.kd')) {
        openKDApp(ta.value, filePath.replace('.kd', ''));
        return;
    }
    try {
        await ensurePythonReady();
    } catch (e) {
        showToast(e.message);
        return;
    }
    if (!openWindows['shell']) openShell();
    focusWindow('shell');
    shellPrint('▶ 执行...', 'info');
    pyodide.runPython("import sys\nfrom js import shellPrint as _sp\nclass _SW:\n def write(self,s):\n  if s.strip():_sp(s.rstrip(),'')\n def flush(self):pass\nsys.stdout=_SW();sys.stderr=_SW()");
    try {
        await pyodide.runPythonAsync(ta.value);
        shellPrint('▶ 完毕', 'info');
    } catch (e) {
        shellPrint('❌ ' + e.message, 'error');
    }
}

/**
 * 在Shell中执行单行代码
 * @param {string} code - Python代码
 */
async function executeShellCode(code) {
    if (code === 'clear') {
        var o = document.getElementById('shell-output');
        if (o) o.innerHTML = '';
        return;
    }
    try {
        await ensurePythonReady();
    } catch (e) {
        shellPrint('❌ ' + e.message, 'error');
        return;
    }
    pyodide.runPython("import sys\nfrom js import shellPrint as _sp\nclass _SW:\n def write(self,s):\n  if s.strip():_sp(s.rstrip(),'')\n def flush(self):pass\nsys.stdout=_SW();sys.stderr=_SW()");
    try {
        var r = pyodide.runPython(code);
        if (r !== undefined && r !== null) shellPrint(repr(r), 'result');
    } catch (e) {
        shellPrint('❌ ' + e.message, 'error');
    }
}

// ─────────────────────────────────────────────────────────────
//  rf 脚本解释器（Run File） - 增强版，支持Canvas和Draw
// ─────────────────────────────────────────────────────────────

var _rfWindowIdCounter = 0;

/**
 * 执行rf脚本
 * @param {string} code - rf脚本代码
 */
function executeRFScript(code) {
    var lines = code.split('\n');
    var variables = {};
    var commands = [];
    var i = 0;
    while (i < lines.length) {
        var line = lines[i].trim();
        if (!line || line.startsWith('//')) {
            i++;
            continue;
        }
        var parts = parseRFLine(line);
        if (!parts) {
            i++;
            continue;
        }
        if (parts.cmd === 'end') {
            i++;
            continue;
        }
        if (parts.cmd === 'button' && parts.args.length >= 2 && parts.args[1] === 'run') {
            var blockLines = [];
            i++;
            while (i < lines.length) {
                var bline = lines[i].trim();
                if (bline === 'end') break;
                blockLines.push(bline);
                i++;
            }
            parts.block = blockLines;
        }
        if (parts.cmd === 'if') {
            var ifBlockLines = [];
            i++;
            var ifDepth = 1;
            while (i < lines.length && ifDepth > 0) {
                var ifLine = lines[i].trim();
                if (ifLine.startsWith('if ')) ifDepth++;
                if (ifLine === 'end') {
                    ifDepth--;
                    if (ifDepth === 0) break;
                }
                ifBlockLines.push(ifLine);
                i++;
            }
            parts.ifBlock = ifBlockLines;
        }
        if (parts.cmd === 'draw') {
            var drawBlockLines = [];
            i++;
            while (i < lines.length) {
                var drawLine = lines[i].trim();
                if (drawLine === 'end') break;
                drawBlockLines.push(drawLine);
                i++;
            }
            parts.block = drawBlockLines;
        }
        commands.push(parts);
        i++;
    }
    executeRFCommands(commands, variables, 0);
}

/**
 * 解析单行rf命令
 * @param {string} line - 单行脚本
 * @returns {object|null} 解析后的命令对象
 */
function parseRFLine(line) {
    var m;
    // window "标题" 宽 高
    m = line.match(/^window\s+"([^"]*)"\s+(\d+)\s+(\d+)/);
    if (m) return { cmd: 'window', args: [m[1], parseInt(m[2]), parseInt(m[3])] };

    // label "文字" [center/left]
    m = line.match(/^label\s+"([^"]*)"\s*(center|left)?/);
    if (m) return { cmd: 'label', args: [m[1], m[2] || 'left'] };

    // button "文字" run / button "文字" close
    m = line.match(/^button\s+"([^"]*)"\s+(run|close)/);
    if (m) return { cmd: 'button', args: [m[1], m[2]] };

    // print "文字"
    m = line.match(/^print\s+"([^"]*)"/);
    if (m) return { cmd: 'print', args: [m[1]] };

    // python "代码"
    m = line.match(/^python\s+"([^"]*)"/);
    if (m) return { cmd: 'python', args: [m[1]] };

    // msg "标题" "内容"
    m = line.match(/^msg\s+"([^"]*)"\s+"([^"]*)"/);
    if (m) return { cmd: 'msg', args: [m[1], m[2]] };

    // ask "标题" "内容" -> 变量
    m = line.match(/^ask\s+"([^"]*)"\s+"([^"]*)"\s*->\s*(\w+)/);
    if (m) return { cmd: 'ask', args: [m[1], m[2], m[3]] };

    // input "提示" -> 变量
    m = line.match(/^input\s+"([^"]*)"\s*->\s*(\w+)/);
    if (m) return { cmd: 'input', args: [m[1], m[2]] };

    // set 变量 = 值
    m = line.match(/^set\s+(\w+)\s*=\s*(.+)/);
    if (m) return { cmd: 'set', args: [m[1], m[2].replace(/"/g, '').trim()] };

    // close
    if (line === 'close') return { cmd: 'close', args: [] };

    // wait 毫秒
    m = line.match(/^wait\s+(\d+)/);
    if (m) return { cmd: 'wait', args: [parseInt(m[1])] };

    // if 变量 == "值" then
    m = line.match(/^if\s+(\w+)\s*==\s*"([^"]*)"\s*then/);
    if (m) return { cmd: 'if', args: [m[1], m[2]] };

    // menu "文字"
    m = line.match(/^menu\s+"([^"]*)"/);
    if (m) return { cmd: 'menu', args: [m[1]] };

    // menuitem "文字" run/close/print/msg [参数]
    m = line.match(/^menuitem\s+"([^"]*)"\s+(run|close|print|msg)\s*(.*)/);
    if (m) return { cmd: 'menuitem', args: [m[1], m[2], m[3] || ''] };

    // menusep
    if (line === 'menusep') return { cmd: 'menusep', args: [] };

    // canvas 宽 高
    m = line.match(/^canvas\s+(\d+)\s+(\d+)/);
    if (m) return { cmd: 'canvas', args: [parseInt(m[1]), parseInt(m[2])] };

    // draw
    if (line.trim() === 'draw') return { cmd: 'draw', args: [] };

    return null;
}

/**
 * 执行rf命令列表
 * @param {Array} commands - 命令列表
 * @param {object} variables - 变量表
 * @param {number} startIdx - 起始索引
 */
function executeRFCommands(commands, variables, startIdx) {
    var i = startIdx;
    var currentWindowId = null;
    var menuItems = [];
    while (i < commands.length) {
        var cmd = commands[i];
        switch (cmd.cmd) {
            case 'window':
                _rfWindowIdCounter++;
                currentWindowId = 'rfwin_' + _rfWindowIdCounter;
                var wTitle = cmd.args[0];
                var wW = cmd.args[1];
                var wH = cmd.args[2];
                var placeholder = '<div class="rf-window-body" id="rf-body-' + currentWindowId + '"></div>';
                createWindow(currentWindowId, wTitle, '📜', wW, wH, 100, 120, placeholder);
                menuItems = [];
                break;
            case 'menu':
                menuItems.push({ type: 'menu', label: cmd.args[0], items: [] });
                break;
            case 'menuitem':
                if (menuItems.length > 0 && menuItems[menuItems.length - 1].type === 'menu') {
                    menuItems[menuItems.length - 1].items.push({
                        label: cmd.args[0],
                        action: cmd.args[1],
                        arg: cmd.args[2]
                    });
                }
                break;
            case 'menusep':
                if (menuItems.length > 0 && menuItems[menuItems.length - 1].type === 'menu') {
                    menuItems[menuItems.length - 1].items.push({ separator: true });
                }
                break;
            case 'label':
                if (currentWindowId) appendRFWidget(currentWindowId, 'label', cmd.args);
                break;
            case 'button':
                if (currentWindowId) appendRFWidget(currentWindowId, 'button', cmd.args, cmd.block, commands, variables);
                break;
            case 'canvas':
                if (currentWindowId) appendRFWidget(currentWindowId, 'canvas', cmd.args);
                break;
            case 'draw':
                if (currentWindowId) appendRFWidget(currentWindowId, 'draw', [], cmd.block);
                break;
            case 'print':
                if (!openWindows['shell']) openShell();
                focusWindow('shell');
                shellPrint(cmd.args[0], '');
                break;
            case 'python':
                if (pyodideReady) {
                    try {
                        pyodide.runPython(cmd.args[0]);
                    } catch (e) {
                        shellPrint('Python错误: ' + e.message, 'error');
                    }
                }
                break;
            case 'msg':
                tkMsgBox('info', cmd.args[0], cmd.args[1]);
                break;
            case 'ask':
                tkMsgBox('yesno', cmd.args[0], cmd.args[1]).then(function(r) {
                    variables[cmd.args[2]] = r ? 'yes' : 'no';
                });
                break;
            case 'input':
                var inpVal = prompt(cmd.args[0], '');
                if (inpVal !== null) variables[cmd.args[1]] = inpVal;
                break;
            case 'set':
                variables[cmd.args[0]] = cmd.args[1];
                break;
            case 'close':
                if (currentWindowId) closeWindow(currentWindowId);
                return;
            case 'wait':
                var start = Date.now();
                while (Date.now() - start < cmd.args[0]) {}
                break;
            case 'if':
                var varVal = variables[cmd.args[0]] || '';
                if (varVal === cmd.args[1] && cmd.ifBlock) {
                    var subCommands = cmd.ifBlock.map(function(l) {
                        return parseRFLine(l);
                    }).filter(Boolean);
                    executeRFCommands(subCommands, variables, 0);
                }
                break;
        }
        i++;
    }
    if (currentWindowId && menuItems.length > 0) {
        renderRFMenu(currentWindowId, menuItems);
    }
}

/**
 * 向rf窗口添加控件
 * @param {string} winId - 窗口ID
 * @param {string} type - 控件类型
 * @param {Array} args - 参数
 * @param {Array} block - 代码块（可选）
 * @param {Array} commands - 命令列表
 * @param {object} variables - 变量表
 */
function appendRFWidget(winId, type, args, block, commands, variables) {
    var body = document.getElementById('rf-body-' + winId);
    if (!body) return;
    if (type === 'label') {
        var text = args[0];
        var align = args[1] || 'left';
        var el = document.createElement('div');
        el.className = 'rf-label' + (align === 'center' ? ' center' : '');
        el.textContent = text;
        body.appendChild(el);
    } else if (type === 'button') {
        var btnText = args[0];
        var action = args[1];
        var el = document.createElement('button');
        el.textContent = btnText;
        if (action === 'close') {
            el.onclick = function() {
                closeWindow(winId);
            };
        } else if (action === 'run' && block) {
            el.onclick = function() {
                var blockCommands = block.map(function(l) {
                    return parseRFLine(l);
                }).filter(Boolean);
                executeRFCommands(blockCommands, variables, 0);
            };
        }
        body.appendChild(el);
    } else if (type === 'canvas') {
        var width = args[0];
        var height = args[1];
        var canvas = document.createElement('canvas');
        canvas.id = 'rf-canvas';
        canvas.width = width;
        canvas.height = height;
        canvas.style.border = '1px solid #999';
        canvas.style.background = '#fff';
        canvas.style.alignSelf = 'center';
        body.appendChild(canvas);
    } else if (type === 'draw' && block) {
        var scriptContent = block.join('\n');
        setTimeout(function() {
            try {
                (new Function(scriptContent))();
            } catch (e) {
                shellPrint('RF Draw Error: ' + e.message, 'error');
            }
        }, 100);
    }
}

/**
 * 渲染rf窗口的菜单栏
 * @param {string} winId - 窗口ID
 * @param {Array} menuItems - 菜单项列表
 */
function renderRFMenu(winId, menuItems) {
    var body = document.getElementById('rf-body-' + winId);
    if (!body) return;
    var menuBar = document.createElement('div');
    menuBar.className = 'rf-menu-bar';
    menuItems.forEach(function(m) {
        if (m.type === 'menu') {
            var menuEl = document.createElement('div');
            menuEl.className = 'rf-menu-item';
            menuEl.textContent = m.label;
            var dropdown = document.createElement('div');
            dropdown.className = 'rf-menu-dropdown';
            m.items.forEach(function(item) {
                if (item.separator) {
                    var sep = document.createElement('div');
                    sep.style.cssText = 'height:1px;background:#999;margin:2px 0';
                    dropdown.appendChild(sep);
                } else {
                    var itemEl = document.createElement('div');
                    itemEl.className = 'rf-menu-dropdown-item';
                    itemEl.textContent = item.label;
                    itemEl.onclick = function() {
                        dropdown.classList.remove('open');
                        if (item.action === 'close') closeWindow(winId);
                        else if (item.action === 'print') shellPrint(item.arg, '');
                        else if (item.action === 'msg') tkMsgBox('info', item.label, item.arg);
                    };
                    dropdown.appendChild(itemEl);
                }
            });
            menuEl.onclick = function(e) {
                e.stopPropagation();
                dropdown.classList.toggle('open');
            };
            menuEl.appendChild(dropdown);
            menuBar.appendChild(menuEl);
        }
    });
    body.insertBefore(menuBar, body.firstChild);
}

/**
 * 根据文件类型打开文件
 * @param {string} path - 文件路径

function openFileByType(path) {
    var ext = path.split('.').pop().toLowerCase();
    if (ext === 'kd') {
        openKDApp(VirtualFS.readFile(path), path.replace('.kd', ''));
        return;
    }
    if (ext === 'sys') {
        openSysFile(path);
        return;
    }
    if (['py', 'rf', 'txt', 'md', 'json', 'ini', 'cfg', 'yml', 'yaml', 'html', 'css', 'js', 'xml', 'csv', 'log'].indexOf(ext) !== -1) {
        openEditor(path);
    } else {
        showToast('不支持此文件类型: .' + ext);
    }
}

/**
 * 从控制面板安装Python环境
 */
function installPythonFromCP() {
    var logEl = document.getElementById('cp-install-log');
    var progressBar = document.getElementById('cp-install-progress');
    var statsEl = document.getElementById('cp-install-stats');
    var fill = document.getElementById('cp-progress-fill');
    var percentEl = document.getElementById('cp-percent');
    var speedEl = document.getElementById('cp-speed');
    var sizeEl = document.getElementById('cp-size');
    var btn = document.getElementById('cp-install-btn');
    var statusEl = document.getElementById('cp-python-status');

    if (!logEl || !progressBar || !statsEl) return;

    logEl.style.display = 'block';
    progressBar.style.display = 'block';
    statsEl.style.display = 'flex';
    logEl.innerHTML = '';
    btn.disabled = true;

    var startTime = Date.now();
    var lastBytes = 0;
    var lastTime = Date.now();
    var speedSamples = [];

    function log(msg) {
        var time = new Date().toLocaleTimeString();
        logEl.innerHTML += '<div>[' + time + '] ' + msg + '</div>';
        logEl.scrollTop = logEl.scrollHeight;
    }

    function formatSpeed(bytesPerSecond) {
        if (bytesPerSecond <= 0) return '0 B/s';
        if (bytesPerSecond < 1024) return Math.round(bytesPerSecond) + ' B/s';
        if (bytesPerSecond < 1048576) return (bytesPerSecond / 1024).toFixed(1) + ' KB/s';
        return (bytesPerSecond / 1048576).toFixed(2) + ' MB/s';
    }

    function getSmoothedSpeed(currentSpeed) {
        speedSamples.push(currentSpeed);
        if (speedSamples.length > 10) speedSamples.shift();
        var sum = 0;
        for (var i = 0; i < speedSamples.length; i++) {
            sum += speedSamples[i];
        }
        return sum / speedSamples.length;
    }

    log('🚀 正在连接 Pyodide CDN...');

    var wasmUrl = 'https://cdn.jsdelivr.net/pyodide/v0.27.0/full/pyodide.asm.wasm';

    fetch(wasmUrl).then(function(response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);

        var totalSize = parseInt(response.headers.get('content-length') || '0');
        var loadedSize = 0;
        var reader = response.body.getReader();

        log('📦 文件大小: ' + (totalSize / 1048576).toFixed(1) + ' MB');
        log('📥 开始下载...');

        function updateDisplay() {
            var now = Date.now();
            var timeDiff = (now - lastTime) / 1000;
            var bytesDiff = loadedSize - lastBytes;
            var currentSpeed = timeDiff > 0 ? bytesDiff / timeDiff : 0;
            var smoothSpeed = getSmoothedSpeed(currentSpeed);
            var pct = totalSize > 0 ? Math.round((loadedSize / totalSize) * 100) : 0;

            fill.style.width = pct + '%';
            percentEl.textContent = pct + '%';
            speedEl.textContent = formatSpeed(smoothSpeed);
            sizeEl.textContent = (loadedSize / 1048576).toFixed(1) + ' / ' + (totalSize / 1048576).toFixed(1) + ' MB';

            lastBytes = loadedSize;
            lastTime = now;
        }

        function pump() {
            return reader.read().then(function(result) {
                if (result.done) {
                    updateDisplay();
                    log('✅ 核心文件下载完成 (' + (loadedSize / 1048576).toFixed(1) + ' MB)');
                    log('🔄 正在初始化 Python 解释器...');

                    fill.style.width = '100%';
                    percentEl.textContent = '100%';
                    speedEl.textContent = '完成';
                    sizeEl.textContent = (loadedSize / 1048576).toFixed(1) + ' / ' + (loadedSize / 1048576).toFixed(1) + ' MB';

                    return loadPyodide({
                        indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.27.0/full/'
                    }).then(function(py) {
                        pyodide = py;
                        injectTkinterEmulator();
                        pyodideReady = true;

                        var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                        fill.style.background = '#107C10';
                        log('✅ 安装完成！总耗时 ' + elapsed + ' 秒');
                        btn.disabled = false;
                        btn.textContent = '重新安装 Pyodide 环境';
                        if (statusEl) statusEl.textContent = '✅ 已安装 (Pyodide ' + PYODIDE_VERSION + ')';
                        showToast('🎉 Python 环境已就绪！');
                    });
                }

                loadedSize += result.value.length;
                updateDisplay();

                return pump();
            });
        }

        return pump();
    }).catch(function(err) {
        log('❌ 下载失败: ' + err.message);
        log('💡 请检查网络连接后重试');
        btn.disabled = false;
        fill.style.width = '0%';
        percentEl.textContent = '0%';
        speedEl.textContent = '失败';
    });
}

/**
 * 更新 tkinter Canvas 像素
 * @param {Uint8Array} rgbBytes - RGB字节数组
 * @param {number} width - 宽度
 * @param {number} height - 高度
 */
function tkCanvasUpdate(rgbBytes, width, height) {
    var canvas = document.getElementById('tk-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var imgData = ctx.createImageData(width, height);
    var arr = new Uint8ClampedArray(rgbBytes);
    for (var i = 0; i < width * height; i++) {
        var src = i * 3;
        var dst = i * 4;
        imgData.data[dst] = arr[src];
        imgData.data[dst + 1] = arr[src + 1];
        imgData.data[dst + 2] = arr[src + 2];
        imgData.data[dst + 3] = 255;
    }
    ctx.putImageData(imgData, 0, 0);
}

/**
 * 在 tkinter Canvas 上绘制文字
 * @param {number} x - X坐标
 * @param {number} y - Y坐标
 * @param {string} text - 文字内容
 * @param {string} fill - 颜色
 * @param {number} size - 字号
 */
function drawUIText(x, y, text, fill, size) {
    var canvas = document.getElementById('tk-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = fill;
    ctx.font = size + "px 'Segoe UI', sans-serif";
    ctx.fillText(text, x, y);
}

/**
 * 更新窗口标题
 * @param {string} id - 窗口ID
 * @param {string} title - 新标题
 */
function updateWindowTitle(id, title) {
    if (openWindows[id]) {
        openWindows[id].title = title;
        var titleEl = openWindows[id].el.querySelector('.title-text');
        if (titleEl) titleEl.textContent = title;
    }
}

/**
 * 调整 tkinter 窗口大小
 * @param {string} id - 窗口ID
 * @param {number} width - 宽度
 * @param {number} height - 高度
 */
function tkResizeWindow(id, width, height) {
    if (openWindows[id]) {
        var win = openWindows[id].el;
        win.style.width = (width + 16) + 'px';
        win.style.height = (height + 40) + 'px';
    }
}

/**
 * 同步 tkinter 控件到 DOM
 * @param {string} jsonStr - JSON字符串
 */
function tkSyncAll(jsonStr) {
    var wrap = document.getElementById('tk-body-wrap') || document.getElementById('tk-panel-wrap');
    if (!wrap) return;
    try {
        var widgets = JSON.parse(jsonStr);
        widgets.forEach(function(w) {
            var el = document.getElementById(w.id);
            if (!el) {
                el = document.createElement('div');
                el.id = w.id;
                wrap.appendChild(el);
            }
            if (w.type === 'label') {
                el.innerHTML = '<span style="color:' + w.fg + ';font-size:' + w.fontSize + 'px">' + escapeHTML(w.text || '') + '</span>';
            } else if (w.type === 'button') {
                el.innerHTML = '<button class="tk-btn" style="font-size:' + w.fontSize + 'px" onclick="tkBtnClick(\'' + w.id + '\')">' + escapeHTML(w.text || '') + '</button>';
            } else if (w.type === 'entry') {
                el.innerHTML = '<input type="text" value="' + escapeHTML(w.value || '') + '" style="width:' + ((w.width || 20) * 8) + 'px;font-size:' + w.fontSize + 'px" onchange="tkEntryChange(\'' + w.id + '\',this.value)" oninput="tkEntryChange(\'' + w.id + '\',this.value)">';
            } else if (w.type === 'frame') {
                el.style.border = '1px solid #ccc';
                el.style.padding = '8px';
                el.style.background = w.bg || '#f0f0f0';
            } else if (w.type === 'listbox') {
                var h = '';
                w.items.forEach(function(it, i) {
                    h += '<div class="tk-listbox-item" onclick="tkListboxSelect(\'' + w.id + '\',' + i + ')">' + escapeHTML(it) + '</div>';
                });
                el.innerHTML = h;
                el.style.maxHeight = ((w.height || 10) * 20) + 'px';
            }
        });
    } catch (e) {
        console.error('tkSyncAll error:', e);
    }
}

/**
 * Listbox选择跟踪
 * @param {string} id - Listbox ID
 * @param {number} idx - 选中索引
 */
function tkListboxSelect(id, idx) {
    _tkListboxSel[id] = idx;
    var el = document.getElementById(id);
    if (el) {
        var items = el.querySelectorAll('.tk-listbox-item');
        items.forEach(function(item, i) {
            item.classList.toggle('selected', i === idx);
        });
    }
}

 */
function tkListboxSelection(id) {
    return _tkListboxSel.hasOwnProperty(id) ? _tkListboxSel[id] : null;
}

/**
 * 初始化控制面板
 */
function tkInitPanel() {
    var w = document.getElementById('tk-panel-wrap');
    if (w) {
        w.innerHTML = '<div class="tk-notebook"><div class="tk-tabs" id="tk-panel-tabs"></div><div class="tk-tab-body" id="tk-panel-body"></div></div>';
    }
    _tkPanelTabs = [];
}

/**
 * 添加Notebook选项卡
 * @param {string} text - 选项卡文字
 */
function tkNotebookAdd(text) {
    _tkPanelTabs.push({ text: text });
    var tabs = document.getElementById('tk-panel-tabs');
    if (!tabs) return;
    var idx = _tkPanelTabs.length - 1;
    var t = document.createElement('div');
    t.className = 'tk-tab' + (idx === 0 ? ' active' : '');
    t.textContent = text;
    t.onclick = function() {
        var allTabs = document.querySelectorAll('#tk-panel-tabs .tk-tab');
        allTabs.forEach(function(tb, i) {
            tb.classList.toggle('active', i === idx);
        });
    };
    tabs.appendChild(t);
}

/**
 * 模拟messagebox
 * @param {string} type - 类型
 * @param {string} title - 标题
 * @param {string} msg - 消息
 * @returns {Promise} 结果
 */
function tkMsgBox(type, title, msg) {
    var icons = {
        info: 'ℹ️',
        warning: '⚠️',
        error: '❌',
        yesno: '❓',
        askstring: '📝'
    };
    var ov = document.createElement('div');
    ov.className = 'tk-msgbox-overlay';
    if (type === 'askstring') {
        ov.innerHTML = '<div class="tk-msgbox"><div class="tk-msg-icon">' + icons[type] + '</div><div class="tk-msg-text"><b>' + escapeHTML(title) + '</b><br>' + escapeHTML(msg) + '</div><input type="text" id="tk-askstring-input" style="width:100%;padding:6px;margin-bottom:12px;border:1px solid #999;border-radius:3px" autofocus><div><button onclick="tkMsgClose(null)">取消</button><button onclick="tkMsgClose(document.getElementById(\'tk-askstring-input\').value)">确定</button></div></div>';
    } else {
        ov.innerHTML = '<div class="tk-msgbox"><div class="tk-msg-icon">' + icons[type] + '</div><div class="tk-msg-text"><b>' + escapeHTML(title) + '</b><br>' + escapeHTML(msg) + '</div><div>' + (type === 'yesno' ? '<button onclick="tkMsgClose(true)">是</button><button onclick="tkMsgClose(false)">否</button>' : '<button onclick="tkMsgClose(true)">确定</button>') + '</div></div>';
    }
    document.body.appendChild(ov);
    return new Promise(function(r) {
        _tkMsgResolve = r;
    });
}

/**
 * 关闭messagebox
 * @param {*} val - 返回值
 */
function tkMsgClose(val) {
    var overlays = document.querySelectorAll('.tk-msgbox-overlay');
    overlays.forEach(function(o) {
        o.remove();
    });
    if (_tkMsgResolve) {
        _tkMsgResolve(val);
        _tkMsgResolve = null;
    }
}

/**
 * HTML转义
 * @param {string} s - 原始字符串
 * @returns {string} 转义后的字符串
 */
function escapeHTML(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

/**
 * 属性转义
 * @param {string} s - 原始字符串
 * @returns {string} 转义后的字符串
 */
function escapeAttr(s) {
    return s.replace(/'/g, "\\'").replace(/"/g, '\\"');
}

/**
 * 显示Toast通知
 * @param {string} m - 消息内容
 */
function showToast(m) {
    var t = document.getElementById('toast');
    t.textContent = m;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(function() {
        t.style.opacity = '0';
    }, 3000);
}

/**
 * 打开 .sys 文件（从文件管理器双击）
 * @param {string} filePath - sys文件路径
 */
function openSysFile(filePath) {
    var content = VirtualFS.readFile(filePath);
    if (!content) {
        showToast('无法读取文件: ' + filePath);
        return;
    }
    // 在 System Control 窗口中打开并显示
    openSysManager(filePath, content);
}

/**
 * 打开 System Control 管理器
 * @param {string} filePath - 可选，要编辑的文件路径
 * @param {string} content - 可选，文件内容
 */
function openSysManager(filePath, content) {
    if (openWindows['sysmanager']) {
        focusWindow('sysmanager');
        // 如果有指定文件，更新编辑器内容
        if (filePath && content) {
            setTimeout(function() {
                var ta = document.getElementById('sys-editor-input');
                if (ta) {
                    ta.value = content;
                    ta.dataset.filepath = filePath;
                    document.getElementById('sys-status-file').textContent = filePath;
                }
            }, 100);
        }
        return;
    }

    var currentFilePath = filePath || '';
    var currentContent = content || '';

    var menuBarHTML = '<div class="menu-bar">';
    menuBarHTML += '<div class="menu-item" onclick="toggleMenu(event, this)">文件<div class="menu-dropdown"><div class="menu-dropdown-item" onclick="sysNewFile()">📄 新建</div><div class="menu-dropdown-item" onclick="sysOpenFile()">📂 打开...</div><div class="menu-dropdown-item" onclick="sysSaveFile()">💾 保存</div><div class="menu-dropdown-item" onclick="sysSaveAsFile()">📋 另存为...</div><div class="menu-separator"></div><div class="menu-dropdown-item" onclick="closeWindow(\'sysmanager\')">✕ 关闭</div></div></div>';
    menuBarHTML += '<div class="menu-item" onclick="toggleMenu(event, this)">运行<div class="menu-dropdown"><div class="menu-dropdown-item" onclick="sysRunCurrent()">▶ 运行当前脚本</div><div class="menu-dropdown-item" onclick="sysInstallUpdate()">📦 安装为系统更新</div></div></div>';
    menuBarHTML += '</div>';

    var toolbarHTML = '<div class="editor-toolbar"><button class="run-btn" onclick="sysRunCurrent()">▶ 运行</button><button onclick="sysInstallUpdate()">📦 安装更新</button><span style="margin-left:8px;">⚡ System Control - 系统级脚本引擎</span></div>';

    var editorHTML = '<div class="editor-area"><textarea id="sys-editor-input" spellcheck="false" style="font-family:var(--font-mono);font-size:14px;line-height:1.6;padding:16px;background:#1e1e1e;color:#d4d4d4;border:none;resize:none;width:100%;height:100%;outline:none;white-space:pre-wrap;word-wrap:break-word;"></textarea></div>';

    var statusHTML = '<div class="editor-statusbar" style="background:#6a0dad;"><span id="sys-status-file">' + (currentFilePath || '未命名.sys') + '</span><span id="sys-status-ln">行: 1, 列: 1</span><span>.sys 系统级脚本</span></div>';

    var bodyHTML = menuBarHTML + toolbarHTML + editorHTML + statusHTML;

    createWindow('sysmanager', 'System Control', '⚡', 750, 550, 80, 100, bodyHTML);

    setTimeout(function() {
        var ta = document.getElementById('sys-editor-input');
        if (!ta) return;
        ta.value = currentContent;
        ta.dataset.filepath = currentFilePath;
        ta.focus();
        ta.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                sysSaveFile();
            }
            if (e.key === 'F5') {
                e.preventDefault();
                sysRunCurrent();
            }
        });
        ta.addEventListener('input', function() {
            var v = ta.value;
            var pos = ta.selectionStart;
            var lines = v.substr(0, pos).split('\n');
            var ln = lines.length;
            var cn = lines[lines.length - 1].length + 1;
            var el = document.getElementById('sys-status-ln');
            if (el) el.textContent = '行: ' + ln + ', 列: ' + cn;
        });
        ta.addEventListener('keyup', function() {
            var el = document.getElementById('sys-status-ln');
            if (!el) return;
            var v = ta.value;
            var pos = ta.selectionStart;
            var lines = v.substr(0, pos).split('\n');
            var ln = lines.length;
            var cn = lines[lines.length - 1].length + 1;
            el.textContent = '行: ' + ln + ', 列: ' + cn;
        });
    }, 100);
}

/**
 * sys脚本 - 新建文件
 */
function sysNewFile() {
    var ta = document.getElementById('sys-editor-input');
    if (ta) {
        ta.value = '// sys 系统级脚本\n// 可用全局变量: _SYS (系统API)\n\n_SYS.showToast("Hello from sys!");\n';
        ta.dataset.filepath = '';
        document.getElementById('sys-status-file').textContent = '未命名.sys';
    }
}

/**
 * sys脚本 - 打开文件
 */
function sysOpenFile() {
    var files = VirtualFS.listFiles();
    var names = Object.keys(files).filter(function(n) { return n.endsWith('.sys'); }).sort();
    if (names.length === 0) {
        alert('没有找到 .sys 文件。\n请在文件管理器中创建。');
        return;
    }
    var list = names.map(function(n, i) { return i + ': ' + n; }).join('\n');
    var choice = prompt('选择要打开的 .sys 文件:\n\n' + list, '0');
    if (choice !== null) {
        var idx = parseInt(choice);
        if (!isNaN(idx) && idx >= 0 && idx < names.length) {
            var path = names[idx];
            var content = VirtualFS.readFile(path);
            if (content) {
                var ta = document.getElementById('sys-editor-input');
                if (ta) {
                    ta.value = content;
                    ta.dataset.filepath = path;
                    document.getElementById('sys-status-file').textContent = path;
                }
            }
        }
    }
}

/**
 * sys脚本 - 保存文件
 */
function sysSaveFile() {
    var ta = document.getElementById('sys-editor-input');
    if (!ta) return;
    var filePath = ta.dataset.filepath;
    if (!filePath) {
        sysSaveAsFile();
        return;
    }
    VirtualFS.writeFile(filePath, ta.value);
    showToast('⚡ 已保存: ' + filePath);
}

/**
 * sys脚本 - 另存为
 */
function sysSaveAsFile() {
    var ta = document.getElementById('sys-editor-input');
    if (!ta) return;
    var n = prompt('文件名:', 'script.sys');
    if (n && n.trim()) {
        n = n.trim();
        if (!n.endsWith('.sys')) n += '.sys';
        ta.dataset.filepath = n;
        document.getElementById('sys-status-file').textContent = n;
        VirtualFS.writeFile(n, ta.value);
        showToast('⚡ 已保存: ' + n);
        refreshFiles();
    }
}

/**
 * sys脚本 - 运行当前脚本
 */
function sysRunCurrent() {
    var ta = document.getElementById('sys-editor-input');
    if (!ta || !ta.value.trim()) {
        showToast('没有可执行的代码');
        return;
    }
    if (!confirm('⚠️ 即将执行系统级脚本。\n\n.sys 脚本拥有系统最底层权限，可以修改任何系统资源。\n\n确定要继续吗？')) {
        return;
    }
    try {
        eval(ta.value);
        showToast('✅ sys脚本执行完毕');
        shellPrint('[System Control] 脚本执行完毕', 'info');
        VirtualFS.refreshStartMenuKD();
        updateTrashIcon();
    } catch (e) {
        showToast('❌ sys脚本错误');
        shellPrint('[System Control] 错误: ' + e.message, 'error');
        console.error('sys脚本执行错误:', e);
    }
}

/**
 * sys脚本 - 安装为系统更新
 */
function sysInstallUpdate() {
    var ta = document.getElementById('sys-editor-input');
    if (!ta || !ta.value.trim()) {
        showToast('没有可执行的代码');
        return;
    }
    var name = prompt('更新名称:', 'update_' + new Date().toISOString().slice(0, 10));
    if (!name || !name.trim()) return;
    name = name.trim();
    if (!name.endsWith('.sys')) name += '.sys';

    if (!confirm('⚠️ 将 "' + name + '" 安装为系统更新。\n\n系统更新会在安装时立即执行，并保存在 updates 目录中。\n\n确定要继续吗？')) {
        return;
    }

    _SYS.installUpdate(name.replace('.sys', ''), ta.value);
    refreshFiles();
}

var virtualFolders = {};
var fileTags = {};
var VFOLDERS_KEY = 'tkemu_vfolders_v1';
var FTAGS_KEY = 'tkemu_ftags_v1';

(function initV152Data() {
    try { var vf = localStorage.getItem(VFOLDERS_KEY); if (vf) virtualFolders = JSON.parse(vf); } catch(e) {}
    try { var ft = localStorage.getItem(FTAGS_KEY); if (ft) fileTags = JSON.parse(ft); } catch(e) {}
})();

function saveVFolders() { localStorage.setItem(VFOLDERS_KEY, JSON.stringify(virtualFolders)); }
function saveFTags() { localStorage.setItem(FTAGS_KEY, JSON.stringify(fileTags)); }

VirtualFS.createVirtualFolder = function(name) {
    if (virtualFolders[name]) return false;
    virtualFolders[name] = { name: name, files: [], time: new Date().toISOString() };
    saveVFolders();
    return true;
};
VirtualFS.removeVirtualFolder = function(name) { delete virtualFolders[name]; saveVFolders(); };
VirtualFS.getVirtualFolders = function() { return virtualFolders; };
VirtualFS.addFileToFolder = function(folderName, filePath) {
    if (virtualFolders[folderName] && virtualFolders[folderName].files.indexOf(filePath) === -1) {
        virtualFolders[folderName].files.push(filePath); saveVFolders(); return true;
    } return false;
};
VirtualFS.removeFileFromFolder = function(folderName, filePath) {
    if (virtualFolders[folderName]) {
        var idx = virtualFolders[folderName].files.indexOf(filePath);
        if (idx > -1) { virtualFolders[folderName].files.splice(idx, 1); saveVFolders(); return true; }
    } return false;
};
VirtualFS.getFilesInFolder = function(folderName) {
    return virtualFolders[folderName] ? virtualFolders[folderName].files : [];
};
VirtualFS.setFileTag = function(path, tag) { fileTags[path] = tag; saveFTags(); };
VirtualFS.getFileTag = function(path) { return fileTags[path] || ''; };
VirtualFS.removeFileTag = function(path) { delete fileTags[path]; saveFTags(); };

    input.onchange = function(e) {

        var count = 0; for (var i = 0; i < files.length; i++) { (function(f) { var reader = new FileReader(); reader.onload = function(ev) { VirtualFS.writeFile(f.name, ev.target.result); count++; if (count === files.length) { closeWindow('files'); openFiles(); showToast('已上传 ' + count + ' 个文件'); } }; reader.readAsText(f); })(files[i]); }

function downloadFileToLocal(path) {

    else { validToken = validToken.trim(); if (tokens.indexOf(validToken) === -1) { alert('令牌无效！'); return; } }

        var updates = getSysUpdates(); updates.push({ name: name, content: ta.value, token: validToken, time: new Date().toISOString() }); saveSysUpdates(updates);

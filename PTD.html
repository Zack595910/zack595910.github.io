// ─── 1. 文件夹嵌套支持（增强 VirtualFS） ───
(function() {
    if (VirtualFS._v160_nested) return;
    VirtualFS._v160_nested = true;
    
    VirtualFS.createFolder = function(folderName) {
        if (!folderName || folderName.indexOf('/') !== -1) return false;
        var allFiles = {};
        try { allFiles = JSON.parse(localStorage.getItem(VirtualFS._key) || '{}'); } catch(e) {}
        var marker = folderName + '/.folder';
        if (allFiles[marker]) return false;
        allFiles[marker] = 'folder';
        localStorage.setItem(VirtualFS._key, JSON.stringify(allFiles));
        return true;
    };
    
    VirtualFS.deleteFolder = function(folderName) {
        var allFiles = {};
        try { allFiles = JSON.parse(localStorage.getItem(VirtualFS._key) || '{}'); } catch(e) {}
        var keys = Object.keys(allFiles);
        var deleted = false;
        keys.forEach(function(k) {
            if (k.indexOf(folderName + '/') === 0) {
                delete allFiles[k];
                deleted = true;
            }
        });
        if (deleted) localStorage.setItem(VirtualFS._key, JSON.stringify(allFiles));
        return deleted;
    };
    
    VirtualFS.getFolders = function() {
        var files = VirtualFS.listFiles();
        var folders = {};
        Object.keys(files).forEach(function(k) {
            var idx = k.indexOf('/');
            if (idx > -1 && k.endsWith('/.folder')) {
                folders[k.substring(0, idx)] = true;
            }
        });
        return Object.keys(folders).sort();
    };
    
    VirtualFS.listFilesInFolder = function(folderName) {
        var files = VirtualFS.listFiles();
        var result = {};
        Object.keys(files).forEach(function(k) {
            if (k.indexOf(folderName + '/') === 0 && !k.endsWith('/.folder')) {
                result[k] = files[k];
            }
        });
        return result;
    };
})();

// 显示登录界面
function v160ShowLogin() {
    var existing = document.getElementById('v160-login-overlay');
    if (existing) existing.remove();
    
    var overlay = document.createElement('div');
    overlay.id = 'v160-login-overlay';
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0a0a2e,#1a1a4e);z-index:99990;display:flex;flex-direction:column;align-items:center;justify-content:center;';
    
    var title = document.createElement('div');
    title.textContent = '选择用户登录';
    title.style.cssText = 'color:#fff;font-size:24px;font-weight:bold;margin-bottom:20px;';
    overlay.appendChild(title);
    
    var listEl = document.createElement('div');
    listEl.style.cssText = 'display:flex;flex-direction:column;gap:8px;';
    
    v160Users.forEach(function(u) {
        var card = document.createElement('div');
        card.style.cssText = 'background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.15);border-radius:14px;padding:14px 20px;cursor:pointer;display:flex;align-items:center;gap:12px;width:260px;transition:all 0.2s;';
        card.onmouseenter = function() { card.style.borderColor = '#00ccff'; card.style.background = 'rgba(255,255,255,0.12)'; };
        card.onmouseleave = function() { card.style.borderColor = 'rgba(255,255,255,0.15)'; card.style.background = 'rgba(255,255,255,0.06)'; };
        
        card.innerHTML = '<div style="font-size:32px;">' + u.avatar + '</div><div style="flex:1;"><div style="color:#fff;font-weight:bold;font-size:15px;">' + u.name + '</div><div style="color:#888;font-size:11px;">' + (u.isAdmin ? '管理员' : '标准用户') + (u.password === '' ? ' | 无密码' : '') + '</div></div><div style="color:#666;font-size:18px;">→</div>';
        
        card.onclick = function() {
            if (u.password === '') {
                // 无密码用户直接登录
                v160SetSession(u.name);
                overlay.remove();
                v160OnLogin();
            } else {
                var pw = prompt('输入密码 (用户: ' + u.name + '):', '');
                if (pw === u.password) {
                    v160SetSession(u.name);
                    overlay.remove();
                    v160OnLogin();
                } else if (pw !== null) {
                    alert('密码错误！');
                }
            }
        };
        listEl.appendChild(card);
    });
    
    overlay.appendChild(listEl);
    
    var addBtn = document.createElement('button');
    addBtn.textContent = '➕ 添加新用户';
    addBtn.style.cssText = 'margin-top:16px;padding:10px 22px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:22px;color:#fff;cursor:pointer;font-size:13px;';
    addBtn.onclick = function() {
        var name = prompt('新用户名:', '');
        if (!name || !name.trim()) return;
        name = name.trim();
        if (v160Users.find(function(u) { return u.name === name; })) { alert('用户已存在'); return; }
        var pw = prompt('设置密码 (留空=无密码):', '');
        if (pw === null) return;
        // 空字符串保持为空密码
        v160Users.push({ name: name, password: pw, avatar: '👤', isAdmin: false, created: new Date().toISOString() });
        v160SaveUsers();
        v160ShowLogin();
        showToast('✅ 用户 ' + name + ' 已创建');
    };
    overlay.appendChild(addBtn);
    
    document.body.appendChild(overlay);
}
// 登录成功后的处理
function v160OnLogin() {
    var user = v160Users.find(function(u) { return u.name === v160CurrentUser; });
    if (user) {
        showToast('✅ 欢迎, ' + user.name);
        // 恢复用户文件
        var ud = v160GetUserData(user.name);
        if (ud && ud.files) {
            var allFiles = {};
            try { allFiles = JSON.parse(localStorage.getItem(VirtualFS._key) || '{}'); } catch(e) {}
            // 把用户文件合并到全局
            for (var k in ud.files) {
                if (ud.files.hasOwnProperty(k)) {
                    allFiles[k] = ud.files[k];
                }
            }
            localStorage.setItem(VirtualFS._key, JSON.stringify(allFiles));
        }
    }
}

// 保存当前用户文件
function v160SaveCurrentUserFiles() {
    if (!v160CurrentUser) return;
    var ud = v160GetUserData(v160CurrentUser);
    var allFiles = {};
    try { allFiles = JSON.parse(localStorage.getItem(VirtualFS._key) || '{}'); } catch(e) {}
    ud.files = {};
    for (var k in allFiles) {
        if (allFiles.hasOwnProperty(k) && !k.startsWith('updates/')) {
            ud.files[k] = allFiles[k];
        }
    }
    ud.lastLogin = new Date().toISOString();
    v160SaveUserData(v160CurrentUser, ud);
}

// 切换用户（保存当前用户数据后显示登录）
window.v160SwitchUser = function() {
    v160SaveCurrentUserFiles();
    v160ClearSession();
    v160ShowLogin();
};

// 注销（切换用户同义）
window.v160Logout = v160SwitchUser;

// 获取当前用户信息
window.v160GetCurrentUser = function() {
    return v160CurrentUser ? v160Users.find(function(u) { return u.name === v160CurrentUser; }) : null;
};

// 在右键菜单加切换用户
(function() {
    var menu = document.getElementById('desktop-context-menu');
    if (!menu || menu._v160_user) return;
    menu._v160_user = true;
    var sep = menu.querySelector('div[style]');
    if (!sep) return;
    var item = document.createElement('div');
    item.className = 'context-menu-item';
    item.innerHTML = '<span>👤</span> 切换用户';
    item.onclick = function() { v160SwitchUser(); hideAllContextMenus(); };
    menu.insertBefore(item, sep);
})();

// 定时自动保存
setInterval(v160SaveCurrentUserFiles, 30000);

// 初始化
v160LoadUsers();
var session = v160GetSession();
if (session && v160Users.find(function(u) { return u.name === session; })) {
    v160CurrentUser = session;
    setTimeout(v160OnLogin, 500);
} else {
    setTimeout(v160ShowLogin, 800);
}

showToast('👥 多用户系统已加载');
// 开始菜单加"注销"按钮
(function() {
    var sm = document.getElementById('start-menu');
    if (!sm || sm._v160_logout) return;
    sm._v160_logout = true;
    
    // 找到重启系统那个菜单项，插在它前面
    var items = sm.querySelectorAll('.start-menu-item');
    var target = null;
    for (var i = 0; i < items.length; i++) {
        if (items[i].textContent.indexOf('重启系统') !== -1) {
            target = items[i];
            break;
        }
    }
    
    var logoutItem = document.createElement('div');
    logoutItem.className = 'start-menu-item';
    logoutItem.innerHTML = '<span class="sm-icon">🚪</span> 注销';
    logoutItem.onclick = function() {
        toggleStartMenu();
        if (typeof v160SwitchUser === 'function') {
            v160SwitchUser();
        } else {
            alert('多用户系统未加载');
        }
    };
    
    if (target) {
        sm.insertBefore(logoutItem, target);
    } else {
        sm.appendChild(logoutItem);
    }
    showToast('✅ 注销按钮已添加');
})();

//  左下角磁贴隐藏功能
//  双击隐藏 / 通过开始菜单重新显示
// ═══════════════════════════════════════════════════════════════

(function() {
    var tiles = document.getElementById('v160-tiles');
    if (!tiles || tiles._v160_hide) return;
    tiles._v160_hide = true;

    // 双击磁贴区域隐藏
    tiles.addEventListener('dblclick', function() {
        tiles.style.display = 'none';
        showToast('磁贴已隐藏，可在开始菜单重新显示');
    });

    // 开始菜单加"显示磁贴"选项
    var sm = document.getElementById('start-menu');
    if (sm) {
        var item = document.createElement('div');
        item.className = 'start-menu-item';
        item.innerHTML = '<span class="sm-icon">📌</span> 显示磁贴';
        item.onclick = function() {
            toggleStartMenu();
            tiles.style.display = 'flex';
            showToast('磁贴已显示');
        };
        sm.appendChild(item);
    }

    // 键盘快捷键：Ctrl+Shift+H 切换
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.shiftKey && e.key === 'H') {
            e.preventDefault();
            tiles.style.display = (tiles.style.display === 'none') ? 'flex' : 'none';
            showToast(tiles.style.display === 'none' ? '磁贴已隐藏' : '磁贴已显示');
        }
    });
})();

    setWallpaperColor: function(c) {
        var d = document.getElementById('desktop');
        d.style.background = c;
        d.style.backgroundImage = 'none';
        var v = document.getElementById('v160-video-wallpaper');
        if (v) v.remove();
        showToast('✅ 壁纸已更改');
    },

    uploadWallpaper: function() {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = function(e) {
            var f = e.target.files[0];
            if (!f) return;
            var r = new FileReader();
            r.onload = function(ev) {
                var d = document.getElementById('desktop');
                d.style.backgroundImage = 'url(' + ev.target.result + ')';
                d.style.backgroundSize = 'cover';
                d.style.backgroundPosition = 'center';
                showToast('🖼️ 壁纸已上传');
            };
            r.readAsDataURL(f);
        };
        input.click();
    },

    uploadVideoWallpaper: function() {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = 'video/*';
        input.onchange = function(e) {
            var f = e.target.files[0];
            if (!f) return;
            var r = new FileReader();
            r.onload = function(ev) {
                var old = document.getElementById('v160-video-wallpaper');
                if (old) old.remove();
                var v = document.createElement('video');
                v.id = 'v160-video-wallpaper';
                v.src = ev.target.result;
                v.loop = true;
                v.muted = true;
                v.autoplay = true;
                v.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-1;';
                document.getElementById('desktop').insertBefore(v, document.getElementById('desktop').firstChild);
                showToast('🎬 动态壁纸已设置');
            };
            r.readAsDataURL(f);
        };
        input.click();
    },

    setWindowColor: function(c) {
        document.documentElement.style.setProperty('--win-accent', c);
        document.documentElement.style.setProperty('--win-title-active', c);
        showToast('✅ 窗口颜色已更改');
    },

    resetWindowColor: function() {
        document.documentElement.style.setProperty('--win-accent', '#0078D4');
        document.documentElement.style.setProperty('--win-title-active', '#0078D4');

    previewScreensaver: function() {
        var type = document.getElementById('wc-screensaver').value;
        if (type === 'none') { showToast('请选择屏幕保护'); return; }
        var overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99999;cursor:none;';
        overlay.onclick = function() { overlay.remove(); clearInterval(overlay._timer); };
        document.body.appendChild(overlay);
        var canvas = document.createElement('canvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        overlay.appendChild(canvas);
        var ctx = canvas.getContext('2d');

        if (type === 'bubbles') {
            var bubbles = [];
            for (var i = 0; i < 20; i++) bubbles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 25 + 8, vy: -Math.random() * 2 - 0.3, color: 'rgba(' + [Math.floor(Math.random() * 200 + 55), Math.floor(Math.random() * 200 + 55), Math.floor(Math.random() * 200 + 55)].join(',') + ',0.5)' });
            overlay._timer = setInterval(function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                bubbles.forEach(function(b) { b.y += b.vy; if (b.y < -50) { b.y = canvas.height + 50;
                        b.x = Math.random() * canvas.width; }
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                    ctx.fillStyle = b.color;
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                    ctx.stroke(); });
            }, 33);
        } else if (type === 'stars') {
            var stars = [];
            for (var s = 0; s < 150; s++) stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 2 + 0.5, sp: Math.random() * 0.5 + 0.1 });
            overlay._timer = setInterval(function() {
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                stars.forEach(function(s) { s.y += s.sp; if (s.y > canvas.height) { s.y = 0;
                        s.x = Math.random() * canvas.width; }
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.fill(); });
            }, 33);
        } else if (type === 'matrix') {
            var drops = [];
            for (var d = 0; d < Math.floor(canvas.width / 18); d++) drops[d] = Math.random() * -100;
            overlay._timer = setInterval(function() {
                ctx.fillStyle = 'rgba(0,0,0,0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#0f0';
                ctx.font = '16px Consolas';
                for (var d = 0; d < drops.length; d++) { ctx.fillText(String.fromCharCode(0x30A0 + Math.random() * 96), d * 18, drops[d] * 18); if (drops[d] * 18 > canvas.height && Math.random() > 0.975) drops[d] = 0;
                    drops[d]++; }
            }, 50);
        }
    },

    showBackup: function(content) {
        content.innerHTML = '<div style="font-weight:bold;font-size:14px;margin-bottom:12px;">💾 备份和还原</div>' +
            '<button onclick="WC.doBackup()" style="padding:10px 20px;background:#0078D4;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px;">📤 导出备份</button>' +
            '<button onclick="WC.doRestore()" style="margin-left:8px;padding:10px 20px;background:#e0e0e0;border:1px solid #999;border-radius:4px;cursor:pointer;font-size:12px;">📥 恢复备份</button>';
    },

    doBackup: function() {
        var blob = new Blob([JSON.stringify(VirtualFS.listFiles())], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'tkemu_backup_' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        showToast('✅ 备份已导出');
    },

    doRestore: function() {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = function(e) {
            var f = e.target.files[0];
            if (!f) return;
            var r = new FileReader();
            r.onload = function(ev) {
                try {
                    var data = JSON.parse(ev.target.result);
                    for (var k in data) { if (data.hasOwnProperty(k)) VirtualFS.writeFile(k, data[k]); }
                    showToast('✅ 备份已恢复');
                    refreshFiles();
                } catch (err) { alert('文件格式错误'); }
            };
            r.readAsText(f);
        };
        input.click();
    },

    showPrograms: function(content) {
        var apps = VirtualFS.getInstalledKDApps();
        var h = '<div style="font-weight:bold;font-size:14px;margin-bottom:12px;">📦 程序和功能</div>';
        if (apps.length === 0) {
            h += '<div style="color:#888;padding:20px;">没有已安装的程序</div>';
        } else {
            apps.forEach(function(app, i) {
                h += '<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee;">';
                h += '<span>⚡ ' + app.name + '</span>';
                h += '<button onclick="WC.uninstallApp(\'' + app.name.replace(/'/g, "\\'") + '\')" style="padding:3px 10px;background:#e74c3c;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:11px;">卸载</button>';
                h += '</div>';
            });

    uninstallApp: function(name) {
        if (confirm('卸载 "' + name + '"？')) {

            showToast('🗑 已卸载');

    showStorage: function(content) {
        var total = (new Blob([localStorage.getItem(VirtualFS._key) || '']).size / 1024).toFixed(1);
        var files = VirtualFS.listFiles();
        var byType = {};
        Object.keys(files).forEach(function(n) {
            var ext = n.split('.').pop().toLowerCase() || '无扩展';
            byType[ext] = (byType[ext] || 0) + 1;
        });
        var h = '<div style="font-weight:bold;font-size:14px;margin-bottom:12px;">💿 存储空间</div>';
        h += '<div style="font-size:20px;font-weight:bold;color:#0078D4;margin-bottom:10px;">' + total + ' KB</div>';
        h += '<div style="font-weight:bold;font-size:12px;margin-bottom:6px;">按类型统计:</div>';
        Object.keys(byType).sort().forEach(function(ext) {
            h += '<div style="padding:4px 0;border-bottom:1px solid #eee;font-size:12px;">.' + ext + ': ' + byType[ext] + ' 个</div>';
        });
        content.innerHTML = h;
    },

    showPower: function(content) {
        content.innerHTML = '<div style="font-weight:bold;font-size:14px;margin-bottom:12px;">🔋 电源选项</div>' +
            '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
            '<button onclick="WC.setPower(\'重启\')" style="padding:10px 20px;background:#0078D4;color:#fff;border:none;border-radius:4px;cursor:pointer;">🔄 重启系统</button>' +

            '<button onclick="WC.switchUser()" style="padding:10px 20px;background:#0078D4;color:#fff;border:none;border-radius:4px;cursor:pointer;">🔄 切换用户</button>';

    showDateTime: function(content) {

            '<div style="font-size:18px;margin-bottom:10px;">' + now.toLocaleString('zh-CN') + '</div>' +
            '<div style="color:#888;font-size:11px;">时区: 本地 | 格式: 24小时制</div>';
    },

    showEase: function(content) {
        content.innerHTML = '<div style="font-weight:bold;font-size:14px;margin-bottom:12px;">♿ 轻松使用</div>' +
            '<div style="margin-bottom:8px;">字体大小: <span id="wc-font-size">' + (parseFloat(document.body.style.fontSize) || 13) + 'px</span></div>' +
            '<button onclick="WC.changeFontSize(-1)" style="padding:8px 16px;border:1px solid #999;border-radius:4px;cursor:pointer;">A-</button>' +
            '<button onclick="WC.changeFontSize(1)" style="margin-left:4px;padding:8px 16px;border:1px solid #999;border-radius:4px;cursor:pointer;">A+</button>';
    },

    changeFontSize: function(delta) {
        var cur = parseFloat(document.body.style.fontSize) || 13;
        var next = Math.max(10, Math.min(20, cur + delta));
        document.body.style.fontSize = next + 'px';
        var el = document.getElementById('wc-font-size');
        if (el) el.textContent = next + 'px';
    },

    showNetwork: function(content) {

// 打开 Windows Control
function openWindowsControl() {
    if (openWindows['wincontrol']) { focusWindow('wincontrol'); return; }
    WC.view = 'category';
    WC.category = null;

    var html = '';
    html += '<div style="display:flex;gap:4px;padding:6px 10px;background:#f8f8f8;border-bottom:1px solid #ccc;flex-shrink:0;align-items:center;">';
    html += '<button onclick="WC.home()" style="padding:4px 12px;border:1px solid #bbb;background:#e0e0e0;cursor:pointer;font-size:11px;border-radius:3px;">🏠 主页</button>';
    html += '<select onchange="WC.setView(this.value)" style="padding:3px 8px;border:1px solid #bbb;border-radius:3px;font-size:11px;margin-left:6px;">';
    html += '<option value="category">类别</option><option value="large">大图标</option><option value="small">小图标</option>';
    html += '</select>';
    html += '<input type="text" placeholder="搜索控制面板" oninput="WC.search(this.value)" style="padding:3px 8px;border:1px solid #bbb;border-radius:3px;font-size:11px;margin-left:6px;width:150px;">';
    html += '</div>';
    html += '<div style="display:flex;flex:1;overflow:hidden;">';
    html += '<div style="width:150px;background:#f5f5f5;border-right:1px solid #ddd;padding:6px 0;overflow-y:auto;flex-shrink:0;">';
    html += '<div style="padding:6px 12px;cursor:pointer;color:#0078D4;font-size:11px;" onclick="WC.home()">🏠 控制面板主页</div>';
    WC.cats.forEach(function(cat) {
        html += '<div style="padding:6px 12px;cursor:pointer;font-size:11px;" onclick="WC.openCat(\'' + cat.id + '\')">' + cat.icon + ' ' + cat.name + '</div>';
    });
    html += '</div>';
    html += '<div style="flex:1;overflow-y:auto;padding:10px;background:#fff;" id="wc-content"></div>';
    html += '</div>';

    createWindow('wincontrol', '控制面板', '🖥️', 720, 500, 60, 100, html);
    setTimeout(function() { WC.render(); }, 100);
}

// 暴露全局
window.openWindowsControl = openWindowsControl;
window.WC = WC;

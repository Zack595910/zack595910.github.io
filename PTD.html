    /**
     * 在桌面上创建快捷方式
     */
    function createDesktopShortcut(name, icon, type, target) {
        var desktop = document.getElementById('desktop');
        if (!desktop) return;

        var shortcut = document.createElement('div');
        shortcut.className = 'desktop-icon';
        shortcut.style.cssText = 'top:calc(' + (20 + Math.random() * 400) + 'px * var(--ui-scale,1));left:calc(' + (20 + Math.random() * 200) + 'px * var(--ui-scale,1));position:absolute;';
        shortcut.innerHTML = '<div class="icon-img">' + icon + '</div><div>' + escapeHTML(name) + '</div>';

        if (type === 'kd') {
            shortcut.ondblclick = function() {
                var apps = VirtualFS.getInstalledKDApps();
                var app = apps.find(function(a) { return a.name === target; });
                if (app) {
                    openKDApp(app.content, app.name);
                } else {
                    showToast('❌ 应用不存在: ' + target);
                }
            };
        } else {
            shortcut.ondblclick = function() {
                openFileByType(target);
            };
        }

        // 右键菜单
        shortcut.oncontextmenu = function(e) {
            e.preventDefault();
            e.stopPropagation();
            hideAllContextMenus();
            var menu = document.createElement('div');
            menu.className = 'context-menu';
            menu.style.cssText = 'position:absolute;display:block;z-index:3000;';
            menu.style.left = e.clientX + 'px';
            menu.style.top = e.clientY + 'px';
            menu.innerHTML = '' +
                '<div class="context-menu-item" onclick="this.parentElement.remove();openFileByType(\'' + escapeAttr(target) + '\');"><span>📄</span> 打开</div>' +
                '<div class="context-menu-item" onclick="this.parentElement.remove();if(confirm(\'删除快捷方式？\')){this.closest(\'.desktop-icon\').remove();}"><span>🗑</span> 删除快捷方式</div>';
            document.body.appendChild(menu);
            setTimeout(function() {
                document.addEventListener('click', function rm() {
                    if (menu.parentNode) menu.remove();
                    document.removeEventListener('click', rm);
                });
            }, 50);
        };

        desktop.appendChild(shortcut);
    }

    function enhanceInputContextMenu() {
        document.addEventListener('contextmenu', function(e) {
            var target = e.target;
            if (!target || !(target.tagName === 'INPUT' || target.tagName === 'TEXTAREA')) return;

            // 不拦截已处理的右键菜单
            if (target.closest('.preview-item') || target.closest('.file-item')) return;

            e.preventDefault();
            e.stopPropagation();

            hideAllContextMenus();

            var menu = document.createElement('div');
            menu.className = 'context-menu';
            menu.style.cssText = 'position:absolute;display:block;z-index:3000;min-width:160px;';
            menu.style.left = e.clientX + 'px';
            menu.style.top = e.clientY + 'px';

            var hasSelection = target.selectionStart !== target.selectionEnd;
            var hasClipboard = false;
            try {
                hasClipboard = navigator.clipboard && navigator.clipboard.readText;
            } catch(err) {}

            menu.innerHTML = '' +
                '<div class="context-menu-item" onclick="v180InputCut(this);" style="' + (hasSelection ? '' : 'opacity:0.4;pointer-events:none;') + '"><span>✂️</span> 剪切</div>' +

        });

function enhanceFileContextMenu() {
    var _origShowFileCtx = window.v172ShowFileContextMenu;
    if (!_origShowFileCtx) return;

    // 直接重写，每次打开右键菜单时都添加
    window.v172ShowFileContextMenu = function(e, filePath) {
        // 保存当前文件路径
        window._v180_current_file = filePath;
        
        // 调用原始函数生成菜单
        _origShowFileCtx(e, filePath);
        
        // 立即添加"用代码编辑器打开"（在菜单显示前）
        setTimeout(function() {
            var menu = document.getElementById('v172-file-context-menu');
            if (!menu || !menu.classList.contains('open')) return;
            
            // 移除之前添加的（如果有）
            var existing = menu.querySelector('.v180-editor-item');
            if (existing) existing.remove();
            
            // 找到"打开"项
            var openItem = null;
            var items = menu.querySelectorAll('.context-menu-item');
            for (var i = 0; i < items.length; i++) {
                if (items[i].textContent.indexOf('打开') !== -1) {
                    openItem = items[i];
                    break;
                }
            }
            
            // 创建"用代码编辑器打开"项
            var editorItem = document.createElement('div');
            editorItem.className = 'context-menu-item v180-editor-item';
            editorItem.innerHTML = '<span>📝</span> 用代码编辑器打开';
            editorItem.onclick = function() {
                var path = window._v180_current_file;
                menu.classList.remove('open');
                if (path) {
                    openEditor(path);
                    showToast('📝 已用代码编辑器打开: ' + path);
                }
            };
            
            // 插入到"打开"项后面
            if (openItem && openItem.nextSibling) {
                menu.insertBefore(editorItem, openItem.nextSibling);
            } else if (openItem) {
                openItem.parentNode.insertBefore(editorItem, openItem.nextSibling);
            } else {
                menu.insertBefore(editorItem, menu.firstChild);
            }
        }, 10);
    };
}

//  修复 - 新建快捷方式可拖动
// ═══════════════════════════════════════════════════════════════

(function() {
    if (window._shortcut_drag_fix) return;
    window._shortcut_drag_fix = true;

    // 保存原始的 wizCreate 函数
    var _origWizCreate = window.wizCreate;

    // 重写 wizCreate，在创建快捷方式后绑定拖动
    window.wizCreate = function() {
        _origWizCreate();

        // 等待快捷方式 DOM 创建完成后绑定拖动
        setTimeout(function() {
            // 找到桌面上的快捷方式（没有拖动绑定的图标）
            var desktop = document.getElementById('desktop');
            if (!desktop) return;

            var icons = desktop.querySelectorAll('.desktop-icon');
            icons.forEach(function(icon) {
                if (icon._dragBound) return;
                icon._dragBound = true;
                bindIconDrag(icon);
            });
        }, 100);
    };

    /**
     * 为单个图标绑定拖动
     */
    function bindIconDrag(icon) {
        var dragInfo = null;

        icon.addEventListener('pointerdown', function(e) {
            if (e.detail > 1) return;
            e.preventDefault();
            e.stopPropagation();

            var desktopRect = document.getElementById('desktop').getBoundingClientRect();
            var iconRect = icon.getBoundingClientRect();

            dragInfo = {
                icon: icon,
                startX: e.clientX,
                startY: e.clientY,
                origLeft: iconRect.left - desktopRect.left,
                origTop: iconRect.top - desktopRect.top
            };

            icon.style.right = 'auto';
            icon.style.bottom = 'auto';
            icon.style.left = dragInfo.origLeft + 'px';
            icon.style.top = dragInfo.origTop + 'px';
            icon.style.zIndex = '500';
            icon.style.opacity = '0.85';
            icon.style.cursor = 'grabbing';

            try {
                icon.setPointerCapture(e.pointerId);
            } catch(err) {}
        });

        icon.addEventListener('pointermove', function(e) {
            if (!dragInfo || dragInfo.icon !== icon) return;
            e.preventDefault();

            var desktopRect = document.getElementById('desktop').getBoundingClientRect();
            var dx = e.clientX - dragInfo.startX;
            var dy = e.clientY - dragInfo.startY;

            var newLeft = dragInfo.origLeft + dx;
            var newTop = dragInfo.origTop + dy;

            var maxLeft = desktopRect.width - icon.offsetWidth - 8;
            var maxTop = desktopRect.height - icon.offsetHeight - 8;
            if (newLeft < 4) newLeft = 4;
            if (newTop < 4) newTop = 4;
            if (newLeft > maxLeft) newLeft = maxLeft;
            if (newTop > maxTop) newTop = maxTop;

            icon.style.left = newLeft + 'px';
            icon.style.top = newTop + 'px';
        });

        icon.addEventListener('pointerup', function() {
            if (!dragInfo || dragInfo.icon !== icon) return;
            icon.style.zIndex = '';
            icon.style.opacity = '1';
            icon.style.cursor = 'pointer';
            dragInfo = null;
        });
    }

    // 给现有所有快捷方式图标绑定（如果有之前创建的）
    setTimeout(function() {
        var desktop = document.getElementById('desktop');
        if (!desktop) return;
        var icons = desktop.querySelectorAll('.desktop-icon');
        icons.forEach(function(icon) {
            if (icon._dragBound) return;
            icon._dragBound = true;
            bindIconDrag(icon);
        });
    }, 500);

    console.log('✅ 快捷方式拖动修复已加载');
})();

//  终极修复 - 桌面图标拖动与双击完美共存
//  删除之前所有相关修复，用这个
// ═══════════════════════════════════════════════════════════════

(function() {
    if (window._icons_ultimate_fix) return;
    window._icons_ultimate_fix = true;

    setTimeout(function() {
        var desktop = document.getElementById('desktop');
        if (!desktop) return;

        var icons = desktop.querySelectorAll('.desktop-icon');
        icons.forEach(function(icon) {
            if (icon._ultimateFixed) return;
            icon._ultimateFixed = true;

            var startX = 0;
            var startY = 0;
            var moved = false;

            // pointerdown 记录位置
            icon.addEventListener('pointerdown', function(e) {
                if (e.detail > 1) return;
                startX = e.clientX;
                startY = e.clientY;
                moved = false;
            });

            // pointermove 检测移动
            icon.addEventListener('pointermove', function(e) {
                if (Math.abs(e.clientX - startX) > 4 || Math.abs(e.clientY - startY) > 4) {
                    moved = true;
                }
            });

            // pointerup 时如果移动了，阻止后续 click
            icon.addEventListener('pointerup', function(e) {
                if (moved) {
                    // 移动了，阻止 click 和 dblclick
                    e.stopPropagation();
                    // 加一个标记，阻止接下来的点击
                    icon._justDragged = true;
                    setTimeout(function() {
                        icon._justDragged = false;
                    }, 100);
                }
            });

            // 拦截 click（如果刚拖过）
            icon.addEventListener('click', function(e) {
                if (icon._justDragged) {
                    e.stopPropagation();
                    e.preventDefault();
                    icon._justDragged = false;
                }
            }, true);

            // dblclick 不受影响
        });
    }, 800);

    console.log('✅ 图标拖动与双击共存修复完成');
})();

//  一键修复 - 恢复所有桌面图标双击打开
//  直接附加，不用删除任何东西
// ═══════════════════════════════════════════════════════════════

(function() {
    if (window._final_icon_fix) return;
    window._final_icon_fix = true;

    setTimeout(function() {
        var desktop = document.getElementById('desktop');
        if (!desktop) return;

        var icons = desktop.querySelectorAll('.desktop-icon');

        icons.forEach(function(icon) {
            // 移除之前所有修复添加的 click 拦截
            var newIcon = icon.cloneNode(true);
            icon.parentNode.replaceChild(newIcon, icon);

            // 重新绑定原始双击
            var originalDblClick = newIcon.getAttribute('ondblclick');
            if (originalDblClick) {
                newIcon.setAttribute('ondblclick', originalDblClick);
            }

            // 重新绑定拖动（不干扰双击）
            var dragStartX = 0;
            var dragStartY = 0;
            var isDragging = false;

            newIcon.addEventListener('pointerdown', function(e) {
                if (e.detail > 1) return;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                isDragging = false;
            });

            newIcon.addEventListener('pointermove', function(e) {
                if (Math.abs(e.clientX - dragStartX) > 5 || Math.abs(e.clientY - dragStartY) > 5) {
                    isDragging = true;
                }
                if (isDragging) {
                    e.preventDefault();
                    var desktopRect = desktop.getBoundingClientRect();
                    var iconRect = newIcon.getBoundingClientRect();
                    var newLeft = e.clientX - desktopRect.left - dragStartX + (dragStartX - (iconRect.left - desktopRect.left));
                    var newTop = e.clientY - desktopRect.top - dragStartY + (dragStartY - (iconRect.top - desktopRect.top));

                    // 简化：直接计算
                    var offsetX = e.clientX - dragStartX;
                    var offsetY = e.clientY - dragStartY;

                    newIcon.style.left = (iconRect.left - desktopRect.left + offsetX) + 'px';
                    newIcon.style.top = (iconRect.top - desktopRect.top + offsetY) + 'px';

                    dragStartX = e.clientX;
                    dragStartY = e.clientY;
                }
            });

            // 不拦截 click，双击正常触发
        });

        showToast('✅ 图标双击已恢复');
    }, 1000);

    console.log('✅ 最终图标修复已加载');
})();

//  终极修复 - 快捷方式完整重写（覆盖所有旧代码）
//  双击打开 + 右键菜单 + 删除 + 拖动 全都能用
// ═══════════════════════════════════════════════════════════════

(function() {
    if (window._shortcut_final_v3) return;
    window._shortcut_final_v3 = true;

    // ═══ 覆盖旧 wizCreate ═══
    window.wizCreate = function() {
        var nameInput = document.getElementById('wiz-name-input');
        var name = nameInput ? nameInput.value.trim() : '';

        // 从全局状态读取
        var selectedItem = null;
        if (window.wizardState && window.wizardState.items && window.wizardState.selectedIndex >= 0) {
            selectedItem = window.wizardState.items[window.wizardState.selectedIndex];
        }

        if (!name && selectedItem) name = selectedItem.name;
        if (!name) {
            showToast('❌ 请输入名称');
            return;
        }

        var icon = (window.wizardState && window.wizardState.selectedIcon) || (selectedItem ? selectedItem.icon : '📄');
        var type = (window.wizardState && window.wizardState.type) || 'file';
        var target = selectedItem ? selectedItem.name : '';

        createShortcut(name, icon, type, target);
        closeWindow('shortcutwiz');
        showToast('✅ 快捷方式已创建: ' + name);
    };

    /**
     * 创建桌面快捷方式
     */
    function createShortcut(name, icon, type, target) {
        var desktop = document.getElementById('desktop');
        if (!desktop) return;

        var shortcut = document.createElement('div');
        shortcut.className = 'desktop-icon';
        shortcut.style.cssText = 'top:calc(50px * var(--ui-scale,1));left:calc(50px * var(--ui-scale,1));position:absolute;';
        shortcut.innerHTML = '<div class="icon-img">' + icon + '</div><div>' + escapeHtml(name) + '</div>';

        // ═══ 双击打开 ═══
        shortcut.ondblclick = function() {
            if (type === 'kd') {
                var apps = VirtualFS.getInstalledKDApps();
                var app = null;
                for (var i = 0; i < apps.length; i++) {
                    if (apps[i].name === target) {
                        app = apps[i];
                        break;
                    }
                }
                if (app) {
                    openKDApp(app.content, app.name);
                } else {
                    showToast('❌ 应用不存在: ' + target);
                }
            } else {
                openFileByType(target);
            }
        };

        // ═══ 右键菜单 ═══
        shortcut.oncontextmenu = function(e) {
            e.preventDefault();
            e.stopPropagation();
            hideAllContextMenus();

            var menu = document.createElement('div');
            menu.className = 'context-menu';
            menu.style.cssText = 'position:fixed;z-index:9999;display:block;min-width:180px;';
            menu.style.left = e.clientX + 'px';
            menu.style.top = e.clientY + 'px';

            menu.innerHTML = '' +
                '<div class="context-menu-item" style="cursor:pointer;" onclick="var el=this.closest(\'.context-menu\');el.remove();var sc=document.querySelector(\'.desktop-icon[data-shortcut=\\\'' + target + '\\\']\');if(sc&&sc.ondblclick)sc.ondblclick();"><span>📂</span> 打开</div>' +
                '<div class="context-menu-item" style="cursor:pointer;" onclick="var el=this.closest(\'.context-menu\');el.remove();var sc=document.querySelector(\'.desktop-icon[data-shortcut=\\\'' + target + '\\\']\');if(sc)sc.remove();"><span>🗑</span> 删除快捷方式</div>';

            document.body.appendChild(menu);

            setTimeout(function() {
                document.addEventListener('click', function removeMenu() {
                    if (menu.parentNode) menu.remove();
                    document.removeEventListener('click', removeMenu);
                });
            }, 50);
        };

        // 标记快捷方式
        shortcut.setAttribute('data-shortcut', target);

        desktop.appendChild(shortcut);

        // ═══ 绑定拖动 ═══
        bindDrag(shortcut);
    }

    /**
     * 绑定拖动（不干扰双击）
     */
    function bindDrag(el) {
        var startX = 0;
        var startY = 0;
        var origLeft = 0;
        var origTop = 0;
        var dragging = false;
        var moved = false;

        el.addEventListener('pointerdown', function(e) {
            if (e.detail > 1) return;
            var desktop = document.getElementById('desktop');
            var desktopRect = desktop.getBoundingClientRect();
            var elRect = el.getBoundingClientRect();

            startX = e.clientX;
            startY = e.clientY;
            origLeft = elRect.left - desktopRect.left;
            origTop = elRect.top - desktopRect.top;
            dragging = true;
            moved = false;

            el.style.right = 'auto';
            el.style.bottom = 'auto';
            el.style.left = origLeft + 'px';
            el.style.top = origTop + 'px';

            try { el.setPointerCapture(e.pointerId); } catch(err) {}
        });

        el.addEventListener('pointermove', function(e) {
            if (!dragging) return;
            var dx = e.clientX - startX;
            var dy = e.clientY - startY;

            if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
                moved = true;
            }

            if (moved) {
                e.preventDefault();
                var newLeft = origLeft + dx;
                var newTop = origTop + dy;

                var desktop = document.getElementById('desktop');
                var desktopRect = desktop.getBoundingClientRect();
                var maxLeft = desktopRect.width - el.offsetWidth - 8;
                var maxTop = desktopRect.height - el.offsetHeight - 8;

                if (newLeft < 4) newLeft = 4;
                if (newTop < 4) newTop = 4;
                if (newLeft > maxLeft) newLeft = maxLeft;
                if (newTop > maxTop) newTop = maxTop;

                el.style.left = newLeft + 'px';
                el.style.top = newTop + 'px';
            }
        });

        el.addEventListener('pointerup', function() {
            dragging = false;
            el.style.zIndex = '';
            el.style.opacity = '1';
        });

        // 不拦截 click，dblclick 正常触发
    }

    function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ═══ 修复已有快捷方式（给旧快捷方式重新绑定） ═══
    setTimeout(function() {
        var desktop = document.getElementById('desktop');
        if (!desktop) return;
        var shortcuts = desktop.querySelectorAll('.desktop-icon[data-shortcut]');
        shortcuts.forEach(function(sc) {
            // 清除旧事件
            var newSc = sc.cloneNode(true);

    // ═══ 9. 实际创建桌面快捷方式 ═══
    function scCreateShortcut(name, icon, type, target) {
        var desktop = document.getElementById('desktop');
        if (!desktop) return;

        var el = document.createElement('div');
        el.className = 'desktop-icon';
        el.style.cssText = 'top:calc(60px * var(--ui-scale,1));left:calc(60px * var(--ui-scale,1));position:absolute;cursor:pointer;';

            var t = el.getAttribute('data-sc-target');

                var apps = VirtualFS.getInstalledKDApps();

            delDiv.className = 'context-menu-item';
            delDiv.style.cursor = 'pointer';
            delDiv.innerHTML = '<span>🗑</span> 删除快捷方式';
            delDiv.onclick = function() {
                menu.remove();
                el.remove();
                showToast('🗑 快捷方式已删除');
            };

            menu.appendChild(openDiv);
            menu.appendChild(delDiv);
            document.body.appendChild(menu);

            setTimeout(function() {
                document.addEventListener('click', function rm() {
                    if (menu.parentNode) menu.remove();
                    document.removeEventListener('click', rm);
                });
            }, 50);
        };

        // ═══ 拖动 ═══
        scBindDrag(el);

        desktop.appendChild(el);
    }

    // ═══ 10. 拖动（不干扰双击） ═══
    function scBindDrag(el) {
        var startX = 0, startY = 0, origL = 0, origT = 0, drag = false, moved = false;

        el.addEventListener('pointerdown', function(e) {
            if (e.detail > 1) return;
            var d = document.getElementById('desktop');
            var dr = d.getBoundingClientRect();
            var er = el.getBoundingClientRect();
            startX = e.clientX;
            startY = e.clientY;
            origL = er.left - dr.left;
            origT = er.top - dr.top;
            drag = true;
            moved = false;
            el.style.right = 'auto';
            el.style.bottom = 'auto';
            el.style.left = origL + 'px';
            el.style.top = origT + 'px';
            try { el.setPointerCapture(e.pointerId); } catch(err) {}
        });

        el.addEventListener('pointermove', function(e) {
            if (!drag) return;
            var dx = e.clientX - startX;
            var dy = e.clientY - startY;
            if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
            if (moved) {
                e.preventDefault();
                var nl = origL + dx;
                var nt = origT + dy;
                var d = document.getElementById('desktop');
                var dr = d.getBoundingClientRect();
                var maxL = dr.width - el.offsetWidth - 4;
                var maxT = dr.height - el.offsetHeight - 4;
                if (nl < 4) nl = 4;
                if (nt < 4) nt = 4;
                if (nl > maxL) nl = maxL;
                if (nt > maxT) nt = maxT;
                el.style.left = nl + 'px';
                el.style.top = nt + 'px';
            }
        });

        el.addEventListener('pointerup', function() {
            drag = false;
        });

        // 关键：不拦截 click，dblclick 正常
    }

    function scEsc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ═══ 11. 覆盖桌面右键入口 ═══
    setTimeout(function() {
        var menu = document.getElementById('desktop-context-menu');
        if (menu) {
            var items = menu.querySelectorAll('.context-menu-item');
            for (var i = 0; i < items.length; i++) {
                if (items[i].textContent.indexOf('创建快捷方式') !== -1) {
                    items[i].onclick = function() {
                        hideAllContextMenus();
                        scOpenWizard();
                    };
                    break;
                }
            }
        }
    }, 300);

    console.log('✅ 快捷方式全新版已加载');
})();

// ═══════════════════════════════════════════════════════════════
//  IndexedDB 存储扩展
//  自动将大文件存入 IndexedDB，小文件留在 localStorage
//  突破 5MB 限制，容量提升 10 倍+
// ═══════════════════════════════════════════════════════════════

(function() {
    if (window._idb_storage) return;
    window._idb_storage = true;

    var DB_NAME = 'tkemu_storage';
    var DB_VERSION = 1;
    var STORE_NAME = 'files';
    var THRESHOLD = 50 * 1024; // 超过 50KB 的文件存 IndexedDB

    var db = null;
    var dbReady = false;
    var pendingOps = [];

    /**
     * 初始化 IndexedDB
     */
    function initDB() {
        return new Promise(function(resolve, reject) {
            var request = indexedDB.open(DB_NAME, DB_VERSION);

            request.onupgradeneeded = function(e) {
                var database = e.target.result;
                if (!database.objectStoreNames.contains(STORE_NAME)) {
                    database.createObjectStore(STORE_NAME);
                }
            };

            request.onsuccess = function(e) {
                db = e.target.result;
                dbReady = true;
                resolve();
            };

            request.onerror = function(e) {
                console.error('IndexedDB 初始化失败:', e.target.error);
                reject(e.target.error);
            };
        });
    }

    /**
     * 写入文件到 IndexedDB
     */
    function idbWrite(key, value) {
        return new Promise(function(resolve, reject) {
            if (!dbReady) {
                reject(new Error('数据库未就绪'));
                return;
            }
            var tx = db.transaction([STORE_NAME], 'readwrite');
            var store = tx.objectStore(STORE_NAME);
            store.put(value, key);
            tx.oncomplete = function() { resolve(); };
            tx.onerror = function(e) { reject(e.target.error); };
        });
    }

    /**
     * 从 IndexedDB 读取文件
     */
    function idbRead(key) {
        return new Promise(function(resolve, reject) {
            if (!dbReady) {
                reject(new Error('数据库未就绪'));
                return;
            }
            var tx = db.transaction([STORE_NAME], 'readonly');
            var store = tx.objectStore(STORE_NAME);
            var request = store.get(key);
            request.onsuccess = function() { resolve(request.result); };
            request.onerror = function(e) { reject(e.target.error); };
        });
    }

    /**
     * 从 IndexedDB 删除文件
     */
    function idbDelete(key) {
        return new Promise(function(resolve, reject) {
            if (!dbReady) {
                reject(new Error('数据库未就绪'));
                return;
            }
            var tx = db.transaction([STORE_NAME], 'readwrite');
            var store = tx.objectStore(STORE_NAME);
            store.delete(key);
            tx.oncomplete = function() { resolve(); };
            tx.onerror = function(e) { reject(e.target.error); };
        });
    }

    /**
     * 获取所有 IndexedDB 中的文件名
     */
    function idbGetAllKeys() {
        return new Promise(function(resolve, reject) {
            if (!dbReady) {
                reject(new Error('数据库未就绪'));
                return;
            }
            var tx = db.transaction([STORE_NAME], 'readonly');
            var store = tx.objectStore(STORE_NAME);
            var request = store.getAllKeys();
            request.onsuccess = function() { resolve(request.result || []); };
            request.onerror = function(e) { reject(e.target.error); };
        });
    }

    /**
     * 获取 IndexedDB 使用空间
     */
    function idbGetUsage() {
        if (navigator.storage && navigator.storage.estimate) {
            return navigator.storage.estimate().then(function(estimate) {
                return estimate.usage || 0;
            });
        }
        return Promise.resolve(0);
    }

    // ═══ 重写 VirtualFS.writeFile 支持 IndexedDB ═══
    var _origWriteFile = VirtualFS.writeFile;
    VirtualFS.writeFile = function(path, content) {
        var size = new Blob([content]).size;

        if (size > THRESHOLD && dbReady) {
            // 大文件 → IndexedDB
            var allFiles = {};
            try { allFiles = JSON.parse(localStorage.getItem(this._key) || '{}'); } catch(e) {}
            // 在 localStorage 中存一个标记
            allFiles[path] = '__IDB__:' + size;
            localStorage.setItem(this._key, JSON.stringify(allFiles));
            // 实际内容存 IndexedDB
            idbWrite('file_' + path, content).then(function() {
                console.log('[IDB] 已写入大文件: ' + path + ' (' + (size/1024).toFixed(1) + 'KB)');
            }).catch(function(err) {
                console.error('[IDB] 写入失败，回退到 localStorage:', err);
                _origWriteFile.call(VirtualFS, path, content);
            });
            // 取消隐藏
            var hiddenIndex = hiddenFiles.indexOf(path);
            if (hiddenIndex > -1) {
                hiddenFiles.splice(hiddenIndex, 1);
                localStorage.setItem(this._hiddenKey, JSON.stringify(hiddenFiles));
            }
            return;
        }

        // 小文件 → 原始 localStorage
        _origWriteFile.call(this, path, content);
    };

    // ═══ 重写 VirtualFS.readFile 支持 IndexedDB ═══
    var _origReadFile = VirtualFS.readFile;
    VirtualFS.readFile = function(path) {
        var allFiles = {};
        try { allFiles = JSON.parse(localStorage.getItem(this._key) || '{}'); } catch(e) {}

        var value = allFiles[path];
        if (value && typeof value === 'string' && value.indexOf('__IDB__:') === 0) {
            // 从 IndexedDB 读取
            if (!dbReady) return null;
            var result = null;
            idbRead('file_' + path).then(function(data) {
                result = data;
            }).catch(function(err) {
                console.error('[IDB] 读取失败:', err);
            });
            // 同步返回问题：IndexedDB 是异步的
            // 返回一个特殊标记，调用者需要处理
            return result;
        }
        return _origReadFile.call(this, path);
    };

    // ═══ 重写 VirtualFS.deleteFile 支持 IndexedDB ═══
    var _origDeleteFile = VirtualFS.deleteFile;
    VirtualFS.deleteFile = function(path) {
        var allFiles = {};
        try { allFiles = JSON.parse(localStorage.getItem(this._key) || '{}'); } catch(e) {}

        var value = allFiles[path];
        if (value && typeof value === 'string' && value.indexOf('__IDB__:') === 0) {
            idbDelete('file_' + path).then(function() {
                console.log('[IDB] 已删除大文件: ' + path);
            }).catch(function(err) {
                console.error('[IDB] 删除失败:', err);

        _origDeleteFile.call(this, path);
    };

    VirtualFS.listFiles = function() {

//  SRM - System Resource Manager 系统资源管理器
//  后台服务核心 + MMC 框架
//  完整展开版，不精简
// ═══════════════════════════════════════════════════════════════

(function() {
    if (window.SRM) return;

    var SRM = {
        // ═══ 基本信息 ═══
        name: 'SRM',
        fullName: 'System Resource Manager',
        version: '1.0.0',
        started: false,

        // ═══ 核心存储 ═══
        _functions: {},       // 函数注册表
        _variables: {},       // 变量注册表
        _processes: {},       // 进程表
        _messages: {},        // 消息队列
        _listeners: {},       // 消息监听器
        _services: {},        // 服务列表
        _registry: {},        // 注册表数据
        _log: [],             // 系统日志
        _storeKey: 'srm_data_v1',

        // ═══════════════════════════════════════════════════════════
        //  函数注册表
        // ═══════════════════════════════════════════════════════════

        /**
         * 注册函数到系统函数池
         * @param {string} name - 函数名（格式：模块.函数名）
         * @param {function} fn - 函数实现
         * @param {string} desc - 函数描述
         */
        registerFunction: function(name, fn, desc) {
            if (this._functions[name]) {
                console.warn('[SRM] 函数已存在，覆盖: ' + name);
            }
            this._functions[name] = {
                fn: fn,
                desc: desc || '',
                registeredAt: new Date().toISOString()
            };
            this._addLog('function', '注册函数: ' + name);
            return this;
        },

        /**
         * 注销函数
         */
        unregisterFunction: function(name) {
            delete this._functions[name];
            this._addLog('function', '注销函数: ' + name);
            return this;
        },

        /**
         * 调用系统函数
         * 支持两种格式：
         * SRM.call('模块.函数名', 参数1, 参数2, ...)
         * SRM.call('模块', '函数名', 参数1, 参数2, ...)
         */
        call: function() {
            var args = Array.prototype.slice.call(arguments);
            var funcName, callArgs;

            if (args.length >= 2 && typeof args[1] === 'string' && this._functions[args[0] + '.' + args[1]]) {
                funcName = args[0] + '.' + args[1];
                callArgs = args.slice(2);
            } else if (args.length >= 1 && this._functions[args[0]]) {
                funcName = args[0];
                callArgs = args.slice(1);
            } else {
                console.error('[SRM] 函数不存在: ' + args[0]);
                return null;
            }

            var func = this._functions[funcName];
            if (!func) {
                console.error('[SRM] 函数未注册: ' + funcName);
                return null;
            }

            this._addLog('call', '调用函数: ' + funcName);
            return func.fn.apply(null, callArgs);
        },

        /**
         * 获取函数信息
         */
        getFunctionInfo: function(name) {
            return this._functions[name] || null;
        },

        /**
         * 列出所有已注册函数
         */
        listFunctions: function() {
            var names = Object.keys(this._functions);
            return names.sort();
        },

        /**
         * 按模块列出函数
         */
        listFunctionsByModule: function(moduleName) {
            var result = [];
            var prefix = moduleName + '.';
            Object.keys(this._functions).forEach(function(name) {
                if (name.indexOf(prefix) === 0) {
                    result.push(name);
                }
            });
            return result.sort();
        },

        // ═══════════════════════════════════════════════════════════
        //  变量注册表
        // ═══════════════════════════════════════════════════════════

        /**
         * 注册变量
         */
        registerVariable: function(name, value, desc) {
            this._variables[name] = {
                value: value,
                desc: desc || '',
                registeredAt: new Date().toISOString()
            };
            return this;
        },

        /**
         * 获取变量
         */
        getVariable: function(name) {
            if (this._variables[name]) {
                return this._variables[name].value;
            }
            return undefined;
        },

        /**
         * 设置变量
         */
        setVariable: function(name, value) {
            if (this._variables[name]) {
                this._variables[name].value = value;
            } else {
                this.registerVariable(name, value);
            }
            return this;
        },

        /**
         * 列出所有变量
         */
        listVariables: function() {
            return Object.keys(this._variables).sort();
        },

        // ═══════════════════════════════════════════════════════════
        //  进程管理
        // ═══════════════════════════════════════════════════════════

        /**
         * 注册进程
         */
        registerProcess: function(name, type, info) {
            var pid = 'proc_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
            this._processes[pid] = {
                pid: pid,
                name: name,
                type: type || 'unknown',
                info: info || {},
                startTime: new Date().toISOString(),
                status: 'running'
            };
            this._addLog('process', '进程启动: ' + name + ' (' + type + ')');
            return pid;
        },

        /**
         * 结束进程
         */
        killProcess: function(pid) {
            if (this._processes[pid]) {
                this._processes[pid].status = 'killed';
                this._addLog('process', '进程结束: ' + this._processes[pid].name);
                delete this._processes[pid];
                return true;
            }
            return false;
        },

        /**
         * 获取进程信息
         */
        getProcess: function(pid) {
            return this._processes[pid] || null;
        },

        /**
         * 列出所有进程
         */
        listProcesses: function() {
            return this._processes;
        },

        /**
         * 按类型列出进程
         */
        listProcessesByType: function(type) {
            var result = {};
            Object.keys(this._processes).forEach(function(pid) {
                if (this._processes[pid].type === type) {
                    result[pid] = this._processes[pid];
                }
            }, this);
            return result;
        },

        // ═══════════════════════════════════════════════════════════
        //  跨程序通信
        // ═══════════════════════════════════════════════════════════

        /**
         * 发送消息给指定进程
         */
        sendMessage: function(toPid, data) {
            if (!this._messages[toPid]) {
                this._messages[toPid] = [];
            }
            this._messages[toPid].push({
                from: 'system',
                data: data,
                time: new Date().toISOString()
            });
            this._addLog('message', '发送消息到: ' + toPid);
            this._notifyListeners(toPid, data);
            return this;
        },

        /**
         * 广播消息给所有进程
         */
        broadcast: function(data) {
            Object.keys(this._processes).forEach(function(pid) {
                this.sendMessage(pid, data);
            }, this);
            return this;
        },

        /**
         * 监听消息
         */
        onMessage: function(pid, callback) {
            if (!this._listeners[pid]) {
                this._listeners[pid] = [];
            }
            this._listeners[pid].push(callback);
            return this;
        },

        /**
         * 内部：通知监听器
         */
        _notifyListeners: function(pid, data) {
            if (this._listeners[pid]) {
                this._listeners[pid].forEach(function(cb) {
                    try { cb(data); } catch(e) {
                        console.error('[SRM] 消息处理错误:', e);
                    }
                });
            }
        },

        /**
         * 获取指定进程的消息队列
         */
        getMessages: function(pid) {
            return this._messages[pid] || [];
        },

        /**
         * 清空指定进程的消息
         */
        clearMessages: function(pid) {
            this._messages[pid] = [];
            return this;
        },

        // ═══════════════════════════════════════════════════════════
        //  服务管理
        // ═══════════════════════════════════════════════════════════

        /**
         * 注册服务
         */
        registerService: function(name, service) {
            this._services[name] = {
                name: name,
                service: service,
                status: 'running',
                registeredAt: new Date().toISOString()
            };
            if (service.init) {
                try { service.init(); } catch(e) {
                    console.error('[SRM] 服务初始化失败: ' + name, e);
                }
            }
            this._addLog('service', '服务已注册: ' + name);
            return this;
        },

        /**
         * 停止服务
         */
        stopService: function(name) {
            if (this._services[name]) {
                this._services[name].status = 'stopped';
                this._addLog('service', '服务已停止: ' + name);
                return true;
            }
            return false;
        },

        /**
         * 启动服务
         */
        startService: function(name) {
            if (this._services[name]) {
                this._services[name].status = 'running';
                this._addLog('service', '服务已启动: ' + name);
                return true;
            }
            return false;
        },

        /**
         * 列出所有服务
         */
        listServices: function() {
            return this._services;
        },

        // ═══════════════════════════════════════════════════════════
        //  注册表
        // ═══════════════════════════════════════════════════════════

        /**
         * 设置注册表键值
         */
        regSet: function(path, value) {
            var keys = path.split('\\');
            var current = this._registry;
            for (var i = 0; i < keys.length - 1; i++) {
                if (!current[keys[i]]) current[keys[i]] = {};
                current = current[keys[i]];
            }
            current[keys[keys.length - 1]] = value;
            this._saveRegistry();
            this._addLog('registry', '设置注册表: ' + path);
            return this;
        },

        /**
         * 获取注册表键值
         */
        regGet: function(path) {
            var keys = path.split('\\');
            var current = this._registry;
            for (var i = 0; i < keys.length; i++) {
                if (current[keys[i]] === undefined) return undefined;
                current = current[keys[i]];
            }
            return current;
        },

        /**
         * 删除注册表键
         */
        regDelete: function(path) {
            var keys = path.split('\\');
            var current = this._registry;
            for (var i = 0; i < keys.length - 1; i++) {
                if (current[keys[i]] === undefined) return false;
                current = current[keys[i]];
            }
            delete current[keys[keys.length - 1]];
            this._saveRegistry();
            return true;
        },

        /**
         * 列出注册表某个路径下的子键
         */
        regList: function(path) {
            var node = path ? this.regGet(path) : this._registry;
            if (node && typeof node === 'object') {
                return Object.keys(node);
            }
            return [];
        },

        /**
         * 保存注册表到 localStorage
         */
        _saveRegistry: function() {
            try {
                localStorage.setItem(this._storeKey + '_registry', JSON.stringify(this._registry));
            } catch(e) {}
        },

        /**
         * 加载注册表
         */
        _loadRegistry: function() {
            try {
                var saved = localStorage.getItem(this._storeKey + '_registry');
                if (saved) this._registry = JSON.parse(saved);
            } catch(e) {}
        },

        // ═══════════════════════════════════════════════════════════
        //  系统日志
        // ═══════════════════════════════════════════════════════════

        /**
         * 添加日志
         */
        _addLog: function(type, message) {
            this._log.push({
                type: type,
                message: message,
                time: new Date().toISOString()
            });
            if (this._log.length > 500) {
                this._log = this._log.slice(this._log.length - 500);
            }
        },

        /**
         * 获取日志
         */
        getLog: function(type) {
            if (type) {
                return this._log.filter(function(entry) {
                    return entry.type === type;
                });
            }
            return this._log;
        },

        /**
         * 清空日志
         */
        clearLog: function() {
            this._log = [];
            return this;
        },

        // ═══════════════════════════════════════════════════════════
        //  系统信息
        // ═══════════════════════════════════════════════════════════

        getInfo: function() {
            return {
                name: this.fullName,
                version: this.version,
                started: this.started,
                functions: Object.keys(this._functions).length,
                variables: Object.keys(this._variables).length,
                processes: Object.keys(this._processes).length,
                services: Object.keys(this._services).length,
                logEntries: this._log.length,
                registryKeys: JSON.stringify(this._registry).length
            };
        },

        // ═══════════════════════════════════════════════════════════
        //  启动
        // ═══════════════════════════════════════════════════════════

        start: function() {
            if (this.started) return;
            this.started = true;
            this._loadRegistry();

            console.log('╔══════════════════════════════════════╗');
            console.log('║  ' + this.fullName + '              ║');
            console.log('║  版本: ' + this.version + '                        ║');
            console.log('║  后台服务已启动                      ║');
            console.log('╚══════════════════════════════════════╝');

            this._addLog('system', 'SRM 后台服务启动');
            this._registerBuiltinFunctions();
            return this;
        },

        // ═══════════════════════════════════════════════════════════
        //  注册内置函数（把旧系统函数接入 SRM）
        // ═══════════════════════════════════════════════════════════

        _registerBuiltinFunctions: function() {
            // 窗口函数
            this.registerFunction('window.create', function(id, title, icon, w, h, top, left, body) {
                return createWindow(id, title, icon, w, h, top, left, body);
            }, '创建窗口');
            this.registerFunction('window.close', function(id) {
                return closeWindow(id);
            }, '关闭窗口');
            this.registerFunction('window.focus', function(id) {
                return focusWindow(id);
            }, '聚焦窗口');
            this.registerFunction('window.minimize', function(id) {
                return minimizeWindow(id);
            }, '最小化窗口');
            this.registerFunction('window.restore', function(id) {
                return restoreWindow(id);
            }, '还原窗口');
            this.registerFunction('window.toggleMaximize', function(id) {
                return toggleMaximize(id);
            }, '最大化/还原');
            this.registerFunction('window.list', function() {
                return openWindows;
            }, '列出所有窗口');
            this.registerFunction('window.getActive', function() {
                return activeWindowId;
            }, '获取活动窗口');

            // 文件函数
            this.registerFunction('file.read', function(path) {
                return VirtualFS.readFile(path);
            }, '读取文件');
            this.registerFunction('file.write', function(path, content) {
                return VirtualFS.writeFile(path, content);
            }, '写入文件');
            this.registerFunction('file.delete', function(path) {
                return VirtualFS.deleteFile(path);
            }, '删除文件');
            this.registerFunction('file.list', function() {
                return VirtualFS.listFiles();
            }, '列出所有文件');
            this.registerFunction('file.hide', function(path) {
                return VirtualFS.hideFile(path);
            }, '隐藏文件');

            // UI 函数
            this.registerFunction('ui.toast', function(msg) {
                return showToast(msg);
            }, '显示通知');
            this.registerFunction('ui.shellPrint', function(text, className) {
                return shellPrint(text, className);
            }, 'Shell 输出');

            // 应用函数
            this.registerFunction('app.open', function(content, name) {
                return openKDApp(content, name);
            }, '打开 KD 应用');
            this.registerFunction('app.install', function(name, content) {
                return VirtualFS.installKDApp(name, content);
            }, '安装 KD 应用');
            this.registerFunction('app.uninstall', function(name) {
                return VirtualFS.uninstallKDApp(name);
            }, '卸载 KD 应用');
            this.registerFunction('app.list', function() {
                return VirtualFS.getInstalledKDApps();
            }, '列出已安装应用');

            // 系统函数
            this.registerFunction('system.restart', function() {
                return restartSystem();
            }, '重启系统');
            this.registerFunction('system.getVersion', function() {
                return APP_VERSION;
            }, '获取版本号');
            this.registerFunction('system.getInfo', function() {
                return this.getInfo();
            }.bind(this), '获取系统信息');
        }
    };

    // 暴露全局
    window.SRM = SRM;

    // 自动启动
    SRM.start();

    console.log('✅ SRM 后台服务核心已加载并启动');
})();
// ═══════════════════════════════════════════════════════════════
//  SRM 第二段：MMC 框架 + 任务管理器 + 系统信息
// ═══════════════════════════════════════════════════════════════

(function() {
    if (!window.SRM) return;
    if (window.SRM._mmcLoaded) return;
    window.SRM._mmcLoaded = true;

    // ═══════════════════════════════════════════════════════════════
    //  MMC 框架
    // ═══════════════════════════════════════════════════════════════

    SRM._mmcUnits = [];
    SRM._mmcActiveUnit = null;

    /**
     * 注册 MMC 管理单元
     * @param {object} unit - { id, name, icon, render }
     */
    SRM.registerMMCUnit = function(unit) {
        this._mmcUnits.push(unit);
        this._addLog('mmc', '注册管理单元: ' + unit.name);
        return this;
    };

    /**
     * 打开 MMC 控制台
     */
    SRM.openMMC = function() {
        if (openWindows['srm_mmc']) {
            focusWindow('srm_mmc');
            return;
        }

        var html = '' +
            '<div style="display:flex;height:100%;background:#f0f0f0;color:#1a1a1a;">' +
            '  <div style="width:200px;background:#e8e8e8;border-right:1px solid #ccc;overflow-y:auto;flex-shrink:0;padding:8px 0;">' +
            '    <div style="padding:8px 14px;font-weight:bold;font-size:13px;color:#0078D4;">📋 管理工具</div>';

        this._mmcUnits.forEach(function(unit) {
            html += '<div onclick="SRM._mmcSelectUnit(\'' + unit.id + '\')" id="mmc-unit-' + unit.id + '" style="padding:8px 14px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:8px;">' +
                '<span>' + unit.icon + '</span> ' + unit.name + '</div>';
        });

        html += '  </div>' +
            '  <div style="flex:1;overflow-y:auto;padding:16px;" id="mmc-content">' +
            '    <div style="color:#888;text-align:center;padding:40px;">请选择左侧管理工具</div>' +
            '  </div>' +
            '</div>';

        createWindow('srm_mmc', '系统控制台', '📋', 700, 500, 50, 60, html);
    };

    /**
     * 选择管理单元
     */
    SRM._mmcSelectUnit = function(unitId) {
        this._mmcActiveUnit = unitId;

        // 高亮选中项
        this._mmcUnits.forEach(function(unit) {
            var el = document.getElementById('mmc-unit-' + unit.id);
            if (el) {
                if (unit.id === unitId) {
                    el.style.background = '#0078D4';
                    el.style.color = '#fff';
                } else {
                    el.style.background = '';
                    el.style.color = '';
                }
            }
        });

        // 渲染内容
        var unit = null;
        for (var i = 0; i < this._mmcUnits.length; i++) {
            if (this._mmcUnits[i].id === unitId) {
                unit = this._mmcUnits[i];
                break;
            }
        }

        var content = document.getElementById('mmc-content');
        if (unit && unit.render && content) {
            unit.render(content);
        }
    };

    // ═══════════════════════════════════════════════════════════════
    //  管理单元：任务管理器
    // ═══════════════════════════════════════════════════════════════

    SRM.registerMMCUnit({
        id: 'taskmgr',
        name: '任务管理器',
        icon: '📊',
        render: function(content) {
            function renderTaskManager() {
                var processes = SRM.listProcesses();
                var pids = Object.keys(processes);

                var h = '<h3 style="color:#0078D4;margin-bottom:12px;">📊 任务管理器</h3>';

                if (pids.length === 0) {
                    h += '<div style="color:#888;padding:30px;text-align:center;">没有运行中的进程</div>';
                } else {
                    h += '<div style="background:#fff;border:1px solid #ddd;border-radius:6px;overflow:hidden;">';
                    h += '<table style="width:100%;border-collapse:collapse;font-size:12px;">';
                    h += '<tr style="background:#f0f7ff;">';
                    h += '<th style="padding:8px;text-align:left;border-bottom:1px solid #ddd;">PID</th>';
                    h += '<th style="padding:8px;text-align:left;border-bottom:1px solid #ddd;">名称</th>';
                    h += '<th style="padding:8px;text-align:left;border-bottom:1px solid #ddd;">类型</th>';
                    h += '<th style="padding:8px;text-align:left;border-bottom:1px solid #ddd;">状态</th>';
                    h += '<th style="padding:8px;text-align:left;border-bottom:1px solid #ddd;">操作</th>';
                    h += '</tr>';

                    pids.forEach(function(pid) {
                        var proc = processes[pid];
                        h += '<tr>';
                        h += '<td style="padding:6px 8px;border-bottom:1px solid #eee;font-family:monospace;font-size:10px;">' + pid + '</td>';
                        h += '<td style="padding:6px 8px;border-bottom:1px solid #eee;">' + proc.name + '</td>';
                        h += '<td style="padding:6px 8px;border-bottom:1px solid #eee;">' + proc.type + '</td>';
                        h += '<td style="padding:6px 8px;border-bottom:1px solid #eee;color:' + (proc.status === 'running' ? '#27ae60' : '#e74c3c') + ';">' + proc.status + '</td>';
                        h += '<td style="padding:6px 8px;border-bottom:1px solid #eee;"><button onclick="SRM.killProcess(\'' + pid + '\');SRM._mmcSelectUnit(\'taskmgr\');" style="background:#e74c3c;color:#fff;border:none;padding:3px 10px;border-radius:3px;cursor:pointer;font-size:10px;">结束</button></td>';
                        h += '</tr>';
                    });

                    h += '</table></div>';
                }

                h += '<button onclick="SRM._mmcSelectUnit(\'taskmgr\')" style="margin-top:10px;padding:6px 14px;background:#0078D4;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;">🔄 刷新</button>';
                content.innerHTML = h;
            }

            renderTaskManager();
        }
    });

    // ═══════════════════════════════════════════════════════════════
    //  管理单元：系统信息
    // ═══════════════════════════════════════════════════════════════

    SRM.registerMMCUnit({
        id: 'sysinfo',
        name: '系统信息',
        icon: 'ℹ️',
        render: function(content) {
            var info = SRM.getInfo();

            var h = '<h3 style="color:#0078D4;margin-bottom:12px;">ℹ️ 系统信息</h3>';
            h += '<div style="background:#fff;border:1px solid #ddd;border-radius:6px;padding:14px;">';
            h += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:12px;"><span>系统名称</span><span style="font-weight:bold;">' + info.name + '</span></div>';
            h += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:12px;"><span>版本</span><span style="font-weight:bold;">' + info.version + '</span></div>';
            h += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:12px;"><span>状态</span><span style="font-weight:bold;color:#27ae60;">' + (info.started ? '运行中' : '未启动') + '</span></div>';
            h += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:12px;"><span>已注册函数</span><span style="font-weight:bold;">' + info.functions + ' 个</span></div>';
            h += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:12px;"><span>已注册变量</span><span style="font-weight:bold;">' + info.variables + ' 个</span></div>';
            h += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:12px;"><span>运行中进程</span><span style="font-weight:bold;">' + info.processes + ' 个</span></div>';
            h += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:12px;"><span>已注册服务</span><span style="font-weight:bold;">' + info.services + ' 个</span></div>';
            h += '<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12px;"><span>日志条目</span><span style="font-weight:bold;">' + info.logEntries + ' 条</span></div>';
            h += '</div>';

            // 函数列表

            name: name,
            intervalMinutes: intervalMinutes,
            lastRun: null,
            enabled: true
        };

                task.lastRun = new Date().toISOString();

                        '<div style="display:flex;gap:6px;padding:10px;background:#1a1a1a;flex-shrink:0;">' +
                        '<button onclick="SRM._cameraTakePhoto()" style="padding:8px 16px;background:#0078D4;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px;">📸 拍照</button>' +
                        '<button onclick="SRM._cameraStop()" style="padding:8px 16px;background:#e74c3c;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px;">⏹ 停止</button>' +
                        '</div></div>';

                    createWindow('srm_camera', '摄像头', '📷', 480, 400, 80, 100, bodyHTML);

                    setTimeout(function() {
                        var container = document.getElementById('camera-preview-container');
                        if (container) {
                            container.appendChild(videoEl);
                        }
                    }, 100);

                    SRM._cameraStream = stream;
                    SRM._cameraVideo = videoEl;
                    resolve(stream);
                })
                .catch(function(err) {
                    SRM.setDeviceStatus('camera', 'error');
                    reject(err);
                });
        });
    };

    SRM._cameraTakePhoto = function() {
        if (!SRM._cameraVideo) return;
        var canvas = document.createElement('canvas');
        canvas.width = SRM._cameraVideo.videoWidth || 640;
        canvas.height = SRM._cameraVideo.videoHeight || 480;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(SRM._cameraVideo, 0, 0);
        var dataURL = canvas.toDataURL('image/png');
        var fileName = 'photo_' + Date.now() + '.png';
        // 保存到虚拟文件系统（存 base64 字符串）
        VirtualFS.writeFile(fileName, dataURL);
        showToast('📸 照片已保存: ' + fileName);
        SRM._addLog('device', '摄像头拍照: ' + fileName);
    };

    SRM._cameraStop = function() {
        if (SRM._cameraStream) {
            SRM._cameraStream.getTracks().forEach(function(track) {
                track.stop();
            });
            SRM._cameraStream = null;
            SRM._cameraVideo = null;
        }
        closeWindow('srm_camera');
        SRM.setDeviceStatus('camera', 'disconnected');
    };

    /**
     * 麦克风录音
     */
    SRM.micRecord = function(seconds) {
        return new Promise(function(resolve, reject) {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                reject(new Error('浏览器不支持麦克风'));
                return;
            }
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(function(stream) {
                    SRM.setDeviceStatus('mic', 'connected');
                    showToast('🎤 开始录音...');
                    var mediaRecorder = new MediaRecorder(stream);
                    var chunks = [];

                    mediaRecorder.ondataavailable = function(e) {
                        chunks.push(e.data);
                    };

                    mediaRecorder.onstop = function() {
                        var blob = new Blob(chunks, { type: 'audio/webm' });
                        var reader = new FileReader();
                        reader.onload = function(e) {
                            var fileName = 'recording_' + Date.now() + '.webm';
                            VirtualFS.writeFile(fileName, e.target.result);
                            stream.getTracks().forEach(function(track) { track.stop(); });
                            SRM.setDeviceStatus('mic', 'disconnected');
                            showToast('🎤 录音已保存: ' + fileName);
                            resolve(fileName);
                        };
                        reader.readAsDataURL(blob);
                    };

                    mediaRecorder.start();
                    setTimeout(function() {
                        mediaRecorder.stop();
                    }, (seconds || 5) * 1000);
                })
                .catch(function(err) {
                    SRM.setDeviceStatus('mic', 'error');
                    reject(err);
                });
        });
    };

    /**
     * U盘文件浏览和导入
     */
    SRM.usbBrowseFiles = function() {
        return new Promise(function(resolve, reject) {
            var input = document.createElement('input');
            input.type = 'file';
            input.multiple = true;
            input.onchange = function(e) {
                var files = e.target.files;
                if (!files || files.length === 0) {
                    resolve([]);
                    return;
                }
                var fileList = [];
                for (var i = 0; i < files.length; i++) {
                    fileList.push({
                        name: files[i].name,
                        size: files[i].size,
                        type: files[i].type,
                        file: files[i]
                    });
                }
                resolve(fileList);
            };
            input.click();
        });
    };

    SRM.usbImportFiles = function() {
        SRM.usbBrowseFiles().then(function(files) {
            if (!files || files.length === 0) return;

            showToast('📥 正在导入 ' + files.length + ' 个文件...');
            var imported = 0;

            files.forEach(function(item) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    VirtualFS.writeFile(item.name, e.target.result);
                    imported++;
                    if (imported === files.length) {
                        showToast('✅ 已导入 ' + imported + ' 个文件');
                        SRM._addLog('device', 'U盘导入 ' + imported + ' 个文件');
                    }
                };
                reader.readAsText(item.file);
            });
        });
    };

    /**
     * 打印文件
     */
    SRM.printFile = function(filePath) {
        var content = VirtualFS.readFile(filePath);
        if (!content) {
            showToast('❌ 文件不存在');
            return;
        }
        var printWindow = window.open('', '_blank');
        if (!printWindow) {
            showToast('❌ 浏览器阻止了弹窗');
            return;
        }
        printWindow.document.write('<pre>' + content.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</pre>');
        printWindow.document.close();
        printWindow.print();
        SRM._addLog('device', '打印文件: ' + filePath);
    };

    SRM.registerMMCUnit({
        id: 'devices',
        name: '设备管理器',
        icon: '🔌',
        render: function(content) {
            var h = '<h3 style="color:#0078D4;margin-bottom:12px;">🔌 设备管理器</h3>';
            h += '<p style="font-size:11px;color:#888;margin-bottom:10px;">查看和管理连接到系统的硬件设备</p>';

            h += '<div style="background:#fff;border:1px solid #ddd;border-radius:6px;overflow:hidden;">';
            SRM._devices.forEach(function(device) {
                var statusColors = {
                    'connected': '#27ae60',
                    'disconnected': '#e74c3c',
                    'available': '#27ae60',
                    'unknown': '#f39c12',
                    'error': '#e74c3c'
                };
                var statusNames = {
                    'connected': '已连接',
                    'disconnected': '已断开',
                    'available': '可用',
                    'unknown': '未检测',
                    'error': '错误'
                };
                var color = statusColors[device.status] || '#999';
                var statusName = statusNames[device.status] || device.status;

                h += '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f0f0f0;">';
                h += '<span style="font-size:24px;">' + device.icon + '</span>';
                h += '<div style="flex:1;">';
                h += '<div style="font-weight:bold;font-size:13px;">' + device.name + '</div>';
                h += '<div style="color:#888;font-size:10px;">' + device.desc + '</div>';
                h += '</div>';
                h += '<span style="color:' + color + ';font-size:10px;">' + statusName + '</span>';

                if (device.id === 'camera') {
                    h += '<button onclick="SRM.cameraCapture().catch(function(e){showToast(\'❌ \'+e.message);});" style="background:#0078D4;color:#fff;border:none;padding:4px 10px;border-radius:3px;cursor:pointer;font-size:10px;">打开</button>';
                }
                if (device.id === 'mic') {
                    h += '<button onclick="var s=parseInt(prompt(\'录音秒数:\',\'5\'));if(s>0){SRM.micRecord(s);}" style="background:#0078D4;color:#fff;border:none;padding:4px 10px;border-radius:3px;cursor:pointer;font-size:10px;">录音</button>';
                }
                if (device.id === 'usb') {
                    h += '<button onclick="SRM.usbImportFiles();" style="background:#27ae60;color:#fff;border:none;padding:4px 10px;border-radius:3px;cursor:pointer;font-size:10px;">导入文件</button>';
                }
                if (device.id === 'printer') {
                    h += '<button onclick="var f=prompt(\'要打印的文件名:\',\'\');if(f){SRM.printFile(f);}" style="background:#0078D4;color:#fff;border:none;padding:4px 10px;border-radius:3px;cursor:pointer;font-size:10px;">打印</button>';
                }
                if (device.id === 'speaker') {
                    h += '<button onclick="if(\'speechSynthesis\' in window){var u=new SpeechSynthesisUtterance(\'音频测试\');u.lang=\'zh-CN\';speechSynthesis.speak(u);}" style="background:#0078D4;color:#fff;border:none;padding:4px 10px;border-radius:3px;cursor:pointer;font-size:10px;">测试</button>';
                }

                h += '</div>';
            });
            h += '</div>';

            h += '<button onclick="SRM._mmcSelectUnit(\'devices\')" style="margin-top:10px;padding:6px 14px;background:#0078D4;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;">🔄 刷新</button>';
            content.innerHTML = h;
        }
    });

    console.log('✅ SRM 第六段已加载：可靠性监视器 + 任务计划 + 设备管理器');
})();

//  SRM 第七段：注册表编辑器
// ═══════════════════════════════════════════════════════════════

(function() {
    if (!window.SRM) return;
    if (window.SRM._regeditLoaded) return;
    window.SRM._regeditLoaded = true;

    // ═══════════════════════════════════════════════════════════════
    //  注册表编辑器
    // ═══════════════════════════════════════════════════════════════

    SRM._regeditPath = '';  // 当前浏览的路径

    /**
     * 打开注册表编辑器
     */
    SRM.openRegedit = function() {
        if (openWindows['srm_regedit']) {
            focusWindow('srm_regedit');
            return;
        }
        SRM._regeditPath = '';
        SRM._regeditRenderWindow();
    };

    /**
     * 渲染注册表编辑器窗口
     */
    SRM._regeditRenderWindow = function() {
        var html = '' +
            '<div style="display:flex;height:100%;background:#f0f0f0;color:#1a1a1a;">' +
            '  <div style="width:250px;background:#e8e8e8;border-right:1px solid #ccc;overflow-y:auto;flex-shrink:0;padding:8px 0;" id="regedit-tree">' +
            '  </div>' +
            '  <div style="flex:1;overflow-y:auto;padding:12px;" id="regedit-values">' +
            '  </div>' +
            '</div>';

        if (openWindows['srm_regedit']) {
            var body = openWindows['srm_regedit'].el.querySelector('.window-body');
            if (body) body.innerHTML = html;
        } else {
            createWindow('srm_regedit', '注册表编辑器', '📋', 650, 450, 70, 80, html);
        }

        setTimeout(function() {
            SRM._regeditRenderTree();
            SRM._regeditRenderValues();
        }, 100);
    };

    /**
     * 渲染注册表树形目录
     */
    SRM._regeditRenderTree = function() {
        var treeEl = document.getElementById('regedit-tree');
        if (!treeEl) return;

        var h = '<div style="padding:6px 12px;font-weight:bold;font-size:12px;color:#0078D4;">📋 注册表</div>';

        // 根节点
        h += '<div onclick="SRM._regeditNavigate(\'\')" style="padding:6px 12px;cursor:pointer;font-size:11px;' + (SRM._regeditPath === '' ? 'background:#0078D4;color:#fff;' : '') + '">📁 计算机</div>';

        // 递归渲染子节点
        function renderNode(node, path, depth) {
            var keys = Object.keys(node);
            keys.sort().forEach(function(key) {
                var fullPath = path ? path + '\\' + key : key;
                var isObject = node[key] !== null && typeof node[key] === 'object';
                var indent = depth * 14;
                var isActive = SRM._regeditPath === fullPath;

                h += '<div onclick="SRM._regeditNavigate(\'' + fullPath.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + '\')" style="padding:4px 12px;padding-left:' + (12 + indent) + 'px;cursor:pointer;font-size:11px;' + (isActive ? 'background:#0078D4;color:#fff;' : '') + '">';
                h += (isObject ? '📁 ' : '📄 ') + key;
                h += '</div>';

                if (isObject && (SRM._regeditPath.indexOf(fullPath) === 0 || SRM._regeditPath === fullPath)) {
                    renderNode(node[key], fullPath, depth + 1);
                }
            });
        }

        renderNode(SRM._registry, '', 0);
        treeEl.innerHTML = h;
    };

    /**
     * 渲染注册表键值
     */
    SRM._regeditRenderValues = function() {
        var valuesEl = document.getElementById('regedit-values');
        if (!valuesEl) return;

        var node = SRM._regeditPath ? SRM.regGet(SRM._regeditPath) : SRM._registry;
        var pathDisplay = SRM._regeditPath || '计算机';

        var h = '<div style="font-weight:bold;font-size:13px;margin-bottom:10px;color:#0078D4;">📁 ' + pathDisplay + '</div>';

        // 当前路径下的键值
        if (node && typeof node === 'object') {
            var keys = Object.keys(node);

            if (keys.length === 0) {
                h += '<div style="color:#888;font-size:11px;padding:20px;text-align:center;">此路径下没有键值</div>';
            } else {
                h += '<div style="background:#fff;border:1px solid #ddd;border-radius:6px;overflow:hidden;">';
                h += '<table style="width:100%;border-collapse:collapse;font-size:11px;">';
                h += '<tr style="background:#f0f7ff;">';
                h += '<th style="padding:8px;text-align:left;border-bottom:1px solid #ddd;">名称</th>';
                h += '<th style="padding:8px;text-align:left;border-bottom:1px solid #ddd;">类型</th>';
                h += '<th style="padding:8px;text-align:left;border-bottom:1px solid #ddd;">数据</th>';
                h += '<th style="padding:8px;text-align:left;border-bottom:1px solid #ddd;">操作</th>';
                h += '</tr>';

                keys.forEach(function(key) {
                    var value = node[key];
                    var isObject = value !== null && typeof value === 'object';
                    var type = isObject ? 'REG_KEY' : (typeof value === 'number' ? 'REG_DWORD' : 'REG_SZ');
                    var displayValue = isObject ? '(子键)' : String(value);

                    h += '<tr>';
                    h += '<td style="padding:6px 8px;border-bottom:1px solid #eee;font-weight:bold;">' + key + '</td>';
                    h += '<td style="padding:6px 8px;border-bottom:1px solid #eee;color:#888;">' + type + '</td>';
                    h += '<td style="padding:6px 8px;border-bottom:1px solid #eee;color:#333;">' + (displayValue.length > 40 ? displayValue.substring(0, 40) + '...' : displayValue) + '</td>';
                    h += '<td style="padding:6px 8px;border-bottom:1px solid #eee;">';
                    if (!isObject) {
                        h += '<button onclick="SRM._regeditEditValue(\'' + key + '\')" style="background:#0078D4;color:#fff;border:none;padding:3px 8px;border-radius:3px;cursor:pointer;font-size:9px;">修改</button> ';
                        h += '<button onclick="SRM._regeditDeleteValue(\'' + key + '\')" style="background:#e74c3c;color:#fff;border:none;padding:3px 8px;border-radius:3px;cursor:pointer;font-size:9px;">删除</button>';
                    }
                    h += '</td>';
                    h += '</tr>';
                });

                h += '</table></div>';
            }
        } else if (node !== undefined) {
            // 当前路径是一个值
            h += '<div style="background:#fff;border:1px solid #ddd;border-radius:6px;padding:14px;">';
            h += '<div style="font-size:12px;">值: <b>' + String(node) + '</b></div>';
            h += '</div>';
        }

        // 新建按钮
        h += '<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;">';
        h += '<button onclick="SRM._regeditNewValue()" style="padding:6px 14px;background:#27ae60;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;">➕ 新建字符串值</button>';
        h += '<button onclick="SRM._regeditNewKey()" style="padding:6px 14px;background:#0078D4;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;">📁 新建子键</button>';
        h += '<button onclick="SRM._regeditRenderWindow()" style="padding:6px 14px;background:#f39c12;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;">🔄 刷新</button>';
        h += '</div>';

        valuesEl.innerHTML = h;
    };

    /**
     * 导航到指定路径
     */
    SRM._regeditNavigate = function(path) {
        SRM._regeditPath = path;
        SRM._regeditRenderTree();
        SRM._regeditRenderValues();
    };

    /**
     * 修改值
     */
    SRM._regeditEditValue = function(key) {
        var currentPath = SRM._regeditPath;
        var currentValue = SRM.regGet(currentPath ? currentPath + '\\' + key : key);
        var newValue = prompt('修改值 ' + key + ':', String(currentValue));
        if (newValue !== null) {
            SRM.regSet(currentPath ? currentPath + '\\' + key : key, newValue);
            SRM._regeditRenderValues();
            SRM._addLog('registry', '修改注册表: ' + (currentPath ? currentPath + '\\' : '') + key);
        }
    };

    /**
     * 删除值
     */
    SRM._regeditDeleteValue = function(key) {
        var currentPath = SRM._regeditPath;
        if (confirm('删除值 ' + key + '？')) {
            SRM.regDelete(currentPath ? currentPath + '\\' + key : key);
            SRM._regeditRenderTree();
            SRM._regeditRenderValues();
            SRM._addLog('registry', '删除注册表值: ' + (currentPath ? currentPath + '\\' : '') + key);
        }
    };

    /**
     * 新建字符串值
     */
    SRM._regeditNewValue = function() {
        var name = prompt('值名称:', '新值');
        if (name && name.trim()) {
            var value = prompt('值数据:', '');
            if (value !== null) {
                SRM.regSet(SRM._regeditPath ? SRM._regeditPath + '\\' + name.trim() : name.trim(), value);
                SRM._regeditRenderTree();
                SRM._regeditRenderValues();
                SRM._addLog('registry', '新建注册表值: ' + name.trim());
            }
        }
    };

    /**
     * 新建子键
     */
    SRM._regeditNewKey = function() {
        var name = prompt('子键名称:', '新键');
        if (name && name.trim()) {
            SRM.regSet(SRM._regeditPath ? SRM._regeditPath + '\\' + name.trim() + '\\_placeholder' : name.trim() + '\\_placeholder', '');
            SRM._regeditRenderTree();
            SRM._regeditRenderValues();
            SRM._addLog('registry', '新建注册表子键: ' + name.trim());
        }
    };

    // 注册到 MMC
    SRM.registerMMCUnit({
        id: 'regedit',
        name: '注册表编辑器',
        icon: '📋',
        render: function(content) {
            content.innerHTML = '<div style="text-align:center;padding:40px;">' +
                '<div style="font-size:40px;margin-bottom:10px;">📋</div>' +
                '<div style="font-weight:bold;margin-bottom:10px;">注册表编辑器</div>' +
                '<button onclick="SRM.openRegedit()" style="padding:10px 24px;background:#0078D4;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;">打开注册表编辑器</button>' +
                '</div>';
        }
    });

    console.log('✅ SRM 第七段已加载：注册表编辑器');
})();
// ═══════════════════════════════════════════════════════════════
//  SRM 第八段：组策略编辑器 + 收尾
// ═══════════════════════════════════════════════════════════════

(function() {
    if (!window.SRM) return;
    if (window.SRM._gpeditLoaded) return;
    window.SRM._gpeditLoaded = true;

    // ═══════════════════════════════════════════════════════════════
    //  组策略数据
    // ═══════════════════════════════════════════════════════════════

    SRM._policies = {};

    // 加载组策略
    (function() {
        try {
            var saved = localStorage.getItem('srm_policies');
            if (saved) SRM._policies = JSON.parse(saved);
        } catch(e) { SRM._policies = {}; }
    })();

    // 默认策略
    if (Object.keys(SRM._policies).length === 0) {
        SRM._policies = {
            '系统': {
                '禁止锁屏': { enabled: false, desc: '禁止用户锁定屏幕' },
                '禁止切换用户': { enabled: false, desc: '禁止切换用户账户' },
                '禁止重置数据': { enabled: false, desc: '禁止清空所有数据' },
                '禁止重启系统': { enabled: false, desc: '禁止重启系统' }
            },
            '文件': {
                '禁止删除系统文件': { enabled: false, desc: '禁止删除系统关键文件' },
                '禁止安装KD应用': { enabled: false, desc: '禁止安装新的 KD 应用' },
                '禁止上传文件': { enabled: false, desc: '禁止从本地上传文件' }
            },
            '界面': {
                '隐藏任务栏': { enabled: false, desc: '隐藏底部任务栏' },
                '禁用右键菜单': { enabled: false, desc: '禁用所有右键菜单' },
                '隐藏开始菜单': { enabled: false, desc: '隐藏开始按钮' }
            },
            '安全': {
                '禁止运行sys脚本': { enabled: false, desc: '禁止执行系统级脚本' },
                '强制密码登录': { enabled: false, desc: '所有用户必须有密码' },
                '禁止导出备份': { enabled: false, desc: '禁止导出系统备份' }
            }
        };
        localStorage.setItem('srm_policies', JSON.stringify(SRM._policies));
    }

    SRM.savePolicies = function() {
        localStorage.setItem('srm_policies', JSON.stringify(SRM._policies));
    };

    SRM.isPolicyEnabled = function(category, policyName) {
        if (SRM._policies[category] && SRM._policies[category][policyName]) {
            return SRM._policies[category][policyName].enabled;
        }
        return false;
    };

    SRM.setPolicy = function(category, policyName, enabled) {
        if (SRM._policies[category] && SRM._policies[category][policyName]) {
            SRM._policies[category][policyName].enabled = enabled;
            SRM.savePolicies();
            SRM._addLog('policy', (enabled ? '启用' : '禁用') + '策略: ' + category + ' → ' + policyName);
            return true;
        }
        return false;
    };

    // ═══════════════════════════════════════════════════════════════
    //  管理单元：组策略编辑器
    // ═══════════════════════════════════════════════════════════════

    SRM.registerMMCUnit({
        id: 'gpedit',
        name: '组策略编辑器',
        icon: '🛡️',
        render: function(content) {
            var h = '<h3 style="color:#0078D4;margin-bottom:12px;">🛡️ 组策略编辑器</h3>';

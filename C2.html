  ═══════════════════════════════════════════════════════════
  C2 相比 C1 新增：
    - 图形模式（160×120，每像素 1 字节，16 色）
    - 图形 BIOS（INT 0x15，8 个功能）
    - 8×8 内置字库（96 个 ASCII 字符）
    - 鼠标控制器（端口 0x60-0x64，INT 0x04）

<script>
/* ═══════════════════════════════════════════════════════════════
   JS-H86 C2 · 核心代码
   ═══════════════════════════════════════════════════════════════ */

'use strict';

/* ─────────────────────────────────────────────────────────────
   模块 1：Memory Bus
   ───────────────────────────────────────────────────────────── */
const Memory = (() => {
    const SIZE = 65536;
    const data = new Uint8Array(SIZE);
    let readCount = 0, writeCount = 0;

    function readByte(addr) {
        if (addr < 0 || addr >= SIZE) throw new Error('内存越界读: 0x' + addr.toString(16));
        readCount++;
        return data[addr];
    }
    function writeByte(addr, value) {
        if (addr < 0 || addr >= SIZE) throw new Error('内存越界写: 0x' + addr.toString(16));
        writeCount++;
        data[addr] = value & 0xFF;
    }
    function readWord(addr) {
        return (readByte((addr + 1) & 0xFFFF) << 8) | readByte(addr & 0xFFFF);
    }
    function writeWord(addr, value) {
        writeByte(addr & 0xFFFF, value & 0xFF);
        writeByte((addr + 1) & 0xFFFF, (value >> 8) & 0xFF);
    }
    function readBlock(addr, length) { return data.slice(addr, addr + length); }
    function writeBlock(addr, bytes) {
        for (let i = 0; i < bytes.length; i++) writeByte(addr + i, bytes[i]);
    }
    function clear() { data.fill(0); readCount = 0; writeCount = 0; }
    function getStats() {
        return { size: SIZE, readCount, writeCount, nonZeroBytes: data.filter(b => b !== 0).length };
    }

    return { SIZE, readByte, writeByte, readWord, writeWord, readBlock, writeBlock, clear, getStats };
})();


/* ─────────────────────────────────────────────────────────────
   模块 2：Font 8×8 字库
   内置 ASCII 0x20-0x7F（96 字符 × 8 字节 = 768 字节）
   每个字符 8×8 位图，每行 8 bit，bit7 在最左
   ───────────────────────────────────────────────────────────── */

        // 0x25 %
        0xC6,0xC6,0x0C,0x18,0x30,0x66,0xC6,0x00,
        // 0x26 &
        0x38,0x6C,0x38,0x76,0xDC,0xCC,0x76,0x00,
        // 0x27 '
        0x18,0x18,0x30,0x00,0x00,0x00,0x00,0x00,
        // 0x28 (
        0x0C,0x18,0x30,0x30,0x30,0x18,0x0C,0x00,
        // 0x29 )
        0x30,0x18,0x0C,0x0C,0x0C,0x18,0x30,0x00,
        // 0x2A *
        0x00,0x66,0x3C,0xFF,0x3C,0x66,0x00,0x00,
        // 0x2B +
        0x00,0x18,0x18,0x7E,0x18,0x18,0x00,0x00,
        // 0x2C ,
        0x00,0x00,0x00,0x00,0x00,0x18,0x18,0x30,
        // 0x2D -

        // 0x2E .

        // 0x55 U
        0x66,0x66,0x66,0x66,0x66,0x66,0x3C,0x00,
        // 0x56 V
        0x66,0x66,0x66,0x66,0x66,0x3C,0x18,0x00,
        // 0x57 W
        0xC6,0xC6,0xC6,0xD6,0xFE,0xEE,0xC6,0x00,
        // 0x58 X
        0x66,0x66,0x3C,0x18,0x3C,0x66,0x66,0x00,
        // 0x59 Y
        0x66,0x66,0x66,0x3C,0x18,0x18,0x18,0x00,

        // 0x5F _
        0x00,0x00,0x00,0x00,0x00,0x00,0x00,0xFF,
        // 0x60 `
        0x30,0x18,0x0C,0x00,0x00,0x00,0x00,0x00,

        // 0x6B k
        0x60,0x60,0x66,0x6C,0x78,0x6C,0x66,0x00,

        0x38,0x18,0x18,0x18,0x18,0x18,0x3C,0x00,

        // 0x6F o
        0x00,0x00,0x3C,0x66,0x66,0x66,0x3C,0x00,
        // 0x70 p
        0x00,0x00,0x7C,0x66,0x66,0x7C,0x60,0x60,
        // 0x71 q
        0x00,0x00,0x3E,0x66,0x66,0x3E,0x06,0x06,
        // 0x72 r
        0x00,0x00,0x7C,0x66,0x60,0x60,0x60,0x00,
        // 0x73 s
        0x00,0x00,0x3E,0x60,0x3C,0x06,0x7C,0x00,
        // 0x74 t
        0x30,0x30,0x7C,0x30,0x30,0x36,0x1C,0x00,

        0x00,0x00,0x66,0x66,0x66,0x66,0x3E,0x00,

        0x00,0x00,0x66,0x66,0x66,0x3C,0x18,0x00,
        // 0x77 w
        0x00,0x00,0xC6,0xC6,0xD6,0xFE,0x6C,0x00,
        // 0x78 x
        0x00,0x00,0x66,0x3C,0x18,0x3C,0x66,0x00,
        // 0x79 y
        0x00,0x00,0x66,0x66,0x66,0x3E,0x06,0x3C,
        // 0x7A z
        0x00,0x00,0x7E,0x0C,0x18,0x30,0x7E,0x00,
        // 0x7B {
        0x0E,0x18,0x18,0x70,0x18,0x18,0x0E,0x00,
        // 0x7C |
        0x18,0x18,0x18,0x18,0x18,0x18,0x18,0x00,
        // 0x7D }
        0x70,0x18,0x18,0x0E,0x18,0x18,0x70,0x00,
        // 0x7E ~
        0x76,0xDC,0x00,0x00,0x00,0x00,0x00,0x00,
        // 0x7F DEL
        0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00
    ]);

    /**
     * 获取字符的 8 字节位图
     * @param {number} code - ASCII 码
     * @returns {Uint8Array} 8 字节
     */
    function getGlyph(code) {
        const idx = (code - 0x20) & 0xFF;
        if (idx < 0 || idx >= 96) {
            return FONT_8X8.slice(0, 8);  // 空格
        }
        return FONT_8X8.slice(idx * 8, idx * 8 + 8);
    }

    function getByte(code, row) {
        const idx = (code - 0x20) & 0xFF;
        if (idx < 0 || idx >= 96 || row < 0 || row >= 8) return 0;
        return FONT_8X8[idx * 8 + row];
    }

    return { getGlyph, getByte, FONT_8X8 };
})();


/* ─────────────────────────────────────────────────────────────
   模块 3：Display Controller
   支持两种模式：文本模式（80×25）、图形模式（160×120）
   ───────────────────────────────────────────────────────────── */
const Display = (() => {
    // 文本模式
    const TEXT_COLS = 80;
    const TEXT_ROWS = 25;
    const TEXT_VRAM_BASE = 0x8000;
    const TEXT_VRAM_SIZE = TEXT_COLS * TEXT_ROWS * 2;  // 4000 字节
    const CHAR_W = 8;
    const CHAR_H = 8;  // 8×8 字库

    // 图形模式
    const GFX_W = 160;
    const GFX_H = 120;
    const GFX_VRAM_BASE = 0x8000;
    const GFX_VRAM_SIZE = GFX_W * GFX_H;  // 19200 字节

    // 模式
    const MODE_TEXT = 0;
    const MODE_GFX = 1;
    let mode = MODE_TEXT;

    // 光标（文本模式）
    let cursorX = 0;
    let cursorY = 0;

    // 调色板（16 色 EGA）
    const PALETTE = [
        '#000000', '#0000AA', '#00AA00', '#00AAAA',
        '#AA0000', '#AA00AA', '#AA5500', '#AAAAAA',
        '#555555', '#5555FF', '#55FF55', '#55FFFF',
        '#FF5555', '#FF55FF', '#FFFF55', '#FFFFFF'
    ];

    // Canvas
    let canvas = null;
    let ctx = null;

    function initCanvas(canvasEl) {
        canvas = canvasEl;
        ctx = canvas.getContext('2d');
        updateCanvasSize();
        render();
    }

    function updateCanvasSize() {
        if (!canvas) return;
        if (mode === MODE_TEXT) {
            canvas.width = TEXT_COLS * CHAR_W;
            canvas.height = TEXT_ROWS * CHAR_H;
        } else {
            canvas.width = GFX_W;
            canvas.height = GFX_H;
        }
    }

    function getMode() { return mode; }

    function setMode(newMode) {
        mode = newMode & 0x01;
        updateCanvasSize();
        if (mode === MODE_TEXT) {
            // 切回文本模式时清屏
            clearText();
        } else {
            clearGfx(0);
        }
        render();
    }

    function getModeName() {
        return mode === MODE_TEXT ? 'TEXT' : 'GFX';
    }

    // ─── 文本模式 ───
    function clearText(attr) {
        for (let y = 0; y < TEXT_ROWS; y++)
            for (let x = 0; x < TEXT_COLS; x++)
                putTextChar(x, y, ' ', attr !== undefined ? attr : 0x07);
        cursorX = 0;
        cursorY = 0;
        render();
    }

    function putTextChar(x, y, char, attr) {
        if (x < 0 || x >= TEXT_COLS || y < 0 || y >= TEXT_ROWS) return;
        const offset = TEXT_VRAM_BASE + (y * TEXT_COLS + x) * 2;
        Memory.writeByte(offset, char.charCodeAt(0) & 0xFF);
        Memory.writeByte(offset + 1, (attr !== undefined ? attr : 0x07) & 0xFF);
    }

    function getTextChar(x, y) {
        if (x < 0 || x >= TEXT_COLS || y < 0 || y >= TEXT_ROWS) return null;
        const offset = TEXT_VRAM_BASE + (y * TEXT_COLS + x) * 2;
        const code = Memory.readByte(offset);
        const attr = Memory.readByte(offset + 1);
        return { char: String.fromCharCode(code), attr };
    }

    function setCursor(x, y) {
        if (mode === MODE_TEXT) {
            cursorX = Math.max(0, Math.min(TEXT_COLS - 1, x));
            cursorY = Math.max(0, Math.min(TEXT_ROWS - 1, y));
        }
        render();
    }

    function getCursor() { return { x: cursorX, y: cursorY }; }

    function putCharAtCursor(ch) {
        if (mode !== MODE_TEXT) return;
        if (ch === '\n') { cursorX = 0; cursorY++; if (cursorY >= TEXT_ROWS) { scrollTextUp(); cursorY = TEXT_ROWS - 1; } render(); return; }
        if (ch === '\r') { cursorX = 0; render(); return; }
        if (ch === '\b') { if (cursorX > 0) cursorX--; else if (cursorY > 0) { cursorY--; cursorX = TEXT_COLS - 1; } putTextChar(cursorX, cursorY, ' ', 0x07); render(); return; }

        putTextChar(cursorX, cursorY, ch, 0x07);
        cursorX++;
        if (cursorX >= TEXT_COLS) {
            cursorX = 0;
            cursorY++;
            if (cursorY >= TEXT_ROWS) { scrollTextUp(); cursorY = TEXT_ROWS - 1; }
        }
        render();
    }

    function scrollTextUp() {
        for (let y = 0; y < TEXT_ROWS - 1; y++) {
            for (let x = 0; x < TEXT_COLS; x++) {
                const srcOff = TEXT_VRAM_BASE + ((y + 1) * TEXT_COLS + x) * 2;
                const dstOff = TEXT_VRAM_BASE + (y * TEXT_COLS + x) * 2;
                Memory.writeByte(dstOff, Memory.readByte(srcOff));
                Memory.writeByte(dstOff + 1, Memory.readByte(srcOff + 1));
            }
        }
        for (let x = 0; x < TEXT_COLS; x++) putTextChar(x, TEXT_ROWS - 1, ' ', 0x07);
    }

    function clearGfx(color) {
        const c = (color !== undefined ? color : 0) & 0x0F;
        for (let i = 0; i < GFX_VRAM_SIZE; i++) {
            Memory.writeByte(GFX_VRAM_BASE + i, c);
        }
        // 不 render，等 GShell 主循环统一刷新
    }

    function putPixel(x, y, color) {
        if (x < 0 || x >= GFX_W || y < 0 || y >= GFX_H) return;
        const offset = GFX_VRAM_BASE + y * GFX_W + x;
        Memory.writeByte(offset, color & 0x0F);
    }

    function getPixel(x, y) {
        if (x < 0 || x >= GFX_W || y < 0 || y >= GFX_H) return 0;
        const offset = GFX_VRAM_BASE + y * GFX_W + x;
        return Memory.readByte(offset) & 0x0F;
    }

    function drawHLine(x1, x2, y, color) {
        if (x1 > x2) { const t = x1; x1 = x2; x2 = t; }
        if (y < 0 || y >= GFX_H) return;
        if (x1 < 0) x1 = 0;
        if (x2 >= GFX_W) x2 = GFX_W - 1;
        for (let x = x1; x <= x2; x++) putPixel(x, y, color);
    }

    function drawVLine(x, y1, y2, color) {
        if (y1 > y2) { const t = y1; y1 = y2; y2 = t; }
        if (x < 0 || x >= GFX_W) return;
        if (y1 < 0) y1 = 0;
        if (y2 >= GFX_H) y2 = GFX_H - 1;
        for (let y = y1; y <= y2; y++) putPixel(x, y, color);
    }

    function fillRect(x, y, w, h, color) {
        for (let dy = 0; dy < h; dy++) {
            for (let dx = 0; dx < w; dx++) {
                putPixel(x + dx, y + dy, color);
            }
        }
    }

    function drawCharGfx(x, y, code, color) {
        if (code < 0x20 || code > 0x7F) code = 0x20;
        for (let row = 0; row < 8; row++) {
            const byte = Font.getByte(code, row);
            for (let col = 0; col < 8; col++) {
                if (byte & (0x80 >> col)) {
                    putPixel(x + col, y + row, color);
                }
            }
        }
    }

    function drawStringGfx(x, y, strAddr, color) {
        let cx = x;
        let addr = strAddr;
        while (true) {
            const code = Memory.readByte(addr);
            if (code === 0) break;
            drawCharGfx(cx, y, code, color);
            cx += 8;
            addr++;
            if (cx + 8 > GFX_W) break;
        }
    }

    // ─── 渲染 ───
    function render() {
        if (!ctx) return;

        if (mode === MODE_TEXT) {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = CHAR_H + 'px monospace';
            ctx.textBaseline = 'top';

            for (let y = 0; y < TEXT_ROWS; y++) {
                for (let x = 0; x < TEXT_COLS; x++) {
                    const offset = TEXT_VRAM_BASE + (y * TEXT_COLS + x) * 2;
                    const code = Memory.readByte(offset);
                    const attr = Memory.readByte(offset + 1);
                    if (code === 0 || code === 32) continue;

                    const fg = attr & 0x0F;
                    const bg = (attr >> 4) & 0x0F;
                    if (bg !== 0) {
                        ctx.fillStyle = PALETTE[bg];
                        ctx.fillRect(x * CHAR_W, y * CHAR_H, CHAR_W, CHAR_H);
                    }
                    ctx.fillStyle = PALETTE[fg];
                    ctx.fillText(String.fromCharCode(code), x * CHAR_W, y * CHAR_H);
                }
            }

            // 光标
            if (cursorX >= 0 && cursorX < TEXT_COLS && cursorY >= 0 && cursorY < TEXT_ROWS) {
                ctx.fillStyle = 'rgba(78, 201, 176, 0.7)';
                ctx.fillRect(cursorX * CHAR_W, cursorY * CHAR_H + CHAR_H - 2, CHAR_W, 2);
            }
        } else {
            // 图形模式：把每个像素作为一个 1×1 的矩形（用 ImageData 更快）
            const imgData = ctx.createImageData(GFX_W, GFX_H);
            for (let i = 0; i < GFX_VRAM_SIZE; i++) {
                const colorIdx = Memory.readByte(GFX_VRAM_BASE + i) & 0x0F;
                const hex = PALETTE[colorIdx];
                const r = parseInt(hex.substring(1, 3), 16);
                const g = parseInt(hex.substring(3, 5), 16);
                const b = parseInt(hex.substring(5, 7), 16);
                const dst = i * 4;
                imgData.data[dst] = r;
                imgData.data[dst + 1] = g;
                imgData.data[dst + 2] = b;
                imgData.data[dst + 3] = 255;
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // 更新光标状态
        const cursorInfo = document.getElementById('c1-display-cursor');
        if (cursorInfo) {
            if (mode === MODE_TEXT) cursorInfo.textContent = '光标: (' + cursorX + ', ' + cursorY + ')';
            else cursorInfo.textContent = '图形 ' + GFX_W + '×' + GFX_H;
        }
    }

    function getInfo() {
        return {
            mode,
            textCols: TEXT_COLS, textRows: TEXT_ROWS,
            gfxW: GFX_W, gfxH: GFX_H,
            vramBase: TEXT_VRAM_BASE,
            cursorX, cursorY
        };
    }

    function getTextScreen() {
        let result = '';
        for (let y = 0; y < TEXT_ROWS; y++) {
            let line = '';
            for (let x = 0; x < TEXT_COLS; x++) line += getTextChar(x, y).char;
            result += line.replace(/\s+$/, '') + '\n';
        }
        return result.replace(/\n+$/, '');
    }

    return {
        MODE_TEXT, MODE_GFX,
        TEXT_COLS, TEXT_ROWS, TEXT_VRAM_BASE,
        GFX_W, GFX_H, GFX_VRAM_BASE, GFX_VRAM_SIZE,
        PALETTE, Font,
        initCanvas, render,
        getMode, setMode, getModeName,
        clearText, clearGfx, clear: clearText,
        putTextChar, getTextChar, putCharAtCursor,
        setCursor, getCursor,
        putPixel, getPixel,
        drawHLine, drawVLine, fillRect,
        drawCharGfx, drawStringGfx,
        getInfo, getTextScreen
    };
})();


/* ─────────────────────────────────────────────────────────────
   模块 4：Keyboard Controller
   ───────────────────────────────────────────────────────────── */
const Keyboard = (() => {
    const buffer = [];
    const MAX_BUFFER = 256;
    let irqEnabled = false;
    let pendingIRQ = false;

    function pushKey(key) {
        if (buffer.length >= MAX_BUFFER) buffer.shift();
        buffer.push(key);
        if (irqEnabled) pendingIRQ = true;
    }
    function popKey() { return buffer.length > 0 ? buffer.shift() : null; }
    function peekKey() { return buffer.length > 0 ? buffer[0] : null; }
    function hasKey() { return buffer.length > 0; }
    function clear() { buffer.length = 0; pendingIRQ = false; }
    function setIRQEnabled(enabled) {
        irqEnabled = !!enabled;
        if (!irqEnabled) pendingIRQ = false;
    }
    function hasPendingIRQ() { return pendingIRQ; }
    function clearPendingIRQ() { pendingIRQ = false; }

    return {
        pushKey, popKey, peekKey, hasKey, clear,
        setIRQEnabled, hasPendingIRQ, clearPendingIRQ
    };
})();


/* ─────────────────────────────────────────────────────────────
   模块 5：Mouse Controller
   端口 0x60-0x64
   中断 INT 0x04
   ───────────────────────────────────────────────────────────── */
const Mouse = (() => {
    let x = 80;   // 初始居中
    let y = 60;
    let buttons = 0;  // bit0=左, bit1=右
    let pendingEvent = false;
    let irqEnabled = false;
    let pendingIRQ = false;

    function setPosition(newX, newY) {
        x = Math.max(0, Math.min(Display.GFX_W - 1, newX));
        y = Math.max(0, Math.min(Display.GFX_H - 1, newY));
        pendingEvent = true;
        if (irqEnabled) pendingIRQ = true;
    }

    function setButtons(newButtons) {
        buttons = newButtons & 0x03;
        pendingEvent = true;
        if (irqEnabled) pendingIRQ = true;
    }

    function getX() { return x; }
    function getY() { return y; }
    function getButtons() { return buttons; }
    function hasEvent() { return pendingEvent; }
    function clearEvent() { pendingEvent = false; }

    function setIRQEnabled(enabled) {
        irqEnabled = !!enabled;
        if (!irqEnabled) pendingIRQ = false;
    }
    function hasPendingIRQ() { return pendingIRQ; }
    function clearPendingIRQ() { pendingIRQ = false; }

    function reset() {
        x = 80; y = 60; buttons = 0;
        pendingEvent = false;
        pendingIRQ = false;
    }

    return {
        setPosition, setButtons,
        getX, getY, getButtons,
        hasEvent, clearEvent,
        setIRQEnabled, hasPendingIRQ, clearPendingIRQ,
        reset
    };
})();


/* ─────────────────────────────────────────────────────────────
   模块 6：Disk Controller
   ───────────────────────────────────────────────────────────── */
const Disk = (() => {
    const SECTOR_SIZE = 512;
    const SECTOR_COUNT = 2048;
    const DISK_SIZE = SECTOR_SIZE * SECTOR_COUNT;

    const image = new Uint8Array(DISK_SIZE);
    let status = 'IDLE';
    let sectorReg = 0;
    let addrReg = 0;

    function readSector(sector, memAddr) {
        if (sector < 0 || sector >= SECTOR_COUNT) throw new Error('非法扇区号: ' + sector);
        status = 'BUSY';
        const offset = sector * SECTOR_SIZE;
        for (let i = 0; i < SECTOR_SIZE; i++) Memory.writeByte(memAddr + i, image[offset + i]);
        status = 'DONE';
    }
    function writeSector(sector, memAddr) {
        if (sector < 0 || sector >= SECTOR_COUNT) throw new Error('非法扇区号: ' + sector);
        status = 'BUSY';
        const offset = sector * SECTOR_SIZE;
        for (let i = 0; i < SECTOR_SIZE; i++) image[offset + i] = Memory.readByte(memAddr + i);
        status = 'DONE';
    }
    function setSectorReg(value) { sectorReg = value & 0xFFFF; }
    function setAddrReg(value) { addrReg = value & 0xFFFF; }
    function getSectorReg() { return sectorReg; }
    function getAddrReg() { return addrReg; }
    function executeCmd(cmd) {
        try {
            if (cmd === 0) readSector(sectorReg, addrReg);
            else if (cmd === 1) writeSector(sectorReg, addrReg);
        } catch (e) { status = 'ERROR'; }
    }
    function getStatus() {
        return status === 'IDLE' ? 0 : (status === 'BUSY' ? 1 : (status === 'DONE' ? 2 : 3));
    }
    function getInfo() {
        return {
            sectorSize: SECTOR_SIZE, sectorCount: SECTOR_COUNT,
            diskSize: DISK_SIZE, status,
            nonZeroBytes: image.filter(b => b !== 0).length
        };
    }
    function clear() { image.fill(0); status = 'IDLE'; }
    function getImage() { return image; }

    return {
        SECTOR_SIZE, SECTOR_COUNT, DISK_SIZE,
        readSector, writeSector,
        setSectorReg, setAddrReg, getSectorReg, getAddrReg,
        executeCmd, getStatus,
        getInfo, clear, getImage
    };
})();


/* ─────────────────────────────────────────────────────────────
   模块 7：Timer
   ───────────────────────────────────────────────────────────── */
const Timer = (() => {
    let counter = 0;
    let irqInterval = 0;
    let irqEnabled = false;
    let pendingIRQ = false;

    function tick() {
        counter = (counter + 1) & 0xFFFF;
        if (irqEnabled && irqInterval > 0 && counter % irqInterval === 0) {
            pendingIRQ = true;
        }
    }
    function getLow() { return counter & 0xFF; }
    function getHigh() { return (counter >> 8) & 0xFF; }
    function getValue() { return counter; }
    function reset() { counter = 0; pendingIRQ = false; }
    function setIRQInterval(n) { irqInterval = n & 0xFFFF; }
    function setIRQEnabled(enabled) {
        irqEnabled = !!enabled;
        if (!irqEnabled) pendingIRQ = false;
    }
    function hasPendingIRQ() { return pendingIRQ; }
    function clearPendingIRQ() { pendingIRQ = false; }

    return {
        tick, getLow, getHigh, getValue, reset,
        setIRQInterval, setIRQEnabled, hasPendingIRQ, clearPendingIRQ
    };
})();


/* ─────────────────────────────────────────────────────────────
   模块 8：I/O Bus
   ───────────────────────────────────────────────────────────── */
const IOBus = (() => {
    const PORT = {
        KBD_DATA:       0x00,
        KBD_STATUS:     0x01,
        DISP_CHAR:      0x10,
        DISP_CTRL:      0x11,
        DISP_CURSOR_X:  0x12,
        DISP_CURSOR_Y:  0x13,
        DISP_MODE:      0x14,
        DISK_SECTOR_L:  0x20,
        DISK_SECTOR_H:  0x21,
        DISK_ADDR_L:    0x22,
        DISK_ADDR_H:    0x23,
        DISK_CMD:       0x24,
        DISK_STATUS:    0x25,
        TIMER_L:        0x30,
        TIMER_H:        0x31,
        INT_CTRL:       0x40,
        TIMER_IRQ:      0x41,
        // 鼠标端口
        MOUSE_X:        0x60,
        MOUSE_Y:        0x61,
        MOUSE_BTN:      0x62,
        MOUSE_STATUS:   0x63,
        MOUSE_CLEAR:    0x64
    };

    let diskSector = 0;
    let diskAddr = 0;

    function inPort(port) {
        switch (port & 0xFF) {
            case PORT.KBD_DATA: {
                const ch = Keyboard.popKey();
                return ch !== null ? ch.charCodeAt(0) : 0;
            }
            case PORT.KBD_STATUS:
                return Keyboard.hasKey() ? 1 : 0;
            case PORT.DISK_STATUS:
                return Disk.getStatus();
            case PORT.TIMER_L:
                return Timer.getLow();
            case PORT.TIMER_H:
                return Timer.getHigh();
            case PORT.INT_CTRL:
                return (Keyboard.hasPendingIRQ() ? 1 : 0)
                    | (Timer.hasPendingIRQ() ? 2 : 0)
                    | (Mouse.hasPendingIRQ() ? 4 : 0);
            case PORT.MOUSE_X:
                return Mouse.getX();
            case PORT.MOUSE_Y:
                return Mouse.getY();
            case PORT.MOUSE_BTN:
                return Mouse.getButtons();
            case PORT.MOUSE_STATUS:
                return Mouse.hasEvent() ? 1 : 0;
            default:
                return 0;
        }
    }

    function outPort(port, value) {
        const v = value & 0xFF;
        switch (port & 0xFF) {
            case PORT.DISP_CHAR:
                Display.putCharAtCursor(String.fromCharCode(v));
                break;
            case PORT.DISP_CTRL:
                if (v === 0) Display.clear();
                else if (v === 1) Display.putCharAtCursor('\r');
                else if (v === 2) Display.putCharAtCursor('\n');
                else if (v === 3) Display.putCharAtCursor('\b');
                break;
            case PORT.DISP_CURSOR_X: {
                const c = Display.getCursor();
                Display.setCursor(v, c.y);
                break;
            }
            case PORT.DISP_CURSOR_Y: {
                const c = Display.getCursor();
                Display.setCursor(c.x, v);
                break;
            }
            case PORT.DISP_MODE:
                Display.setMode(v & 0x01);
                break;
            case PORT.DISK_SECTOR_L:
                diskSector = (diskSector & 0xFF00) | v;
                Disk.setSectorReg(diskSector);
                break;
            case PORT.DISK_SECTOR_H:
                diskSector = (diskSector & 0x00FF) | (v << 8);
                Disk.setSectorReg(diskSector);
                break;
            case PORT.DISK_ADDR_L:
                diskAddr = (diskAddr & 0xFF00) | v;
                Disk.setAddrReg(diskAddr);
                break;
            case PORT.DISK_ADDR_H:
                diskAddr = (diskAddr & 0x00FF) | (v << 8);
                Disk.setAddrReg(diskAddr);
                break;
            case PORT.DISK_CMD:
                Disk.executeCmd(v);
                break;
            case PORT.INT_CTRL:
                Keyboard.setIRQEnabled((v & 1) !== 0);
                Timer.setIRQEnabled((v & 2) !== 0);
                Mouse.setIRQEnabled((v & 4) !== 0);
                break;
            case PORT.TIMER_IRQ:
                Timer.setIRQInterval(v);
                break;
            case PORT.MOUSE_CLEAR:
                Mouse.clearEvent();
                Mouse.clearPendingIRQ();
                break;
            default:
                break;
        }
    }

    return { PORT, inPort, outPort };
})();


/* ─────────────────────────────────────────────────────────────
   模块 9：Interrupt Controller
   ───────────────────────────────────────────────────────────── */
const InterruptController = (() => {
    const IVT_BASE = 0x0000;
    const USER_PROGRAM_BASE = 0x0100;

    let intCount = 0;
    let lastInt = -1;
    let inInterrupt = 0;
    let maxNesting = 0;
    let rejectedVectors = 0;

    function setVector(n, addr) {
        n = n & 0xFF;
        if (n * 2 >= USER_PROGRAM_BASE) {
            rejectedVectors++;
            console.warn('[IC] 拒绝设置向量 0x' + n.toString(16));
            return false;
        }
        Memory.writeWord(IVT_BASE + n * 2, addr & 0xFFFF);
        return true;
    }

    function getVector(n) {
        n = n & 0xFF;
        return Memory.readWord(IVT_BASE + n * 2);
    }

    function getCount() { return intCount; }
    function getLastInt() { return lastInt; }
    function getNesting() { return inInterrupt; }
    function getMaxNesting() { return maxNesting; }
    function getRejectedCount() { return rejectedVectors; }
    function reset() {
        intCount = 0; lastInt = -1; inInterrupt = 0; maxNesting = 0; rejectedVectors = 0;
    }
    function beginInterrupt(n) {
        intCount++; lastInt = n; inInterrupt++;
        if (inInterrupt > maxNesting) maxNesting = inInterrupt;
    }
    function endInterrupt() { if (inInterrupt > 0) inInterrupt--; }

    return {
        IVT_BASE, USER_PROGRAM_BASE,
        setVector, getVector,
        getCount, getLastInt, getNesting, getMaxNesting, getRejectedCount, reset,
        beginInterrupt, endInterrupt
    };
})();


/* ─────────────────────────────────────────────────────────────
   模块 10：BIOS
   INT 0x10 显示（文本）
   INT 0x11 设备检测
   INT 0x12 内存检测
   INT 0x13 磁盘
   INT 0x15 图形（C2 新增）
   INT 0x16 键盘
   INT 0x1A 定时器
   INT 0x20 系统调用
   ───────────────────────────────────────────────────────────── */
const BIOS = (() => {
    let callCount = 0;
    const callLog = [];

    function handle(n, cpuAPI) {
        callCount++;
        if (callLog.length < 100) callLog.push(n);

        switch (n) {
            case 0x10: {  // 显示服务（文本）
                const ah = (cpuAPI.getReg(0) >> 8) & 0xFF;
                const al = cpuAPI.getReg(0) & 0xFF;
                if (ah === 0x00) { Display.clearText(); cpuAPI.setReg(0, 0); }
                else if (ah === 0x01) { Display.putCharAtCursor(String.fromCharCode(al)); cpuAPI.setReg(0, 0); }
                else if (ah === 0x02) {
                    const col = cpuAPI.getReg(1) & 0xFF;
                    const row = (cpuAPI.getReg(0) >> 8) & 0xFF;
                    Display.setCursor(col, row);
                    cpuAPI.setReg(0, 0);
                } else if (ah === 0x03) {
                    const c = Display.getCursor();
                    cpuAPI.setReg(2, (c.y << 8) | c.x);
                    cpuAPI.setReg(0, 0);
                } else if (ah === 0x0E) {
                    Display.putCharAtCursor(String.fromCharCode(al));
                    cpuAPI.setReg(0, 0);
                }
                return true;
            }

            case 0x11: {
                cpuAPI.setReg(0, 0x001F);  // 键盘/显示/磁盘/定时器/鼠标
                return true;
            }

            case 0x12: {
                cpuAPI.setReg(0, 64);
                return true;
            }

            case 0x13: {
                const ah = (cpuAPI.getReg(0) >> 8) & 0xFF;
                if (ah === 0x00) {
                    Disk.executeCmd(-1);
                    cpuAPI.setReg(0, 0);
                } else if (ah === 0x02) {
                    try {
                        Disk.readSector(cpuAPI.getReg(2) & 0xFFFF, cpuAPI.getReg(3));
                        cpuAPI.setReg(0, 0);
                    } catch (e) { cpuAPI.setReg(0, 0x0C00); }
                } else if (ah === 0x03) {
                    try {
                        Disk.writeSector(cpuAPI.getReg(2) & 0xFFFF, cpuAPI.getReg(3));
                        cpuAPI.setReg(0, 0);
                    } catch (e) { cpuAPI.setReg(0, 0x0C00); }
                }
                return true;
            }

            // ═══════════ 图形 BIOS（C2 新增）═══════════
            case 0x15: {
                const ah = (cpuAPI.getReg(0) >> 8) & 0xFF;
                const al = cpuAPI.getReg(0) & 0xFF;

                if (ah === 0x00) {
                    // 切换模式
                    Display.setMode(al);
                    cpuAPI.setReg(0, 0);
                } else if (ah === 0x01) {
                    // 画点：CX=X, DX=Y, AL=颜色
                    const x = cpuAPI.getReg(1) & 0xFF;
                    const y = cpuAPI.getReg(2) & 0xFF;
                    Display.putPixel(x, y, al);
                    cpuAPI.setReg(0, 0);
                } else if (ah === 0x02) {
                    // 读点：CX=X, DX=Y → AL=颜色
                    const x = cpuAPI.getReg(1) & 0xFF;
                    const y = cpuAPI.getReg(2) & 0xFF;
                    const c = Display.getPixel(x, y);
                    cpuAPI.setReg(0, c);
                } else if (ah === 0x03) {
                    // 横线：CX=X1, DX=X2, SI=Y, AL=颜色
                    const x1 = cpuAPI.getReg(1) & 0xFF;
                    const x2 = cpuAPI.getReg(2) & 0xFF;
                    const y = cpuAPI.getReg(4) & 0xFF;
                    Display.drawHLine(x1, x2, y, al);
                    cpuAPI.setReg(0, 0);
                } else if (ah === 0x04) {
                    // 竖线：CX=X, DX=Y1, SI=Y2, AL=颜色

    const FLAG_C = 0x0002;
    const FLAG_N = 0x0004;
    const FLAG_V = 0x0008;

    function setPC(value) { PC = value & 0xFFFF; }
    function getSP() { return SP; }
    function setSP(value) { SP = value & 0xFFFF; }
    function getFLAGS() { return FLAGS; }

        0x20, 0x21, 0x22, 0x23, 0x24, 0x25,

        0x40, 0x41,

            case 0x22: return 'SUB R' + dst + ', R' + src;
            case 0x23: return 'SUB R' + dst + ', #0x' + imm16.toString(16).padStart(4, '0');
            case 0x24: return 'MUL R' + dst + ', R' + src;
            case 0x25: return 'DIV R' + dst + ', R' + src;
            case 0x30: return 'AND R' + dst + ', R' + src;
            case 0x31: return 'OR R' + dst + ', R' + src;
            case 0x32: return 'XOR R' + dst + ', R' + src;
            case 0x33: return 'NOT R' + dst;
            case 0x34: return 'SHL R' + dst + ', #' + imm16;
            case 0x35: return 'SHR R' + dst + ', #' + imm16;
            case 0x40: return 'CMP R' + dst + ', R' + src;
            case 0x41: return 'CMP R' + dst + ', #0x' + imm16.toString(16).padStart(4, '0');
            case 0x50: return 'JMP 0x' + imm16.toString(16).padStart(4, '0');
            case 0x51: return 'JZ 0x' + imm16.toString(16).padStart(4, '0');
            case 0x52: return 'JNZ 0x' + imm16.toString(16).padStart(4, '0');
            case 0x53: return 'JC 0x' + imm16.toString(16).padStart(4, '0');
            case 0x54: return 'JNC 0x' + imm16.toString(16).padStart(4, '0');
            case 0x55: return 'JN 0x' + imm16.toString(16).padStart(4, '0');
            case 0x60: return 'PUSH R' + dst;
            case 0x61: return 'POP R' + dst;
            case 0x62: return 'CALL 0x' + imm16.toString(16).padStart(4, '0');
            case 0x63: return 'RET';
            case 0x70: return 'IN R' + dst + ', 0x' + src.toString(16).padStart(2, '0');
            case 0x71: return 'OUT 0x' + dst.toString(16).padStart(2, '0') + ', R' + src;
            case 0x72: return 'INT 0x' + dst.toString(16).padStart(2, '0');
            case 0x73: return 'IRET';
            case 0x74: return 'STI';
            case 0x75: return 'CLI';
            default:   return 'DB 0x' + op.toString(16).padStart(2, '0');
        }
    }

    return { getOpcode, listOpcodes, count, encode, disassemble, IMPLEMENTED };
})();


/* ─────────────────────────────────────────────────────────────
   模块 13：ProgramLoader
   ───────────────────────────────────────────────────────────── */
const ProgramLoader = (() => {
    function loadHex(addr, hexStr) {
        const tokens = hexStr.trim().split(/\s+/).filter(t => t.length > 0);
        const bytes = new Uint8Array(tokens.length);
        for (let i = 0; i < tokens.length; i++) bytes[i] = parseInt(tokens[i], 16) & 0xFF;
        Memory.writeBlock(addr, bytes);
        return bytes.length;
    }

    function loadInstructions(addr, instrs) {
        let offset = 0;
        for (const instr of instrs) {
            const bytes = Assembler.encode(instr.mnemonic, instr.op1, instr.op2, instr.op3);
            Memory.writeBlock(addr + offset, bytes);
            offset += 4;
        }
        return offset;
    }

    function disassembleRange(addr, count) {
        const result = [];
        for (let i = 0; i < count; i++) {
            const instrAddr = addr + i * 4;
            const bytes = new Uint8Array(4);
            for (let j = 0; j < 4; j++) bytes[j] = Memory.readByte((instrAddr + j) & 0xFFFF);
            result.push({ addr: instrAddr, bytes, text: Assembler.disassemble(bytes) });
        }
        return result;
    }

    return { loadHex, loadInstructions, disassembleRange };
})();


/* ─────────────────────────────────────────────────────────────
   模块 14：GShell（图形外壳）
   用 C1 汇编生成代码，写到内存，从 0x1000 开始执行
   提供：
     - 桌面背景
     - 顶部菜单栏（文字）
     - 一个"系统信息"窗口
     - 鼠标指针
     - 关闭按钮（点击关闭窗口）
     - Esc 返回命令行
   ───────────────────────────────────────────────────────────── */
const GShell = (() => {

    // 固定地址
    const CODE_ADDR = 0x2000;        // GShell 代码起始（避开用户程序区）
    const WIN_STRUCT = 0x4000;       // 窗口结构体
    const STRING_ADDR = 0x4200;      // 字符串池
    const MOUSE_PREV_X = 0x4100;     // 上一帧鼠标 X
    const MOUSE_PREV_Y = 0x4101;     // 上一帧鼠标 Y
    const MOUSE_PREV_BTN = 0x4102;   // 上一帧鼠标按键
    const DRAG_STATE = 0x4103;       // 拖动状态：0=无, 1=拖动中
    const DRAG_OFFSET_X = 0x4104;    // 拖动偏移 X
    const DRAG_OFFSET_Y = 0x4105;    // 拖动偏移 Y
    const FRAME_COUNTER = 0x4106;    // 帧计数器

    /**
     * 生成 GShell 的汇编代码
     * @returns {Array} 指令数组
     */
    function generate() {
        const instrs = [];
        const labels = {};
        const fixups = [];  // { idx, label } 需要回填的跳转

        function label(name) { labels[name] = CODE_ADDR + instrs.length * 4; }
        function emit(mnemonic, op1, op2, op3) {
            instrs.push({ mnemonic, op1, op2, op3 });
        }
        function emitJmp(mnemonic, labelName) {
            fixups.push({ idx: instrs.length, label: labelName });
            instrs.push({ mnemonic, op1: 0, op2: 0 });
        }
        function emitCall(labelName) {
            fixups.push({ idx: instrs.length, label: labelName });
            instrs.push({ mnemonic: 'CALL', op1: 0, op2: 0 });
        }

        // ─── 初始化 ───
        emit('INT', 0x15, 0);        // 先切图形模式前，先初始化
        // 实际：切模式 + 清屏
        emit('MOV_RI', 0, 0x0001);   // AH=0x00, AL=1 (图形模式)
        emit('INT', 0x15, 0);
        emit('MOV_RI', 0, 0x0701);   // AH=0x07 (清屏), AL=1 (深蓝)
        emit('INT', 0x15, 0);

        // 初始化状态
        emit('MOV_RI', 0, MOUSE_PREV_X); emit('MOV_RI', 1, 0xFFFF); emit('MOV_MR', 0, 1);
        emit('MOV_RI', 0, MOUSE_PREV_Y); emit('MOV_RI', 1, 0xFFFF); emit('MOV_MR', 0, 1);
        emit('MOV_RI', 0, MOUSE_PREV_BTN); emit('MOV_RI', 1, 0); emit('MOV_MR', 0, 1);
        emit('MOV_RI', 0, DRAG_STATE); emit('MOV_RI', 1, 0); emit('MOV_MR', 0, 1);
        // 刷新屏幕
        emit('MOV_RI', 0, 0x0900);   // AH=0x09 (刷新)
        emit('INT', 0x15, 0);
        emit('MOV_RI', 0, FRAME_COUNTER); 
        emit('MOV_RI', 1, 0); 
        emit('MOV_MR', 0, 1);

        // ─── 主循环 ───
        label('MAIN_LOOP');

        // 1. 清屏（深蓝背景）
        emit('MOV_RI', 0, 0x0701);
        emit('INT', 0x15, 0);

        // 2. 画菜单栏（顶部 12 行黑色 + 文字）
        emitCall('DRAW_MENUBAR');

        // 3. 画窗口
        emitCall('DRAW_WINDOW');

        // 4. 画鼠标指针
        emitCall('DRAW_MOUSE');

        // 5. 处理鼠标事件
        emitCall('HANDLE_MOUSE');

        // 6. 处理键盘（Esc 退出）
        emitCall('HANDLE_KEYBOARD');

        // 7. 刷新屏幕（关键！否则画的内容不上 Canvas）
        emit('MOV_RI', 0, 0x0900);   // AH=0x09 = 刷新屏幕
        emit('INT', 0x15, 0);

        // 8. 帧计数
        emit('MOV_RI', 0, FRAME_COUNTER);
        emit('MOV_RM', 1, 0);
        emit('ADD_RI', 1, 1);
        emit('MOV_MR', 0, 1);

        emitJmp('JMP', 'MAIN_LOOP');

        // ─── 菜单栏 ───
        label('DRAW_MENUBAR');
        // 填黑色矩形：x=0, y=0, w=160, h=10
        emit('MOV_RI', 0, 0x0500);   // AH=0x05 (填矩形), AL=0 (黑)
        emit('MOV_RI', 1, 0);         // X=0
        emit('MOV_RI', 2, 0);         // Y=0
        emit('MOV_RI', 4, 160);       // W=160
        emit('MOV_RI', 5, 10);        // H=10
        emit('INT', 0x15, 0);

        // 写菜单文字 "C2 GShell"
        emit('MOV_RI', 0, 0x0802);    // AH=0x08 (画字符串), AL 不用
        emit('MOV_RI', 1, 2);          // X=2
        emit('MOV_RI', 2, 1);          // Y=1
        emit('MOV_RI', 4, STRING_ADDR + 0);  // "C2 GShell"
        emit('MOV_RI', 3, 14);         // BL=14 (黄)
        emit('INT', 0x15, 0);

        // 写 "System" 菜单
        emit('MOV_RI', 0, 0x0802);
        emit('MOV_RI', 1, 70);
        emit('MOV_RI', 2, 1);
        emit('MOV_RI', 4, STRING_ADDR + 16);  // "System"
        emit('MOV_RI', 3, 15);          // 白
        emit('INT', 0x15, 0);

        emit('RET', 0, 0);

        // ─── 窗口绘制 ───
        label('DRAW_WINDOW');
        // 窗口结构：X=30, Y=20, W=100, H=70
        // 1. 窗口阴影
        emit('MOV_RI', 0, 0x0508);   // 填矩形，AL=8 (深灰)
        emit('MOV_RI', 1, 32);
        emit('MOV_RI', 2, 22);
        emit('MOV_RI', 4, 100);
        emit('MOV_RI', 5, 70);
        emit('INT', 0x15, 0);

        // 2. 窗口主体（浅灰）
        emit('MOV_RI', 0, 0x0507);   // AL=7 (浅灰)
        emit('MOV_RI', 1, 30);
        emit('MOV_RI', 2, 20);
        emit('MOV_RI', 4, 100);
        emit('MOV_RI', 5, 70);
        emit('INT', 0x15, 0);

        // 3. 标题栏（深蓝）
        emit('MOV_RI', 0, 0x0501);   // AL=1 (深蓝)
        emit('MOV_RI', 1, 30);
        emit('MOV_RI', 2, 20);
        emit('MOV_RI', 4, 100);
        emit('MOV_RI', 5, 10);
        emit('INT', 0x15, 0);

        // 4. 标题文字 "System Info"
        emit('MOV_RI', 0, 0x0802);
        emit('MOV_RI', 1, 33);
        emit('MOV_RI', 2, 21);
        emit('MOV_RI', 4, STRING_ADDR + 32);   // "System Info"
        emit('MOV_RI', 3, 15);   // 白
        emit('INT', 0x15, 0);

        // 5. 关闭按钮（红方块）
        emit('MOV_RI', 0, 0x0504);   // AL=4 (红)
        emit('MOV_RI', 1, 122);
        emit('MOV_RI', 2, 21);
        emit('MOV_RI', 4, 6);
        emit('MOV_RI', 5, 7);
        emit('INT', 0x15, 0);

        // 6. 窗口内容：CPU 状态
        emit('MOV_RI', 0, 0x0802);
        emit('MOV_RI', 1, 34);
        emit('MOV_RI', 2, 34);
        emit('MOV_RI', 4, STRING_ADDR + 48);   // "JS-H86 C2"
        emit('MOV_RI', 3, 0);   // 黑
        emit('INT', 0x15, 0);

        emit('MOV_RI', 0, 0x0802);
        emit('MOV_RI', 1, 34);
        emit('MOV_RI', 2, 46);
        emit('MOV_RI', 4, STRING_ADDR + 64);   // "CPU: IDLE"
        emit('MOV_RI', 3, 0);
        emit('INT', 0x15, 0);

        emit('MOV_RI', 0, 0x0802);
        emit('MOV_RI', 1, 34);
        emit('MOV_RI', 2, 58);
        emit('MOV_RI', 4, STRING_ADDR + 80);   // "RAM: 64 KB"
        emit('MOV_RI', 3, 0);
        emit('INT', 0x15, 0);

        emit('MOV_RI', 0, 0x0802);
        emit('MOV_RI', 1, 34);
        emit('MOV_RI', 2, 70);
        emit('MOV_RI', 4, STRING_ADDR + 96);   // "Disk: 1 MB"
        emit('MOV_RI', 3, 0);
        emit('INT', 0x15, 0);

        emit('RET', 0, 0);

        // ─── 鼠标绘制 ───
        label('DRAW_MOUSE');
        // 读鼠标位置到 R6/R7（避免污染 R0，R0 是 BIOS 功能号）
        emit('IN', 6, 0x60);  // R6 = X
        emit('IN', 7, 0x61);  // R7 = Y

        // 中心点
        emit('MOV_RI', 0, 0x010F);  // AH=0x01 (画点), AL=15 (白)
        emit('MOV_RR', 1, 6);        // CX = X
        emit('MOV_RR', 2, 7);        // DX = Y
        emit('INT', 0x15, 0);

        // 上
        emit('MOV_RI', 0, 0x010F);
        emit('MOV_RR', 1, 6);
        emit('MOV_RR', 2, 7);
        emit('CMP_RI', 2, 0);
        emitJmp('JZ', 'MOUSE_SKIP_UP');
        emit('SUB_RI', 2, 1);
        emit('INT', 0x15, 0);
        label('MOUSE_SKIP_UP');

        // 下
        emit('MOV_RI', 0, 0x010F);
        emit('MOV_RR', 1, 6);
        emit('MOV_RR', 2, 7);
        emit('ADD_RI', 2, 1);
        emit('INT', 0x15, 0);

        // 左
        emit('MOV_RI', 0, 0x010F);
        emit('MOV_RR', 1, 6);
        emit('CMP_RI', 1, 0);
        emitJmp('JZ', 'MOUSE_SKIP_LEFT');
        emit('SUB_RI', 1, 1);
        emit('MOV_RR', 2, 7);
        emit('INT', 0x15, 0);
        label('MOUSE_SKIP_LEFT');

        // 右
        emit('MOV_RI', 0, 0x010F);
        emit('MOV_RR', 1, 6);
        emit('ADD_RI', 1, 1);
        emit('MOV_RR', 2, 7);
        emit('INT', 0x15, 0);

        emit('RET', 0, 0);

        // ─── 鼠标事件处理 ───
        label('HANDLE_MOUSE');
        // 读当前鼠标按键
        emit('IN', 0, 0x62);   // R0 = 按键

        // 读上一次按键
        emit('MOV_RI', 1, MOUSE_PREV_BTN);
        emit('MOV_RM', 2, 1);  // R2 = prev_btn

        // 保存当前按键
        emit('MOV_MR', 1, 0);  // [prev_btn] = R0

        // 判断：如果左键按下（bit0=1），且上一次没按下（上升沿）
        emit('MOV_RI', 3, 1);
        emit('AND_RR', 0, 3);  // R0 = R0 & 1
        emit('CMP_RI', 0, 0);
        emitJmp('JZ', 'MOUSE_NO_CLICK');  // 当前没按

        emit('MOV_RI', 3, 1);
        emit('AND_RR', 2, 3);  // R2 = R2 & 1
        emit('CMP_RI', 2, 0);
        emitJmp('JNZ', 'MOUSE_NO_CLICK'); // 上一次也按着

        // 点击发生：检查是否点关闭按钮 (122-128, 21-28)
        emit('IN', 0, 0x60);   // mouse X
        emit('IN', 1, 0x61);   // mouse Y
        emit('CMP_RI', 0, 122);
        emitJmp('JC', 'MOUSE_CHECK_ALT');  // X < 122, 跳
        emit('CMP_RI', 0, 128);
        emitJmp('JNC', 'MOUSE_CHECK_ALT'); // X >= 128, 跳
        emit('CMP_RI', 1, 21);
        emitJmp('JC', 'MOUSE_CHECK_ALT');
        emit('CMP_RI', 1, 28);
        emitJmp('JNC', 'MOUSE_CHECK_ALT');
        // 命中关闭按钮 → 什么都不做（保持窗口存在，仅作演示）
        // 也可以切换 DRAG_STATE 或退出

        label('MOUSE_CHECK_ALT');
        label('MOUSE_NO_CLICK');
        emit('RET', 0, 0);

        // ─── 键盘处理 ───
        label('HANDLE_KEYBOARD');
        // 检查键盘是否有数据
        emit('IN', 0, 0x01);   // 键盘状态
        emit('CMP_RI', 0, 0);
        emitJmp('JZ', 'KB_NO_KEY');

        emit('IN', 0, 0x00);   // 读键
        // Esc = 0x1B
        emit('CMP_RI', 0, 0x1B);
        emitJmp('JNZ', 'KB_NOT_ESC');

        // Esc → 切回文本模式 + 停机
        emit('MOV_RI', 0, 0x0000);   // AH=0x00, AL=0 (文本模式)
        emit('INT', 0x15, 0);
        emit('MOV_RI', 0, 0x0000);   // AH=0x00 (系统调用：停机)
        emit('INT', 0x20, 0);
        emit('HLT', 0, 0);

        label('KB_NOT_ESC');
        label('KB_NO_KEY');
        emit('RET', 0, 0);

        // ─── 回填 fixup ───
        for (const f of fixups) {
            const target = labels[f.label];
            if (target === undefined) {
                console.warn('未定义的标签: ' + f.label);
                continue;
            }
            instrs[f.idx].op1 = target;
        }

        return instrs;
    }

    /**
     * 准备字符串池到内存
     */
    function prepareStrings() {
        const strings = {
            'C2 GShell': STRING_ADDR + 0,
            'System': STRING_ADDR + 16,
            'System Info': STRING_ADDR + 32,
            'JS-H86 C2': STRING_ADDR + 48,
            'CPU: IDLE': STRING_ADDR + 64,
            'RAM: 64 KB': STRING_ADDR + 80,
            'Disk: 1 MB': STRING_ADDR + 96
        };

        // 写字符串（以 0 结尾）
        function writeString(addr, str) {
            for (let i = 0; i < str.length; i++) {
                Memory.writeByte(addr + i, str.charCodeAt(i) & 0xFF);
            }
            Memory.writeByte(addr + str.length, 0);
        }

        writeString(STRING_ADDR + 0,  'C2 GShell');
        writeString(STRING_ADDR + 16, 'System');
        writeString(STRING_ADDR + 32, 'System Info');
        writeString(STRING_ADDR + 48, 'JS-H86 C2');
        writeString(STRING_ADDR + 64, 'CPU: IDLE');
        writeString(STRING_ADDR + 80, 'RAM: 64 KB');
        writeString(STRING_ADDR + 96, 'Disk: 1 MB');

        return strings;
    }

    /**
     * 加载 GShell 到内存
     * @returns {object} { codeAddr, instructionCount }
     */
    function loadToMemory() {
        const instrs = generate();
        // 先把代码编好（因为跳转回填需要地址）
        // generate() 里已经用了 labels 和 fixups，回填过了
        // 现在写入内存
        ProgramLoader.loadInstructions(CODE_ADDR, instrs);
        prepareStrings();
        return {
            codeAddr: CODE_ADDR,
            instructionCount: instrs.length
        };
    }

    return {
        CODE_ADDR, STRING_ADDR,
        generate, prepareStrings, loadToMemory
    };
})();


/* ─────────────────────────────────────────────────────────────
   模块 15：OS（保留 C1 的命令行 OS，用于"模式 0"）
   ───────────────────────────────────────────────────────────── */
const OS = (() => {
    const BOOT_ADDR = 0x7C00;
    const OS_ADDR = 0x1000;

    function generateBootSector() {
        const instrs = [
            { mnemonic: 'MOV_RI', op1: 0, op2: 0x0100 | 66 },
            { mnemonic: 'INT',    op1: 0x10, op2: 0 },
            { mnemonic: 'MOV_RI', op1: 3, op2: OS_ADDR },
            { mnemonic: 'MOV_RI', op1: 2, op2: 1 },
            { mnemonic: 'MOV_RI', op1: 0, op2: 0x0200 },
            { mnemonic: 'INT',    op1: 0x13, op2: 0 },
            { mnemonic: 'MOV_RI', op1: 3, op2: OS_ADDR + 512 },
            { mnemonic: 'MOV_RI', op1: 2, op2: 2 },
            { mnemonic: 'MOV_RI', op1: 0, op2: 0x0200 },
            { mnemonic: 'INT',    op1: 0x13, op2: 0 },
            { mnemonic: 'MOV_RI', op1: 3, op2: OS_ADDR + 1024 },
            { mnemonic: 'MOV_RI', op1: 2, op2: 3 },
            { mnemonic: 'MOV_RI', op1: 0, op2: 0x0200 },
            { mnemonic: 'INT',    op1: 0x13, op2: 0 },
            { mnemonic: 'MOV_RI', op1: 3, op2: OS_ADDR + 1536 },
            { mnemonic: 'MOV_RI', op1: 2, op2: 4 },
            { mnemonic: 'MOV_RI', op1: 0, op2: 0x0200 },
            { mnemonic: 'INT',    op1: 0x13, op2: 0 },
            { mnemonic: 'JMP',    op1: OS_ADDR, op2: 0 }
        ];
        return instrs;
    }

    function generateCLICode() {
        const instrs = [];
        instrs.push({ mnemonic: 'MOV_RI', op1: 0, op2: 0x0000 });
        instrs.push({ mnemonic: 'INT',    op1: 0x10, op2: 0 });

        const banner = 'JS-H86 C1 Command Line';
        for (let i = 0; i < banner.length; i++) {
            instrs.push({ mnemonic: 'MOV_RI', op1: 0, op2: 0x0E00 | banner.charCodeAt(i) });
            instrs.push({ mnemonic: 'INT',    op1: 0x10, op2: 0 });
        }
        instrs.push({ mnemonic: 'MOV_RI', op1: 0, op2: 0x0E0A });
        instrs.push({ mnemonic: 'INT',    op1: 0x10, op2: 0 });

        const promptAddr = OS_ADDR + instrs.length * 4;
        const prompt = 'C1> ';
        for (let i = 0; i < prompt.length; i++) {
            instrs.push({ mnemonic: 'MOV_RI', op1: 0, op2: 0x0E00 | prompt.charCodeAt(i) });
            instrs.push({ mnemonic: 'INT',    op1: 0x10, op2: 0 });
        }

        const readAddr = OS_ADDR + instrs.length * 4;
        instrs.push({ mnemonic: 'MOV_RI', op1: 0, op2: 0x0000 });
        instrs.push({ mnemonic: 'INT',    op1: 0x16, op2: 0 });
        instrs.push({ mnemonic: 'CMP_RI', op1: 0, op2: 0 });
        instrs.push({ mnemonic: 'JZ',     op1: readAddr, op2: 0 });

        // 回显
        instrs.push({ mnemonic: 'MOV_RR', op1: 2, op2: 0 });
        instrs.push({ mnemonic: 'MOV_RI', op1: 0, op2: 0x0E00 });
        instrs.push({ mnemonic: 'OR_RR',  op1: 0, op2: 2 });
        instrs.push({ mnemonic: 'INT',    op1: 0x10, op2: 0 });

        // x 退出
        instrs.push({ mnemonic: 'CMP_RI', op1: 2, op2: 120 });
        instrs.push({ mnemonic: 'JZ',     op1: 0, op2: 0 });

        // 换行 + 回提示符
        instrs.push({ mnemonic: 'MOV_RI', op1: 0, op2: 0x0E0A });
        instrs.push({ mnemonic: 'INT',    op1: 0x10, op2: 0 });
        instrs.push({ mnemonic: 'JMP',    op1: promptAddr, op2: 0 });

        // x 处理
        const haltAddr = OS_ADDR + instrs.length * 4;
        instrs.push({ mnemonic: 'MOV_RI', op1: 0, op2: 0x0E0A });
        instrs.push({ mnemonic: 'INT',    op1: 0x10, op2: 0 });
        const msg = 'System halted.';
        for (let i = 0; i < msg.length; i++) {
            instrs.push({ mnemonic: 'MOV_RI', op1: 0, op2: 0x0E00 | msg.charCodeAt(i) });
            instrs.push({ mnemonic: 'INT',    op1: 0x10, op2: 0 });
        }
        instrs.push({ mnemonic: 'HLT',    op1: 0, op2: 0 });

        // 修正 JZ
        for (let i = 0; i < instrs.length; i++) {
            if (instrs[i].mnemonic === 'JZ' && instrs[i].op1 === 0 && instrs[i].op2 === 0) {
                instrs[i].op1 = haltAddr;
                break;
            }
        }

        return instrs;
    }

    function installToDisk() {
        const bootInstrs = generateBootSector();
        const bootImage = new Uint8Array(512);
        let bootOffset = 0;
        for (const instr of bootInstrs) {
            const bytes = Assembler.encode(instr.mnemonic, instr.op1, instr.op2);
            for (let i = 0; i < 4; i++) bootImage[bootOffset++] = bytes[i];
        }

        const osInstrs = generateCLICode();
        const osImage = new Uint8Array(4 * 512);
        let osOffset = 0;
        for (const instr of osInstrs) {
            if (osOffset + 4 > osImage.length) break;
            const bytes = Assembler.encode(instr.mnemonic, instr.op1, instr.op2);
            for (let i = 0; i < 4; i++) osImage[osOffset++] = bytes[i];
        }

        const disk = Disk.getImage();
        for (let i = 0; i < 512; i++) disk[i] = bootImage[i];
        for (let i = 0; i < osImage.length; i++) disk[512 + i] = osImage[i];

        return {
            bootBytes: bootInstrs.length * 4,
            osBytes: osInstrs.length * 4,
            totalSectors: 5
        };
    }

    return { installToDisk, BOOT_ADDR, OS_ADDR, generateBootSector, generateCLICode };
})();


/* ─────────────────────────────────────────────────────────────
   模块 16：Machine
   ───────────────────────────────────────────────────────────── */
const Machine = (() => {
    let booted = false;

    function post() {
        const checks = [];

        try {
            Memory.writeByte(0xFFFE, 0xAA);
            const v = Memory.readByte(0xFFFE);
            Memory.writeByte(0xFFFE, 0x00);
            checks.push({ name: '内存总线', ok: v === 0xAA, info: Memory.SIZE + ' 字节' });
        } catch (e) {
            checks.push({ name: '内存总线', ok: false, info: e.message });
        }

        try {
            CPU.setReg(7, 0xBEEF);
            const v = CPU.getReg(7);
            CPU.setReg(7, 0);
            checks.push({ name: 'CPU 寄存器', ok: v === 0xBEEF, info: '8 × 16 位' });
        } catch (e) {
            checks.push({ name: 'CPU 寄存器', ok: false, info: e.message });
        }

        try {
            Display.setMode(Display.MODE_TEXT);
            Display.putTextChar(0, 0, 'X', 0x07);
            const c = Display.getTextChar(0, 0);
            Display.putTextChar(0, 0, ' ', 0x07);
            checks.push({ name: '显示控制器', ok: c.char === 'X', info: '文本+图形' });
        } catch (e) {
            checks.push({ name: '显示控制器', ok: false, info: e.message });
        }

        try {
            const info = Disk.getInfo();
            checks.push({ name: '磁盘控制器', ok: info.sectorCount === 2048, info: (info.diskSize / 1024 / 1024) + ' MB' });
        } catch (e) {
            checks.push({ name: '磁盘控制器', ok: false, info: e.message });
        }

        try {
            Keyboard.pushKey('A');
            const k = Keyboard.popKey();
            Keyboard.clear();
            checks.push({ name: '键盘控制器', ok: k === 'A', info: '缓冲区 256' });
        } catch (e) {
            checks.push({ name: '键盘控制器', ok: false, info: e.message });
        }

        try {
            Mouse.setPosition(50, 60);
            const ok = (Mouse.getX() === 50 && Mouse.getY() === 60);
            Mouse.reset();
            checks.push({ name: '鼠标控制器', ok: ok, info: '端口 0x60-0x64' });
        } catch (e) {
            checks.push({ name: '鼠标控制器', ok: false, info: e.message });
        }

        try {
            const c = Assembler.count();
            checks.push({ name: '指令表', ok: c === 38, info: c + ' 条指令' });
        } catch (e) {
            checks.push({ name: '指令表', ok: false, info: e.message });
        }

        try {
            const v = IOBus.inPort(0x00);
            checks.push({ name: 'I/O 总线', ok: v === 0, info: '端口 0x00 - 0xFF' });
        } catch (e) {
            checks.push({ name: 'I/O 总线', ok: false, info: e.message });
        }

        try {
            InterruptController.setVector(0x70, 0x1234);
            const addr = InterruptController.getVector(0x70);
            InterruptController.setVector(0x70, 0);
            checks.push({ name: '中断控制器', ok: addr === 0x1234, info: '256 向量' });
        } catch (e) {
            checks.push({ name: '中断控制器', ok: false, info: e.message });
        }

        return checks;
    }

    function boot() {
        if (booted) return;
        booted = true;

        Memory.clear();
        CPU.reset();
        Display.setMode(Display.MODE_TEXT);
        Display.clearText();
        Disk.clear();
        Keyboard.clear();
        Mouse.reset();
        Timer.reset();
        InterruptController.reset();
        BIOS.reset();

        const led = document.getElementById('led-power');
        if (led) led.classList.add('on');

        Terminal.start();
        Terminal.printBanner();
        StatusBar.start();

        // 全局键盘监听
        document.addEventListener('keydown', (e) => {
            const inputFocused = document.activeElement && document.activeElement.id === 'input-field';
            if (inputFocused) return;

            if (e.key.length === 1) Keyboard.pushKey(e.key);
            else if (e.key === 'Enter') Keyboard.pushKey('\n');
            else if (e.key === 'Backspace') Keyboard.pushKey('\b');
            else if (e.key === 'Escape') Keyboard.pushKey('\x1B');
        });
    }

    function reset() { booted = false; boot(); }

    return { boot, reset, post };
})();


/* ─────────────────────────────────────────────────────────────
   模块 17：StatusBar
   ───────────────────────────────────────────────────────────── */
const StatusBar = (() => {
    let timer = null;

    function update() {
        const s = CPU.snapshot();
        const elCpu = document.getElementById('stat-cpu');
        const elPc = document.getElementById('stat-pc');
        const elSp = document.getElementById('stat-sp');
        const elFlags = document.getElementById('stat-flags');
        const elMode = document.getElementById('stat-mode');
        const elInt = document.getElementById('stat-int');
        const led = document.getElementById('led-power');

        if (elCpu) elCpu.textContent = s.state;
        if (elPc) elPc.textContent = '0x' + s.PC.toString(16).padStart(4, '0').toUpperCase();
        if (elSp) elSp.textContent = '0x' + s.SP.toString(16).padStart(4, '0').toUpperCase();
        if (elFlags) elFlags.textContent = CPU.flagsToString() + ' 0x' + s.FLAGS.toString(16).padStart(4, '0').toUpperCase();
        if (elMode) elMode.textContent = Display.getModeName();
        if (elInt) {
            const nesting = InterruptController.getNesting();
            const lastInt = InterruptController.getLastInt();
            elInt.textContent = nesting > 0 ? ('0x' + lastInt.toString(16) + ' (' + nesting + ')') : '--';
        }

        if (led) {
            led.classList.remove('on', 'running');
            if (s.state === 'RUNNING') led.classList.add('running');
            else led.classList.add('on');
        }
    }

    function start() {
        if (timer) clearInterval(timer);
        timer = setInterval(update, 100);
        update();
    }

    return { start, update };
})();


/* ─────────────────────────────────────────────────────────────
   模块 18：Terminal
   ───────────────────────────────────────────────────────────── */
const Terminal = (() => {
    let termEl = null;
    let inputEl = null;
    let promptEl = null;
    let history = [];
    let historyIdx = -1;

    const commands = {};

    function registerCommand(name, desc, handler) {
        commands[name] = { desc, handler };
    }

    function start() {
        termEl = document.getElementById('terminal');
        inputEl = document.getElementById('input-field');
        promptEl = document.getElementById('input-prompt');
        if (!termEl || !inputEl) return;

        inputEl.addEventListener('keydown', onKeyDown);
        inputEl.focus();
        document.addEventListener('click', () => inputEl.focus());
        registerBuiltinCommands();
    }

    function onKeyDown(e) {
        if (e.key === 'Enter') {
            const cmd = inputEl.value.trim();
            inputEl.value = '';
            if (cmd) { history.push(cmd); historyIdx = history.length; execute(cmd); }
            else newLine();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (historyIdx > 0) { historyIdx--; inputEl.value = history[historyIdx]; }
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (historyIdx < history.length - 1) { historyIdx++; inputEl.value = history[historyIdx]; }
            else { historyIdx = history.length; inputEl.value = ''; }
        } else if (e.key === 'l' && e.ctrlKey) {
            e.preventDefault();
            clearScreen();
        }
    }

    function execute(input) {
        printLine(promptEl.textContent + ' ' + input, 'line-input');
        const parts = input.split(/\s+/);
        const cmd = parts[0].toLowerCase();
        const args = parts.slice(1);
        const fullCmd = parts.length >= 2 ? parts[0].toLowerCase() + ' ' + parts[1].toLowerCase() : null;

        if (fullCmd && commands[fullCmd]) {
            try { commands[fullCmd].handler(parts.slice(2)); }
            catch (e) { printLine('错误: ' + e.message, 'line-error'); }
        } else if (commands[cmd]) {
            try { commands[cmd].handler(args); }
            catch (e) { printLine('错误: ' + e.message, 'line-error'); }
        } else {
            printLine('未识别的命令: ' + cmd, 'line-error');
            printLine('输入 help 查看可用命令', 'line-dim');
        }
    }

    function printLine(text, className) {
        const div = document.createElement('div');
        if (className) div.className = className;
        div.textContent = text;
        termEl.appendChild(div);
        termEl.scrollTop = termEl.scrollHeight;
    }

    function newLine() { printLine('', ''); }
    function clearScreen() { termEl.innerHTML = ''; }

    function printBanner() {
        printLine('═══════════════════════════════════════════════════════', 'line-info');
        printLine('  JS-H86 C2 架构 · 第二代实现（图形化）', 'line-bright');
        printLine('  版本：v2.0.0', 'line-info');
        printLine('═══════════════════════════════════════════════════════', 'line-info');
        newLine();
        printLine('内存: 64 KB  磁盘: 1 MB  显示: 160×120 图形', 'line-dim');
        printLine('指令: 38 条（新增 MOV_RMO / MOV_MRO）', 'line-success');
        printLine('BIOS: INT 0x10/0x11/0x12/0x13/0x15/0x16/0x1A/0x20', 'line-success');
        printLine('鼠标: 端口 0x60-0x64, 中断 INT 0x04', 'line-success');
        printLine('GShell: 图形外壳（系统信息面板）', 'line-success');
        newLine();
        printLine('输入 boot 启动图形界面，test 跑测试', 'line-warn');
        newLine();
    }

    function registerBuiltinCommands() {

        registerCommand('help', '显示所有命令', () => {
            printLine('可用命令：', 'line-bright');
            Object.keys(commands).sort().forEach(name => {
                const pad = name.padEnd(22, ' ');
                printLine('  ' + pad + commands[name].desc, 'line-info');
            });
        });

        registerCommand('test', '运行全套测试', () => { runFullTest(); });
        registerCommand('clear', '清屏', () => { clearScreen(); });

        registerCommand('version', '显示版本信息', () => {
            printLine('JS-H86 C2 v2.0.0（图形化）', 'line-bright');
            printLine('已实现: 38 条指令', 'line-success');
            printLine('BIOS: INT 0x10/0x13/0x15/0x16/0x20', 'line-success');
            printLine('GShell: 系统信息面板 + 鼠标 + 关闭按钮', 'line-success');
        });

        registerCommand('regs', '显示 CPU 寄存器', () => {
            const s = CPU.snapshot();
            printLine('CPU 寄存器：', 'line-bright');
            printLine('  R0 = 0x' + hex4(s.R0) + '  R1 = 0x' + hex4(s.R1) + '  R2 = 0x' + hex4(s.R2) + '  R3 = 0x' + hex4(s.R3), 'line-info');
            printLine('  R4 = 0x' + hex4(s.R4) + '  R5 = 0x' + hex4(s.R5) + '  R6 = 0x' + hex4(s.R6) + '  R7 = 0x' + hex4(s.R7), 'line-info');
            printLine('  PC = 0x' + hex4(s.PC) + '   SP = 0x' + hex4(s.SP), 'line-info');
            printLine('  FLAGS = ' + CPU.flagsToString() + '  MODE = ' + Display.getModeName(), 'line-info');
            printLine('  状态: ' + s.state + '   已执行: ' + s.instructionCount, 'line-info');
            printLine('  中断: 次数=' + InterruptController.getCount() + ' 最后=0x' + InterruptController.getLastInt().toString(16), 'line-info');
            if (s.lastError) printLine('  最后错误: ' + s.lastError, 'line-error');
        });

        registerCommand('mouse', '显示鼠标状态', () => {
            printLine('鼠标：', 'line-bright');
            printLine('  X = ' + Mouse.getX() + '   Y = ' + Mouse.getY(), 'line-info');
            printLine('  按键 = ' + Mouse.getButtons() + ' (bit0=左, bit1=右)', 'line-info');
            printLine('  有新事件 = ' + (Mouse.hasEvent() ? '是' : '否'), 'line-info');
        });

        registerCommand('mem', '查看内存（mem <地址> [长度]）', (args) => {
            if (args.length === 0) { printLine('用法: mem <地址> [长度]', 'line-warn'); return; }
            dumpMemory(parseHex(args[0]), args[1] ? parseInt(args[1]) : 64);
        });

        registerCommand('screen', '查看屏幕（文本）', () => {
            if (Display.getMode() !== Display.MODE_TEXT) {
                printLine('当前是图形模式，先用 text 切换回文本', 'line-warn');
                return;
            }
            const text = Display.getTextScreen();
            printLine('屏幕内容：', 'line-bright');
            text.split('\n').forEach((line, i) => {
                printLine(String(i).padStart(2, ' ') + ' │' + line, 'line-info');
            });
        });

        registerCommand('display', '打开显示器窗口', () => { openDisplayWindow(); });

        registerCommand('mode', '切换显示模式（mode text / mode gfx）', (args) => {
            if (args.length === 0) {
                printLine('当前模式: ' + Display.getModeName(), 'line-info');
                printLine('用法: mode text | mode gfx', 'line-dim');
                return;
            }
            const m = args[0].toLowerCase();
            if (m === 'text') { Display.setMode(Display.MODE_TEXT); printLine('已切到文本模式', 'line-success'); }
            else if (m === 'gfx' || m === 'graphics') { Display.setMode(Display.MODE_GFX); printLine('已切到图形模式', 'line-success'); }
            else printLine('未知模式: ' + m, 'line-error');
            if (!document.getElementById('c1-display-canvas')) openDisplayWindow();
        });

        registerCommand('gtest', '测试图形 BIOS', () => { runGfxTest(); });

        registerCommand('asm', '列出所有指令', () => {
            const list = Assembler.listOpcodes();
            printLine('指令表（共 ' + list.length + ' 条）：', 'line-bright');
            list.forEach(item => {
                const mark = item.implemented ? '★' : ' ';
                const cls = item.implemented ? 'line-success' : 'line-dim';
                printLine('  ' + mark + ' 0x' + hex2(item.opcode) + '  ' + item.mnemonic, cls);
            });
        });

        registerCommand('post', '上电自检', () => {
            const checks = Machine.post();
            printLine('上电自检（POST）：', 'line-bright');
            checks.forEach(c => {
                const status = c.ok ? '[OK]  ' : '[FAIL]';
                const cls = c.ok ? 'line-success' : 'line-error';
                printLine('  ' + status + ' ' + c.name.padEnd(14) + ' ' + c.info, cls);
            });
        });

        registerCommand('reset', '复位机器', () => {
            printLine('正在复位...', 'line-warn');
            setTimeout(() => Machine.reset(), 300);
        });

        registerCommand('run', '从 PC 开始执行', (args) => {
            let addr = CPU.getPC();
            if (args.length > 0) { addr = parseHex(args[0]); CPU.setPC(addr); }
            if (addr === 0) { printLine('PC = 0，先用 load 或 demo 加载程序', 'line-warn'); return; }
            if (!document.getElementById('c1-display-canvas')) openDisplayWindow();

            printLine('从 0x' + hex4(addr) + ' 执行...', 'line-info');
            const t0 = performance.now();
            const result = CPU.run();
            const t1 = performance.now();

            printLine('执行 ' + result.executed + ' 条，耗时 ' + (t1 - t0).toFixed(2) + ' ms', 'line-info');
            if (result.error) printLine('错误: ' + result.error, 'line-error');
            else if (result.halted) printLine('CPU 停机', 'line-success');
            else if (result.limitReached) printLine('达到指令上限', 'line-warn');
        });

        registerCommand('boot', '启动图形界面（GShell）', () => { runBoot(); });
        registerCommand('boot-cli', '启动命令行 OS（C1 风格）', () => { runBootCLI(); });

        registerCommand('demo', '默认示例（hello）', () => { runDemoHello(); });
        registerCommand('demo hello', 'Hello World', () => { runDemoHello(); });
        registerCommand('demo isr', '自定义 ISR', () => { runDemoISR(); });
        registerCommand('demo index', '索引寻址演示', () => { runDemoIndex(); });
        registerCommand('demo gfx', '图形模式演示', () => { runDemoGfx(); });

        registerCommand('demos', '列出所有示例', () => {
            printLine('示例程序：', 'line-bright');
            printLine('  demo hello     → Hello World', 'line-info');
            printLine('  demo isr       → 自定义中断处理', 'line-info');
            printLine('  demo index     → MOV_RMO / MOV_MRO 索引寻址', 'line-info');
            printLine('  demo gfx       → 图形模式画图', 'line-info');
        });
    }

    function openDisplayWindow() {
        if (document.getElementById('c1-display-canvas')) return;

        const win = document.createElement('div');
        win.id = 'c1-display-window';
        win.style.cssText = 'position:fixed;top:80px;right:40px;width:660px;height:500px;background:#1a1a1a;border:2px solid #4ec9b0;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.6);z-index:9999;display:flex;flex-direction:column;overflow:hidden;';

        const titlebar = document.createElement('div');
        titlebar.style.cssText = 'height:30px;background:#252525;display:flex;align-items:center;padding:0 10px;color:#ccc;font-size:12px;border-bottom:1px solid #333;cursor:move;user-select:none;';
        titlebar.innerHTML = '<span style="color:#4ec9b0;font-weight:bold;">🖥 JS-H86 C2 显示器</span><span id="c1-display-cursor" style="margin-left:20px;color:#888;font-size:11px;">光标: (0, 0)</span><span style="margin-left:auto;cursor:pointer;padding:0 8px;" id="c1-display-close">✕</span>';

        const content = document.createElement('div');
        content.style.cssText = 'flex:1;display:flex;align-items:center;justify-content:center;padding:10px;background:#000;overflow:hidden;';
        content.innerHTML = '<canvas id="c1-display-canvas" style="width:100%;height:100%;object-fit:contain;image-rendering:pixelated;"></canvas>';
        win.appendChild(titlebar);
        win.appendChild(content);
        document.body.appendChild(win);

        document.getElementById('c1-display-close').onclick = function() { win.remove(); };

        let dragInfo = null;
        titlebar.addEventListener('pointerdown', function(e) {
            if (e.target.id === 'c1-display-close') return;
            dragInfo = { startX: e.clientX, startY: e.clientY, origLeft: win.offsetLeft, origTop: win.offsetTop };
            e.preventDefault();
        });
        document.addEventListener('pointermove', function(e) {
            if (!dragInfo) return;
            win.style.left = (dragInfo.origLeft + e.clientX - dragInfo.startX) + 'px';
            win.style.top = (dragInfo.origTop + e.clientY - dragInfo.startY) + 'px';
            win.style.right = 'auto';
        });
        document.addEventListener('pointerup', function() { dragInfo = null; });

        setTimeout(() => {
            const canvas = document.getElementById('c1-display-canvas');
            if (canvas) {
                Display.initCanvas(canvas);
                attachMouseEvents(canvas);
            }
        }, 50);
    }

    /**
     * 绑定鼠标事件到 Canvas
     * 把浏览器的鼠标位置映射到 C1 的 160×120 坐标
     */
    function attachMouseEvents(canvas) {
        if (!canvas || canvas._mouseAttached) return;
        canvas._mouseAttached = true;

        function updateMouse(e) {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / rect.width * Display.GFX_W);
            const y = Math.floor((e.clientY - rect.top) / rect.height * Display.GFX_H);
            Mouse.setPosition(x, y);
        }

        canvas.addEventListener('mousemove', updateMouse);
        canvas.addEventListener('mousedown', function(e) {
            updateMouse(e);
            let btn = Mouse.getButtons();
            if (e.button === 0) btn |= 0x01;
            if (e.button === 2) btn |= 0x02;
            Mouse.setButtons(btn);
        });
        canvas.addEventListener('mouseup', function(e) {
            updateMouse(e);
            let btn = Mouse.getButtons();
            if (e.button === 0) btn &= ~0x01;
            if (e.button === 2) btn &= ~0x02;
            Mouse.setButtons(btn);
        });
        canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    }

    // ─── 启动图形 GShell ───
    function runBoot() {
        printLine('═══════════════════════════════════════════════════════', 'line-info');
        printLine('  JS-H86 C2 图形界面启动（GShell）', 'line-bright');
        printLine('═══════════════════════════════════════════════════════', 'line-info');
        newLine();

        printLine('[POST] 上电自检...', 'line-warn');
        const checks = Machine.post();
        checks.forEach(c => {
            printLine('  ' + (c.ok ? '[OK]  ' : '[FAIL]') + ' ' + c.name.padEnd(14) + ' ' + c.info,
                      c.ok ? 'line-success' : 'line-error');
        });
        newLine();

        printLine('[GFX] 准备 GShell 代码...', 'line-warn');
        Memory.clear();
        CPU.reset();
        Mouse.reset();
        Keyboard.clear();
        Timer.reset();
        InterruptController.reset();

        const shellInfo = GShell.loadToMemory();
        printLine('  GShell 代码: ' + shellInfo.instructionCount + ' 条指令，加载到 0x' + hex4(shellInfo.codeAddr), 'line-info');
        printLine('  字符串池: 0x' + hex4(GShell.STRING_ADDR), 'line-info');
        newLine();

        // 打开显示器窗口
        if (!document.getElementById('c1-display-canvas')) openDisplayWindow();

        printLine('[GFX] 切换到图形模式（GShell2 混合模式）...', 'line-warn');
        newLine();

        setTimeout(function() {
            GShell2.boot();
        }, 100);
    }
    // ─── 启动命令行 OS ───
    function runBootCLI() {
        printLine('═══════════════════════════════════════════════════════', 'line-info');
        printLine('  JS-H86 C2 命令行模式启动', 'line-bright');
        printLine('═══════════════════════════════════════════════════════', 'line-info');
        newLine();

        printLine('[DISK] 写入 CLI OS 到磁盘...', 'line-warn');
        const installResult = OS.installToDisk();
        printLine('  引导扇区: ' + installResult.bootBytes + ' 字节', 'line-info');
        printLine('  CLI OS: ' + installResult.osBytes + ' 字节', 'line-info');
        newLine();

        Memory.clear();
        CPU.reset();
        Display.setMode(Display.MODE_TEXT);
        Display.clearText();
        Keyboard.clear();
        Timer.reset();
        InterruptController.reset();

        printLine('[BIOS] 读引导扇区到 0x7C00...', 'line-warn');
        Disk.readSector(0, 0x7C00);

        CPU.setPC(0x7C00);

    function runDemoIndex() {
        Memory.clear(); CPU.reset();
        Display.setMode(Display.MODE_TEXT);
        if (!document.getElementById('c1-display-canvas')) openDisplayWindow();

        // 写入数组到 0x2000: [100, 200, 300, 400]
        Memory.writeWord(0x2000, 100);
        Memory.writeWord(0x2002, 200);
        Memory.writeWord(0x2004, 300);
        Memory.writeWord(0x2006, 400);

        // R0 = 0x2000 (基址)
        // R1 = [R0 + 0]  → 100
        // R2 = [R0 + 2]  → 200
        // R3 = [R0 + 4]  → 300
        // R4 = [R0 + 6]  → 400
        // R5 = 0x9999
        // [R0 + 8] = R5  (写)
        // R6 = [R0 + 8]  → 0x9999
        ProgramLoader.loadInstructions(0x0100, [
            { mnemonic: 'MOV_RI',  op1: 0, op2: 0x2000 },
            { mnemonic: 'MOV_RMO', op1: 1, op2: 0, op3: 0 },
            { mnemonic: 'MOV_RMO', op1: 2, op2: 0, op3: 2 },
            { mnemonic: 'MOV_RMO', op1: 3, op2: 0, op3: 4 },
            { mnemonic: 'MOV_RMO', op1: 4, op2: 0, op3: 6 },
            { mnemonic: 'MOV_RI',  op1: 5, op2: 0x9999 },
            { mnemonic: 'MOV_MRO', op1: 0, op2: 5, op3: 8 },
            { mnemonic: 'MOV_RMO', op1: 6, op2: 0, op3: 8 },
            { mnemonic: 'HLT',     op1: 0, op2: 0 }
        ]);

        CPU.setPC(0x0100);
        printLine('── 索引寻址演示 ──', 'line-bright');
        const r = CPU.run();
        const s = CPU.snapshot();
        printLine('  R1 = ' + s.R1 + ' (期望 100)', s.R1 === 100 ? 'line-success' : 'line-error');
        printLine('  R2 = ' + s.R2 + ' (期望 200)', s.R2 === 200 ? 'line-success' : 'line-error');
        printLine('  R3 = ' + s.R3 + ' (期望 300)', s.R3 === 300 ? 'line-success' : 'line-error');
        printLine('  R4 = ' + s.R4 + ' (期望 400)', s.R4 === 400 ? 'line-success' : 'line-error');
        printLine('  R6 = 0x' + hex4(s.R6) + ' (期望 0x9999)', s.R6 === 0x9999 ? 'line-success' : 'line-error');
    }

    function dumpMemory(addr, len) {
        printLine('内存 0x' + hex4(addr) + ' - 0x' + hex4(addr + len - 1) + '：', 'line-bright');
        for (let row = 0; row < len; row += 16) {
            let hex = '', ascii = '';
            for (let col = 0; col < 16 && row + col < len; col++) {
                const b = Memory.readByte(addr + row + col);
                hex += hex2(b) + ' ';
                ascii += (b >= 32 && b < 127) ? String.fromCharCode(b) : '.';
            }
            printLine('  ' + hex4(addr + row) + '  ' + hex.padEnd(48, ' ') + ' |' + ascii.padEnd(16, ' ') + '|', 'line-info');
        }
    }

    function hex2(v) { return v.toString(16).padStart(2, '0').toUpperCase(); }
    function hex4(v) { return v.toString(16).padStart(4, '0').toUpperCase(); }
    function parseHex(s) {
        if (s.startsWith('0x') || s.startsWith('0X')) return parseInt(s.substring(2), 16);
        return parseInt(s, 16);
    }

    return { start, printLine, newLine, clearScreen, registerCommand, printBanner };
})();

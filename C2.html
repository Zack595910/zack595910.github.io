/* ═══════════════════════════════════════════════════════════
   GShell2 · 图形外壳（完整版 v2.1）
   - 窗口管理：多窗口 + 拖动 + 关闭 + 菜单
   - 应用：System Info / Notepad / Calculator / Paint / Terminal
           Files（文件系统）/ Editor（汇编器）
   ═══════════════════════════════════════════════════════════ */
const GShell2 = (() => {

    const W = 160, H = 120, MENUBAR_H = 10;

    // 颜色
    const C_BLACK=0,C_BLUE=1,C_GREEN=2,C_CYAN=3,C_RED=4,C_MAGENTA=5,C_BROWN=6,C_GRAY=7;
    const C_DGRAY=8,C_LBLUE=9,C_LGREEN=10,C_LCYAN=11,C_LRED=12,C_LMAG=13,C_YELLOW=14,C_WHITE=15;

    const MENU_ITEMS = [
        'New Notepad', 'Calculator', 'Paint', 'Terminal',
        'Files', 'Editor',
        '---',
        'Close All', 'About', 'Exit'
    ];

    let windows = [];
    let nextWinId = 1;
    let activeWinId = 0;
    let draggingWinId = 0, dragOffsetX = 0, dragOffsetY = 0;
    let menuOpen = false, menuSelection = -1;
    let pressedItem = null;
    let cursorBlink = 0, cursorVisible = true;
    let running = false, rafId = null;

    // ─── 磁盘文件系统 ───
    // 用 Disk 模块的扇区 1-8（每扇区 512 字节）存文件
    // 结构：每文件占 1 扇区，前 32 字节是文件名，后 480 字节是内容
    const FS_START_SECTOR = 1;
    const FS_MAX_FILES = 8;
    const FS_NAME_LEN = 32;
    const FS_DATA_LEN = 480;

    function fsReadFile(idx) {
        if (idx < 0 || idx >= FS_MAX_FILES) return null;
        const buf = new Uint8Array(512);
        try {
            Disk.readSector(FS_START_SECTOR + idx, 0x4000);   // 临时缓冲区 0x4000
            for (let i = 0; i < 512; i++) buf[i] = Memory.readByte(0x4000 + i);
        } catch (e) { return null; }
        // 检查是否有内容
        let name = '';
        for (let i = 0; i < FS_NAME_LEN; i++) {
            if (buf[i] === 0) break;
            name += String.fromCharCode(buf[i]);
        }
        if (!name) return null;
        let content = '';
        for (let i = FS_NAME_LEN; i < 512; i++) {
            if (buf[i] === 0) break;
            content += String.fromCharCode(buf[i]);
        }
        return { name: name, content: content, idx: idx };
    }

    function fsWriteFile(idx, name, content) {
        if (idx < 0 || idx >= FS_MAX_FILES) return false;
        const buf = new Uint8Array(512);
        for (let i = 0; i < Math.min(name.length, FS_NAME_LEN - 1); i++) buf[i] = name.charCodeAt(i);
        for (let i = 0; i < Math.min(content.length, FS_DATA_LEN - 1); i++) {
            buf[FS_NAME_LEN + i] = content.charCodeAt(i);
        }
        for (let i = 0; i < 512; i++) Memory.writeByte(0x4000 + i, buf[i]);
        try {
            Disk.writeSector(FS_START_SECTOR + idx, 0x4000);
            return true;
        } catch (e) { return false; }
    }

    function fsDeleteFile(idx) {
        if (idx < 0 || idx >= FS_MAX_FILES) return false;
        for (let i = 0; i < 512; i++) Memory.writeByte(0x4000 + i, 0);
        try {
            Disk.writeSector(FS_START_SECTOR + idx, 0x4000);
            return true;
        } catch (e) { return false; }
    }

    function fsListFiles() {
        const list = [];
        for (let i = 0; i < FS_MAX_FILES; i++) {
            const f = fsReadFile(i);
            if (f) list.push(f);
        }
        return list;
    }

    // ─── 汇编器（简版：只支持 C2 指令集的一部分）───
    // 每行一条指令
    // 支持格式：MOV R0, 5 / ADD R0, R1 / INT 0x10 / HLT 等
    const OPCODES = {
        'NOP':0x00,'HLT':0x01,
        'MOV':0x10,'ADD':0x20,'SUB':0x22,'MUL':0x24,'DIV':0x25,
        'AND':0x30,'OR':0x31,'XOR':0x32,'NOT':0x33,
        'CMP':0x40,
        'JMP':0x50,'JZ':0x51,'JNZ':0x52,'JC':0x53,'JNC':0x54,'JN':0x55,
        'PUSH':0x60,'POP':0x61,'CALL':0x62,'RET':0x63,
        'IN':0x70,'OUT':0x71,'INT':0x72,'IRET':0x73,'STI':0x74,'CLI':0x75
    };

    /**
     * 汇编一行
     * 返回 { ok, bytes, error }
     */
    function assembleLine(line, labels, pc) {
        line = line.replace(/;.*$/, '').trim();   // 去掉注释
        if (!line) return { ok: true, bytes: new Uint8Array(0) };   // 空行

        // 标签：name:
        let m = line.match(/^(\w+):\s*(.*)$/);
        if (m) {
            labels[m[1]] = pc;
            line = m[2].trim();
            if (!line) return { ok: true, bytes: new Uint8Array(0) };
        }

        // 指令解析
        const parts = line.split(/\s+/);
        const mnemonic = parts[0].toUpperCase();
        const args = line.slice(mnemonic.length).trim().split(',').map(s => s.trim());

        const bytes = new Uint8Array(4);
        let opcode = OPCODES[mnemonic];
        if (opcode === undefined) {
            return { ok: false, error: '未知指令: ' + mnemonic };
        }
        bytes[0] = opcode;

        function reg(s) {
            const m = s.match(/^R(\d+)$/i);
            if (!m) return -1;
            return parseInt(m[1]);
        }
        function imm(s) {
            if (s.startsWith('0x') || s.startsWith('0X')) return parseInt(s.substring(2), 16);
            // 标签
            if (labels[s] !== undefined) return labels[s];
            // 数字
            const n = parseInt(s);
            if (isNaN(n)) return null;
            return n;
        }

        try {
            if (mnemonic === 'NOP' || mnemonic === 'HLT' || mnemonic === 'RET' ||
                mnemonic === 'IRET' || mnemonic === 'STI' || mnemonic === 'CLI') {
                // 无参数
            }
            else if (mnemonic === 'MOV' || mnemonic === 'ADD' || mnemonic === 'SUB' ||
                     mnemonic === 'MUL' || mnemonic === 'DIV' || mnemonic === 'AND' ||
                     mnemonic === 'OR' || mnemonic === 'XOR' || mnemonic === 'CMP') {
                // MOV Rd, Rs 或 MOV Rd, #imm
                const rd = reg(args[0]);
                if (rd < 0) return { ok: false, error: '非法目标寄存器: ' + args[0] };
                const rs = reg(args[1]);
                if (rs >= 0) {
                    // 寄存器-寄存器
                    bytes[1] = rd;
                    bytes[2] = rs;
                } else {
                    // 立即数
                    const v = imm(args[1]);
                    if (v === null) return { ok: false, error: '非法立即数: ' + args[1] };
                    bytes[0] = opcode + 1;   // _RI 变体
                    bytes[1] = rd;
                    bytes[2] = (v >> 8) & 0xFF;
                    bytes[3] = v & 0xFF;
                }
            }
            else if (mnemonic === 'NOT' || mnemonic === 'PUSH' || mnemonic === 'POP') {
                const r = reg(args[0]);
                if (r < 0) return { ok: false, error: '非法寄存器: ' + args[0] };
                bytes[1] = r;
            }
            else if (mnemonic === 'JMP' || mnemonic === 'JZ' || mnemonic === 'JNZ' ||
                     mnemonic === 'JC' || mnemonic === 'JNC' || mnemonic === 'JN' ||
                     mnemonic === 'CALL') {
                const v = imm(args[0]);
                if (v === null) return { ok: false, error: '非法地址: ' + args[0] };
                bytes[2] = (v >> 8) & 0xFF;
                bytes[3] = v & 0xFF;
            }
            else if (mnemonic === 'INT') {
                const v = imm(args[0]);
                if (v === null) return { ok: false, error: '非法中断号: ' + args[0] };
                bytes[1] = v & 0xFF;
            }
            else if (mnemonic === 'IN') {
                const rd = reg(args[0]);
                const p = imm(args[1]);
                if (rd < 0 || p === null) return { ok: false, error: 'IN 参数错' };
                bytes[1] = rd;
                bytes[2] = p & 0xFF;
            }
            else if (mnemonic === 'OUT') {
                const p = imm(args[0]);
                const rs = reg(args[1]);
                if (p === null || rs < 0) return { ok: false, error: 'OUT 参数错' };
                bytes[1] = p & 0xFF;
                bytes[2] = rs;
            }
            else {
                return { ok: false, error: '不支持的指令: ' + mnemonic };
            }
        } catch (e) {
            return { ok: false, error: e.message };
        }

        return { ok: true, bytes: bytes };
    }

    /**
     * 汇编整个程序
     * 返回 { ok, bytes, errors, labels }
     */
    function assembleProgram(src) {
        const lines = src.split('\n');
        const labels = {};
        const errors = [];
        let pc = 0x0100;   // 程序加载到 0x0100

        // 第一遍：收集标签
        for (const line of lines) {
            const m = line.match(/^\s*(\w+):/);
            if (m) {
                labels[m[1]] = pc;
            }
            // 跳过空行和纯标签行
            const code = line.replace(/;.*$/, '').replace(/^\s*\w+:\s*/, '').trim();
            if (code) pc += 4;
        }

        // 第二遍：生成字节
        const program = [];
        for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed) continue;
            const code = line.replace(/;.*$/, '').replace(/^\s*\w+:\s*/, '').trim();
            if (!code) continue;

            const r = assembleLine(line, labels, program.length * 4 + 0x0100);
            if (!r.ok) {
                errors.push(line + '  →  ' + r.error);
            } else {
                program.push(...r.bytes);
            }
        }

        return {
            ok: errors.length === 0,
            bytes: new Uint8Array(program),
            errors: errors,
            labels: labels
        };
    }

    // ═══ 底层绘图 ═══
    function px(x, y, c) { Display.putPixel(x|0, y|0, c); }
    function fill(x, y, w, h, c) { Display.fillRect(x|0, y|0, w|0, h|0, c); }
    function hline(x1, x2, y, c) { Display.drawHLine(x1|0, x2|0, y|0, c); }
    function vline(x, y1, y2, c) { Display.drawVLine(x|0, y1|0, y2|0, c); }
    function text(x, y, s, c) {
        let cx = x;
        for (let i = 0; i < s.length; i++) {
            if (cx + 8 > W) break;
            Display.drawCharGfx(cx, y, s.charCodeAt(i), c);
            cx += 8;
        }
    }

    // ═══ 窗口工厂 ═══
    function makeWin(opts) {
        return Object.assign({
            id: nextWinId++,
            x: 10, y: 15, w: 100, h: 70,
            title: 'Window',
            visible: true,
            type: 'lines',
            lines: [],
            buffer: '',
            calcDisplay: '0', calcOp: null, calcAcc: 0,
            paintBuf: null, paintColor: C_RED,
            termLines: ['JS-H86 C2 Terminal', 'Type "help"', ''], termInput: '',
            // Files
            fsFiles: null, fsSelected: -1,
            // Editor
            editorText: '',
            editorErrors: [],
            editorStatus: '',
            buttons: null,
            hoverBtn: -1
        }, opts);
    }

    function createWin(opts) {
        if (windows.length >= 4) return null;
        const w = makeWin(opts);
        if (w.type === 'paint') {
            const cw = w.w - 4, ch = w.h - 22;
            w.paintBuf = new Uint8Array(cw * ch);
        }
        if (w.type === 'files') {
            w.fsFiles = fsListFiles();
        }
        if (w.type === 'editor') {
            if (!w.editorText) {
                w.editorText = '; C2 Assembly\nMOV R0, 5\nMOV R1, 3\nADD R0, R1\nINT 0x10\nHLT\n';
            }
        }
        windows.push(w);
        activeWinId = w.id;
        return w;
    }

    function findWin(id) {
        for (const w of windows) if (w.id === id) return w;
        return null;
    }
    function closeWin(id) {
        const idx = windows.findIndex(w => w.id === id);
        if (idx >= 0) {
            windows.splice(idx, 1);
            if (activeWinId === id) activeWinId = windows.length > 0 ? windows[windows.length-1].id : 0;
        }
    }
    function bringToFront(id) {
        const idx = windows.findIndex(w => w.id === id);
        if (idx >= 0) {
            const [w] = windows.splice(idx, 1);
            windows.push(w);
            activeWinId = id;
        }
    }

    function hitTest(mx, my) {
        if (my < MENUBAR_H) return { id: 0, region: 'menu' };
        for (let i = windows.length - 1; i >= 0; i--) {
            const w = windows[i];
            if (!w.visible) continue;
            if (mx >= w.x && mx < w.x + w.w && my >= w.y && my < w.y + w.h) {
                const cbx = w.x + w.w - 8, cby = w.y + 2;
                if (mx >= cbx && mx < cbx + 6 && my >= cby && my < cby + 6) return { id: w.id, region: 'close' };
                if (my < w.y + 10) return { id: w.id, region: 'title' };
                return { id: w.id, region: 'body' };
            }
        }
        return { id: 0, region: 'none' };
    }

    // ═══ 绘制 ═══
    function drawDesktop() {
        fill(0, 0, W, H, C_BLUE);
        for (let i = 0; i < W; i += 16) px(i, H - 1, C_DGRAY);
    }

    function drawMenuBar() {
        fill(0, 0, W, MENUBAR_H, C_BLACK);
        text(2, 1, 'C2 GShell', C_YELLOW);
        const sysX = 70;
        text(sysX, 1, 'System', C_WHITE);
        if (menuOpen) {
            fill(sysX - 2, 0, 6 * 8 + 4, MENUBAR_H, C_LBLUE);
            text(sysX, 1, 'System', C_BLACK);
        }
    }

    function drawMenuDropdown() {
        if (!menuOpen) return;
        const dx = 68, dy = MENUBAR_H, dw = 100, itemH = 10;
        const dh = MENU_ITEMS.length * itemH + 2;
        fill(dx + 1, dy + 1, dw, dh, C_DGRAY);
        fill(dx, dy, dw, dh, C_GRAY);
        hline(dx, dx + dw - 1, dy, C_BLACK);
        hline(dx, dx + dw - 1, dy + dh - 1, C_BLACK);
        vline(dx, dy, dy + dh - 1, C_BLACK);
        vline(dx + dw - 1, dy, dy + dh - 1, C_BLACK);
        for (let i = 0; i < MENU_ITEMS.length; i++) {
            const iy = dy + 1 + i * itemH;
            if (MENU_ITEMS[i] === '---') {
                hline(dx + 2, dx + dw - 3, iy + itemH/2, C_DGRAY);
                continue;
            }
            if (menuSelection === i) {
                fill(dx + 1, iy, dw - 2, itemH, C_BLUE);
                text(dx + 4, iy + 1, MENU_ITEMS[i], C_WHITE);
            } else {
                text(dx + 4, iy + 1, MENU_ITEMS[i], C_BLACK);
            }
        }
    }

    function drawWindowBorder(win) {
        const { x, y, w, h } = win;
        const isActive = (win.id === activeWinId);
        const titleColor = isActive ? C_BLUE : C_DGRAY;
        const titleText = isActive ? C_WHITE : C_GRAY;
        fill(x + 1, y + 1, w, h, C_DGRAY);
        fill(x, y, w, h, C_GRAY);
        hline(x, x + w - 1, y, C_BLACK);
        hline(x, x + w - 1, y + h - 1, C_BLACK);
        vline(x, y, y + h - 1, C_BLACK);
        vline(x + w - 1, y, y + h - 1, C_BLACK);
        fill(x + 1, y + 1, w - 2, 9, titleColor);
        text(x + 3, y + 2, win.title, titleText);
        const cbx = x + w - 8, cby = y + 2;
        fill(cbx, cby, 6, 6, C_RED);
        px(cbx + 1, cby + 1, C_WHITE); px(cbx + 2, cby + 2, C_WHITE);
        px(cbx + 3, cby + 3, C_WHITE); px(cbx + 4, cby + 4, C_WHITE);
        px(cbx + 4, cby + 1, C_WHITE); px(cbx + 3, cby + 2, C_WHITE);
        px(cbx + 2, cby + 3, C_WHITE); px(cbx + 1, cby + 4, C_WHITE);
    }

    function drawWindowContent(win) {
        const { x, y, w, h } = win;
        const padX = x + 3, padY = y + 12;

        if (win.type === 'lines' || win.type === 'notepad') {
            const maxW = w - 6, maxH = h - 15;
            const cols = Math.floor(maxW / 8), rows = Math.floor(maxH / 8);
            const lines = win.type === 'notepad' ? win.buffer.split('\n') : win.lines;
            const showLines = lines.slice(-rows);
            for (let i = 0; i < showLines.length; i++) {
                let line = showLines[i];
                if (line.length > cols) line = line.slice(-cols);
                text(padX, padY + i * 8, line, C_BLACK);
            }
            if (win.type === 'notepad' && win.id === activeWinId && cursorVisible) {
                const lastLine = lines[lines.length - 1] || '';
                const curLineIdx = lines.length - 1;
                if (curLineIdx < rows) {
                    const cx = padX + Math.min(lastLine.length, cols) * 8;
                    const cy = padY + curLineIdx * 8;
                    fill(cx, cy + 7, 6, 2, C_BLACK);
                }
            }
        } else if (win.type === 'calculator') {
            drawCalculator(win);
        } else if (win.type === 'paint') {
            drawPaint(win);
        } else if (win.type === 'terminal') {
            drawTerminal(win);
        } else if (win.type === 'files') {
            drawFiles(win);
        } else if (win.type === 'editor') {
            drawEditor(win);
        }
    }

    function drawCalculator(win) {
        const { x, y, w, h } = win;
        const padX = x + 3, padY = y + 12;
        const dispW = w - 6;
        fill(padX, padY, dispW, 12, C_BLACK);
        text(padX + 2, padY + 2, win.calcDisplay, C_LGREEN);
        if (!win.buttons) {
            const btnW = Math.floor((w - 8) / 4), btnH = 10;
            const labels = [
                ['C','CE','←','/'],
                ['7','8','9','*'],
                ['4','5','6','-'],
                ['1','2','3','+'],
                ['0','.','=','=']
            ];
            win.buttons = [];
            for (let r = 0; r < 5; r++) for (let c = 0; c < 4; c++) {
                win.buttons.push({
                    x: padX + c * btnW,
                    y: padY + 16 + r * (btnH + 1),
                    w: btnW - 1, h: btnH, label: labels[r][c]
                });
            }
        }
        for (let i = 0; i < win.buttons.length; i++) {
            const b = win.buttons[i];
            const isHover = (pressedItem && pressedItem.winId === win.id && pressedItem.itemId === i);
            fill(b.x, b.y, b.w, b.h, isHover ? C_LBLUE : C_GRAY);
            hline(b.x, b.x + b.w - 1, b.y, C_BLACK);
            hline(b.x, b.x + b.w - 1, b.y + b.h - 1, C_BLACK);
            vline(b.x, b.y, b.y + b.h - 1, C_BLACK);
            vline(b.x + b.w - 1, b.y, b.y + b.h - 1, C_BLACK);
            text(b.x + Math.max(1, Math.floor((b.w - b.label.length*8)/2)), b.y + 1, b.label, C_BLACK);
        }
    }

    function drawPaint(win) {
        const { x, y, w, h } = win;
        const padX = x + 2, padY = y + 12;
        const cw = w - 4, ch = h - 22;
        fill(padX, padY, cw, ch, C_WHITE);
        if (win.paintBuf) {
            for (let py = 0; py < ch; py++) for (let pxi = 0; pxi < cw; pxi++) {
                const c = win.paintBuf[py * cw + pxi];
                if (c) px(padX + pxi, padY + py, c);
            }
        }
        hline(padX, padX + cw - 1, padY - 1, C_BLACK);
        hline(padX, padX + cw - 1, padY + ch, C_BLACK);
        vline(padX - 1, padY, padY + ch - 1, C_BLACK);
        vline(padX + cw, padY, padY + ch - 1, C_BLACK);
        const palY = padY + ch + 2;
        const colors = [C_BLACK, C_RED, C_GREEN, C_BLUE, C_YELLOW, C_WHITE];
        for (let i = 0; i < colors.length; i++) {
            const swX = padX + i * 10;
            fill(swX, palY, 8, 6, colors[i]);
            if (colors[i] === win.paintColor) {
                hline(swX, swX + 7, palY - 1, C_BLACK);
                hline(swX, swX + 7, palY + 6, C_BLACK);
            }
        }
    }

    function drawTerminal(win) {
        const { x, y, w, h } = win;
        const padX = x + 2, padY = y + 12;
        const maxW = w - 4, maxH = h - 15;
        const rows = Math.floor((maxH - 10) / 8), cols = Math.floor(maxW / 8);
        fill(padX, padY, maxW, maxH, C_BLACK);
        const showLines = win.termLines.slice(-rows);
        for (let i = 0; i < showLines.length; i++) {
            let line = showLines[i];
            if (line.length > cols) line = line.slice(-cols);
            text(padX + 1, padY + 1 + i * 8, line, C_LGREEN);
        }
        const inputY = padY + maxH - 10;
        text(padX + 1, inputY, '> ' + win.termInput, C_WHITE);
        if (win.id === activeWinId && cursorVisible) {
            fill(padX + 9 + win.termInput.length * 8, inputY + 7, 6, 2, C_WHITE);
        }
    }

    function drawFiles(win) {
        const { x, y, w, h } = win;
        const padX = x + 2, padY = y + 12;
        const maxW = w - 4, maxH = h - 15;
        fill(padX, padY, maxW, maxH, C_BLACK);
        // 刷新列表
        win.fsFiles = fsListFiles();
        if (win.fsFiles.length === 0) {
            text(padX + 4, padY + 4, '(no files)', C_GRAY);
        } else {
            for (let i = 0; i < win.fsFiles.length && i < 7; i++) {
                const f = win.fsFiles[i];
                const isSel = (i === win.fsSelected);
                if (isSel) fill(padX + 1, padY + 1 + i * 9, maxW - 2, 9, C_BLUE);
                text(padX + 3, padY + 2 + i * 9, '[' + i + '] ' + f.name, isSel ? C_WHITE : C_LGREEN);
            }
        }
        // 底部提示
        const hintY = padY + maxH - 9;
        fill(padX, hintY, maxW, 9, C_DGRAY);
        text(padX + 2, hintY + 1, 'N=New  D=Del  Enter=Open', C_WHITE);
    }

    function drawEditor(win) {
        const { x, y, w, h } = win;
        const padX = x + 2, padY = y + 12;
        const maxW = w - 4, maxH = h - 22;
        fill(padX, padY, maxW, maxH, C_BLACK);
        // 显示文本
        const lines = win.editorText.split('\n');
        const rows = Math.floor(maxH / 8), cols = Math.floor(maxW / 8);
        const showLines = lines.slice(-rows);
        for (let i = 0; i < showLines.length; i++) {
            let line = showLines[i];
            if (line.length > cols) line = line.slice(-cols);
            text(padX + 1, padY + 1 + i * 8, line, C_LGREEN);
        }
        // 光标
        if (win.id === activeWinId && cursorVisible) {
            const lastLine = lines[lines.length - 1] || '';
            const curLineIdx = lines.length - 1;
            if (curLineIdx < rows) {
                const cx = padX + 1 + Math.min(lastLine.length, cols) * 8;
                const cy = padY + 1 + curLineIdx * 8;
                fill(cx, cy + 7, 6, 2, C_LGREEN);
            }
        }
        // 底部状态栏
        const statusY = padY + maxH;
        fill(padX, statusY, maxW, 9, C_DGRAY);
        text(padX + 2, statusY + 1, win.editorStatus || 'F5=Assemble&Run  Esc=Close', C_WHITE);
    }

    function drawCursor() {
        const mx = Mouse.getX(), my = Mouse.getY();
        px(mx, my, C_WHITE);
        px(mx - 1, my, C_WHITE);
        px(mx + 1, my, C_WHITE);
        px(mx, my - 1, C_WHITE);
        px(mx, my + 1, C_WHITE);
    }

    function drawAll() {
        drawDesktop();
        for (const w of windows) {
            drawWindowBorder(w);
            drawWindowContent(w);
        }
        drawMenuBar();
        drawMenuDropdown();
        drawCursor();
    }

    function tick() {
        if (!running) return;
        drawAll();
        Display.render();
        cursorBlink++;
        if (cursorBlink % 15 === 0) cursorVisible = !cursorVisible;
        rafId = setTimeout(tick, 50);
    }

    // ═══ 事件 ═══
    function onMouseDown(mx, my, btn) {
        if (!(btn & 1)) return;

        if (my < MENUBAR_H) {
            if (mx >= 68 && mx < 68 + 6 * 8) { menuOpen = !menuOpen; menuSelection = -1; }
            else menuOpen = false;
            return;
        }

        if (menuOpen) {
            const dx = 68, dy = MENUBAR_H, dw = 100, itemH = 10;
            const dh = MENU_ITEMS.length * itemH + 2;
            if (mx >= dx && mx < dx + dw && my >= dy && my < dy + dh) {
                const idx = Math.floor((my - dy - 1) / itemH);
                if (idx >= 0 && idx < MENU_ITEMS.length && MENU_ITEMS[idx] !== '---') handleMenuItem(idx);
                menuOpen = false;
                return;
            } else {
                menuOpen = false;
            }
        }

        const hit = hitTest(mx, my);
        if (hit.id === 0) return;
        bringToFront(hit.id);

        if (hit.region === 'close') { closeWin(hit.id); return; }
        if (hit.region === 'title') {
            const w = findWin(hit.id);
            if (w) { draggingWinId = w.id; dragOffsetX = mx - w.x; dragOffsetY = my - w.y; }
            return;
        }

        const w = findWin(hit.id);
        if (!w) return;

        // Files 窗口：点击文件列表
        if (w.type === 'files') {
            const padX = w.x + 2, padY = w.y + 12;
            const localY = my - padY;
            if (localY >= 0 && localY < 7 * 9) {
                const idx = Math.floor(localY / 9);
                if (idx >= 0 && idx < w.fsFiles.length) {
                    w.fsSelected = idx;
                    // 双击打开？简化：单击选中，回车打开
                }
            }
        }

        handleContentClick(w, mx, my, true);
    }

    function onMouseMove(mx, my) {
        if (draggingWinId) {
            const w = findWin(draggingWinId);
            if (w) {
                w.x = Math.max(0, Math.min(W - w.w, mx - dragOffsetX));
                w.y = Math.max(MENUBAR_H, Math.min(H - 10, my - dragOffsetY));
            }
            return;
        }
        if (menuOpen) {
            const dx = 68, dy = MENUBAR_H, dw = 100, itemH = 10;
            const dh = MENU_ITEMS.length * itemH + 2;
            if (mx >= dx && mx < dx + dw && my >= dy && my < dy + dh) {
                const idx = Math.floor((my - dy - 1) / itemH);
                menuSelection = (idx >= 0 && idx < MENU_ITEMS.length) ? idx : -1;
            } else menuSelection = -1;
        }
        const hit = hitTest(mx, my);
        if (hit.id > 0) {
            const w = findWin(hit.id);
            if (w) handleContentClick(w, mx, my, false);
        }
    }

    function onMouseUp(mx, my, btn) {
        if (draggingWinId) { draggingWinId = 0; pressedItem = null; return; }
        if (pressedItem) {
            const w = findWin(pressedItem.winId);
            if (w) handleContentClick(w, mx, my, 'up');
            pressedItem = null;
        }
    }

    function handleContentClick(w, mx, my, isDown) {
        if (w.type === 'calculator') {
            if (!w.buttons) return;
            for (let i = 0; i < w.buttons.length; i++) {
                const b = w.buttons[i];
                if (mx >= b.x && mx < b.x + b.w && my >= b.y && my < b.y + b.h) {
                    if (isDown === true) { pressedItem = { winId: w.id, itemId: i }; calcInput(w, b.label); }
                    return;
                }
            }
        } else if (w.type === 'paint') {
            const padX = w.x + 2, padY = w.y + 12;
            const cw = w.w - 4, ch = w.h - 22;
            const palY = padY + ch + 2;
            if (my >= palY && my < palY + 6) {
                const colors = [C_BLACK, C_RED, C_GREEN, C_BLUE, C_YELLOW, C_WHITE];
                const idx = Math.floor((mx - padX) / 10);
                if (idx >= 0 && idx < colors.length) { w.paintColor = colors[idx]; return; }
            }
            if (mx >= padX && mx < padX + cw && my >= padY && my < padY + ch) {
                if (isDown === true) pressedItem = { winId: w.id, itemId: 'paint' };
                const pxi = mx - padX, pyi = my - padY;
                if (pxi >= 0 && pxi < cw && pyi >= 0 && pyi < ch) {
                    w.paintBuf[pyi * cw + pxi] = w.paintColor;
                }
            }
        }
    }

    function calcInput(w, label) {
        const d = w.calcDisplay;
        if (label === 'C') { w.calcDisplay = '0'; w.calcOp = null; w.calcAcc = 0; return; }
        if (label === 'CE') { w.calcDisplay = '0'; return; }
        if (label === '←') { w.calcDisplay = d.length > 1 ? d.slice(0, -1) : '0'; return; }
        if ('+-*/'.includes(label)) {
            w.calcAcc = parseFloat(d) || 0;
            w.calcOp = label;
            w.calcDisplay = '0';
            return;
        }
        if (label === '=') {
            const b = parseFloat(d) || 0;
            let r = w.calcAcc;
            switch (w.calcOp) {
                case '+': r += b; break;
                case '-': r -= b; break;
                case '*': r *= b; break;
                case '/': r = b === 0 ? 0 : r / b; break;
                default: r = b;
            }
            let s = (Math.round(r * 100) / 100).toString();
            if (s.length > 8) s = s.slice(0, 8);
            w.calcDisplay = s;
            w.calcOp = null; w.calcAcc = 0;
            return;
        }
        if (label === '.') { if (!d.includes('.')) w.calcDisplay = d + '.'; return; }
        if (d === '0') w.calcDisplay = label;
        else if (d.length < 8) w.calcDisplay = d + label;
    }

    function termExec(w, cmd) {
        cmd = cmd.trim();
        w.termLines.push('> ' + cmd);
        if (cmd === '') return;
        if (cmd === 'help') {
            w.termLines.push('Commands: help, clear, echo X, ver, ls, cat N');
        } else if (cmd === 'clear') {
            w.termLines = [];
        } else if (cmd.startsWith('echo ')) {
            w.termLines.push(cmd.slice(5));
        } else if (cmd === 'ver') {
            w.termLines.push('JS-H86 C2 v2.1');
        } else if (cmd === 'ls') {
            const files = fsListFiles();
            if (files.length === 0) w.termLines.push('(no files)');
            else files.forEach((f, i) => w.termLines.push('[' + i + '] ' + f.name));
        } else if (cmd.startsWith('cat ')) {
            const idx = parseInt(cmd.slice(4));
            const f = fsReadFile(idx);
            if (f) w.termLines.push(f.content);
            else w.termLines.push('No such file');
        } else {
            w.termLines.push('Unknown: ' + cmd);
        }
    }

    // ─── Files 操作 ───
    function filesNew(w) {
        const name = prompt('文件名:', 'file' + (w.fsFiles.length + 1) + '.txt');
        if (!name) return;
        // 找空槽位
        for (let i = 0; i < FS_MAX_FILES; i++) {
            if (!fsReadFile(i)) {
                fsWriteFile(i, name, '');
                w.fsFiles = fsListFiles();
                w.fsSelected = w.fsFiles.findIndex(f => f.name === name);
                return;
            }
        }
        alert('磁盘已满');
    }
    function filesDelete(w) {
        if (w.fsSelected < 0 || w.fsSelected >= w.fsFiles.length) return;
        const f = w.fsFiles[w.fsSelected];
        fsDeleteFile(f.idx);
        w.fsFiles = fsListFiles();
        w.fsSelected = -1;
    }
    function filesOpen(w) {
        if (w.fsSelected < 0 || w.fsSelected >= w.fsFiles.length) return;
        const f = w.fsFiles[w.fsSelected];
        // 打开到 Editor
        createWin({ x: 15, y: 18, w: 130, h: 90, title: f.name, type: 'editor', editorText: f.content });
    }

    // ─── Editor 操作 ───
    function editorRun(w) {
        const result = assembleProgram(w.editorText);
        if (!result.ok) {
            w.editorStatus = 'ERROR: ' + result.errors[0];
            return;
        }
        // 加载到 0x0100
        Memory.writeBlock(0x0100, result.bytes);
        CPU.setPC(0x0100);
        CPU.setState('RUNNING');
        const r = CPU.run(1000);
        w.editorStatus = 'OK: ' + result.bytes.length + 'B, exec ' + r.executed + ' instr';
        // 保存到磁盘
        // 找同名文件，找不到就写入第一个空槽位
        for (let i = 0; i < FS_MAX_FILES; i++) {
            const f = fsReadFile(i);
            if (f && f.name === w.title) {
                fsWriteFile(i, w.title, w.editorText);
                break;
            }
        }
    }

    // ─── 菜单 ───
    function handleMenuItem(idx) {
        const item = MENU_ITEMS[idx];
        switch (item) {
            case 'New Notepad': createWin({ x: 20, y: 20, w: 100, h: 70, title: 'Notepad', type: 'notepad', buffer: '' }); break;
            case 'Calculator': createWin({ x: 20, y: 20, w: 70, h: 80, title: 'Calc', type: 'calculator' }); break;
            case 'Paint': createWin({ x: 20, y: 20, w: 100, h: 80, title: 'Paint', type: 'paint' }); break;
            case 'Terminal': createWin({ x: 15, y: 18, w: 120, h: 80, title: 'Terminal', type: 'terminal' }); break;
            case 'Files': createWin({ x: 15, y: 18, w: 120, h: 80, title: 'Files', type: 'files' }); break;
            case 'Editor': createWin({ x: 10, y: 15, w: 140, h: 95, title: 'Editor', type: 'editor' }); break;
            case 'Close All': windows = []; activeWinId = 0; break;
            case 'About': createWin({ x: 30, y: 25, w: 100, h: 60, title: 'About', type: 'lines',
                lines: ['JS-H86 C2 v2.1', 'Graphical Shell', 'Files + Assembler', '(c) Snxth 2026'] }); break;
            case 'Exit': exit(); break;
        }
    }

    // ─── 键盘 ───
    function onKeyDown(e) {
        const w = findWin(activeWinId);
        if (!w) return;

        if (w.type === 'notepad') {
            if (e.key === 'Backspace') { w.buffer = w.buffer.slice(0, -1); e.preventDefault(); return; }
            if (e.key === 'Enter') { w.buffer += '\n'; e.preventDefault(); return; }
            if (e.key.length === 1 && w.buffer.length < 500) { w.buffer += e.key; e.preventDefault(); }
        } else if (w.type === 'terminal') {
            if (e.key === 'Backspace') { w.termInput = w.termInput.slice(0, -1); e.preventDefault(); return; }
            if (e.key === 'Enter') { termExec(w, w.termInput); w.termInput = ''; e.preventDefault(); return; }
            if (e.key.length === 1 && w.termInput.length < 30) { w.termInput += e.key; e.preventDefault(); }
        } else if (w.type === 'calculator') {
            if (e.key >= '0' && e.key <= '9') { calcInput(w, e.key); e.preventDefault(); }
            else if ('+-*/'.includes(e.key)) { calcInput(w, e.key); e.preventDefault(); }
            else if (e.key === 'Enter' || e.key === '=') { calcInput(w, '='); e.preventDefault(); }
            else if (e.key === 'Backspace') { calcInput(w, '←'); e.preventDefault(); }
            else if (e.key === 'Escape') { calcInput(w, 'C'); e.preventDefault(); }
        } else if (w.type === 'files') {
            if (e.key === 'n' || e.key === 'N') { filesNew(w); e.preventDefault(); }
            else if (e.key === 'd' || e.key === 'D') { filesDelete(w); e.preventDefault(); }
            else if (e.key === 'Enter') { filesOpen(w); e.preventDefault(); }
        } else if (w.type === 'editor') {
            if (e.key === 'F5') { editorRun(w); e.preventDefault(); return; }
            if (e.key === 'Backspace') { w.editorText = w.editorText.slice(0, -1); e.preventDefault(); return; }
            if (e.key === 'Enter') { w.editorText += '\n'; e.preventDefault(); return; }
            if (e.key === 'Tab') { w.editorText += '  '; e.preventDefault(); return; }
            if (e.key.length === 1 && w.editorText.length < 800) { w.editorText += e.key; e.preventDefault(); }
        }
    }

    // ─── 启动/退出 ───
    function boot() {
        if (running) return;
        Memory.clear();
        CPU.reset();
        Display.setMode(Display.MODE_GFX);
        Display.clearGfx(C_BLUE);

        if (!document.getElementById('c1-display-canvas')) {
            if (typeof Terminal._openDisplayWindow === 'function') Terminal._openDisplayWindow();
        }

        running = true;
        cursorBlink = 0; cursorVisible = true;
        nextWinId = 1; activeWinId = 0; draggingWinId = 0;
        menuOpen = false; menuSelection = -1; pressedItem = null;
        windows = [];

        // 初始 System Info
        createWin({
            x: 30, y: 20, w: 100, h: 70, title: 'System Info', type: 'lines',
            lines: ['JS-H86 C2 v2.1', 'RAM: 64 KB', 'Disk: 1 MB',
                    'Files: ' + fsListFiles().length, 'Click "System"!']
        });

        bindCanvasInput();
        tick();

        Terminal.printLine('GShell2 v2.1 已启动', 'line-success');
        Terminal.printLine('  菜单：Notepad / Calculator / Paint / Terminal / Files / Editor', 'line-info');
        Terminal.printLine('  Files 窗口：N=新建 D=删除 Enter=打开', 'line-info');
        Terminal.printLine('  Editor 窗口：写 C2 汇编，F5 编译运行', 'line-info');
        Terminal.newLine();
    }

    function bindCanvasInput() {
        const canvas = document.getElementById('c1-display-canvas');
        if (!canvas || canvas._gshell2_bound) return;
        canvas._gshell2_bound = true;

        function toC1(e) {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / rect.width * W);
            const y = Math.floor((e.clientY - rect.top) / rect.height * H);
            return { x: Math.max(0, Math.min(W - 1, x)), y: Math.max(0, Math.min(H - 1, y)) };
        }

        canvas.addEventListener('mousedown', function(e) {
            const p = toC1(e);
            let btn = e.button === 0 ? 1 : (e.button === 2 ? 2 : 0);
            onMouseDown(p.x, p.y, btn);
            Mouse.setPosition(p.x, p.y);
            Mouse.setButtons(btn);
            e.preventDefault();
        });

        canvas.addEventListener('mousemove', function(e) {
            const p = toC1(e);
            onMouseMove(p.x, p.y);
            Mouse.setPosition(p.x, p.y);
            if (pressedItem) {
                const w = findWin(pressedItem.winId);
                if (w && w.type === 'paint' && pressedItem.itemId === 'paint') {
                    handleContentClick(w, p.x, p.y, true);
                }
            }
        });

        canvas.addEventListener('mouseup', function(e) {
            const p = toC1(e);
            onMouseUp(p.x, p.y, 0);
            Mouse.setButtons(0);
        });

        canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });

        if (!window._gshell2_key_bound) {
            window._gshell2_key_bound = true;
            window.addEventListener('keydown', function(e) {
                if (!running) return;
                if (e.key === 'Escape' && !findWin(activeWinId)) { exit(); e.preventDefault(); return; }
                onKeyDown(e);
            });
        }
    }

    function exit() {
        running = false;
        if (rafId) { clearTimeout(rafId); rafId = null; }
        Display.setMode(Display.MODE_TEXT);
        Display.clearText();
        Display.setCursor(0, 0);
        const msg = 'GShell2 exited.';
        for (let i = 0; i < msg.length; i++) Display.putCharAtCursor(msg[i]);
        Terminal.printLine('[GShell2] 退出，切回文本模式。', 'line-success');
        Terminal.newLine();
    }

    return {
        boot: boot,
        exit: exit,
        isRunning: function() { return running; },
        listWindows: function() { return windows.slice(); }
    };
})();
/* ═══════════════════════════════════════════════════════════
   GShell2 键盘焦点锁定补丁
   - GShell2 运行时：终端输入框失焦 + 禁止抢焦点
   - GShell2 退出时：恢复终端焦点
   - 同时清空 C1 键盘缓冲区，避免残留按键污染
   ═══════════════════════════════════════════════════════════ */
(function() {

    window._gshell2FocusGuard = false;
    let lastRunning = false;

    // 捕获阶段拦截 input-field 的聚焦
    const el = document.getElementById('input-field');
    if (el) {
        el.addEventListener('focus', function() {
            if (window._gshell2FocusGuard) {
                el.blur();
            }
        }, true);
    }

    // 捕获阶段拦截所有 click：GShell2 运行时，点 input-field 无效
    document.addEventListener('click', function(e) {
        if (!window._gshell2FocusGuard) return;
        if (e.target && e.target.id === 'input-field') {
            e.preventDefault();
            e.stopPropagation();
        }
    }, true);

    // 轮询 GShell2 状态
    setInterval(function() {
        if (typeof GShell2 === 'undefined') return;
        const isRunning = GShell2.isRunning();
        if (isRunning && !lastRunning) {
            window._gshell2FocusGuard = true;
            if (el) el.blur();
            if (typeof Keyboard !== 'undefined' && Keyboard.clear) Keyboard.clear();
        } else if (!isRunning && lastRunning) {
            window._gshell2FocusGuard = false;
            if (typeof Keyboard !== 'undefined' && Keyboard.clear) Keyboard.clear();
            if (el) el.focus();
        }
        lastRunning = isRunning;
    }, 100);

    console.log('✅ GShell2 键盘焦点锁定已启用');
})();
/* ═══════════════════════════════════════════════════════════
   C2 磁盘持久化补丁 (localStorage 版)
   - 自动在开机时恢复磁盘镜像
   - 每次写入扇区后自动保存
   ═══════════════════════════════════════════════════════════ */
(function patchDiskPersistence() {
    const STORAGE_KEY = 'c2_disk_image_v1';

    // 1. 劫持 Disk.writeSector：写完自动保存
    const _origWriteSector = Disk.writeSector;
    Disk.writeSector = function(sector, memAddr) {
        // 调用原函数
        _origWriteSector.call(Disk, sector, memAddr);
        
        // 异步保存，避免卡死主线程
        setTimeout(() => {
            try {
                // 只取有内容的扇区（优化存储）
                const img = Disk.getImage();
                // 把 Uint8Array 转成 Base64 字符串存，比 JSON 体积小很多
                let binary = '';
                const len = img.byteLength;
                // 分块转，防止爆栈
                for (let i = 0; i < len; i += 8192) {
                    binary += String.fromCharCode.apply(null, img.subarray(i, i + 8192));
                }
                const b64 = btoa(binary);
                localStorage.setItem(STORAGE_KEY, b64);
            } catch (e) {
                console.warn('磁盘持久化失败 (可能空间不足):', e.message);
                // 如果存不下，提示用户
                if (e.name === 'QuotaExceededError') {
                    showToast('⚠️ 磁盘存满了！请清理或减少文件。');
                }
            }
        }, 10);
    };

    // 2. 开机时自动加载
    // 劫持 Machine.boot 或者利用 DOMContentLoaded
    // 因为 Machine.boot 在 DOMContentLoaded 时执行，我们延迟一点加载
    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            try {
                const b64 = localStorage.getItem(STORAGE_KEY);
                if (b64) {
                    const binary = atob(b64);
                    const len = binary.length;
                    const arr = new Uint8Array(1048576);
                    for (let i = 0; i < len; i++) {
                        arr[i] = binary.charCodeAt(i);
                    }
                    // 加载进内存
                    const img = Disk.getImage();
                    img.set(arr);
                    console.log('✅ C2 磁盘镜像已从本地恢复');
                }
            } catch (e) {
                console.warn('磁盘镜像读取失败:', e);
            }
        }, 200); // 等 200ms，确保 Machine.boot 初始化完毕
    });

})();

<script>
'use strict';

// ═══════════════════════════════════════════════════════════
//  内存：16 MB（0x000000 - 0xFFFFFF）
// ═══════════════════════════════════════════════════════════
const Memory = (() => {
    const SIZE = 16777216;
    const data = new Uint8Array(SIZE);
    return {
        SIZE,
        readByte: a => data[a & 0xFFFFFF],
        writeByte: (a, v) => { data[a & 0xFFFFFF] = v & 0xFF; },
        readWord: a => {
            a &= 0xFFFFFF;
            return (data[a] | (data[a+1]<<8) | (data[a+2]<<16) | (data[a+3]<<24)) >>> 0;
        },
        writeWord: (a, v) => {
            a &= 0xFFFFFF;
            data[a]=v&0xFF; data[a+1]=(v>>>8)&0xFF; data[a+2]=(v>>>16)&0xFF; data[a+3]=(v>>>24)&0xFF;
        },
        writeBlock: (a, b) => { for (let i=0;i<b.length;i++) data[(a+i)&0xFFFFFF]=b[i]; },
        clear: () => data.fill(0)
    };
})();

// ═══════════════════════════════════════════════════════════
//  32 位 CPU（8 字节定长指令）
//  指令布局：[op:1B][dst:1B][src:1B][pad:1B][imm32:4B]
//  MOV_RI  : [op][dst][0][0][imm32]
//  MOV_RR/ADD/SUB/MUL/MUL_HI/SWAP : [op][dst][src][0][0]
//  NEG     : [op][dst][0][0][0]
//  JMP/JZ/JNZ/CALL : [op][0][0][0][addr32]
//  RET     : [op][0][0][0][0]
//  INT     : [op][0][0][0][vector32]  ← 注意 vector 在 [4..7]
//  HLT/NOP : [op][0][0][0][0]
// ═══════════════════════════════════════════════════════════
const CPU = (() => {
    const regs = new Uint32Array(8);
    let PC = 0;
    let SP = 0x00FFFFFF;
    let FLAGS = 0;

    const F_Z = 0x01, F_C = 0x02, F_N = 0x04, F_V = 0x08, F_I = 0x10;
    const STACK_TOP = 0x00FFFFFF;
    const STACK_BOTTOM = 0x00010000;

    let state = 'IDLE';
    let lastError = null;
    let instrCount = 0;

    const OP = {
        NOP: 0x00, HLT: 0x01,
        MOV_RI: 0x11, MOV_RR: 0x10,
        ADD: 0x20, SUB: 0x21, MUL: 0x22, MUL_HI: 0x23,
        SWAP: 0x24, NEG: 0x25,
        JMP: 0x50, JZ: 0x51, JNZ: 0x52,
        CALL: 0x60, RET: 0x61,
        INT: 0x70
    };

    function getReg(i) { return regs[i & 7]; }
    function setReg(i, v) { regs[i & 7] = v >>> 0; }
    function getPC() { return PC; }
    function setPC(v) { PC = v >>> 0; }
    function getSP() { return SP; }
    function setSP(v) { SP = v >>> 0; }
    function getFLAGS() { return FLAGS; }
    function getState() { return state; }
    function setState(s) { state = s; }
    function getLastError() { return lastError; }
    function getInstrCount() { return instrCount; }

    function testFlag(m) { return (FLAGS & m) !== 0; }
    function setFlag(m, on) { if (on) FLAGS |= m; else FLAGS &= ~m; FLAGS &= 0xFFFFFFFF; }
    function updateZN(r) {
        setFlag(F_Z, r === 0);
        setFlag(F_N, (r & 0x80000000) !== 0);
    }

    function reset() {
        regs.fill(0);
        PC = 0; SP = STACK_TOP; FLAGS = 0;
        state = 'IDLE'; lastError = null; instrCount = 0;
    }

    function push32(v) {
        if (SP - 4 < STACK_BOTTOM) throw new Error('栈溢出 SP=0x' + SP.toString(16));
        SP = (SP - 4) >>> 0;
        Memory.writeWord(SP, v);
    }
    function pop32() {
        if (SP >= STACK_TOP) throw new Error('栈为空');
        const v = Memory.readWord(SP);
        SP = (SP + 4) >>> 0;
        return v;
    }

    function fetch() {
        const b = new Uint8Array(8);
        for (let i = 0; i < 8; i++) b[i] = Memory.readByte((PC + i) & 0xFFFFFF);
        return b;
    }

    function step() {
        if (state === 'HALTED' || state === 'ERROR') return { ok: true, halted: true };
        try {
            const b = fetch();
            const op = b[0];
            let advance = 8;

            switch (op) {
                case OP.NOP: break;
                case OP.HLT: state = 'HALTED'; break;

                case OP.MOV_RI: {
                    const dst = b[1] & 7;
                    const imm = (b[4] | (b[5]<<8) | (b[6]<<16) | (b[7]<<24)) >>> 0;
                    regs[dst] = imm;
                    updateZN(imm);
                    break;
                }
                case OP.MOV_RR: {
                    const dst = b[1] & 7, src = b[2] & 7;
                    regs[dst] = regs[src];
                    updateZN(regs[dst]);
                    break;
                }
                case OP.ADD: {
                    const dst = b[1] & 7, src = b[2] & 7;
                    const r = regs[dst] + regs[src];
                    const carry = r > 0xFFFFFFFF;
                    regs[dst] = r >>> 0;
                    updateZN(regs[dst]);
                    setFlag(F_C, carry);
                    setFlag(F_V, false);
                    break;
                }
                case OP.SUB: {
                    const dst = b[1] & 7, src = b[2] & 7;
                    const r = regs[dst] - regs[src];
                    const borrow = regs[dst] < regs[src];
                    regs[dst] = r >>> 0;
                    updateZN(regs[dst]);
                    setFlag(F_C, borrow);
                    setFlag(F_V, false);
                    break;
                }
                case OP.MUL: {
                    const dst = b[1] & 7, src = b[2] & 7;
                    const prod = BigInt(regs[dst]) * BigInt(regs[src]);
                    regs[dst] = Number(prod & 0xFFFFFFFFn) >>> 0;
                    updateZN(regs[dst]);
                    break;
                }
                case OP.MUL_HI: {
                    const dst = b[1] & 7, src = b[2] & 7;
                    const prod = BigInt(regs[dst]) * BigInt(regs[src]);
                    regs[dst] = Number((prod >> 32n) & 0xFFFFFFFFn) >>> 0;
                    updateZN(regs[dst]);
                    break;
                }
                case OP.SWAP: {
                    const dst = b[1] & 7, src = b[2] & 7;
                    const t = regs[dst]; regs[dst] = regs[src]; regs[src] = t;
                    updateZN(regs[dst]);
                    break;
                }
                case OP.NEG: {
                    const dst = b[1] & 7;
                    regs[dst] = (0 - regs[dst]) >>> 0;
                    updateZN(regs[dst]);
                    setFlag(F_C, regs[dst] !== 0);
                    break;
                }
                case OP.JMP: {
                    PC = (b[4] | (b[5]<<8) | (b[6]<<16) | (b[7]<<24)) >>> 0;
                    advance = 0;
                    break;
                }
                case OP.JZ: {
                    const addr = (b[4] | (b[5]<<8) | (b[6]<<16) | (b[7]<<24)) >>> 0;
                    if (testFlag(F_Z)) { PC = addr; advance = 0; }
                    break;
                }
                case OP.JNZ: {
                    const addr = (b[4] | (b[5]<<8) | (b[6]<<16) | (b[7]<<24)) >>> 0;
                    if (!testFlag(F_Z)) { PC = addr; advance = 0; }
                    break;
                }
                case OP.CALL: {
                    const addr = (b[4] | (b[5]<<8) | (b[6]<<16) | (b[7]<<24)) >>> 0;
                    push32((PC + 8) >>> 0);
                    PC = addr;
                    advance = 0;
                    break;
                }
                case OP.RET: {
                    PC = pop32();
                    advance = 0;
                    break;
                }
                case OP.INT: {
                    // ★ 修复：vector 在 [4..7]（emit8 把 imm32 放在 [4..7]）
                    const vec = b[4] & 0xFF;
                    const isrAddr = Memory.readWord(vec * 4);
                    if (isrAddr !== 0) {
                        push32((PC + 8) >>> 0);
                        push32(FLAGS);
                        setFlag(F_I, false);
                        PC = isrAddr;
                        advance = 0;
                    } else {
                        BIOS.handle(vec, {
                            getReg, setReg, setState: s => { state = s; }
                        });
                    }
                    break;
                }
                default:
                    throw new Error('未知指令 0x' + op.toString(16).padStart(2, '0'));
            }

            if (advance) PC = (PC + 8) >>> 0;
            instrCount++;
            return { ok: true, halted: state === 'HALTED' };
        } catch (e) {
            state = 'ERROR';
            lastError = e.message;
            return { ok: false, error: e.message };
        }
    }

    function run(maxInstr) {
        const limit = maxInstr || 1000000;
        state = 'RUNNING';
        let n = 0;
        while ((state === 'RUNNING') && n < limit) {
            const r = step();
            if (!r.ok) return { executed: n, halted: false, error: r.error };
            n++;
            if (state === 'HALTED') break;
        }
        return { executed: n, halted: state === 'HALTED', limitReached: n >= limit };
    }

    function snapshot() {
        return {
            R0: regs[0], R1: regs[1], R2: regs[2], R3: regs[3],
            R4: regs[4], R5: regs[5], R6: regs[6], R7: regs[7],
            PC, SP, FLAGS, state, instrCount, lastError
        };
    }

    return {
        OP, F_Z, F_C, F_N, F_V, F_I,
        getReg, setReg, getPC, setPC, getSP, setSP, getFLAGS,
        getState, setState, getLastError, getInstrCount,
        testFlag, setFlag, updateZN,
        reset, push32, pop32, step, run, snapshot
    };
})();

// ═══════════════════════════════════════════════════════════
//  BIOS
// ═══════════════════════════════════════════════════════════
const BIOS = {
    handle(n, api) {
        if (n === 0x00) { api.setState('HALTED'); return; }
        if (n === 0x10) {
            const ch = String.fromCharCode(api.getReg(0) & 0xFF);
            console.log('[BIOS] ' + ch);
            return;
        }
    }
};

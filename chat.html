<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双人聊天室</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 12px; background: #1c1c1e; text-align: center; font-weight: bold; border-bottom: 1px solid #333; }
  #status { font-size: 12px; color: #888; margin-top: 4px; }
  #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 75%; padding: 8px 12px; border-radius: 16px; word-break: break-word; font-size: 15px; line-height: 1.4; }
  .me { align-self: flex-end; background: #0b84ff; color: #fff; border-bottom-right-radius: 4px; }
  .other { align-self: flex-start; background: #2c2c2e; color: #eee; border-bottom-left-radius: 4px; }
  .system { align-self: center; color: #666; font-size: 12px; padding: 4px; }
  footer { display: flex; padding: 10px; background: #1c1c1e; border-top: 1px solid #333; gap: 8px; }
  input { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #333; background: #2c2c2e; color: #fff; font-size: 15px; outline: none; }
  button { padding: 0 18px; border-radius: 20px; border: none; background: #0b84ff; color: #fff; font-weight: bold; font-size: 15px; cursor: pointer; }
  button:active { opacity: 0.7; }
</style>
</head>
<body>
<header>
  双人聊天室
  <div id="status">连接中...</div>
</header>
<div id="messages"></div>
<footer>
  <input id="input" type="text" placeholder="输入消息..." autocomplete="off">
  <button id="send">发送</button>
</footer>

<script>
  // itty-sockets 的客户端代码，直接粘贴到这里
  let connect=(e,s={})=>{let a,t,n=[],p={},o=()=>(a||(a=new WebSocket((/^wss?:/.test(e)?e:"wss://itty.ws/c/"+e)+"?"+new URLSearchParams(s)),a.onmessage=(e,s=JSON.parse(e.data),a=s?.message,t={...null==a?.[0]&&a,...s})=>[t.type,s.type?0:"message","*"].map(e=>p[e]?.map(e=>e(t))),a.onopen=()=>(n.splice(0).map(e=>a.send(e)),p.open?.map(e=>e(t)),t&&a?.close()),a.onclose=()=>(t=a=null,p.close?.map(e=>e(t)))),l),l={open:o,send:(e,s)=>(e=(s?`${s}`:"")+JSON.stringify(e),1&a?.readyState?a.send(e):n.push(e),o()),on:(e,s)=>((p[e?.[0]?e:"*"]??=[]).push(e?.[0]?s:a=>e?.(a)&&s(a)),o()),remove:(e,s)=>(p[e]=p[e]?.filter(e=>e!=s),l),close:()=>(1&a?.readyState?a.close():t=1,l),push:(e,s)=>(t=1,l.send(e,s))};return l};

  // ⚠️ 房间名：两个人必须用完全一样的，比如 'wo-men-de-chat'
  const ROOM = 'wo-men-de-chat'; 

  const statusEl = document.getElementById('status');
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  function addMessage(text, type) {
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // 连接并加入房间
  const socket = connect(ROOM);

  // 收到消息
  socket.on('message', (data) => {
    // data 里包含了消息和发送者别名
    addMessage(data.message, 'other');
  });

  // 连接状态
  socket.on('open', () => { statusEl.textContent = '已连接'; });
  socket.on('close', () => { statusEl.textContent = '连接断开'; });

  // 发送消息
  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    socket.send(text);
    addMessage(text, 'me');
    inputEl.value = '';
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
</script>
</body>
</html>

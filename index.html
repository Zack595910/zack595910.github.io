<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search</title>
<style>
:root {
    --bg: #0a0a1e;
    --card: #12122a;
    --accent: #0078D4;
    --accent2: #00ccff;
    --green: #00ff41;
    --red: #ff4444;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: var(--bg);
    color: #e0e0e0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 0%, rgba(0,120,212,0.15) 0%, transparent 70%);
}
.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px;
}

/* 头部 */
.hero {
    padding: 120px 0 60px;
    text-align: center;
}
.hero .logo {
    font-size: 42px;
    font-weight: bold;
    color: var(--accent2);
    letter-spacing: 4px;
    margin-bottom: 8px;
}
.hero .logo span { color: var(--green); }
.hero .subtitle {
    font-size: 14px;
    color: #888;
    margin-bottom: 40px;
}

/* 搜索框 */
.search-wrap {
    max-width: 600px;
    margin: 0 auto 40px;
    position: relative;
}
.search-box {
    width: 100%;
    padding: 18px 60px 18px 60px;
    background: #1a1a2e;
    border: 2px solid #333;
    border-radius: 40px;
    color: #ffffff;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: all 0.3s;
}
.search-box:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 30px rgba(0,204,255,0.2);
}
.search-box::placeholder { color: #666; }
.search-icon {
    position: absolute;
    left: 24px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    color: #666;
    pointer-events: none;
}
.search-clear {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    color: #666;
    cursor: pointer;
    display: none;
    background: none;
    border: none;
    padding: 4px;
}
.search-clear:hover { color: #fff; }

/* 分类 */
.categories {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 40px;
}
.cat-btn {
    padding: 10px 24px;
    background: #1a1a2e;
    border: 1px solid #333;
    border-radius: 20px;
    color: #aaa;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}
.cat-btn:hover {
    border-color: var(--accent2);
    color: #fff;
}
.cat-btn.active {
    background: rgba(0,204,255,0.15);
    border-color: var(--accent2);
    color: var(--accent2);
}

/* 项目网格 */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    padding-bottom: 80px;
}
.card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 24px 20px;
    cursor: pointer;
    transition: all 0.25s;
}
.card:hover {
    border-color: rgba(0,204,255,0.4);
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(0,120,212,0.2);
}
.card .icon {
    font-size: 42px;
    margin-bottom: 14px;
    display: block;
}
.card .name {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 8px;
}
.card .desc {
    font-size: 13px;
    color: #888;
    line-height: 1.6;
}

/* 空状态 */
.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 0;
    color: #666;
}

/* 页脚 */
footer {
    text-align: center;
    padding: 30px 0;
    border-top: 1px solid rgba(255,255,255,0.05);
    font-size: 12px;
    color: #555;
}

@media (max-width: 600px) {
    .hero { padding: 80px 0 40px; }
    .hero .logo { font-size: 30px; }
    .grid { grid-template-columns: 1fr; }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.card { animation: fadeIn 0.3s ease-out backwards; }
</style>
</head>
<body>

<div class="container">

    <div class="hero">
        <div class="logo">Sea<span>rch</span></div>
        <div class="subtitle">一站式导航</div>

        <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-box" id="searchBox" placeholder="搜索..." autocomplete="off">
            <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
        </div>

        <div class="categories" id="categories"></div>
    </div>

    <div class="grid" id="grid"></div>

</div>

<footer>
    © 2026 闪讯工作社 Snxth.
</footer>

<script>
var projects = [
    // ═══ Windows应用 ═══
    {
        name: 'tkemu',
        icon: '🖥️',
        url: 'PTD.html',
        desc: '浏览器中的 Windows 桌面模拟器',
        category: 'windows'
    },
    {
        name: 'Core System',
        icon: '💠',
        url: 'CS.html',
        desc: '全新架构的浏览器操作系统',
        category: 'windows'
    },

    // ═══ 网页 ═══
    {
        name: 'Python IDE',
        icon: '🐍',
        url: 'Python.html',
        desc: '在线 Python 集成开发环境',
        category: 'web'
    },
    {
        name: 'RF 语言',
        icon: '🔨',
        url: 'RF.html',
        desc: 'C 语言编写的轻量级编程语言',
        category: 'web'
    },
    {
        name: 'W 语言',
        icon: '🪟',
        url: 'W.html',
        desc: '专为 Windows 界面设计的语言',
        category: 'web'
    },
    {
        name: 'KSD 游戏框架',
        icon: '🎮',
        url: 'KSD.html',
        desc: '纯 Python 打造的模块化游戏框架',
        category: 'web'
    },
    {
        name: '双人聊天室',
        icon: '💬',
        url: 'chat.html',
        desc: '基于 WebSocket 的双人实时聊天',
        category: 'web'
    },
    {
        name: 'GitHub 仓库',
        icon: '📂',
        url: 'https://github.com/Zack595910/KSD-',
        desc: '开源项目源代码',
        category: 'web'
    },

    // ═══ 媒体 ═══
    {
        name: '路障塔防',
        icon: '🏰',
        url: 'tafang.html',
        desc: '策略塔防游戏',
        category: 'media'
    },
    {
        name: '最新资讯',
        icon: '📰',
        url: 'news.html',
        desc: '项目新闻和公告',
        category: 'media'
    }
];

var categories = [
    { id: 'all', name: '全部' },
    { id: 'windows', name: 'Windows应用' },
    { id: 'web', name: '网页' },
    { id: 'media', name: '媒体' }
];

var currentCategory = 'all';
var currentSearch = '';

function renderCategories() {
    var el = document.getElementById('categories');
    var h = '';
    categories.forEach(function(cat) {
        h += '<button class="cat-btn' + (currentCategory === cat.id ? ' active' : '') + '" onclick="setCategory(\'' + cat.id + '\')">' + cat.name + '</button>';
    });
    el.innerHTML = h;
}

function renderProjects() {
    var grid = document.getElementById('grid');
    var filtered = projects.filter(function(p) {
        var catMatch = currentCategory === 'all' || p.category === currentCategory;
        var searchMatch = !currentSearch ||
            p.name.toLowerCase().indexOf(currentSearch.toLowerCase()) !== -1 ||
            p.desc.toLowerCase().indexOf(currentSearch.toLowerCase()) !== -1;
        return catMatch && searchMatch;
    });

    if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty">没有找到匹配的项目</div>';
        return;
    }

    var h = '';
    filtered.forEach(function(p, i) {
        h += '<div class="card" onclick="window.open(\'' + p.url + '\', \'_blank\')" style="animation-delay:' + (i * 0.03) + 's">';
        h += '<span class="icon">' + p.icon + '</span>';
        h += '<div class="name">' + p.name + '</div>';
        h += '<div class="desc">' + p.desc + '</div>';
        h += '</div>';
    });
    grid.innerHTML = h;
}

function setCategory(id) {
    currentCategory = id;
    renderCategories();
    renderProjects();
}

function clearSearch() {
    document.getElementById('searchBox').value = '';
    currentSearch = '';
    document.getElementById('searchClear').style.display = 'none';
    renderProjects();
}

document.getElementById('searchBox').addEventListener('input', function(e) {
    currentSearch = e.target.value;
    document.getElementById('searchClear').style.display = currentSearch ? 'block' : 'none';
    renderProjects();
});

document.addEventListener('keydown', function(e) {
    if (e.key === '/' && document.activeElement !== document.getElementById('searchBox')) {
        e.preventDefault();
        document.getElementById('searchBox').focus();
    }
});

renderCategories();
renderProjects();
</script>

</body>
</html>

<style>
:root {
    --bg: #0a0a1e;
    --card: #12122a;
    --text: #e0e0e0;
    --accent: #0078D4;
    --accent2: #00ccff;
    --gold: #FFD700;
    --green: #00ff41;
    --purple: #9944ff;
    --orange: #ff8800;
    --red: #ff4444;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    background: radial-gradient(ellipse at 50% 0%, rgba(0,120,212,0.15) 0%, transparent 70%);
}
.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px;
}

/* 头部 */
.hero {
    padding: 120px 0 60px;
    text-align: center;
}
.hero .logo {
    font-size: 42px;
    font-weight: bold;
    color: var(--accent2);
    letter-spacing: 4px;
    margin-bottom: 8px;
}
.hero .logo span { color: var(--green); }
.hero .subtitle {
    font-size: 14px;
    color: #888;
    margin-bottom: 40px;
}

/* 搜索框 */
.search-wrap {
    max-width: 600px;
    margin: 0 auto 40px;
    position: relative;
}
.search-box {
    width: 100%;
    padding: 18px 60px 18px 60px;
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 40px;
    color: #ffffff;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: all 0.3s;
}
.search-box:focus {
    border-color: var(--accent2);
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 30px rgba(0,204,255,0.2);
}
.search-box::placeholder { color: #666; }
.search-icon {
    position: absolute;
    left: 24px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    color: #666;
    pointer-events: none;
}
.search-clear {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    color: #666;
    cursor: pointer;
    display: none;
    background: none;
    border: none;
    padding: 4px;
}
.search-clear:hover { color: #fff; }

/* 分类 */
.categories {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 40px;
}
.cat-btn {
    padding: 10px 24px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    color: #aaa;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}
.cat-btn:hover {
    border-color: var(--accent2);
    color: #fff;
}
.cat-btn.active {
    background: rgba(0,204,255,0.15);
    border-color: var(--accent2);
    color: var(--accent2);
}

/* 项目网格 */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
    padding-bottom: 80px;
}
.card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 22px 18px;
    cursor: pointer;
    transition: all 0.25s;
    text-decoration: none;
    color: inherit;
    display: block;
    position: relative;
    overflow: hidden;
}
.card:hover {
    border-color: rgba(0,204,255,0.4);
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(0,120,212,0.2);
}
.card .icon {
    font-size: 38px;
    margin-bottom: 12px;
    display: block;
}
.card .name {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 6px;
}
.card .desc {
    font-size: 12px;
    color: #888;
    line-height: 1.5;
}
.card .tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 10px;
}
.card .tag {
    font-size: 10px;
    padding: 2px 8px;
    background: rgba(0,204,255,0.1);
    color: var(--accent2);
    border-radius: 10px;
}
.card .news-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    font-size: 9px;
    padding: 3px 8px;
    background: rgba(255,68,68,0.2);
    color: var(--red);
    border-radius: 8px;
    font-weight: bold;
}

/* 空状态 */
.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 0;
    color: #666;
}
.empty .empty-icon { font-size: 48px; margin-bottom: 12px; }

/* 详情页 */
.detail-page {
    display: none;
    padding: 80px 0 60px;
    max-width: 700px;
    margin: 0 auto;
}
.detail-page.active { display: block; }
.detail-back {
    display: inline-block;
    padding: 8px 18px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    color: #aaa;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 30px;
    transition: all 0.2s;
}
.detail-back:hover {
    border-color: var(--accent2);
    color: #fff;
}
.detail-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
}
.detail-icon {
    font-size: 64px;
    flex-shrink: 0;
}
.detail-title {
    font-size: 28px;
    font-weight: bold;
    color: #fff;
    margin-bottom: 6px;
}
.detail-category {
    font-size: 12px;
    color: var(--accent2);
    padding: 3px 12px;
    background: rgba(0,204,255,0.1);
    border-radius: 12px;
    display: inline-block;
}
.detail-body {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 28px;
    margin-bottom: 24px;
    line-height: 1.8;
}
.detail-body h3 {
    font-size: 15px;
    color: var(--accent2);
    margin-bottom: 12px;
}
.detail-body p {
    font-size: 14px;
    color: #aaa;
    margin-bottom: 10px;
}
.detail-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 16px;
}
.detail-tag {
    font-size: 12px;
    padding: 4px 12px;
    background: rgba(0,204,255,0.1);
    color: var(--accent2);
    border-radius: 12px;
}
.detail-btn-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}
.detail-btn {
    display: inline-block;
    padding: 16px 40px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    border-radius: 40px;
    box-shadow: 0 4px 20px rgba(0,120,212,0.4);
    transition: all 0.3s;
    cursor: pointer;
    border: none;
    font-family: inherit;
}
.detail-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 30px rgba(0,120,212,0.6);
}
.detail-btn.secondary {
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.15);
    box-shadow: none;
    color: #aaa;
}
.detail-btn.secondary:hover {
    border-color: var(--accent2);
    color: #fff;
}
.detail-news {
    background: rgba(255,215,0,0.05);
    border: 1px solid rgba(255,215,0,0.2);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 24px;
}
.detail-news h3 {
    font-size: 14px;
    color: var(--gold);
    margin-bottom: 10px;
}
.detail-news p {
    font-size: 13px;
    color: #aaa;
    line-height: 1.7;
}

/* 页脚 */
footer {
    text-align: center;
    padding: 30px 0;
    border-top: 1px solid rgba(255,255,255,0.05);
    font-size: 12px;
    color: #555;
}

/* 移动端 */
@media (max-width: 600px) {
    .hero { padding: 80px 0 40px; }
    .hero .logo { font-size: 30px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .card { padding: 16px 14px; }
    .card .icon { font-size: 30px; }
    .card .name { font-size: 13px; }
    .card .desc { font-size: 11px; }
    .detail-icon { font-size: 48px; }
    .detail-title { font-size: 22px; }
    .detail-body { padding: 20px; }
    .detail-btn { padding: 14px 28px; font-size: 14px; }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.card { animation: fadeIn 0.3s ease-out backwards; }
</style>

var categories = [
    { id: 'all', name: '全部', icon: '📦' },
    { id: 'windows', name: 'Windows应用', icon: '🖥️' },
    { id: 'web', name: '网页', icon: '🌐' },
    { id: 'media', name: '媒体', icon: '🎬' }
];

var currentCategory = 'all';
var currentSearch = '';
var currentProject = null;

function renderCategories() {
    var el = document.getElementById('categories');
    var h = '';
    categories.forEach(function(cat) {
        h += '<button class="cat-btn' + (currentCategory === cat.id ? ' active' : '') + '" onclick="setCategory(\'' + cat.id + '\')">' + cat.icon + ' ' + cat.name + '</button>';
    });
    el.innerHTML = h;
}

function renderProjects() {
    var grid = document.getElementById('grid');
    var filtered = projects.filter(function(p) {
        var catMatch = currentCategory === 'all' || p.category === currentCategory;
        var searchMatch = !currentSearch ||
            p.name.toLowerCase().indexOf(currentSearch.toLowerCase()) !== -1 ||
            p.desc.toLowerCase().indexOf(currentSearch.toLowerCase()) !== -1 ||
            p.tags.some(function(t) { return t.toLowerCase().indexOf(currentSearch.toLowerCase()) !== -1; });
        return catMatch && searchMatch;
    });

    if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>没有找到匹配的项目</div>';
        return;
    }

    var h = '';
    filtered.forEach(function(p, i) {
        h += '<div class="card" onclick="openDetail(\'' + p.name + '\')" style="animation-delay:' + (i * 0.03) + 's">';
        if (p.isNews) h += '<div class="news-badge">NEW</div>';
        h += '<span class="icon">' + p.icon + '</span>';
        h += '<div class="name">' + p.name + '</div>';
        h += '<div class="desc">' + p.desc + '</div>';
        if (p.tags && p.tags.length > 0) {
            h += '<div class="tags">';
            p.tags.forEach(function(t) {
                h += '<span class="tag">' + t + '</span>';
            });
            h += '</div>';
        }
        h += '</div>';
    });
    grid.innerHTML = h;
}

function setCategory(id) {
    currentCategory = id;
    renderCategories();
    renderProjects();
}

function clearSearch() {
    document.getElementById('searchBox').value = '';
    currentSearch = '';
    document.getElementById('searchClear').style.display = 'none';
    renderProjects();
}

document.getElementById('searchBox').addEventListener('input', function(e) {
    currentSearch = e.target.value;
    document.getElementById('searchClear').style.display = currentSearch ? 'block' : 'none';
    renderProjects();
});

function openDetail(name) {
    var p = projects.find(function(x) { return x.name === name; });
    if (!p) return;

    if (p.isNews) {
        window.location.href = p.url;
        return;
    }

    currentProject = p;

    document.getElementById('detailIcon').textContent = p.icon;
    document.getElementById('detailTitle').textContent = p.name;
    document.getElementById('detailCategory').textContent = getCategoryName(p.category);
    document.getElementById('detailDesc').textContent = p.longDesc || p.desc;

    var tagsEl = document.getElementById('detailTags');
    tagsEl.innerHTML = '';
    if (p.tags) {
        p.tags.forEach(function(t) {
            tagsEl.innerHTML += '<span class="detail-tag">' + t + '</span>';
        });
    }

    var newsEl = document.getElementById('detailNews');
    if (p.news) {
        document.getElementById('detailNewsText').textContent = p.news;
        newsEl.style.display = 'block';
    } else {
        newsEl.style.display = 'none';
    }

    var extraBtn = document.getElementById('detailExtraBtn');
    if (p.extraUrl) {
        extraBtn.style.display = 'inline-block';
        extraBtn.textContent = p.extraText || '📄 查看详情';
    } else {
        extraBtn.style.display = 'none';
    }

    document.getElementById('mainPage').style.display = 'none';
    document.getElementById('detailPage').classList.add('active');
    window.scrollTo(0, 0);
}

function getCategoryName(id) {
    var cat = categories.find(function(c) { return c.id === id; });
    return cat ? cat.name : '';
}

function openProjectUrl() {
    if (currentProject) {
        window.open(currentProject.url, '_blank');
    }
}

function openExtraUrl() {
    if (currentProject && currentProject.extraUrl) {
        window.open(currentProject.extraUrl, '_blank');
    }
}

function backToMain() {
    document.getElementById('detailPage').classList.remove('active');
    document.getElementById('mainPage').style.display = 'block';
    currentProject = null;
}

document.addEventListener('keydown', function(e) {
    if (e.key === '/' && document.activeElement !== document.getElementById('searchBox')) {
        e.preventDefault();
        document.getElementById('searchBox').focus();
    }
    if (e.key === 'Escape') {
        if (document.getElementById('detailPage').classList.contains('active')) {
            backToMain();
        }
    }
});

renderCategories();
renderProjects();
</script>

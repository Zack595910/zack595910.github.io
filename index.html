<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>EZNT 操作系统</title>
<!-- =====================================================================
     EZNT - Ecosystem Native Technology
     EznK architecture | 32-bit browser operating system

     Entry point. All behaviour lives in js/ modules loaded as plain
     <script src> tags below. No ES modules, no build step, no fetch.

     Load order is the dependency order and is also the boot order:
       L1 platform -> L3 kernel (SRM) -> Ezn32 NT -> Ezn32 API ->
       Ezn32 UI -> L5 shell -> js/boot.js

     Screen text is ASCII only (rule #10): the CSS below sets a monospace
     font and nothing in the markup carries non-ASCII UI text.
     ===================================================================== -->
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #004E8C;
        font-family: 'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
    }
    /* The EznK root surface. js/platform/dom.js resolves this element as
     * the default parent for DOM.create(); no module ever touches body. */
    #eznt-root {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        background: linear-gradient(135deg, #0078D4 0%, #004E8C 100%);
    }
    /* The desktop element is the anchor for the desktop canvas and for the
     * window canvases; it carries no styling of its own besides size. */
    #desktop {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
    }
    /* Boot screen: pure geometry + ASCII text, removed once ready. */
    #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 200000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(135deg, #0078D4 0%, #004E8C 100%);
        color: #FFFFFF;
    }
    #boot-logo {
        font-size: 46px;
        font-weight: bold;
        letter-spacing: 12px;
    }
    #boot-sub {
        font-size: 13px;
        opacity: 0.85;
        letter-spacing: 3px;
    }
    #boot-status {
        font-size: 12px;
        opacity: 0.75;
        margin-top: 12px;
    }
    #boot-bar {
        width: 220px;
        height: 3px;
        background: rgba(255,255,255,0.25);
        overflow: hidden;
    }
    #boot-bar-fill {
        width: 40%;
        height: 100%;
        background: #FFFFFF;
        animation: eznt-boot 1.2s ease-in-out infinite;
    }
    @keyframes eznt-boot {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
    }
</style>
</head>
<body>

<main id="eznt-root">
    <!-- Desktop canvas + window canvases are appended here at runtime. -->
    <div id="desktop"></div>
</main>

<!-- Boot screen, removed by js/boot.js when the system is ready -->
<div id="boot-screen">
    <div id="boot-logo">EZNT</div>
    <div id="boot-sub">ECOSYSTEM NATIVE TECHNOLOGY</div>
    <div id="boot-bar"><div id="boot-bar-fill"></div></div>
    <div id="boot-status">[EZNT] Starting...</div>
</div>

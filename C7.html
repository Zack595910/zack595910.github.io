<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C7 · 浏览器 PC（v86）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0a0a0a; color:#ccc;
    font-family:'Consolas','Courier New',monospace; user-select:none; }
  #app { display:flex; flex-direction:column; width:100%; height:100%; }

  #status { height:28px; background:#1a1a1a; border-bottom:1px solid #333; display:flex;
    align-items:center; padding:0 10px; font-size:12px; color:#888; gap:16px; flex-shrink:0; }
  #status .brand { color:#4ec9b0; font-weight:bold; }
  #status .val { color:#4ec9b0; }
  #status .spacer { flex:1; }
  #status .led { width:8px; height:8px; border-radius:50%; background:#333; display:inline-block; margin-right:6px; }
  #status .led.on { background:#4ec9b0; box-shadow:0 0 6px #4ec9b0; }
  #status .led.run { background:#dcdcaa; box-shadow:0 0 6px #dcdcaa; }
  #status .led.io { background:#569cd6; box-shadow:0 0 6px #569cd6; transition:opacity 0.1s; opacity:0; }
  #status .led.io.active { opacity:1; }

  #screenWrap { flex:1; display:flex; align-items:center; justify-content:center;
    background:#000; overflow:hidden; position:relative; }
  #screenWrap > div { max-width:100%; max-height:100%; }
  #screenWrap canvas { image-rendering:pixelated; background:#000; display:block;
    max-width:100%; max-height:100%; outline:none; }

  #configPanel { position:absolute; inset:0; background:rgba(10,10,10,0.96); z-index:10;
    display:flex; align-items:center; justify-content:center; overflow:auto; }
  #configPanel .card { width:600px; max-width:94vw; background:#151515;
    border:1px solid #333; border-radius:8px; padding:20px 24px; }
  #configPanel h2 { font-size:16px; color:#4ec9b0; margin-bottom:4px; }
  #configPanel .sub { font-size:11px; color:#666; margin-bottom:16px; }
  .row { display:flex; align-items:center; margin-bottom:10px; gap:10px; }
  .row label { width:110px; font-size:12px; color:#999; flex-shrink:0; }
  .row select, .row input[type=text], .row input[type=file] {
    flex:1; background:#252525; color:#ccc; border:1px solid #444; border-radius:4px;
    padding:4px 8px; font-family:inherit; font-size:12px; outline:none; }
  
  .hda-controls { display:flex; flex:1; gap:8px; }
  .hda-controls button { background:#333; color:#ccc; border:1px solid #555; border-radius:4px; padding:4px 12px; cursor:pointer; font-size:12px; flex-shrink:0; outline:none; }
  .hda-controls button:hover { background:#444; }

  .btns { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .btns button { flex:1; min-width:120px; background:#252525; color:#ccc; border:1px solid #444;
    border-radius:4px; padding:8px; font-family:inherit; font-size:13px; cursor:pointer; outline:none; }
  .btns button:hover { background:#333; }
  .btns button.primary { background:#1d3a34; border-color:#4ec9b0; color:#4ec9b0; }
  .btns button.primary:hover { background:#244a42; }
  .btns button.danger { border-color:#a33; color:#f88; }

  #toolbar { height:40px; background:#141414; border-top:1px solid #333; display:none;
    align-items:center; padding:0 8px; gap:8px; font-size:12px; flex-shrink:0; }
  #toolbar button { background:#252525; color:#ccc; border:1px solid #444;
    border-radius:4px; padding:4px 10px; font-family:inherit; font-size:12px; cursor:pointer; outline:none; }
  #toolbar button:hover { background:#333; }
  #toolbar .tool-sep { width:1px; height:20px; background:#444; margin:0 6px; }
  
  #shutdownText { display:none; color:#666; font-size:16px; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); }

  #log { height:110px; background:#0a0a0a; border-top:1px solid #333; overflow-y:auto;
    padding:4px 8px; font-size:11px; color:#6a9955; flex-shrink:0; white-space:pre-wrap;
    display:none; user-select:text; }
  #log .err { color:#f44747; }
  #log .warn { color:#dcdcaa; }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100;
    display:none; align-items:center; justify-content:center; }
  .modal-content { background:#181818; border:1px solid #444; border-radius:8px;
    width:640px; max-width:92vw; max-height:85vh; display:flex; flex-direction:column; box-shadow:0 8px 32px rgba(0,0,0,0.8); }
  .modal-header { padding:12px 16px; border-bottom:1px solid #333; display:flex; justify-content:space-between; align-items:center; font-weight:bold; color:#4ec9b0; }
  .modal-close { cursor:pointer; color:#888; font-size:18px; }
  .modal-close:hover { color:#fff; }
  .modal-body { padding:16px; overflow-y:auto; flex:1; }
  
  .file-list { width:100%; border-collapse:collapse; font-size:12px; }
  .file-list th { text-align:left; padding:6px; border-bottom:1px solid #444; color:#888; font-weight:normal; }
  .file-list td { padding:6px; border-bottom:1px solid #222; color:#ccc; }
  .file-list tr:hover { background:#222; }
  .action-btn { background:#333; border:1px solid #555; color:#ccc; padding:2px 6px; border-radius:3px; cursor:pointer; font-size:11px; margin-right:4px; }
  .action-btn:hover { background:#444; }
  .action-btn.danger { border-color:#a33; color:#f88; }
  .action-btn.danger:hover { background:#522; }
</style>
</head>
<body>

  <div id="status">
    <span class="brand">C7</span>
    <span>v86 <span class="val" id="stat-sys">未启动</span></span>

  <div id="screenWrap">
    <div id="configPanel">
      <div class="card">
        <h2>C7 · 开机配置</h2>

        </div>
        <div class="row" id="row-fda-file" style="display:none;">
          <label></label>

        <div class="row" id="row-fda-cache" style="display:none;">

          <select id="cfg-fda-cache"></select>

        <div class="row">
          <label>硬盘 C:</label>
          <select id="cfg-hda-type">

        <div class="row" id="row-hda-create-idb" style="display:none;">

        <div class="row" id="row-cdrom-file" style="display:none;">
          <label></label>
          <input type="file" id="cfg-cdrom-file" accept=".iso">

        <div class="row">
          <label>启动顺序</label>
          <select id="cfg-boot">
            <option value="fd">软盘 → 硬盘 → 光盘</option>

</div>

<div id="downloadModal" class="modal-overlay">
  <div class="modal-content">

        <select id="dl-type" style="flex:1;">
          <option value="hda">硬盘</option>

</div>

<div id="fileModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <span>🗂️ 存储文件管理器</span>
      <span class="modal-close" onclick="closeModal('fileModal')">✕</span>

    <div class="modal-body">
      <table class="file-list" id="file-table">
        <thead><tr><th>文件名</th><th>类型</th><th>大小</th><th>操作</th></tr></thead>
        <tbody></tbody>
      </table>
      <div id="file-empty" style="display:none; text-align:center; color:#666; padding:20px;">没有找到任何文件</div>
    </div>
  </div>
</div>

<script src="./libv86.js"></script>
<script>
'use strict';

const CORSPROXY_KEY = '301c7ba4';
const RELAY_URL = `fetch:https://corsproxy.io/?key=${CORSPROXY_KEY}&url=`;

const DB_NAME = 'c7_store_v2';
const DB_VERSION = 1;
const STORE_IMAGES = 'images';
const STORE_CONFIG = 'config';
const STORE_LOGS = 'logs';
const LOG_MAX = 500;

let emulator = null;
let isShutdown = false;
let localHdaHandle = null;
let localHdaFile = null;

const logEl = document.getElementById('log');
let logBuf = [];

function log(msg, cls) {
  const line = { ts: Date.now(), text: String(msg), cls: cls || '' };
  logBuf.push(line);
  if (logBuf.length > LOG_MAX) logBuf.shift();
  const div = document.createElement('div');
  if (cls) div.className = cls;
  div.textContent = msg;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  Storage.saveLog(line).catch(()=>{});
  while (logEl.children.length > LOG_MAX) logEl.removeChild(logEl.firstChild);
}

const Storage = (() => {
  let db = null;
  function open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains(STORE_IMAGES)) d.createObjectStore(STORE_IMAGES, { keyPath: 'name' });
        if (!d.objectStoreNames.contains(STORE_CONFIG)) d.createObjectStore(STORE_CONFIG, { keyPath: 'key' });
        if (!d.objectStoreNames.contains(STORE_LOGS)) d.createObjectStore(STORE_LOGS, { keyPath: 'ts' });
      };
      req.onsuccess = () => { db = req.result; resolve(); };
      req.onerror = () => reject(req.error);
    });
  }
  function tx(store, mode) { return db.transaction(store, mode).objectStore(store); }
  function reqP(req) { return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }

  async function saveImage(name, data, type) {
    const rec = { name, size: data.file ? data.file.size : (data.blob ? data.blob.size : 0), type: type || 'fda', ts: Date.now(), ...data };
    await reqP(tx(STORE_IMAGES, 'readwrite').put(rec));
  }
  async function getImage(name) { return reqP(tx(STORE_IMAGES, 'readonly').get(name)); }
  async function listImages() { return reqP(tx(STORE_IMAGES, 'readonly').getAll()); }
  async function deleteImage(name) { return reqP(tx(STORE_IMAGES, 'readwrite').delete(name)); }
  
  async function saveConfig(cfg) { await reqP(tx(STORE_CONFIG, 'readwrite').put({ key: 'main', value: cfg })); }
  async function loadConfig() { const r = await reqP(tx(STORE_CONFIG, 'readonly').get('main')); return r ? r.value : null; }
  
  async function saveLog(entry) {
    await reqP(tx(STORE_LOGS, 'readwrite').put(entry));
    const all = await reqP(tx(STORE_LOGS, 'readonly').getAllKeys());
    if (all.length > LOG_MAX * 2) {
      const t = tx(STORE_LOGS, 'readwrite');
      all.sort((a,b)=>a-b).slice(0, all.length - LOG_MAX).forEach(k => t.delete(k));
    }
  }
  async function loadLogs() { return reqP(tx(STORE_LOGS, 'readonly').getAll()); }
  
  async function clearAll() {
    for (const s of [STORE_IMAGES, STORE_CONFIG, STORE_LOGS]) {
      await reqP(tx(s, 'readwrite').clear());
    }
  }
  return { open, saveImage, getImage, listImages, deleteImage, saveConfig, loadConfig, saveLog, loadLogs, clearAll };
})();

const $ = id => document.getElementById(id);
const screenWrap = $('screenWrap'), configPanel = $('configPanel'), toolbar = $('toolbar'), bootHint = $('bootHint');
const cfgMem = $('cfg-mem'), cfgBoot = $('cfg-boot'), cfgNet = $('cfg-net');
const cfgFdaType = $('cfg-fda-type'), cfgFdaFile = $('cfg-fda-file'), cfgFdaCache = $('cfg-fda-cache');
const cfgHdaType = $('cfg-hda-type'), cfgHdaFile = $('cfg-hda-file'), cfgHdaCache = $('cfg-hda-cache');
const cfgHdaIdbSize = $('cfg-hda-idb-size'), cfgHdaFsSize = $('cfg-hda-fs-size');
const cfgCdType = $('cfg-cdrom-type'), cfgCdFile = $('cfg-cdrom-file'), cfgCdCache = $('cfg-cdrom-cache');

const rowFdaFile = $('row-fda-file'), rowFdaCache = $('row-fda-cache');
const rowHdaCreateIdb = $('row-hda-create-idb'), rowHdaCreateFs = $('row-hda-create-fs'), rowHdaFile = $('row-hda-file'), rowHdaCache = $('row-hda-cache');
const rowCdFile = $('row-cdrom-file'), rowCdCache = $('row-cdrom-cache');

const DEFAULT_CFG = { mem: 64, fdaType: 'none', fdaName: '', hdaType: 'none', hdaName: '', cdromType: 'none', cdromName: '', boot: 'hd', net: 'off' };
let cfg = { ...DEFAULT_CFG };

function fmtSize(n) {
  if (!n) return '0 B'; if (n < 1024) return n + ' B'; if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  if (n < 1024*1024*1024) return (n/1024/1024).toFixed(1) + ' MB'; return (n/1024/1024/1024).toFixed(2) + ' GB';
}
function readCfgFromUI() {
  return {
    mem: parseInt(cfgMem.value, 10), boot: cfgBoot.value, net: cfgNet.value,
    fdaType: cfgFdaType.value, fdaName: cfgFdaType.value === 'cached' ? cfgFdaCache.value : '',
    hdaType: cfgHdaType.value, hdaName: cfgHdaType.value === 'cached' ? cfgHdaCache.value : '',
    cdromType: cfgCdType.value, cdromName: cfgCdType.value === 'cached' ? cfgCdCache.value : ''
  };
}
function writeCfgToUI(c) {
  cfgMem.value = String(c.mem || 64); cfgBoot.value = c.boot || 'hd'; cfgNet.value = c.net || 'off';
  cfgFdaType.value = c.fdaType || 'none'; cfgHdaType.value = c.hdaType || 'none'; cfgCdType.value = c.cdromType || 'none';
  updateTypeRows();
}
function updateTypeRows() {
  rowFdaFile.style.display = (cfgFdaType.value === 'local') ? 'flex' : 'none';
  rowFdaCache.style.display = (cfgFdaType.value === 'cached') ? 'flex' : 'none';
  rowHdaCreateIdb.style.display = (cfgHdaType.value === 'create_idb') ? 'flex' : 'none';
  rowHdaCreateFs.style.display = (cfgHdaType.value === 'create_fs') ? 'flex' : 'none';
  rowHdaFile.style.display = (cfgHdaType.value === 'local') ? 'flex' : 'none';
  rowHdaCache.style.display = (cfgHdaType.value === 'cached') ? 'flex' : 'none';
  rowCdFile.style.display = (cfgCdType.value === 'local') ? 'flex' : 'none';
  rowCdCache.style.display = (cfgCdType.value === 'cached') ? 'flex' : 'none';
}
[cfgFdaType, cfgHdaType, cfgCdType].forEach(s => s.addEventListener('change', updateTypeRows));
function updateMemStatus() {
  const total = parseInt(cfgMem.value, 10) || 64;
  $('stat-mem').textContent = `${total} / ${total} MB`;
}
cfgMem.addEventListener('change', updateMemStatus);

window.closeModal = function(id) { $(id).style.display = 'none'; };
function openModal(id) { $(id).style.display = 'flex'; }

async function renderFileManager() {
  const tb = $('file-table').querySelector('tbody');
  const empty = $('file-empty');
  tb.innerHTML = '';
  try {
    const imgs = await Storage.listImages();
    if (imgs.length === 0) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    
    for (const im of imgs) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${im.name}</td>
        <td>${im.type === 'hda' ? '硬盘' : im.type === 'cdrom' ? '光盘' : '软盘'}</td>
        <td>${fmtSize(im.size)}</td>
        <td>
          <button class="action-btn danger" onclick="deleteFile('${im.name}')">删除</button>
        </td>
      `;
      tb.appendChild(tr);
    }
  } catch (e) {
    log('获取文件列表失败: ' + e.message, 'err');
  }
}

window.deleteFile = async function(name) {
  const imgs = await Storage.listImages();
  const im = imgs.find(x => x.name === name);
  if (!im) return;
  
  const isActive = (cfgHdaType.value === 'cached' && cfgHdaCache.value === name) ||
                   (cfgCdType.value === 'cached' && cfgCdCache.value === name) ||
                   (cfgFdaType.value === 'cached' && cfgFdaCache.value === name);
                   
  let msg = `确定删除 "${name}" (${fmtSize(im.size)}) 吗？`;
  if (isActive) {
    msg = `⚠️ 危险警告：该文件当前正被虚拟机挂载使用中！\n删除将导致系统崩溃或无法启动。\n确定要删除吗？`;
  }
  
  if (!confirm(msg)) return;
  
  try {
    await Storage.deleteImage(name);
    log(`已删除文件: ${name}`, 'warn');
    renderFileManager();
    await populateCacheSelects();
  } catch (e) {
    alert('删除失败: ' + e.message);
  }
};

$('btn-dl-start').onclick = async () => {
  const url = $('dl-url').value.trim();
  const type = $('dl-type').value;
  if (!url) return alert('请输入下载链接');
  
  const btn = $('btn-dl-start'), wrap = $('dlProgressWrap'), bar = $('dlProgressBar'), txt = $('dlProgressText'), res = $('dl-result');
  
  btn.disabled = true; wrap.style.display = 'block'; bar.style.width = '0%'; bar.style.backgroundColor = '#4ec9b0'; txt.textContent = '连接中…'; res.textContent = '';
  
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    
    const contentLength = resp.headers.get('content-length');
    const total = parseInt(contentLength, 10);
    let loaded = 0; const chunks = [];
    const reader = resp.body.getReader();
    
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); loaded += value.length;
      if (total) {
        const percent = Math.round((loaded / total) * 100);
        bar.style.width = percent + '%';
        txt.textContent = percent + '% (' + fmtSize(loaded) + ' / ' + fmtSize(total) + ')';
      } else {
        txt.textContent = '已下载 ' + fmtSize(loaded);
      }
    }
    
    const blob = new Blob(chunks, { type: 'application/octet-stream' });
    if (blob.size < 1024) throw new Error('文件过小，可能下载到了错误页面。');
    
    let filename = 'downloaded.img';
    try { const u = new URL(url); const p = u.pathname.split('/'); if (p.length > 0 && p[p.length-1]) filename = p[p.length-1]; } catch {}
    if (type === 'cdrom' && !filename.endsWith('.iso')) filename += '.iso';
    
    await Storage.saveImage(filename, { blob }, type);
    log(`下载完成并存入存储: ${filename} (${fmtSize(blob.size)})`, 'success');
    res.textContent = `✅ 下载成功: ${filename}\n已自动挂载到对应设备。`;
    
    if (type === 'cdrom') { cfgCdType.value = 'cached'; updateTypeRows(); cfgCdCache.value = filename; }
    if (type === 'fda') { cfgFdaType.value = 'cached'; updateTypeRows(); cfgFdaCache.value = filename; }
    if (type === 'hda') { cfgHdaType.value = 'cached'; updateTypeRows(); cfgHdaCache.value = filename; }
    
    await populateCacheSelects();
    renderFileManager();
    
  } catch (e) {
    log('下载失败: ' + e.message, 'err');
    txt.textContent = '下载失败'; bar.style.backgroundColor = '#f44747'; res.textContent = '❌ 错误: ' + e.message;
  } finally { btn.disabled = false; }
};

$('btn-create-hda-idb').onclick = async () => {
  const sizeMB = parseInt(cfgHdaIdbSize.value, 10);
  const name = `hdd_${sizeMB}mb_${Date.now()}.img`;
  try {
    const chunkSize = 1024 * 1024;
    const zeroChunk = new Uint8Array(chunkSize);
    const blobParts = [];
    for (let i = 0; i < sizeMB; i++) blobParts.push(zeroChunk);
    const blob = new Blob(blobParts);
    
    await Storage.saveImage(name, { blob }, 'hda');
    log(`已创建空硬盘并存入 IDB: ${name} (${sizeMB} MB)`, 'success');
    
    cfgHdaType.value = 'cached'; updateTypeRows();
    await populateCacheSelects();
    cfgHdaCache.value = name;
  } catch (e) {
    log('创建 IDB 硬盘失败: ' + e.message, 'err');
  }
};

$('btn-create-hda-fs').onclick = async () => {
  if (!window.showSaveFilePicker) return alert('当前浏览器不支持，请使用 Edge/Chrome。');
  const sizeMB = parseInt(cfgHdaFsSize.value, 10);
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: `c7_hdd_${sizeMB}mb.img`,
      types: [{ description: 'Raw Disk Image', accept: { 'application/octet-stream': ['.img'] } }],
    });
    const writable = await handle.createWritable();
    const chunkSize = 1024 * 1024;
    const zeroChunk = new Uint8Array(chunkSize);
    for (let i = 0; i < sizeMB; i++) await writable.write(zeroChunk);
    await writable.close();
    localHdaHandle = handle;
    localHdaFile = await handle.getFile();
    log(`已新建本地硬盘: ${handle.name} (${sizeMB} MB)`, 'success');
    alert(`已成功创建本地硬盘: ${handle.name}`);
  } catch (e) {
    if (e.name !== 'AbortError') log('新建本地硬盘失败: ' + e.message, 'err');
  }
};

async function populateCacheSelects() {
  const imgs = await Storage.listImages();
  for (const [sel, type] of [[cfgFdaCache, 'fda'], [cfgHdaCache, 'hda'], [cfgCdCache, 'cdrom']]) {
    sel.innerHTML = '';
    const filtered = imgs.filter(x => x.type === type);
    if (filtered.length === 0) {
      const o = document.createElement('option'); o.value = ''; o.textContent = '(无匹配镜像)'; sel.appendChild(o); continue;
    }
    for (const im of filtered) {
      const o = document.createElement('option'); o.value = im.name; o.textContent = `${im.name} · ${fmtSize(im.size)}`; sel.appendChild(o);
    }
  }
}

async function ensureImageForType(type) {
  const uiType = type === 'fda' ? cfgFdaType.value : type === 'hda' ? cfgHdaType.value : cfgCdType.value;
  const uiFile = type === 'fda' ? cfgFdaFile.files[0] : type === 'hda' ? cfgHdaFile.files[0] : cfgCdFile.files[0];
  const uiCacheName = type === 'fda' ? cfgFdaCache.value : type === 'hda' ? cfgHdaCache.value : cfgCdCache.value;

  if (uiType === 'none') return null;
  
  if (uiType === 'create_fs') {
    if (!localHdaFile) {
      if (localHdaHandle) localHdaFile = await localHdaHandle.getFile();
      else throw new Error('请先点击“选择路径并创建”或“挂载本地已有文件”');
    }
    return { file: localHdaFile };
  }
  if (uiType === 'local') {
    if (!uiFile) throw new Error(`请选择${labelOf(type)}本地文件`);
    return { file: uiFile };
  }
  if (uiType === 'cached') {
    if (!uiCacheName) throw new Error(`没有已缓存的${labelOf(type)}镜像`);
    const rec = await Storage.getImage(uiCacheName);
    if (!rec) throw new Error(`缓存镜像 ${uiCacheName} 不存在`);
    if (rec.file) return { file: rec.file };
    if (rec.blob) return { file: new File([rec.blob], rec.name) };
    throw new Error('缓存镜像缺少数据');
  }
  throw new Error('未知挂载类型 ' + uiType);
}
function labelOf(t) { return t === 'fda' ? '软盘' : t === 'hda' ? '硬盘' : '光盘'; }

function destroyEmulator() {
  if (emulator && typeof emulator.destroy === 'function') { try { emulator.destroy(); } catch(e) {} }
  emulator = null;
  const old = screenWrap.querySelector('.v86_screen'); if (old) old.remove();
  const oldCanvas = screenWrap.querySelector('canvas'); if (oldCanvas) oldCanvas.remove();
}

function buildOptions(fda, hda, cd) {
  const opts = {
    wasm_path: './v86.wasm', memory_size: (cfgMem.value | 0) * 1024 * 1024,
    vga_memory_size: 4 * 1024 * 1024, bios: { url: './seabios.bin' }, vga_bios: { url: './vgabios.bin' },
    autostart: true
  };
  
  // 强制使用真实物理文件
  if (fda && fda.file) opts.fda = { buffer: fda.file };
  if (hda && hda.file) opts.hda = { buffer: hda.file };
  if (cd && cd.file) opts.cdrom = { buffer: cd.file };
  
  const boot = cfgBoot.value;
  if (boot === 'fd') opts.boot_order = 0x213; else if (boot === 'cd') opts.boot_order = 0x231; else opts.boot_order = 0x132;
  if (cfgNet.value === 'corsproxy') opts.net_device = { type: 'ne2k', relay_url: RELAY_URL };
  return opts;
}

async function startMachine() {
  if (isShutdown) {
    isShutdown = false;
    $('shutdownText').style.display = 'none';
    $('btn-power').textContent = '开机';
  }

  let fda = null, hda = null, cd = null;
  try { 
    fda = await ensureImageForType('fda'); 
    hda = await ensureImageForType('hda'); 
    cd  = await ensureImageForType('cdrom'); 
  } catch(e) { 
    log(e.message, 'err'); alert(e.message); return; 
  }

  cfg = readCfgFromUI(); Storage.saveConfig(cfg);
  destroyEmulator();

  const opts = buildOptions(fda, hda, cd);
  const screenDiv = document.createElement('div'); screenDiv.className = 'v86_screen'; screenDiv.tabIndex = 0;
  screenWrap.insertBefore(screenDiv, bootHint); opts.screen_container = screenDiv;

  try {
    emulator = new V86(opts);
  } catch (e) {
    log('v86 初始化失败: ' + e.message, 'err'); alert('v86 启动失败，请查看控制台。'); return;
  }

  emulator.add_listener('emulator-ready', () => {
    configPanel.style.display = 'none'; toolbar.style.display = 'flex'; logEl.style.display = 'block'; bootHint.style.display = 'none';
    $('stat-sys').textContent = '运行中'; setLed('run'); try { screenDiv.focus(); } catch(e) {}
    $('btn-power').textContent = '关机'; $('btn-power').style.display = 'inline-block';
    
    let ioTimeout = null;
    emulator.add_listener('ide-io', () => {
      const led = $('io-led'); led.classList.add('active');
      clearTimeout(ioTimeout); ioTimeout = setTimeout(() => led.classList.remove('active'), 50);
    });
  });

  bindInput(screenDiv); setLed('run'); $('stat-sys').textContent = '运行中';
  updateMemStatus();
}

function setLed(kind) { const led = $('led-power'); led.className = 'led'; if (kind === 'run') led.classList.add('run'); else if (kind === 'on') led.classList.add('on'); }

const SCANCODE_MAP = {
  'Escape':0x01,'Digit1':0x02,'Digit2':0x03,'Digit3':0x04,'Digit4':0x05,'Digit5':0x06,'Digit6':0x07,'Digit7':0x08,'Digit8':0x09,'Digit9':0x0A,'Digit0':0x0B,'Minus':0x0C,'Equal':0x0D,'Backspace':0x0E,'Tab':0x0F,
  'KeyQ':0x10,'KeyW':0x11,'KeyE':0x12,'KeyR':0x13,'KeyT':0x14,'KeyY':0x15,'KeyU':0x16,'KeyI':0x17,'KeyO':0x18,'KeyP':0x19,'BracketLeft':0x1A,'BracketRight':0x1B,'Enter':0x1C,'ControlLeft':0x1D,
  'KeyA':0x1E,'KeyS':0x1F,'KeyD':0x20,'KeyF':0x21,'KeyG':0x22,'KeyH':0x23,'KeyJ':0x24,'KeyK':0x25,'KeyL':0x26,'Semicolon':0x27,'Quote':0x28,'Backquote':0x29,'ShiftLeft':0x2A,'Backslash':0x2B,
  'KeyZ':0x2C,'KeyX':0x2D,'KeyC':0x2E,'KeyV':0x2F,'KeyB':0x30,'KeyN':0x31,'KeyM':0x32,'Comma':0x33,'Period':0x34,'Slash':0x35,'ShiftRight':0x36,'NumpadMultiply':0x37,'AltLeft':0x38,'Space':0x39,
  'CapsLock':0x3A,'F1':0x3B,'F2':0x3C,'F3':0x3D,'F4':0x3E,'F5':0x3F,'F6':0x40,'F7':0x41,'F8':0x42,'F9':0x43,'F10':0x44,'NumLock':0x45,'ScrollLock':0x46,
  'Numpad7':0x47,'Numpad8':0x48,'Numpad9':0x49,'NumpadSubtract':0x4A,'Numpad4':0x4B,'Numpad5':0x4C,'Numpad6':0x4D,'NumpadAdd':0x4E,'Numpad1':0x4F,'Numpad2':0x50,'Numpad3':0x51,'Numpad0':0x52,'NumpadDecimal':0x53,'F11':0x57,'F12':0x58
};
function bindInput(el) {
  if (el._c7bound) return; el._c7bound = true;
  el.addEventListener('keydown', (e) => { if (!emulator) return; const sc = SCANCODE_MAP[e.code]; if (sc !== undefined) { try { emulator.keyboard_send_scancodes([sc]); } catch(err) {} e.preventDefault(); } });
  el.addEventListener('keyup', (e) => { if (!emulator) return; const sc = SCANCODE_MAP[e.code]; if (sc !== undefined) { try { emulator.keyboard_send_scancodes([sc | 0x80]); } catch(err) {} e.preventDefault(); } });
  el.addEventListener('mousemove', (e) => { if (!emulator) return; try { emulator.mouse_set_status([0, 0, (e.buttons & 1) ? 1 : 0, (e.buttons & 4) ? 1 : 0, (e.buttons & 2) ? 1 : 0, 0]); } catch(err) {} });
  el.addEventListener('mousedown', (e) => { if (!emulator) return; try { emulator.mouse_set_status([0, 0, (e.buttons & 1) ? 1 : 0, (e.buttons & 4) ? 1 : 0, (e.buttons & 2) ? 1 : 0, 0]); } catch(err) {} e.preventDefault(); });
  el.addEventListener('mouseup', () => { if (!emulator) return; try { emulator.mouse_set_status([0, 0, 0, 0, 0, 0]); } catch(err) {} });
}

$('btn-power').onclick = () => {
  if (emulator) {
    destroyEmulator();
    isShutdown = true;
    $('stat-sys').textContent = '已关机';
    $('shutdownText').style.display = 'block';
    $('btn-power').textContent = '开机';
    setLed('');
    log('已关机');
  } else {
    startMachine();
  }
};

$('btn-config').onclick = () => {
  destroyEmulator(); isShutdown = false;
  toolbar.style.display = 'none'; logEl.style.display = 'none';
  configPanel.style.display = 'flex'; bootHint.style.display = 'block';
  $('stat-sys').textContent = '未启动'; $('shutdownText').style.display = 'none';
  setLed('');
  log('返回主界面，请换盘后点击“启动”');
};

$('btn-pause').onclick = () => { if (emulator) { try { emulator.stop(); } catch(e){} setLed('on'); log('已暂停'); } };
$('btn-resume').onclick = () => { if (emulator) { try { emulator.run(); } catch(e){} setLed('run'); log('已继续'); } };
$('btn-reset').onclick = () => { if (emulator) { try { emulator.restart(); } catch(e){} log('复位'); } };

$('btn-start').onclick = () => { startMachine(); };
$('btn-clear').onclick = async () => { if (!confirm('确定清空所有已缓存镜像、配置和日志？')) return; await Storage.clearAll(); logBuf = []; logEl.innerHTML = ''; await populateCacheSelects(); renderFileManager(); log('已清空存储', 'warn'); };
$('btn-reset-defaults').onclick = () => { cfg = { ...DEFAULT_CFG }; writeCfgToUI(cfg); updateTypeRows(); log('已恢复默认配置', 'warn'); };

$('btn-open-downloader').onclick = () => { openModal('downloadModal'); };
$('btn-open-files').onclick = () => { openModal('fileModal'); renderFileManager(); };

(async function init() {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  try { await Storage.open(); } catch (e) { log('IndexedDB 打开失败: ' + e.message, 'err'); }
  try { const saved = await Storage.loadConfig(); if (saved) cfg = { ...DEFAULT_CFG, ...saved }; } catch (e) { log('读取配置失败: ' + e.message, 'err'); }
  
  writeCfgToUI(cfg); 
  await populateCacheSelects(); 
  updateMemStatus();
  
  try { 
    const logs = await Storage.loadLogs(); 
    logs.sort((a,b)=>a.ts-b.ts).forEach(l => { 
      const div = document.createElement('div'); if (l.cls) div.className = l.cls; div.textContent = l.text; logEl.appendChild(div); logBuf.push(l); 
    }); 
    while (logEl.children.length > LOG_MAX) logEl.removeChild(logEl.firstChild); 
    logEl.scrollTop = logEl.scrollHeight; 
  } catch(e) {}

  log('C7 就绪 (稳定版)');
  screenWrap.addEventListener('click', () => { const c = screenWrap.querySelector('canvas'); if (c) c.focus(); });
})();
</script>

<script>
(function initVirtualKeyboard() {
  const SCANCODE_MAP = {
    'Escape':0x01,'Digit1':0x02,'Digit2':0x03,'Digit3':0x04,'Digit4':0x05,'Digit5':0x06,'Digit6':0x07,'Digit7':0x08,'Digit8':0x09,'Digit9':0x0A,'Digit0':0x0B,'Minus':0x0C,'Equal':0x0D,'Backspace':0x0E,'Tab':0x0F,

    .vk-btn { background: #2a2a2a; color: #ccc; border: 1px solid #444; border-radius: 4px; padding: 6px; font-family: monospace; font-size: 12px; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; min-width: 28px; height: 32px; flex: 1 0 28px; }

    </div>
    <div id="vk-body"></div>
  `;
  
  document.body.appendChild(toggleBtn);
  document.body.appendChild(panel);

  const layout = [
    ['Escape','F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12'],
    ['Backquote','Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0','Minus','Equal','Backspace'],
    ['Tab','KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP','BracketLeft','BracketRight','Backslash'],
    ['CapsLock','KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote','Enter'],

  ];

    const rowDiv = document.createElement('div');

      const btn = document.createElement('button');

      let label = code.replace('Key','').replace('Digit','').replace('Left','').replace('Right','');
      if (code === 'Space') label = 'Space';
      if (code === 'Backspace') label = '←';
      btn.textContent = label;
      
      const press = (e) => {
        e.preventDefault();
        if (typeof emulator !== 'undefined' && emulator) {
          const sc = SCANCODE_MAP[code];

    panel.style.bottom = 'auto'; panel.style.right = 'auto'; e.preventDefault();
  });

    if (!isDragging) return;

    panel.style.top = (origY + e.clientY - startY) + 'px';
  });
  window.addEventListener('mouseup', () => { isDragging = false; });

  setInterval(() => {
    if (typeof emulator !== 'undefined' && emulator) {
      toggleBtn.style.display = 'block';
    } else {
      toggleBtn.style.display = 'none';
      panel.style.display = 'none';
    }
  }, 500);
})();
